version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Manaus"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: "production"
        patterns:
          - "*"
      development:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # Workspace is pinned to pnpm@11.18.0 — bump deliberately, not by Dependabot.
      - dependency-name: "pnpm"
        versions: ["*"]
      # @playwright/test and supabase CLI are pinned by tests/scope/local-command-surface.test.mjs
      # (asserts 1.51.1 and 2.107.0 verbatim). The Supabase CLI pin is also deliberate:
      # 2.107.0 is the last version accepting [inbucket] in supabase/config.toml — 2.108+
      # renamed it to [local_smtp]. Bumping either breaks test:scope; do it manually.
      - dependency-name: "@playwright/test"
        versions: ["*"]
      - dependency-name: "supabase"
        versions: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Manaus"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
