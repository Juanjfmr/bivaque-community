name: Format guide temporary

on:
  push:
    branches:
      - feat/manaus-arrival-guide

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply semantic fixes before formatter
        shell: python
        run: |
          from pathlib import Path

          page = Path("apps/web/app/(shell)/guide/page.tsx")
          text = page.read_text()

          for opening in (
              '<main className="mx-auto w-full max-w-[64rem] px-4 py-6 sm:py-8">',
              '<main className="mx-auto flex w-full max-w-2xl flex-col gap-6 px-4 py-8">',
          ):
              if opening not in text:
                  continue
              start = text.index(opening)
              text = text[:start] + opening.replace("<main", "<div", 1) + text[start + len(opening):]
              end = text.index("</main>", start)
              text = text[:end] + "</div>" + text[end + len("</main>"):]

          old_nav = '<div className="mt-4 flex gap-2 overflow-x-auto pb-1" aria-label="Ir para uma fase do guia">'
          if old_nav in text:
              new_nav = '<nav className="mt-4 flex flex-wrap gap-2" aria-label="Ir para uma fase do guia">'
              start = text.index(old_nav)
              text = text[:start] + new_nav + text[start + len(old_nav):]
              section_end = text.index("      </section>", start)
              close = text.rfind("        </div>", start, section_end)
              assert close != -1
              text = text[:close] + "        </nav>" + text[close + len("        </div>"):]

          text = text.replace(
              '<fieldset className="flex gap-2 overflow-x-auto pb-1">',
              '<fieldset className="flex flex-wrap gap-2">',
              1,
          )
          text = text.replace(
              '                                role="checkbox"\n                                aria-checked={checked}',
              '                                aria-pressed={checked}',
              1,
          )
          page.write_text(text)

          content = Path("apps/web/app/(shell)/guide/manaus-guide-content.ts")
          text = content.read_text()
          text = text.replace(
              "Em Manaus, 8 km no mapa podem significar experiências bem diferentes conforme o horário.",
              "Em Manaus, uma distância curta no mapa pode significar uma experiência bem diferente conforme o horário.",
          )
          content.write_text(text)

          city = Path("apps/web/app/components/bivaque/city-reference.tsx")
          text = city.read_text()
          text = text.replace(
              "Moradia, escola, mudança, saúde, transporte e rotina da casa — um roteiro de D-60 a\n          D+60, somado às indicações locais curadas pela comunidade.",
              "Referência permanente para quem chega. Em Manaus, inclui o roteiro D-60 a D+60; nas\n          demais cidades, cresce com as indicações locais curadas pela comunidade.",
          )
          city.write_text(text)
      - name: Format changed guide files
        run: |
          pnpm exec biome check --write \
            'apps/web/app/(shell)/guide/page.tsx' \
            'apps/web/app/(shell)/guide/manaus-guide-content.ts' \
            'apps/web/app/(shell)/guide/manaus-guide-hero.tsx' \
            'apps/web/app/components/bivaque/city-reference.tsx' \
            'tests/unit/guide/manaus-guide-content.test.ts'
      - name: Commit formatted guide files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            'apps/web/app/(shell)/guide/page.tsx' \
            'apps/web/app/(shell)/guide/manaus-guide-content.ts' \
            'apps/web/app/(shell)/guide/manaus-guide-hero.tsx' \
            'apps/web/app/components/bivaque/city-reference.tsx' \
            'tests/unit/guide/manaus-guide-content.test.ts'
          if git diff --cached --quiet; then
            echo "Guide files are already formatted."
            exit 0
          fi
          git commit -m "fix(guide): format and harden Manaus guide"
          git push origin HEAD:feat/manaus-arrival-guide
