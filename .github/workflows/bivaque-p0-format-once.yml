name: Bivaque P0 Formatting (one-off)
on:
  pull_request:
    paths:
      - '.github/workflows/bivaque-p0-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/ui-foundation-21st-20261026' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only changed app files
        run: |
          pnpm exec biome check --write \
            apps/app/components/bivaque/grade.tsx \
            apps/app/components/bivaque/sobreposicao.tsx \
            apps/app/components/ui/dialog.tsx \
            apps/app/playwright.config.ts \
            apps/app/src/telas/Busca.tsx \
            apps/app/src/telas/Comunidade.tsx \
            apps/app/src/telas/Mercado.tsx \
            apps/app/src/telas/Pergunta.tsx \
            apps/app/lib/perguntas-locais.ts \
            apps/app/tests/e2e/r72-mobile-p0.spec.ts || true
      - name: Commit only deterministic formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/components/bivaque/grade.tsx apps/app/components/bivaque/sobreposicao.tsx apps/app/components/ui/dialog.tsx apps/app/playwright.config.ts apps/app/src/telas/Busca.tsx apps/app/src/telas/Comunidade.tsx apps/app/src/telas/Mercado.tsx apps/app/src/telas/Pergunta.tsx apps/app/lib/perguntas-locais.ts apps/app/tests/e2e/r72-mobile-p0.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(app): apply Biome to shadcn and mobile P0 changes"
            git push origin HEAD:refs/heads/codex/ui-foundation-21st-20261026
          fi
