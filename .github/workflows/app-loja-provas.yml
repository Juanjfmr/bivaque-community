name: Provas do app de loja

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/app/android/**
      - apps/app/ios/**
      - apps/app/lib/nativo/**
      - apps/app/src/nativo/**
      - apps/app/lib/api/cliente.ts
      - apps/app/capacitor.config.ts
      - tests/nativo/**
      - .github/workflows/app-loja-provas.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Cache Supabase stack images
        id: supabase-images
        uses: actions/cache@v6
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-2.107.0-postgres-17.6.1.136-gotrue-v2.190.0-postgrest-v14.13-storage-api-v1.60.20-postgres-meta-v0.96.6-studio-2026.06.15-sha-a412298-kong-2.8.1-imgproxy-v3.8.0-mailpit-v1.22.3

      - name: Load Supabase stack images from cache
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-images.tar

      - name: Pre-pull Supabase stack images
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          pull() {
            local ecr="public.ecr.aws/supabase/$1" hub="$2"
            for delay in 0 10 30 60; do
              sleep "$delay"
              docker pull -q "$ecr" && return 0
            done
            docker pull -q "$hub" && docker tag "$hub" "$ecr"               || echo "::warning::$1 nao baixou do ECR nem do Docker Hub; o supabase start tenta de novo"
          }
          pull postgres:17.6.1.136 supabase/postgres:17.6.1.136
          pull gotrue:v2.190.0 supabase/gotrue:v2.190.0
          pull postgrest:v14.13 postgrest/postgrest:v14.13
          pull storage-api:v1.60.20 supabase/storage-api:v1.60.20
          pull postgres-meta:v0.96.6 supabase/postgres-meta:v0.96.6
          pull studio:2026.06.15-sha-a412298 supabase/studio:2026.06.15-sha-a412298
          pull kong:2.8.1 kong:2.8.1
          pull imgproxy:v3.8.0 darthsim/imgproxy:v3.8.0
          pull mailpit:v1.22.3 axllent/mailpit:v1.22.3
          # Grava o conjunto para o cache do próximo run. Imagem que faltou não
          # derruba o passo (o pull acima já avisou); o cache simplesmente não é
          # gravado e o run seguinte baixa de novo.
          docker save -o /tmp/supabase-images.tar \
            public.ecr.aws/supabase/postgres:17.6.1.136 \
            public.ecr.aws/supabase/gotrue:v2.190.0 \
            public.ecr.aws/supabase/postgrest:v14.13 \
            public.ecr.aws/supabase/storage-api:v1.60.20 \
            public.ecr.aws/supabase/postgres-meta:v0.96.6 \
            public.ecr.aws/supabase/studio:2026.06.15-sha-a412298 \
            public.ecr.aws/supabase/kong:2.8.1 \
            public.ecr.aws/supabase/imgproxy:v3.8.0 \
            public.ecr.aws/supabase/mailpit:v1.22.3 \
            || echo "::warning::nem todas as imagens foram salvas; o proximo run baixa de novo"

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Configurar pilha e servidor
        run: |
          set -euo pipefail
          pnpm exec supabase status -o env > "$RUNNER_TEMP/supabase.env"
          . "$RUNNER_TEMP/supabase.env"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "BIVAQUE_LIMITER_PEPPER=$(openssl rand -hex 32)"
          } > apps/web/.env.local
          pnpm exec supabase db reset --local
          pnpm build
          pnpm --filter web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000; then exit 0; fi
            sleep 2
          done
          echo "::error::Servidor web não iniciou"
          exit 1
      - name: Compilar APK de depuração
        env:
          VITE_API_BASE: http://localhost:3000
          VITE_SUPABASE_URL: http://localhost:54321
        run: |
          pnpm --filter @bivaque/app build
          pnpm --filter @bivaque/app exec cap sync android
          mkdir -p apps/app/android/app/src/debug/res/xml
          cat > apps/app/android/app/src/debug/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">
            <application android:networkSecurityConfig="@xml/rede_de_prova" tools:ignore="GoogleAppIndexingWarning" />
          </manifest>
          EOF
          cat > apps/app/android/app/src/debug/res/xml/rede_de_prova.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false" />
            <domain-config cleartextTrafficPermitted="true">
              <domain includeSubdomains="false">localhost</domain>
              <domain includeSubdomains="false">127.0.0.1</domain>
            </domain-config>
          </network-security-config>
          EOF
          cd apps/app/android
          for attempt in 1 2 3; do
            echo "Tentativa $attempt/3: ./gradlew assembleDebug"
            if ./gradlew assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "assembleDebug falhou na tentativa $attempt; aguardando 60s antes de repetir"
              sleep 60
            fi
          done
          echo "::error::assembleDebug falhou após 3 tentativas"
          exit 1
      - name: Conferir configuração de rede no APK de depuração
        run: |
          set -euo pipefail
          mkdir -p .visual/loja-004/nativo
          apk=apps/app/android/app/build/outputs/apk/debug/app-debug.apk
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          "$aapt2" dump xmltree "$apk" --file AndroidManifest.xml | grep -F 'networkSecurityConfig' | tee .visual/loja-004/nativo/rede-debug.log
          unzip -p "$apk" resources.arsc | strings | grep -F 'rede_de_prova' | tee -a .visual/loja-004/nativo/rede-debug.log
          test -s .visual/loja-004/nativo/rede-debug.log
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Registrar respostas do servidor
        run: |
          mkdir -p .visual/loja-004/nativo
          {
            printf 'GET /api/localities: '
            curl -s -o /dev/null -w "%{http_code}\n" http://localhost:3000/api/localities
            printf 'OPTIONS /api/app/voce: '
            curl -s -o /dev/null -w "%{http_code}\n" -X OPTIONS -H "Origin: https://localhost" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: authorization,x-bivaque-app,x-bivaque-cliente" http://localhost:3000/api/app/voce
          } > .visual/loja-004/nativo/servidor.log
      - name: Provar no emulador
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb reverse tcp:3000 tcp:3000
            adb reverse tcp:54321 tcp:54321
            adb install -r apps/app/android/app/build/outputs/apk/debug/app-debug.apk
            node tests/nativo/android.mjs
      - name: Filtrar erros do servidor web
        if: always()
        run: |
          mkdir -p .visual/loja-004/nativo
          if [ -f "$RUNNER_TEMP/web.log" ]; then
            (grep -E 'error|Error|warn| [45][0-9]{2}([[:space:]]|$)' "$RUNNER_TEMP/web.log" || true) \
              | sed -E 's/eyJ[A-Za-z0-9._-]+/[omitido]/g; s/Bearer [^ ]+/[omitido]/g; s/\b[0-9]{6}\b/[omitido]/g; s/\?[^ ]*/[omitido]/g' \
              | sed -n '1,300p' > .visual/loja-004/nativo/web-erros.log
          else
            : > .visual/loja-004/nativo/web-erros.log
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provas-android
          path: .visual/loja-004/nativo/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Iniciar API de prova do iOS
        run: |
          mkdir -p .visual/loja-004/ios
          : > .visual/loja-004/ios/ios-api.log
          node tests/nativo/api-de-prova.mjs .visual/loja-004/ios/ios-api.log > "$RUNNER_TEMP/ios-api-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ios-api-server.pid"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3999/api/localities; then exit 0; fi
            sleep 1
          done
          echo "::error::API de prova do iOS não iniciou"
          exit 1
      - name: Preparar app
        env:
          VITE_API_BASE: http://localhost:3999
          VITE_SUPABASE_URL: http://localhost:3999
        run: |
          pnpm --filter @bivaque/app build
          pnpm --filter @bivaque/app exec cap sync ios
      - name: Compilar simulador sem assinatura
        working-directory: apps/app/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Abrir app e link no simulador
        run: |
          set -euo pipefail
          mkdir -p .visual/loja-004/ios
          device=$(xcrun simctl list devices available -j | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=Object.values(JSON.parse(s).devices).flat().find(x=>x.name.startsWith("iPhone"));if(!d)process.exit(1);process.stdout.write(d.udid)})')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/App.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/App.app/Info.plist")
          mkdir -p .visual/loja-004/ios
          xcrun simctl launch --terminate-running-process --stdout="$RUNNER_TEMP/ios-console.log" --stderr="$RUNNER_TEMP/ios-console-error.log" "$device" "$bundle_id"
          node tests/nativo/ios.mjs "$device" "$bundle_id"
      - name: Registrar logs do app e WebKit
        if: always()
        run: |
          mkdir -p .visual/loja-004/ios
          filter='s/eyJ[A-Za-z0-9._-]+/[omitido]/g; s/Bearer [^ ]+/[omitido]/g; s/\b[0-9]{6}\b/[omitido]/g; s/\?[^ ]*/[omitido]/g'
          if [ -f "$RUNNER_TEMP/ios-console.log" ]; then
            sed -E "$filter" "$RUNNER_TEMP/ios-console.log" | tail -n 400 > .visual/loja-004/ios/ios-console.log
          else
            : > .visual/loja-004/ios/ios-console.log
          fi
          if [ -f "$RUNNER_TEMP/ios-console-error.log" ]; then
            sed -E "$filter" "$RUNNER_TEMP/ios-console-error.log" | tail -n 400 > .visual/loja-004/ios/ios-console-error.log
          else
            : > .visual/loja-004/ios/ios-console-error.log
          fi
          if [ -f "$RUNNER_TEMP/ios-api-server.log" ]; then
            sed -E "$filter" "$RUNNER_TEMP/ios-api-server.log" | tail -n 400 > .visual/loja-004/ios/ios-api-server.log
          fi
          process_name=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/App.app/Info.plist" 2>/dev/null || echo App)
          xcrun simctl spawn "$device" log show --last 5m --style compact --predicate "(subsystem CONTAINS[c] \"$process_name\" OR subsystem CONTAINS[c] \"webkit\" OR subsystem CONTAINS[c] \"capacitor\") AND NOT subsystem CONTAINS[c] \"com.apple.coremedia\"" 2>&1 \
            | sed -E "$filter" | tail -n 400 > .visual/loja-004/ios/ios-app.log || true
          xcrun simctl spawn "$device" log show --last 5m --style compact --predicate 'process == "com.apple.WebKit.WebContent" AND (eventMessage CONTAINS[c] "Content Security Policy" OR eventMessage CONTAINS[c] "Refused" OR eventMessage CONTAINS[c] "error")' 2>&1 \
            | sed -E "$filter" | tail -n 400 > .visual/loja-004/ios/ios-webkit.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provas-ios
          path: |
            .visual/loja-004/ios/*.png
            .visual/loja-004/ios/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
