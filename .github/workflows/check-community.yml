name: Diagnose community prototype

on:
  push:
    branches:
      - feat/comunidade-21st-visual-20261027

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Biome diagnostics
        run: pnpm exec biome check apps/prototipo --max-diagnostics=300 || true
      - name: Prototype typecheck
        run: pnpm --filter @bivaque/prototipo typecheck || true
      - name: Prototype build
        run: pnpm --filter @bivaque/prototipo build || true
