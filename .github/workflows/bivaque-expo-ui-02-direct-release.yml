name: Bivaque Expo UI 0.2 - Direct APK Release

on:
  push:
    branches:
      - experiment/bivaque-native-expo-ui-20261111
    paths:
      - ".github/workflows/bivaque-expo-ui-02-direct-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: experiments/bivaque-native-v1
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: experiments/bivaque-native-v1/package.json
      - name: Install exact Expo SDK 56 dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx expo install --check
      - name: Validate types and behavior
        run: |
          npm run assets:copy
          npm run typecheck
          npm test
      - name: Compile standalone Android release
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: Confirm APK and checksum
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Bivaque_Expo_UI_0.2.0_Android.apk
          test -s Bivaque_Expo_UI_0.2.0_Android.apk
          sha256sum Bivaque_Expo_UI_0.2.0_Android.apk | tee SHA256SUMS.txt
          ls -lah Bivaque_Expo_UI_0.2.0_Android.apk
      - name: Publish APK to GitHub Releases without artifact upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bivaque-expo-ui-v0.2.0-android"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Bivaque Nativo 0.2.0 (Expo UI) - Android APK" \
              --notes "APK beta nativo Android, Expo SDK 56, Expo UI, Expo Image; banco demonstrativo local sem Supabase. Instalador separado do beta 0.1."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            Bivaque_Expo_UI_0.2.0_Android.apk SHA256SUMS.txt --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url
