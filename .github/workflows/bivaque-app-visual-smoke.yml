name: Bivaque App Visual Smoke

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` faz aplicar a label ci:full disparar o run completo neste PR.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/app/**'
      - '.github/workflows/bivaque-app-visual-smoke.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # RUN-149/150: o visual rodava em série num worker só (7 projetos, ~32 min) e
  # workers>1 COLIDE (scaffold modo-de-prova compartilha estado). A distribuição é
  # por PROJETO em runners isolados: cada job tem seu vite dev/preview + scaffold
  # próprios, sem colisão, sem Supabase (só install + build Vite + chromium). Os 6
  # tamanhos são balanceados; publicado roda só *.publicado.spec.ts. Wall time cai
  # para ~o projeto mais lento + setup. O agregador abaixo é o check único do gate.
  visual:
    name: Visual / ${{ matrix.project }}
    # ubuntu-latest migrou para 26.04, que o Playwright 1.51.1 não suporta (pin intencional).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Completo só no fechamento do lote (label ci:full), push na main ou dispatch;
    # ver ADR-20261114.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    strategy:
      fail-fast: false
      matrix:
        project:
          - mobile-320
          - mobile-360
          - mobile-375
          - mobile-430
          - tablet-768
          - desktop-1440
          - publicado

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Vite app
        run: pnpm --filter @bivaque/app build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run project ${{ matrix.project }}
        # Um projeto por runner, workers:1 (config do app): sem colisão de scaffold.
        run: pnpm --filter @bivaque/app exec playwright test --project=${{ matrix.project }} --trace=retain-on-failure

      - name: Save test and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-${{ matrix.project }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            apps/app/test-results/
            apps/app/artifacts/visual/
            apps/app/artifacts/visual-mobile/
            .visual/

  # Check único do gate (nome antigo preservado): agrega os 7 projetos. Verde se
  # todos passaram ou se o visual foi pulado (PR sem ci:full); vermelho se algum falhou.
  visual-aggregate:
    name: App mobile-first / 320-360-375-430-768-1440
    needs: [visual]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate visual projects
        run: |
          result="${{ needs.visual.result }}"
          echo "visual matrix: $result"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "::error::um ou mais projetos visuais falharam"
            exit 1
          fi