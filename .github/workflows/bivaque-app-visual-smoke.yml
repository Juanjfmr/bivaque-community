name: Bivaque App Visual Smoke

on:
  pull_request:
    paths:
      - 'apps/app/**'
      - '.github/workflows/bivaque-app-visual-smoke.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-visual-smoke:
    name: App mobile-first / 320-360-375-430-768-1440
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Vite app
        run: pnpm --filter @bivaque/app build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the app suite, six sizes
        # A suíte inteira, pelo script do pacote: spec nova entra sozinha. A
        # lista fixa de antes deixou 15 casos vermelhos passarem batido.
        run: pnpm --filter @bivaque/app test:e2e --trace=retain-on-failure

      - name: Save test and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-visual-evidence
          if-no-files-found: ignore
          path: |
            apps/app/test-results/
            apps/app/artifacts/visual/
            apps/app/artifacts/visual-mobile/
