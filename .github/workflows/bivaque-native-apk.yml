name: Bivaque Native Android APK
on:
  push:
    branches:
      - experiment/bivaque-native-v1-20261111
    paths:
      - "experiments/bivaque-native-v1/**"
      - ".github/workflows/bivaque-native-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: experiments/bivaque-native-v1
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install native app dependencies
        run: npm install --no-audit --no-fund
      - name: Include original Bivaque image assets
        run: npm run assets:copy
      - name: Verify native TypeScript and behavior contracts
        run: |
          npm run typecheck
          npm test
      - name: Verify Metro Android JS bundle
        run: npx expo export --platform android --output-dir dist
      - name: Generate Android native sources
        run: npx expo prebuild --clean --platform android --no-install
      - name: Compile installable release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: Verify APK and prepare download
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Bivaque_Nativo_Beta_Android.apk
          test -s out/Bivaque_Nativo_Beta_Android.apk
          echo "APK SHA-256: $(sha256sum out/Bivaque_Nativo_Beta_Android.apk)"
          if command -v apksigner >/dev/null; then apksigner verify out/Bivaque_Nativo_Beta_Android.apk; fi
      - name: Upload real Android APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Bivaque-Nativo-Beta-APK
          path: experiments/bivaque-native-v1/out/Bivaque_Nativo_Beta_Android.apk
          retention-days: 14