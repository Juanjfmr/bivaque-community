name: Format community prototype
on:
  push:
    branches:
      - feat/comunidade-21st-visual-20261027
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Apply safe formatting and imports
        run: |
          pnpm exec biome check --write             apps/prototipo/components/bivaque/jornada-comunidade.tsx             apps/prototipo/components/ui/button.tsx             apps/prototipo/components/ui/badge.tsx || true
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/prototipo
            git commit -m "style(community): fix Biome imports and formatting"
            git push
          fi
