name: Format community prototype

on:
  push:
    branches:
      - feat/comunidade-21st-visual-20261027

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format new community files
        run: |
          pnpm exec biome format --write \
            apps/prototipo/components/bivaque/jornada-comunidade.tsx \
            apps/prototipo/components/bivaque/jornada-comunidade.css \
            apps/prototipo/components/bivaque/estrutura.tsx \
            apps/prototipo/app/comunidade/page.tsx \
            apps/prototipo/app/comunidade/indicacoes/page.tsx \
            apps/prototipo/app/comunidade/criar/page.tsx \
            apps/prototipo/app/comunidade/grupos/page.tsx \
            'apps/prototipo/app/comunidade/grupos/[id]/page.tsx' \
            apps/prototipo/app/comunidade/eventos/page.tsx \
            'apps/prototipo/app/comunidade/pergunta/[id]/page.tsx' \
            apps/prototipo/app/mercado/page.tsx
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/prototipo
            git commit -m "style(community): apply Biome formatting"
            git push
          fi
