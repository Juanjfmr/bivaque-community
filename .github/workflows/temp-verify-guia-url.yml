name: Temp verify Bivaque Guia React URL
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose route mappings
        shell: bash
        run: |
          set -u
          BASE="https://bivaque-guia-react-preview-a9jk473e7-hub-militar.vercel.app"
          for PATH_TO_TEST in / /app /app/ /index.html /assets/index-BOAI5XBn.js /app/assets/index-BOAI5XBn.js /app/fonts/noto-sans.woff2; do
            echo "PROBE $PATH_TO_TEST"
            curl --connect-timeout 8 --max-time 15 -sSL -D /tmp/header -o /tmp/body -w 'STATUS=%{http_code} FINAL=%{url_effective}\n' "$BASE$PATH_TO_TEST"
            grep -iE '^(HTTP/|location:|content-type:|x-vercel-id:)' /tmp/header || true
            echo "BODY_SIZE=$(wc -c < /tmp/body)"
            head -c 90 /tmp/body || true
            echo
          done
