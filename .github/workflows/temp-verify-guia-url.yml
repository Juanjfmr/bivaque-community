name: Temp verify Bivaque Guia React URL
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Validate live React preview at mobile and desktop sizes
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test'
          const base='https://bivaque-guia-react-preview-lx7o21nbi-hub-militar.vercel.app/app/'
          const browser=await chromium.launch({headless:true})
          try {
            for (const width of [320,375,430,768,1440]) {
              const page=await browser.newPage({viewport:{width,height:900}})
              const errors=[]
              page.on('pageerror',e=>errors.push(e.message))
              const response=await page.goto(base,{waitUntil:'networkidle',timeout:45000})
              if(response?.status()!==200)throw new Error('HTTP '+response?.status())
              await page.getByText('Sua rede em Manaus').first().waitFor({timeout:30000})
              await page.getByText('Favoritos da vizinhança').first().waitFor({timeout:30000})
              await page.getByText('Imóveis para morar').first().waitFor({timeout:30000})
              const metrics=await page.evaluate(()=>({viewport:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth, cards:document.querySelectorAll('[data-vitrine="21st"]').length}))
              if(metrics.scrollWidth>metrics.viewport+2)throw new Error('overflow '+width+' '+JSON.stringify(metrics))
              if(errors.length)throw new Error('JS '+width+' '+errors.join('; '))
              console.log('BIVAQUE_UI_OK '+width+' '+JSON.stringify(metrics))
              await page.close()
            }
          } finally {await browser.close()}
          JS
