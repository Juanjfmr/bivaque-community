name: Guide downstream verification temporary

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, DB, and E2E after baseline scope blocker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Write local Supabase env
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          . /tmp/supabase.env
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "BIVAQUE_VISUAL_EMAIL=visual@bivaque.example.invalid"
            echo "BIVAQUE_VISUAL_PASSWORD=bivaque-e2e-local"
          } > apps/web/.env.local

      - name: Build web app
        run: pnpm build

      - name: Check generated types drift
        run: |
          pnpm generate:types
          git diff --exit-code -- supabase/database.generated.ts

      - name: Reset local database without seed
        run: pnpm exec supabase db reset --local --no-seed

      - name: Database tests
        run: pnpm test:db

      - name: Schema lint
        run: pnpm db:lint

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Reset local database with seed
        run: pnpm exec supabase db reset --local

      - name: Root E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guide-verification-playwright-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            apps/web/playwright-report/
            apps/web/test-results/
