name: Bivaque P1 Final Format
on:
  pull_request:
    paths:
      - '.github/workflows/bivaque-p1-final-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/ui-foundation-21st-20261026' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exactly two updated P1 files
        run: pnpm exec biome check --write apps/app/components/bivaque/cartao-de-anuncio.tsx apps/app/tests/e2e/r72-mobile-p1.spec.ts
      - name: Commit formatting to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/components/bivaque/cartao-de-anuncio.tsx apps/app/tests/e2e/r72-mobile-p1.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(app): format P1 property attributes"
            git push origin HEAD:refs/heads/codex/ui-foundation-21st-20261026
          fi
