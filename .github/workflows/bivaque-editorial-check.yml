name: Bivaque Editorial — visual verification
on:
  push:
    branches:
      - feat/bivaque-editorial-shadcn-20261025
    paths:
      - 'prototypes/bivaque-next-shadcn/**'
      - '.github/workflows/bivaque-editorial-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bivaque-editorial-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/bivaque-next-shadcn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check color contrast
        run: node scripts/verify-contrast.mjs
      - name: Verify component grammar and remove generic hero
        run: |
          grep -q 'A vida muda de cidade' components/library-app.tsx
          grep -q 'A comunidade responde' components/library-app.tsx
          grep -q 'Navegação principal mobile' components/library-app.tsx
          grep -q 'slice(0,3)' components/library-app.tsx
          ! grep -q 'photo-1486406146926-c627a92ad1ab' components/library-app.tsx
      - name: Build static GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/bivaque-community'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Check expected routes and image assets
        run: |
          test -f out/index.html
          test -f out/comunidade/index.html
          test -f out/imoveis/index.html
          test -f out/servicos/index.html
          test -f out/brand/bivaque-logo-horizontal-white.svg
          grep -q '/bivaque-community/_next/static' out/index.html
