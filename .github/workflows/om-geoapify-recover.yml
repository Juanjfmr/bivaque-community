name: OM Geoapify - recover existing 537 (no submit)
# One-off safe recovery. NEVER submit a new paid batch.
on:
  push:
    branches:
      - feat/om-catalog-staging-20261021
    paths:
      - .github/workflows/om-geoapify-recover.yml
permissions:
  contents: read
concurrency:
  group: om-geoapify-recover-existing-4253ec56
  cancel-in-progress: false
jobs:
  collect-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and verify original 537-address manifest (offline)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/om
          python scripts/om-catalog/normalize.py data/om/raw_oms_1416.csv /tmp/om
          python scripts/om-catalog/audit_sites.py --organizations /tmp/om/military_organizations.csv --sites /tmp/om/military_sites.csv --out /tmp/om/audit --localities data/om/ibge_localities.csv
          python scripts/om-catalog/geoapify_batch.py --queue /tmp/om/audit/geocoding_queue.csv --out /tmp/om/geocoding --max-addresses 537
          echo 'db1fe824a0aea3f7908add1fa4ab737ea2cb7ece093bc3027e4b5b7b7adde652  /tmp/om/geocoding/geocoding_manifest.json' | sha256sum -c -
          printf '%s\n' '{"id":"4253ec562d7c4d5896a3907de3ed30fa","inputs":537,"mode":"collect-only"}' > /tmp/om/geocoding/batch_job.json
      - name: Collect Geoapify batch WITHOUT new submission
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GEOAPIFY_API_KEY" ]; then
            echo '::error::The existing GEOAPIFY_API_KEY secret is missing.'
            exit 1
          fi
          for attempt in $(seq 1 24); do
            python scripts/om-catalog/geoapify_batch.py --queue /tmp/om/audit/geocoding_queue.csv --out /tmp/om/geocoding --operation collect --job-id 4253ec562d7c4d5896a3907de3ed30fa --max-addresses 537 | tee /tmp/om/geocoding/recovery_status.json
            status=$(python -c "import json;print(json.load(open('/tmp/om/geocoding/recovery_status.json'))['status'])")
            if [ "$status" = "RECEIVED_UNVERIFIED" ]; then
              python scripts/om-catalog/parse_geoapify_results.py --manifest /tmp/om/geocoding/geocoding_manifest.json --results /tmp/om/geocoding/provider_results_unverified.json --queue /tmp/om/audit/geocoding_queue.csv --out /tmp/om/geocoding/unverified_suggestions.csv
              python - <<'PY'
          import csv,json,collections,pathlib
          p=pathlib.Path('/tmp/om/geocoding')
          rows=list(csv.DictReader((p/'unverified_suggestions.csv').open(encoding='utf-8')))
          raw=json.loads((p/'provider_results_unverified.json').read_text(encoding='utf-8'))
          with_coordinates=sum(isinstance(hit,dict) and hit.get('lat') is not None and hit.get('lon') is not None for hit in raw)
          statuses=dict(collections.Counter(row.get('status','') for row in rows))
          summary={'batch_id':'4253ec562d7c4d5896a3907de3ed30fa','requests':537,'provider_responses':len(raw),'coordinate_candidates_unverified':with_coordinates,'review_rows':len(rows),'review_statuses':statuses,'verified_military_locations':0}
          (p/'recovery_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Original Geoapify batch recovered (UNVERIFIED)\n\n')
              for k,v in summary.items():f.write(f'- {k}: {v}\n')
          PY
              exit 0
            fi
            echo "Existing batch status: $status; check $attempt/24"
            if [ "$attempt" -lt 24 ]; then sleep 30; fi
          done
          echo '::error::Original Geoapify batch is still pending. No new batch was submitted.'
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: om-geoapify-recovery-original-batch-unverified
          path: /tmp/om/geocoding/
          retention-days: 14
          if-no-files-found: warn
