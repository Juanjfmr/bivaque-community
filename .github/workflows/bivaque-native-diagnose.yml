name: Diagnose Expo autolinking modules
on:
  push:
    branches:
      - experiment/bivaque-native-v1-20261111
    paths:
      - ".github/workflows/bivaque-native-diagnose.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/bivaque-native-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect Expo modules
        run: |
          npm install --no-audit --no-fund
          npx expo-modules-autolinking resolve --platform android --json > /tmp/expo-modules.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/expo-modules.json'))
          print('STRUCTURE:',list(d))
          for i,x in enumerate(d.get('modules',[])):
            print('MODULE',i,'packageName=',x.get('packageName'),'name=',x.get('name'))
            for j,p in enumerate(x.get('projects',[])):
              print('   PROJECT',j,'publication=',p.get('publication'))
          PY