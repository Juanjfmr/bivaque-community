name: Unpack Bivaque Native source
on:
  push:
    branches:
      - experiment/bivaque-native-v1-20261111
    paths:
      - "native-beta-bootstrap/payload.b64"
      - ".github/workflows/bivaque-native-bootstrap.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    if: github.repository == 'Juanjfmr/bivaque-community'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore reviewable Expo source files
        run: |
          set -euo pipefail
          test -f native-beta-bootstrap/payload.b64 || exit 0
          mkdir -p experiments/bivaque-native-v1
          base64 -d native-beta-bootstrap/payload.b64 | tar -xz -C experiments/bivaque-native-v1
          test -f experiments/bivaque-native-v1/package.json
          test -f experiments/bivaque-native-v1/app/_layout.tsx
          rm -rf native-beta-bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A experiments/bivaque-native-v1 native-beta-bootstrap
          git commit -m "feat(native): Expo Android app with persistent community and marketplace journeys"
          git push origin HEAD:experiment/bivaque-native-v1-20261111