name: Pull Request CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` faz aplicar a label ci:full disparar o run completo neste PR.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ciclo de implementação: feedback em <=5 min, sem Supabase/build/E2E (ADR-20261114).
  fast:
    name: Fast checks
    # ubuntu-latest migrou para 26.04, que o Playwright 1.51.1 não suporta
    # (chromium). Pinar 24.04 até o Playwright ser atualizado (pin intencional).
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck E2E specs
        run: pnpm exec tsc -p tests/e2e/tsconfig.json

      - name: Unit, privacy and scope tests
        run: pnpm test

      - name: Secrets scan
        run: pnpm test:secrets

  ci:
    name: Install, test, and build
    # ubuntu-latest migrou para 26.04, que o Playwright 1.51.1 não suporta
    # (chromium). Pinar 24.04 até o Playwright ser atualizado (pin intencional).
    runs-on: ubuntu-24.04
    # Completo só no fechamento do lote (label ci:full), push na main ou dispatch;
    # ver ADR-20261114.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Next.js build artifacts
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Os specs de E2E da raiz são TypeScript e não passam pelo typecheck dos
      # workspaces; sem este passo um spec quebrado só aparecia depois de subir
      # o Supabase inteiro. Os specs de apps/app entram no `tsc --noEmit` do
      # build do app, que inclui `tests/`.
      - name: Typecheck E2E specs
        run: pnpm exec tsc -p tests/e2e/tsconfig.json

      - name: Unit, privacy and scope tests
        run: pnpm test

      - name: Secrets scan
        run: pnpm test:secrets

      # `supabase start` pulls the whole stack from the public ECR, and the ECR
      # refused it twice in a row with "toomanyrequests: Data limit exceeded"
      # before any test ran (21/10/2026, PR #98, and other branches the same
      # day). Same remedy as the tool images below: pull with backoff and, if
      # ECR still refuses, take the same tag from Docker Hub and retag it under
      # the name the CLI asks for, so `supabase start` finds it locally.
      # Tags are the defaults of the pinned CLI (2.107.0), from `supabase services`.
      - name: Pre-pull Supabase stack images
        run: |
          pull() {
            local ecr="public.ecr.aws/supabase/$1" hub="$2"
            for delay in 0 10 30 60; do
              sleep "$delay"
              docker pull -q "$ecr" && return 0
            done
            docker pull -q "$hub" && docker tag "$hub" "$ecr"               || echo "::warning::$1 nao baixou do ECR nem do Docker Hub; o supabase start tenta de novo"
          }
          pull postgres:17.6.1.136 supabase/postgres:17.6.1.136
          pull gotrue:v2.190.0 supabase/gotrue:v2.190.0
          pull postgrest:v14.13 postgrest/postgrest:v14.13
          pull storage-api:v1.60.20 supabase/storage-api:v1.60.20
          pull postgres-meta:v0.96.6 supabase/postgres-meta:v0.96.6
          pull studio:2026.06.15-sha-a412298 supabase/studio:2026.06.15-sha-a412298
          pull kong:2.8.1 kong:2.8.1
          pull imgproxy:v3.8.0 darthsim/imgproxy:v3.8.0
          pull mailpit:v1.22.3 axllent/mailpit:v1.22.3

      - name: Start local Supabase
        run: pnpm exec supabase start

      # CI-E2E-UPSTREAM-INSTAVEL: o lote serial cai com 502 (recv() failed 104 /
      # upstream prematurely closed) na corrida Kong<->PostgREST. A receita provada
      # na reinvestigacao do RUN-144 aplica upstream_keepalive_idle_timeout=10 no
      # Kong EM EXECUCAO: `kong prepare` com o template custom + HUP no master.
      # NUNCA `kong reload` (regenera o template default e derruba o server 8088 de
      # templates de email -> GoTrue 404 -> F01 sem codigo) e NUNCA recriar o
      # container (perde os binds dos templates: a mesma regressao do RUN-144).
      - name: Apply Kong upstream keepalive idle timeout
        run: |
          set -euo pipefail
          kong=$(docker ps --filter "name=supabase_kong_" --format "{{.Names}}" | head -n1)
          if [ -z "$kong" ]; then
            echo "::error::container supabase_kong_* nao encontrado; o override nao foi aplicado"
            exit 1
          fi

          # `prepare` le o env do processo do exec e escreve .kong_env, que o init
          # do nginx relê no HUP. O -p e obrigatorio: sem ele o --nginx-conf e
          # silenciosamente ignorado nesta imagem.
          docker exec -e KONG_UPSTREAM_KEEPALIVE_IDLE_TIMEOUT=10 "$kong" \
            kong prepare -p /usr/local/kong --nginx-conf /home/kong/custom_nginx.template
          docker exec "$kong" sh -c 'kill -HUP $(cat /usr/local/kong/pids/nginx.pid)'
          sleep 2

          echo "Kong: $kong"
          echo "--- .kong_env ---"
          docker exec "$kong" grep -i upstream_keepalive_idle_timeout /usr/local/kong/.kong_env
          if ! docker exec "$kong" grep -qiE '^upstream_keepalive_idle_timeout *= *10$' /usr/local/kong/.kong_env; then
            echo "::error::.kong_env nao ficou com upstream_keepalive_idle_timeout = 10; o HUP nao aplicou o valor"
            exit 1
          fi

          echo "--- server 8088 no nginx.conf gerado ---"
          if ! docker exec "$kong" grep -q 'listen 0.0.0.0:8088' /usr/local/kong/nginx.conf; then
            echo "::error::nginx.conf gerado nao tem o server 8088 dos templates; o GoTrue cairia no template default (F01)"
            exit 1
          fi
          docker exec "$kong" grep -n '8088' /usr/local/kong/nginx.conf

          echo "--- fetch de um template de email em 127.0.0.1:8088 ---"
          # A imagem nao tem curl; o wget do BusyBox responde o status HTTP.
          docker exec "$kong" wget -q -S -O /dev/null http://127.0.0.1:8088/email/confirmation.html 2>&1 \
            | tee /tmp/kong-8088.txt || true
          if ! grep -q '200 OK' /tmp/kong-8088.txt; then
            echo "::error::o server 8088 nao respondeu 200 para o template; o F01 quebraria (GoTrue 404 -> magic link)"
            exit 1
          fi
          echo 'OK: upstream_keepalive_idle_timeout=10 aplicado, 8088 vivo servindo os templates'

      # `generate:types` and `test:db` pull two more images on first use. The
      # public ECR answers anonymous pulls with "toomanyrequests: Rate exceeded"
      # at busy hours, which failed this job twice before any test ran
      # (26/09/2026). Pull them here with backoff; if ECR still refuses, take the
      # same tag from Docker Hub and retag it under the name the CLI asks for.
      # Tags follow the pinned CLI (2.107.0).
      - name: Pre-pull Supabase tool images
        run: |
          pull() {
            local ecr="public.ecr.aws/supabase/$1" hub="supabase/$1"
            for delay in 0 10 30 60; do
              sleep "$delay"
              docker pull -q "$ecr" && return 0
            done
            docker pull -q "$hub" && docker tag "$hub" "$ecr"
          }
          pull postgres-meta:v0.96.1
          pull pg_prove:3.36

      # Next inlines NEXT_PUBLIC_* at build time, so the stack has to be up and
      # the env written before `pnpm build` runs — not after it.
      #
      # The three BIVAQUE_* values below are development seed credentials
      # (supabase/seed.sql), public and disposable by design. They are supplied
      # here rather than defaulted inside a spec so that the specs keep the
      # contract this repo enforces: read the credential from the environment,
      # and throw when nothing provides one.
      - name: Write local Supabase env
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          . /tmp/supabase.env
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "BIVAQUE_VISUAL_EMAIL=visual@bivaque.example.invalid"
            echo "BIVAQUE_VISUAL_PASSWORD=bivaque-e2e-local"
            echo "BIVAQUE_E2E_OPERATOR_PASSWORD=bivaque-e2e-local"
            # Disposable pepper for the local limiter: production requires a real
            # secret; the E2E of the entry needs the OTP routes answering 200.
            echo "BIVAQUE_LIMITER_PEPPER=ci-e2e-limiter-pepper"
          } > apps/web/.env.local

      - name: Build web app
        run: pnpm build

      - name: Check generated types drift
        run: |
          pnpm generate:types
          git diff --exit-code -- supabase/database.generated.ts

      # pgTAP compares the exact set of profiles visible in Manaus against its
      # own fixtures, so it has to run against a database WITHOUT the
      # development seed. E2E needs the opposite — it authenticates as a seeded
      # user — hence the second reset further down.
      - name: Reset local database (no seed)
        run: pnpm exec supabase db reset --local --no-seed

      # O cliente do pg_prove só enxerga supabase/tests, então um include de
      # ../migrations não resolve dentro do container. A reaplicação integral da
      # carga nacional (prova de idempotência) roda aqui, no container do banco:
      # a segunda aplicação não pode mudar a contagem.
      - name: Reapply the IBGE neighborhoods load
        run: |
          set -euo pipefail
          db=$(docker ps --filter "name=supabase_db_" --format "{{.Names}}" | head -n1)
          test -n "$db"
          before=$(docker exec -u postgres "$db" psql -U postgres -d postgres -tAc "select count(*) from public.neighborhoods")
          docker exec -i -u postgres "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q < supabase/migrations/20261107140757_ibge_bairros_censo_2022.sql
          after=$(docker exec -u postgres "$db" psql -U postgres -d postgres -tAc "select count(*) from public.neighborhoods")
          echo "bairros antes=$before depois=$after"
          test "$before" = "$after"

      - name: Database tests
        run: pnpm test:db

      - name: Schema lint
        run: pnpm db:lint

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Reset local database (with seed)
        run: pnpm exec supabase db reset --local

      # Dois lotes de propósito: o normal roda em paralelo e EXCLUI os specs
      # marcados @stateful; esses rodam em serial depois, porque escrevem nas
      # mesmas linhas (grupo privado, save da mesma conta, pendentes da vila) e
      # colidiam entre si quando tudo rodava junto. Ver o contrato em
      # tests/scope/local-command-surface.test.mjs.
      - name: Root E2E tests (parallel, excluding @stateful)
        run: pnpm test:e2e

      # O trace de falha vai junto no artefato (test-results/): o relatório só
      # mostra o passo que travou, e um spec stateful que passa local e falha
      # aqui não tem outra testemunha do que a tela tinha (PR #98, 21/10/2026).
      - name: Root E2E tests (stateful, serial)
        run: pnpm test:e2e:stateful --trace=retain-on-failure

      # Testemunha do flaky (CI-E2E-UPSTREAM-INSTAVEL): em falha, guarda os logs da
      # stack local. O tail de 200 linhas do Kong só pegava access log e o evento 502
      # ficava de fora; aqui o tail do Kong é maior e os erros/upstream são extraídos
      # à parte, com rota e timestamp, para diagnosticar a causa real do 502.
      - name: Collect local Supabase diagnostics
        if: failure()
        run: |
          mkdir -p ci-stack-logs
          for service in kong rest auth db; do
            container=$(docker ps -a --filter "name=supabase_${service}_" --format "{{.Names}}" | head -n1)
            if [ -z "$container" ]; then
              echo "Container supabase_${service}_* nao encontrado" > "ci-stack-logs/${service}-container-missing.txt"
              continue
            fi
            tail_lines=200
            if [ "$service" = "kong" ]; then tail_lines=10000; fi
            docker logs --tail "$tail_lines" "$container" > "ci-stack-logs/${service}.log" 2>&1 || true
            docker inspect --format '{{.RestartCount}}' "$container" > "ci-stack-logs/${service}-restart-count.txt" 2>&1 || true
          done
          kong=$(docker ps -a --filter "name=supabase_kong_" --format "{{.Names}}" | head -n1)
          if [ -n "$kong" ]; then
            docker logs "$kong" 2>&1 | grep -iE '\[error\]|\[crit\]|\[warn\]|upstream|prematurely|reset by peer|HTTP/1.1" 502' > ci-stack-logs/kong-errors.log || true
          fi
          db=$(docker ps -a --filter "name=supabase_db_" --format "{{.Names}}" | head -n1)
          if [ -n "$db" ]; then
            docker exec -u postgres "$db" psql -U postgres -d postgres -Atc \
              "SHOW max_connections; SELECT count(*) FROM pg_stat_activity;" \
              > ci-stack-logs/db-connections.txt 2>&1 || true
          else
            echo "Container do banco nao encontrado" > ci-stack-logs/db-connections.txt
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            apps/web/playwright-report/
            apps/web/test-results/
            ci-stack-logs/

      # `.visual/` é ignorado pelo Git e concentra as capturas de tela das
      # provas visuais. Sem o artefato, a evidência de uma falha de UI morre
      # junto com a máquina do CI.
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: .visual/
          retention-days: 7
