name: Pull Request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Install, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Next.js build artifacts
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, privacy and scope tests
        run: pnpm test

      - name: Secrets scan
        run: pnpm test:secrets

      - name: Start local Supabase
        run: pnpm exec supabase start

      # Supabase CLI pulls these images lazily. Public ECR can answer with
      # toomanyrequests while the runner is healthy, so fetch the two images
      # that are needed later with bounded backoff while the failure is still
      # attributable to the registry pull. Once present, the dependent steps
      # use Docker's local cache instead of pulling concurrently with tests.
      - name: Warm Supabase test images
        shell: bash
        run: |
          set -euo pipefail

          pull_with_backoff() {
            local image="$1"
            local attempt

            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                return 0
              fi

              if [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 15))
              fi
            done

            echo "Failed to pull $image after 5 attempts" >&2
            return 1
          }

          pull_with_backoff public.ecr.aws/supabase/postgres-meta:v0.96.1
          pull_with_backoff public.ecr.aws/supabase/pg_prove:3.36

      # Next inlines NEXT_PUBLIC_* at build time, so the stack has to be up and
      # the env written before `pnpm build` runs — not after it.
      #
      # The three BIVAQUE_* values below are development seed credentials
      # (supabase/seed.sql), public and disposable by design. They are supplied
      # here rather than defaulted inside a spec so that the specs keep the
      # contract this repo enforces: read the credential from the environment,
      # and throw when nothing provides one.
      - name: Write local Supabase env
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          . /tmp/supabase.env
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "BIVAQUE_VISUAL_EMAIL=visual@bivaque.example.invalid"
            echo "BIVAQUE_VISUAL_PASSWORD=bivaque-e2e-local"
            echo "BIVAQUE_E2E_OPERATOR_PASSWORD=bivaque-e2e-local"
          } > apps/web/.env.local

      - name: Build web app
        run: pnpm build

      - name: Check generated types drift
        run: |
          pnpm generate:types
          git diff --exit-code -- supabase/database.generated.ts

      # pgTAP compares the exact set of profiles visible in Manaus against its
      # own fixtures, so it has to run against a database WITHOUT the
      # development seed. E2E needs the opposite — it authenticates as a seeded
      # user — hence the second reset further down.
      - name: Reset local database (no seed)
        run: pnpm exec supabase db reset --local --no-seed

      - name: Database tests
        run: pnpm test:db

      - name: Schema lint
        run: pnpm db:lint

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Reset local database for stateful E2E (with seed)
        run: pnpm exec supabase db reset --local

      # Stateful flows mutate the shared Postgres database. Run them once,
      # against a fresh seed, instead of repeating them across three viewport
      # projects where a failed cleanup can contaminate the next project.
      - name: Stateful E2E baseline
        run: pnpm exec playwright test --grep @stateful --project=desktop-1440 --workers=1 --retries=0

      - name: Reset local database for responsive E2E (with seed)
        run: pnpm exec supabase db reset --local

      - name: Root E2E tests (excluding stateful)
        run: pnpm exec playwright test --grep-invert @stateful --retries=0

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            apps/web/playwright-report/
            apps/web/test-results/
