name: Pull Request CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Install, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Next.js build artifacts
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, privacy and scope tests
        run: pnpm test

      - name: Secrets scan
        run: pnpm test:secrets

      - name: Start local Supabase
        run: pnpm exec supabase start

      # Next inlines NEXT_PUBLIC_* at build time, so the stack has to be up and
      # the env written before `pnpm build` runs — not after it.
      #
      # The two BIVAQUE_VISUAL_* values are the development seed's account
      # (supabase/seed.sql), public and disposable by design. They are supplied
      # here rather than defaulted inside a spec so that the specs keep the
      # contract this repo enforces: read the credential from the environment,
      # and throw when nothing provides one.
      - name: Write local Supabase env
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          . /tmp/supabase.env
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "BIVAQUE_VISUAL_EMAIL=visual@bivaque.example.invalid"
            echo "BIVAQUE_VISUAL_PASSWORD=bivaque-e2e-local"
          } > apps/web/.env.local

      - name: Build web app
        run: pnpm build

      - name: Check generated types drift
        run: |
          pnpm generate:types
          git diff --exit-code -- supabase/database.generated.ts

      # pgTAP compares the exact set of profiles visible in Manaus against its
      # own fixtures, so it has to run against a database WITHOUT the
      # development seed. E2E needs the opposite — it authenticates as a seeded
      # user — hence the second reset further down.
      - name: Reset local database (no seed)
        run: pnpm exec supabase db reset --local --no-seed

      - name: Database tests
        run: pnpm test:db

      - name: Schema lint
        run: pnpm db:lint

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Reset local database (with seed)
        run: pnpm exec supabase db reset --local

      - name: Root E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            apps/web/playwright-report/
            apps/web/test-results/

  format-guide-temp:
    name: Format Manaus guide (temporary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply semantic fixes
        shell: python
        run: |
          from pathlib import Path

          page = Path("apps/web/app/(shell)/guide/page.tsx")
          text = page.read_text()
          text = text.replace('<main className="mx-auto w-full max-w-[64rem] px-4 py-6 sm:py-8">', '<div className="mx-auto w-full max-w-[64rem] px-4 py-6 sm:py-8">', 1)
          text = text.replace('</main>\n  )\n}\n\nfunction CommunityGuide', '</div>\n  )\n}\n\nfunction CommunityGuide', 1)
          text = text.replace('<main className="mx-auto flex w-full max-w-2xl flex-col gap-6 px-4 py-8">', '<div className="mx-auto flex w-full max-w-2xl flex-col gap-6 px-4 py-8">', 1)
          text = text.replace('</main>\n  )\n}\n\nfunction CommunityDirectory', '</div>\n  )\n}\n\nfunction CommunityDirectory', 1)
          text = text.replace('<div className="mt-4 flex gap-2 overflow-x-auto pb-1" aria-label="Ir para uma fase do guia">', '<nav className="mt-4 flex gap-2 overflow-x-auto pb-1" aria-label="Ir para uma fase do guia">', 1)
          text = text.replace('        </div>\n      </section>\n\n      <section className="mt-5 rounded-2xl border', '        </nav>\n      </section>\n\n      <section className="mt-5 rounded-2xl border', 1)
          text = text.replace('                                role="checkbox"\n                                aria-checked={checked}', '                                aria-pressed={checked}', 1)
          page.write_text(text)

          content = Path("apps/web/app/(shell)/guide/manaus-guide-content.ts")
          text = content.read_text()
          text = text.replace('Em Manaus, 8 km no mapa podem significar experiências bem diferentes conforme o horário.', 'Em Manaus, uma distância curta no mapa pode significar uma experiência bem diferente conforme o horário.')
          content.write_text(text)

          city = Path("apps/web/app/components/bivaque/city-reference.tsx")
          text = city.read_text()
          text = text.replace('Moradia, escola, mudança, saúde, transporte e rotina da casa — um roteiro de D-60 a\n          D+60, somado às indicações locais curadas pela comunidade.', 'Referência permanente para quem chega. Em Manaus, inclui o roteiro D-60 a D+60; nas\n          demais cidades, cresce com as indicações locais curadas pela comunidade.')
          city.write_text(text)

      - name: Format guide files
        run: |
          pnpm exec biome check --write \
            'apps/web/app/(shell)/guide/page.tsx' \
            'apps/web/app/(shell)/guide/manaus-guide-content.ts' \
            'apps/web/app/(shell)/guide/manaus-guide-hero.tsx' \
            'apps/web/app/components/bivaque/city-reference.tsx' \
            'tests/unit/guide/manaus-guide-content.test.ts'

      - name: Upload formatted guide files
        uses: actions/upload-artifact@v7
        with:
          name: formatted-guide-files
          path: |
            apps/web/app/(shell)/guide/page.tsx
            apps/web/app/(shell)/guide/manaus-guide-content.ts
            apps/web/app/(shell)/guide/manaus-guide-hero.tsx
            apps/web/app/components/bivaque/city-reference.tsx
            tests/unit/guide/manaus-guide-content.test.ts
