name: Build do app de loja

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    if: contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bivaque/app build
      - run: pnpm --filter @bivaque/app exec cap sync android
      - name: Compilar APK de debug
        run: ./gradlew assembleDebug
        working-directory: apps/app/android
      # O scanner cobre texto do build web e projetos nativos versionados, nao binarios APK/IPA.
      - name: Varrer arquivos textuais
        run: |
          mkdir -p "$RUNNER_TEMP/scan/tests"
          cp tests/secrets-scan.mjs "$RUNNER_TEMP/scan/tests/"
          { git ls-files apps/app/android apps/app/ios; find apps/app/dist-nativo -type f; } | while IFS= read -r file; do
            if [ -f "$file" ] && grep -Iq . "$file"; then
              mkdir -p "$RUNNER_TEMP/scan/$(dirname "$file")"
              cp "$file" "$RUNNER_TEMP/scan/$file"
            fi
          done
          cd "$RUNNER_TEMP/scan"
          git init -q
          git add -f apps
          node tests/secrets-scan.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: apps/app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    if: contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bivaque/app build
      - run: pnpm --filter @bivaque/app exec cap sync ios
      - name: Compilar sem assinatura
        run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/app/ios/App
      # O scanner cobre texto do build web e projetos nativos versionados, nao binarios APK/IPA.
      - name: Varrer arquivos textuais
        run: |
          mkdir -p "$RUNNER_TEMP/scan/tests"
          cp tests/secrets-scan.mjs "$RUNNER_TEMP/scan/tests/"
          { git ls-files apps/app/android apps/app/ios; find apps/app/dist-nativo -type f; } | while IFS= read -r file; do
            if [ -f "$file" ] && grep -Iq . "$file"; then
              mkdir -p "$RUNNER_TEMP/scan/$(dirname "$file")"
              cp "$file" "$RUNNER_TEMP/scan/$file"
            fi
          done
          cd "$RUNNER_TEMP/scan"
          git init -q
          git add -f apps
          node tests/secrets-scan.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulador
          path: ${{ runner.temp }}/ios-build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
