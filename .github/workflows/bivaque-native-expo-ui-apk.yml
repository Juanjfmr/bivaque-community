name: Bivaque Expo UI Android APK
on:
  push:
    branches:
      - experiment/bivaque-native-expo-ui-20261111
    paths:
      - "experiments/bivaque-native-v1/**"
      - ".github/workflows/bivaque-native-expo-ui-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bivaque-expo-ui-apk
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: experiments/bivaque-native-v1
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK 56 dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx expo install --check
          npm ls expo @expo/ui react react-native --depth=0
      - name: Include assets
        run: npm run assets:copy
      - name: Validate native app
        run: |
          npm run typecheck
          npm test
      - name: Build Metro Android bundle
        run: npx expo export --platform android --output-dir dist
      - name: Generate Android native project
        run: npx expo prebuild --clean --platform android --no-install
      - name: Compile Android release
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: Verify installable APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Bivaque_Expo_UI_Beta_Android.apk
          test -s out/Bivaque_Expo_UI_Beta_Android.apk
          sha256sum out/Bivaque_Expo_UI_Beta_Android.apk | tee out/SHA256SUMS.txt
      - name: Publish public prerelease for Android testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bivaque-expo-ui-android-beta-0.2.0-20261111"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Bivaque Expo UI · Beta nativo Android 0.2.0" \
              --notes "Build de teste Android, isolado da produção. Expo SDK 56, Expo UI, Expo Image. Dados locais; não integrado ao Supabase."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            out/Bivaque_Expo_UI_Beta_Android.apk out/SHA256SUMS.txt --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url | \
            node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const d=JSON.parse(s);console.log(d.url);for(const a of d.assets)console.log(a.name,a.url);if(!d.assets.some(a=>a.name==="Bivaque_Expo_UI_Beta_Android.apk"))process.exit(1)})'
