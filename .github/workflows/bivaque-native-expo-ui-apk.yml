name: Bivaque Expo UI Android APK
on:
  push:
    branches:
      - experiment/bivaque-native-expo-ui-20261111
    paths:
      - "experiments/bivaque-native-v1/**"
      - ".github/workflows/bivaque-native-expo-ui-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: experiments/bivaque-native-v1
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK 56 dependencies
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx expo install --fix --npm
          npx expo install --check
          npm ls expo @expo/ui react react-native --depth=0
      - name: Include assets
        run: npm run assets:copy
      - name: Validate native app
        run: |
          npm run typecheck
          npm test
      - name: Build Metro Android bundle
        run: npx expo export --platform android --output-dir dist
      - name: Generate Android native project
        run: npx expo prebuild --clean --platform android --no-install
      - name: Compile Android release
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g
      - name: Verify installable APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Bivaque_Expo_UI_Beta_Android.apk
          test -s out/Bivaque_Expo_UI_Beta_Android.apk
          sha256sum out/Bivaque_Expo_UI_Beta_Android.apk | tee out/SHA256SUMS.txt
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bivaque-Expo-UI-Beta-Android
          path: |
            experiments/bivaque-native-v1/out/Bivaque_Expo_UI_Beta_Android.apk
            experiments/bivaque-native-v1/out/SHA256SUMS.txt
          retention-days: 14
