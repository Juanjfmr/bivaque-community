name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".visual/**"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Número da PR aberta no repositório para revisar"
        required: true
        type: number

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write  # exigido pelo claude-code-action@v1 (OIDC token)

jobs:
  review:
    name: Claude Code review (DeepSeek V4.1 Flash)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout workflow source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate selected pull request
        if: github.event_name == 'workflow_dispatch'
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<< "$pull_request")"
          base_ref="$(jq -r '.base.ref' <<< "$pull_request")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<< "$pull_request")"
          head_sha="$(jq -r '.head.sha' <<< "$pull_request")"

          if [[ "$state" != "open" || "$base_ref" != "$DEFAULT_BRANCH" || "$head_repository" != "$REPOSITORY" ]]; then
            echo "Only open pull requests from this repository targeting $DEFAULT_BRANCH can be reviewed." >&2
            exit 1
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout selected pull request
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0

      - name: Check review workflow integrity
        id: integrity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if git diff --quiet "origin/$DEFAULT_BRANCH" HEAD -- .github/workflows/claude-review.yml; then
            echo "matches-default=true" >> "$GITHUB_OUTPUT"
          else
            echo "matches-default=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check review credential
        id: credential
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ -n "$DEEPSEEK_API_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude Code Review
        if: steps.credential.outputs.available == 'true' && steps.integrity.outputs.matches-default == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Chave DeepSeek (formato Anthropic em api.deepseek.com/anthropic).
          # Rota "tolerada sem suporte" — ver AGENTS.md/notas de decisão.
          anthropic_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://api.deepseek.com/anthropic",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "deepseek-flash",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "deepseek-flash",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-flash",
                "CLAUDE_CODE_SUBAGENT_MODEL": "deepseek-flash"
              }
            }
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha || steps.target.outputs.head_sha }}

            Revise este PR do Bivaque Community (Next.js 16 + TypeScript + Supabase + pnpm).
            Comece por `git diff --stat origin/${{ github.event.repository.default_branch }}...HEAD` e
            `git diff origin/${{ github.event.repository.default_branch }}...HEAD`. Leia apenas as seções de AGENTS.md e
            os arquivos diretamente relacionados aos hunks alterados; não percorra o repositório
            nem leia documentos inteiros sem necessidade. Limite os achados ao que o diff introduz
            ou deixa sem atender. Foque em:

            1. **Spec/contrato**: o diff cumpre o que o título/comentário promete?
            2. **RLS/Supabase**: scope column com policy na MESMA migration (Padrão 6 —
               a falha recorrente do repo). RLS forcada, grants mínimos.
            3. **Testes**: cada via de permissão tem teste positivo E negativo?
            4. **Bugs/segurança**: secrets, injeção, dead code, estilo Biome.

            **Você não executa nada.** Não há build, teste, lint ou instalação
            disponíveis nesta sessão — as únicas ferramentas são leitura de arquivo,
            busca e `git diff/show/log`. Tentar `pnpm`, `npx` ou escrita gasta turno e
            é negado. Revise pelo diff e pelo código; quando um achado depender de
            execução, descreva o comando que o provaria em vez de tentar rodá-lo.

            Poste comentários inline via MCP do GitHub apenas nos pontos que
            exigem ação, no máximo três achados acionáveis. Não repita comentários já existentes.
            Termine com um resumo: APROVADO / MUDANÇAS PEDIDAS e os achados encontrados.
            Não invente problemas — só o que é real.
          claude_args: |
            --model deepseek-flash
            --max-turns 100

            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git show:*),Bash(git log:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash(pnpm install*),Bash(npx pnpm*),Edit,Write"

      - name: Report skipped review
        if: steps.credential.outputs.available != 'true' || steps.integrity.outputs.matches-default != 'true'
        shell: bash
        env:
          CREDENTIAL_AVAILABLE: ${{ steps.credential.outputs.available }}
          WORKFLOW_MATCHES_DEFAULT: ${{ steps.integrity.outputs.matches-default }}
        run: |
          if [[ "$WORKFLOW_MATCHES_DEFAULT" != "true" ]]; then
            echo "::warning title=Review skipped::claude-code-action requires this workflow to match the default branch. This change must be integrated before automated reviews can run."
          elif [[ "$CREDENTIAL_AVAILABLE" != "true" ]]; then
            echo "::warning title=Review skipped::DEEPSEEK_API_KEY is unavailable to this event, commonly for Dependabot or fork pull requests. Configure the secret for that event or request a maintainer review."
          fi

      - name: Resultado
        if: steps.credential.outputs.available == 'true' && steps.integrity.outputs.matches-default == 'true'
        run: echo "A ação de revisão terminou; confirme o parecer e os comentários no PR antes de tratar o check como aprovação."
