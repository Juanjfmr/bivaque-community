name: Bivaque P1 Format
on:
  pull_request:
    paths:
      - '.github/workflows/bivaque-p1-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/ui-foundation-21st-20261026' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only P1 source and test files
        run: |
          pnpm exec biome check --write \
            apps/app/components/bivaque/linha-de-pergunta.tsx \
            apps/app/src/telas/Anuncio.tsx \
            apps/app/src/telas/Negocio.tsx \
            apps/app/src/telas/Grupo.tsx \
            apps/app/src/telas/Inicio.tsx \
            apps/app/tests/e2e/r72-mobile-p1.spec.ts \
            apps/prototipo/components/ui/badge.tsx \
            apps/prototipo/components/ui/button.tsx
      - name: Commit reviewed formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/components/bivaque/linha-de-pergunta.tsx apps/app/src/telas/Anuncio.tsx apps/app/src/telas/Negocio.tsx apps/app/src/telas/Grupo.tsx apps/app/src/telas/Inicio.tsx apps/app/tests/e2e/r72-mobile-p1.spec.ts apps/prototipo/components/ui/badge.tsx apps/prototipo/components/ui/button.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(app): format P1 detail and desktop layout"
            git push origin HEAD:refs/heads/codex/ui-foundation-21st-20261026
          fi
