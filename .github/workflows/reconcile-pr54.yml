name: Reconcile PR 54

on:
  push:
    branches:
      - reconcile/pr53-20260907

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore current-main invariants
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            .github/workflows/pull-request-ci.yml \
            tests/e2e/group-admin-cycle.spec.ts \
            tests/e2e/reports-member-flow.spec.ts \
            apps/web/package.json \
            packages/contracts/package.json \
            apps/web/public/brand \
            apps/web/app/components/bivaque/brand-mark.tsx \
            apps/web/app/(preauth)/consent/front-matter.ts \
            apps/web/app/(preauth)/consent/document-render.tsx \
            docs/brand \
            docs/DOMAIN.md \
            docs/agents/HANDOFF-2026-08-22-e2e-triagem.md \
            docs/agents/HANDOFF-2026-08-26-drift-de-tipos.md \
            docs/agents/tasks/E2E-001.task.yml \
            docs/agents/tasks/RUN-001.task.yml \
            docs/agents/tasks/RUN-002.task.yml \
            docs/agents/tasks/RUN-003.task.yml \
            docs/decisions/ADR-20260828-termos-e-condicoes.md \
            docs/legal/TERMOS_E_CONDICOES.md \
            packages/tokens/src/official-brand.ts \
            tests/scope/brand-identity.test.mjs \
            tests/scope/brand-visual-audit.test.mjs \
            tests/scope/legal-documents.test.mjs \
            tests/unit/infra/outbox-preferences.test.ts \
            tests/unit/legal/front-matter.test.ts \
            tests/unit/onboarding/verify-and-provision.test.ts \
            apps/web/app/api/internal/outbox/route.ts \
            apps/web/lib/onboarding/verifyAndProvision.ts \
            apps/web/lib/portal/types.ts \
            apps/web/lib/portal/verification-copy.ts \
            tests/unit/portal/verification-copy.test.ts \
            apps/web/app/api/sw/route.ts \
            apps/web/public/sw.js

      - name: Add missing-key observability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/api/onboarding/route.ts")
          source = path.read_text()
          old = '''      const result = await verifyEligibility(supabase, { userId, cpf, consentVersion })
      return NextResponse.json(result)
'''
          new = '''      const result = await verifyEligibility(supabase, { userId, cpf, consentVersion })
      if (result.outcome.status === "temporary_error" && result.outcome.errorCode === "INVALID_KEY") {
        log.error("Portal verification unavailable: API key not configured", {
          action: "verify-cpf",
        })
      }
      return NextResponse.json(result)
'''
          if old not in source:
              raise SystemExit("expected verify-cpf response block not found")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Reconcile lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Normalize restored formatting
        run: pnpm exec biome format --write tests/e2e/reports-member-flow.spec.ts apps/web/app/api/onboarding/route.ts

      - name: Validate fast gate
        run: pnpm gate

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No reconciliation changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(reconcile): preserve current main invariants"
          git push origin HEAD:reconcile/pr53-20260907
