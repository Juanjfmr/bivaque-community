name: Bivaque P0 Finalize Lint
on:
  pull_request:
    paths:
      - '.github/workflows/bivaque-p0-ci-finalize.yml'

permissions:
  contents: write

jobs:
  formatter:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/ui-foundation-21st-20261026' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Correct formatting of currently changed test and Community
        run: |
          pnpm exec biome check --write apps/app/src/telas/Comunidade.tsx apps/app/tests/e2e/mobile-first.spec.ts apps/app/tests/e2e/r72-mobile-p0.spec.ts
      - name: Commit format to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/src/telas/Comunidade.tsx apps/app/tests/e2e/mobile-first.spec.ts apps/app/tests/e2e/r72-mobile-p0.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(app): finalize mobile P0 formatting"
            git push origin HEAD:refs/heads/codex/ui-foundation-21st-20261026
          fi
      - name: Diagnose remaining global Biome error
        run: pnpm exec biome check --max-diagnostics=200 --diagnostic-level=error || true
