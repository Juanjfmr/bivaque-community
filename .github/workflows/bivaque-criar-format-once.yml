name: Bivaque Criar Format Once
# rerun after JSX parse and fieldset fix
on:
  pull_request:
    paths:
      - '.github/workflows/bivaque-criar-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/ui-foundation-21st-20261026' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only Create journey files
        run: |
          pnpm exec biome check --write \
            apps/app/lib/rascunhos-criacao.ts \
            apps/app/components/bivaque/formulario-criacao.tsx \
            apps/app/src/casca/MenuCriar.tsx \
            apps/app/src/telas/Comunidade.tsx \
            apps/app/src/telas/MeusAnuncios.tsx \
            apps/app/tests/e2e/menu-criar-fluxos.spec.ts
      - name: Commit Biome changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/lib/rascunhos-criacao.ts apps/app/components/bivaque/formulario-criacao.tsx apps/app/src/casca/MenuCriar.tsx apps/app/src/telas/Comunidade.tsx apps/app/src/telas/MeusAnuncios.tsx apps/app/tests/e2e/menu-criar-fluxos.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(app): format local Create workflows"
            git push origin HEAD:refs/heads/codex/ui-foundation-21st-20261026
          fi
