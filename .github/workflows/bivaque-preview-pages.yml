name: Bivaque — prévia temporária no GitHub Pages
on:
  push:
    branches:
      - feat/github-pages-preview-20261025
    paths:
      - 'prototypes/bivaque-next-shadcn/**'
      - '.github/workflows/bivaque-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bivaque-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: prototypes/bivaque-next-shadcn
    steps:
      - name: Obter código da branch experimental
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Gerar exportação estática para Pages
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: '/bivaque-community'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      # Mantém a landing e o laboratório existentes e publica o PR #116 em
      # /bivaque-community/pr116/ (subpasta isolada, sem mudar produção).
      - name: Obter fonte do PR #116
        uses: actions/checkout@v4
        with:
          ref: codex/ui-foundation-21st-20261026
          path: pr116-source
          persist-credentials: false
      - name: Preparar pnpm do app
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - name: Instalar dependências do PR #116
        working-directory: pr116-source
        run: pnpm install --frozen-lockfile
      - name: Compilar app React do PR #116 para Pages
        shell: bash
        working-directory: pr116-source
        run: |
          set -euo pipefail
          # As substituições existem APENAS neste checkout temporário de build.
          # O código do PR #116, o R72 e a branch principal não são modificados.
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          function trocarArquivo(nome, antigo, novo, quantidade = 1) {
            const atual = fs.readFileSync(nome, 'utf8')
            const encontradas = atual.split(antigo).length - 1
            if (encontradas !== quantidade) {
              throw new Error(nome + ': esperado ' + quantidade + ' ocorrências, encontrado ' + encontradas)
            }
            fs.writeFileSync(nome, atual.replaceAll(antigo, novo))
          }
          trocarArquivo('apps/app/vite.config.ts', 'base: "/app/"', 'base: "/bivaque-community/pr116/"')
          trocarArquivo('apps/app/src/roteador.tsx', 'basepath: "/app"', 'basepath: "/bivaque-community/pr116"')
          trocarArquivo('apps/app/lib/navegacao/rotas.ts', 'export const BASE_PUBLICA = "/app"', 'export const BASE_PUBLICA = "/bivaque-community/pr116"')
          const imagens = 'apps/app/lib/demo/imagens.ts'
          const s = fs.readFileSync(imagens, 'utf8')
          if (s.split('"/app/demo/').length < 10) throw new Error('URLs de imagem não encontradas')
          fs.writeFileSync(imagens, s.replaceAll('"/app/demo/', '"/bivaque-community/pr116/demo/'))
          const css = 'apps/app/src/styles.css'
          const estilo = fs.readFileSync(css, 'utf8')
          if (estilo.split('url("/app/fonts/').length !== 4) throw new Error('URLs das três fontes não encontradas')
          fs.writeFileSync(css, estilo.replaceAll('url("/app/fonts/', 'url("/bivaque-community/pr116/fonts/'))
          NODE
          pnpm --filter @bivaque/app build
          test -s apps/app/dist/index.html
          SITE="$GITHUB_WORKSPACE/prototypes/bivaque-next-shadcn/out/pr116"
          mkdir -p "$SITE"
          cp -a apps/app/dist/. "$SITE/"
          # Primeiro acesso direto e reload das rotas estáticas mais usadas.
          for rota in inicio busca comunidade mercado imoveis desapegos negocios conversas voce guia agenda salvos meus-anuncios; do
            mkdir -p "$SITE/$rota"
            cp apps/app/dist/index.html "$SITE/$rota/index.html"
          done
          echo "PR116=$(git rev-parse HEAD)" > "$SITE/versao.txt"
          echo "PUBLIC_URL=https://juanjfmr.github.io/bivaque-community/pr116/"
          test -s "$SITE/index.html"
          # O endereço deve continuar apontando para os assets do próprio PR.
          grep -q '/bivaque-community/pr116/assets/' "$SITE/index.html"
          test -s "$SITE/inicio/index.html"
          # Cabeçalho único: apresentação, busca e atalhos no mesmo módulo.
          grep -ql 'bv-home-ferramentas' "$SITE"/assets/*.css
          grep -ql 'bv-home-atalho' "$SITE"/assets/*.css
          echo "Preview: cabeçalho, busca e atalhos integrados no PR116."

      - name: Publicar arquivos estáticos também na raiz da branch de testes
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          BUILD="$PWD/out"
          # O Pages configurado como fonte branch/root não deve servir README via Jekyll.
          # Versione EXCLUSIVAMENTE artefatos exportados, sem alterar a main.
          find "$BUILD" -type f -printf '%P\0' > /tmp/bivaque-static-paths
          cp -a "$BUILD"/. "$ROOT"/
          touch "$ROOT"/.nojekyll
          printf '.nojekyll\0' >> /tmp/bivaque-static-paths
          cd "$ROOT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f --pathspec-from-file=/tmp/bivaque-static-paths --pathspec-file-nul
          if ! git diff --cached --quiet; then
            git commit -m "ci(preview): mirror exported Next.js site into Pages branch root [skip ci]"
            git push origin HEAD:refs/heads/feat/github-pages-preview-20261025
          fi
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v4
        with:
          path: prototypes/bivaque-next-shadcn/out
      - name: Publicar prévia no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
