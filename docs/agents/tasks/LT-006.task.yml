# LAN-TROCA — F08 (lado app): o Guia retém e consome q/categoria da URL.
#
# Prepara a troca parcial de /guide (LT-007, lado web). O núcleo do Guia já está ligado
# e provado (f08-guia-real.spec.ts), mas q/categoria são estado local (Guia.tsx:90-92) e
# guia não está em ROTAS_COM_BUSCA (roteador.tsx:76). Sem isso, /guide?q=... -> /app/guia
# perderia o termo (mesmo bug que o LT-003 corrigiu na busca) e o link do Salvos web
# (/guide?q=<nome>, lib/saves/saved-items.ts:122) quebraria. Molde: LT-003 (retenção) +
# busca/termo-url.ts (leitura pura do endereço). Este lote é SÓ app; a troca web é o LT-007.
#
# ESCOPO LIMITADO: retenção + consumo de q/categoria. NÃO adicionar rota endereçável do
# verbete, porta de sugestão de lugar novo, nem acompanhamento de correção — esses gaps
# ficam para lotes próprios (F08-RESSALVAS / evolução do guia). NÃO tocar apps/web.

task_id: LT-006

objective: >
  Quem abre /app/guia?q=<termo>&categoria=<cat> (link direto, ou o futuro 307 de /guide)
  vê o Guia já com o termo no campo e a categoria filtrada, e o endereço mantém q/categoria
  após a materialização da entrada e as regravações de rolagem/foco. A leitura do endereço
  é pura e testada (molde busca/termo-url.ts); a digitação/filtro manual continuam vencendo
  o valor de origem. O ?locality= do guia antigo NÃO é suportado (o app lista só a cidade
  da sessão) — perda declarada, não implementada.

authority:
  - docs/LANCAMENTO.md (critério 6 — trocada; LAN-TROCA no board)
  - docs/decisions/ADR-20261024-front-react-spa.md §8
  - docs/agents/tasks/LT-003.task.yml (molde de retenção) e apps/app/src/busca/termo-url.ts (leitura pura)
  - tools/backend-kanban/public/board.json (LAN-TROCA, LAN-F08; mapa F08 do explore 14/11)

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Guia.tsx:90-92 usa estado local (termo/busca/categoria), sem leitura de useLocation/useSearch;
    guia NÃO está em ROTAS_COM_BUSCA (roteador.tsx:76 — desapegos/imoveis/catalogo/mercado/busca),
    então a materialização da entrada (Casca.tsx -> gravar -> navigate sem search) apaga q/categoria
    da URL (mesmo mecanismo do bug da busca, LT-003). O guia antigo consome ?q= e ?locality=
    (apps/web/app/(shell)/guide/page.tsx:96,106) e o Salvos web linka /guide?q=<nome>
    (apps/web/lib/saves/saved-items.ts:122). Catálogo tem /guia (rotas.ts:146) mas sem search persistente.

allowed_paths:
