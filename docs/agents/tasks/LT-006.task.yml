  - apps/app/src/roteador.tsx
  - apps/app/src/telas/Guia.tsx
  - apps/app/src/guia
  - apps/app/tests
  - .visual/lt-006

forbidden:
  - alterar apps/web, a API /api/app/guia, proxy, supabase, migrations
  - adicionar rota endereçável do verbete (/app/guia/$id), porta de sugestão de lugar novo, ou acompanhamento de correção (gaps de lotes próprios)
  - suportar ?locality= (o app lista só a cidade da sessão; perda declarada)
  - mudar o comportamento de digitação/filtro manual (continuam vencendo a origem), nem os estados carregando/vazio/negado/sessão/falha
  - usar skip/fixme novo ou afrouxar asserção; tocar outra jornada
  - push, merge ou force-push; ler/criar/editar .env; imprimir secrets
  - tocar em .work/main ou em outra worktree

acceptance:
  - "guia adicionado a ROTAS_COM_BUSCA (roteador.tsx:76); a materialização e as regravações preservam q/categoria na URL de /app/guia."
  - "Guia.tsx lê q/categoria do endereço na montagem e semeia o campo de busca e o filtro de categoria (leitura pura em apps/app/src/guia/, molde termo-url.ts, com teste unitário). Termo/categoria inválidos ou ausentes abrem o estado normal sem erro."
  - "Digitação e filtro manual continuam vencendo o valor de origem; a URL não é reescrita enquanto a pessoa digita (mesmo contrato da busca)."
  - "E2E do app (molde busca-termo-url.spec.ts) prova: /app/guia?q=<termo> abre com o termo no campo e a lista filtrada, q/categoria retidos na URL após a materialização, nos tamanhos e temas que o molde usa; caso sem q abre normal."
  - "Perda do ?locality= declarada no relatório (não implementada). f08-guia-real.spec.ts e os unitários do guia seguem verdes."
  - "Passam: app test, app typecheck, gate --fast, tsc -p tests/e2e (se aplicável). O E2E de navegador roda no CI."

