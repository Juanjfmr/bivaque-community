  - O Destaque de momento mantem o limite de 5 conversas novas por mes (so o Plano do negocio e ilimitado); voltar ao Gratis encerra o destaque e vale com a pagina pausada ou suspensa
  - Apagar a conta zera bloqueios e denuncias, tira os prazos de oferta, anonimiza o nome nos titulos do Painel, retira propostas e ofertas da pagina, remove alsoCity de pergunta apagada, passa a administracao ao primeiro moderador ou encerra o grupo, e limpa so o voto e a presenca da pessoa sem subtrair totais-base
  - Meus chamados so abre para quem entrou; quem envia sem conta ve so a confirmacao
