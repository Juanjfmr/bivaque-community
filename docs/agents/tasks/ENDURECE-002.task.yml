task_id: ENDURECE-002
objective: >
  Endurecimento parte B, antes do LAN-PROVA: cabeçalhos de segurança em toda resposta do Next,
  Content-Security-Policy aplicada (não só report-only) com nonce por requisição nas páginas do Next
  e política estática para o app em /app, e Clear-Site-Data na saída da conta pelo app. R3 decidido
  por delegação: ADR com status "Aceito por delegação — aguarda ratificação" e linha na RATIFICACAO.
authority:
  - docs/LANCAMENTO.md (LAN-PROVA)
  - docs/decisions/ADR-20261024-front-react-spa.md (§5, contrato de segurança da API)
  - docs/decisions/ADR-20261110-superficie-publica-do-proxy.md
  - apps/web/next.config.ts (SEC-007, frame-ancestors já existente)
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Em origin/main (8f9f3902), next.config.ts só envia `Content-Security-Policy: frame-ancestors
    'none'` e `X-Frame-Options: DENY`. Não há script-src, connect-src, nosniff, Referrer-Policy,
    Permissions-Policy, HSTS nem COOP. A rota POST /api/app/voce/sair remove os cookies da sessão,
    mas não pede ao navegador que apague cache e armazenamento local (rascunhos e preferências ficam
    em aparelho compartilhado).
allowed_paths:
  - apps/web/next.config.ts
  - apps/web/proxy.ts
  - apps/web/lib/security/*.ts
  - apps/web/app/layout.tsx
  - apps/web/app/api/app/voce/sair/route.ts
  - apps/web/app/api/app/voce/sair/*.test.ts
  - apps/app/index.html
  - apps/app/vite.config.ts
  - apps/app/src/telas/Voce*.tsx
  - apps/app/tests/*.test.ts
  - apps/app/tests/e2e/*.spec.ts
  - tests/unit/**/*.test.ts
  - tests/e2e/*.spec.ts
  - docs/decisions/ADR-20261119-cabecalhos-e-csp.md
  - docs/decisions/RATIFICACAO.md
  - docs/agents/tasks/ENDURECE-002.task.yml
forbidden:
  - banco, migrations, supabase/
  - dependência nova
  - "'unsafe-inline' ou 'unsafe-eval' em script-src (style-src pode ter 'unsafe-inline', com o motivo no ADR)"
  - CSP só em report-only como entrega final
  - afrouxar ou apagar asserção de teste existente
  - mudar a regra de sessão, CSRF ou CORS da rota-do-app
  - git stash, reiniciar ou reconstruir o banco local, delegar
  - segredo, chave ou DSN real no repositório; dado pessoal real ou CPF real em teste
acceptance:
  - "toda resposta do Next (páginas, /api e /app) leva: X-Content-Type-Options nosniff; Referrer-Policy strict-origin-when-cross-origin; Permissions-Policy negando câmera, microfone, geolocalização, pagamento e USB, salvo o que o app usa de fato (provar com rg); Cross-Origin-Opener-Policy same-origin; Strict-Transport-Security max-age=63072000; includeSubDomains; e os dois de moldura que já existem"
  - "páginas do Next: CSP com nonce por requisição gerado no proxy (script-src 'self' 'nonce-…' 'strict-dynamic'), o nonce lido no layout e repassado ao Next; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
  - "app em /app: CSP estática sem nonce (script-src 'self'), já que o index.html é arquivo do build; nenhum script inline no index.html"
  - "connect-src e img-src listam só as origens usadas de fato (Supabase do ambiente, Sentry se configurado, storage de mídia), lidas das variáveis de ambiente públicas, nunca escritas fixas no código"
  - "POST /api/app/voce/sair com sucesso responde Clear-Site-Data: \"cache\", \"storage\"; resposta de erro (403, 503) não leva o cabeçalho; teste positivo e negativo"
  - "nenhuma violação de CSP no console nos fluxos e2e do app e da web (o teste escuta securitypolicyviolation e mensagens 'Content Security Policy' e falha se houver)"
  - "depois de sair pelo app, a pessoa cai na entrada e o tema e a navegação continuam funcionando (Clear-Site-Data não quebra a tela nova)"
  - ADR-20261119-cabecalhos-e-csp.md com status "Aceito por delegação — aguarda ratificação" e uma linha nova em RATIFICACAO.md
proof:
  - npx pnpm@11.18.0 gate --fast
  - npx pnpm@11.18.0 test
  - npx pnpm@11.18.0 --filter @bivaque/app test
  - npx pnpm@11.18.0 --filter @bivaque/app exec vite build
  - npx pnpm@11.18.0 --filter @bivaque/app test:e2e
  - curl -sI de /, /app/inicio e /api/app/voce/sair no servidor local de produção (next build + next start), mostrando os cabeçalhos
risk: security
risk_level: R3
adr: docs/decisions/ADR-20261119-cabecalhos-e-csp.md
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: HUMAN_DECISION
closure:
  requires_runtime_evidence: true
