acceptance:
  - Os nomes Politica de privacidade e Codigo de conduta no aceite (cadastro, Google e convite) abrem a pagina e voltam ao mesmo passo sem perder nome, e-mail e senha digitados nem marcar ou desmarcar a caixa
  - As paginas abrem para quem saiu (visual da entrada) e para quem entrou (barra do app), tambem pelo endereco direto, marcadas Versao de teste; o CPF so confirma o vinculo e nao fica salvo
  - Configuracoes e o rodape da landing levam as duas paginas; a senha digitada nunca vai para o armazenamento
  - Pedido com proposta escolhida oferece Servico concluido (encerra como Concluido na lista e no detalhe), Conversar com o prestador (abre a conversa da escolha) e Desistir desta proposta (confirma, marca desistida e reabre o pedido para as outras propostas validas, se o prazo do pedido permitir, e avisa o resultado)
  - Proposta com validade vencida aparece como Vencida e nao pode ser escolhida (botao ausente e recusa com aviso)
  - A empresa que teve a proposta desistida, ou que voltou a lista, recebe aviso
  - Ocultar uma pergunta grava hiddenByMe (nao hidden), tira so das listas da pessoa e avisa Pergunta ocultada para voce com Desfazer
  - O endereco direto de pergunta ocultada abre com a faixa Voce ocultou esta pergunta e Mostrar, sem falar em moderacao; Configuracoes lista Ocultados com Mostrar por item
  - A remocao pela moderacao (hidden) continua dizendo moderacao e some das listas
