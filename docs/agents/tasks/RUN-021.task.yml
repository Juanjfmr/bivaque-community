# LAN-F04 (06/11/2026): grupos ligados ao banco, sobre as telas atuais do app, no molde das jornadas na main.
# Processo enxuto (ADR-20261105-entrada-enxuta-e-r3-sem-parada): uma rodada, uma revisão, no máximo uma correção.
# O aceite visual do redesenho de Grupos (APP-REGUA-NEXTDOOR) segue com o dono; este lote troca a fonte do dado, não o desenho.
task_id: RUN-021

objective: >
  Os grupos do apps/app passam a ser reais: diretório de grupos da cidade da sessão, entrar em grupo aberto
  e pedir entrada em grupo fechado com motivo, ver o grupo com suas publicações, publicar (texto e foto),
  comentar e responder em fio, marcar Útil, salvar, fixar (admin) e ocultar, e denunciar publicação. Nada
  da tela aprovada some; campo sem dado real mostra vazio honesto.

authority:
  - docs/LANCAMENTO.md (F04)
  - docs/decisions/ADR-20261105-porta-de-dados-do-app.md (o molde)
  - docs/decisions/ADR-20261101-foto-e-resposta-nos-grupos.md (foto e resposta encadeada)
  - docs/decisions/ADR-20261105-entrada-enxuta-e-r3-sem-parada.md (processo)
  - tools/backend-kanban card LAN-F04
  - referência viva: apps/web/app/api/app/perguntas e eventos; a tela antiga em apps/web/app/(shell)/groups

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    apps/app/src/telas/Grupo.tsx e Publicacao.tsx leem a demonstração; Comunidade.tsx já lê as perguntas da
    cidade (F04 parcial). A web antiga tem grupos em apps/web/app/(shell)/groups e apps/web/lib/communities,
    com entrada, pedido com motivo, publicação, comentário, fixar e denúncia; o banco tem groups, membros,
    pedidos, posts, comentários e reports com RLS.

