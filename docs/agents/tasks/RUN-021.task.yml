forbidden:
  - tocar em apps/app/lib/api/cliente.ts, apps/web/lib/app-api, apps/app/src/entrada e nas rotas de outras jornadas (só importar)
  - editar tools/backend-kanban ou RATIFICACAO.md
  - confiar em user_id, papel, grupo ou cidade vindos do corpo, da query ou do app
  - service_role onde a RLS da sessão basta (exceção só para storage depois de conferir posse, padrão SEC-006)
  - editar migration existente
  - mudar o desenho aprovado das telas; inventar dado
  - pedir revisão a outro modelo (o coordenador cuida)
  - push, merge ou force-push fora do branch deste lote
  - ler, criar ou editar arquivos .env

acceptance:
  - "Rotas /api/app/grupos com a sessão sob RLS: diretório da cidade, detalhe do grupo com publicações paginadas, entrar/pedir com motivo, publicar (texto e foto pela pasta do próprio membro), comentar e responder em fio, Útil, salvar, fixar (só admin), ocultar e denunciar; grupo fechado sem participação não mostra publicações."
  - "Cada rota com teste de unidade positivo e negativo (401, 403 de origem/cabeçalho, não membro, não admin, inexistente 404, corpo inválido 400, erro do banco 503 sem eco)."
  - "Módulo apps/app/lib/dados/grupos.ts com o cliente único e AbortSignal; Grupo.tsx e Publicacao.tsx trocam dadosDoApp pelo módulo, com carregando, vazio honesto, erro com Tentar de novo e resultado gravado."
  - "Testes do apps/app que esperavam a demonstração passam a simular as rotas com page.route (RegExp; no glob do Playwright * não cruza /)."
  - "E2E tests/e2e/f04-grupos-real.spec.ts contra o banco com seed: entrar, publicar, comentar, recarregar e ver gravado; não membro negado; o spec devolve o banco ao estado inicial ao terminar (workers=1, três larguras em série)."
  - "Relatório em .visual/run-021/relatorio.md: o que entrou, commits, números e o que não rodou."

proof:
  - npx pnpm@11.18.0 gate --fast
  - npx pnpm@11.18.0 exec vitest run tests/unit/app-api/grupos
  - npx pnpm@11.18.0 --filter @bivaque/app test
  - npx pnpm@11.18.0 test:scope
  - E2E da raiz com banco no CI

