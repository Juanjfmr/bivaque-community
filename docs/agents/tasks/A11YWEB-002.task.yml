task_id: A11YWEB-002
objective: >
  Fechar o critério 5 de LANCAMENTO (acessibilidade: teclado, leitor de tela, contraste, alvos,
  movimento reduzido) em todas as jornadas do web, F02 a F10: a matriz de axe do app passa a cobrir
  as telas de cada jornada que hoje ficam de fora, cada jornada ganha uma prova do caminho principal
  pelo teclado, e as falhas essenciais que aparecerem são corrigidas no mesmo lote.
authority:
  - docs/LANCAMENTO.md (critério 5 e jornadas F02 a F10)
  - "decisão do coordenador, 23/11: o dono pausou a loja e o web vai primeiro; lote 2 do plano aprovado"
  - "cards LAN-F02, LAN-F03, LAN-F06, LAN-F07, LAN-F08, LAN-F09, LAN-F10 em tools/backend-kanban/public/board.json"
  - apps/app/tests/e2e/acessibilidade.spec.ts (matriz atual e o seu padrão)
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Continuação do A11YWEB-001, que esgotou três rodadas (head eb0eb49f8 na branch
    test/a11y-jornadas-web) com cobertura parcial. Revisão às cegas R1 (DeepSeek,
    .visual/a11yweb-001/revisao-deepseek.md): FAIL. Faltam Cidade, Meus anúncios (populado, vazio,
    falha), Meu negócio, Pedidos, Novo pedido, Agenda populada e as provas de teclado de F03, F05,
    F06, F08 e F09. Defeitos dos testes já escritos: movimento reduzido passa vazio quando não há
    animação (H1); stub de /conversas/:id/mensagens não confere o método (H2); foco visível aceita
    box-shadow estática (H3); heading-order não roda nas 9 telas do primeiro laço e "um h1" não é
    contado (H4); falha de Salvos derruba só uma das quatro leituras e o detector casa "erro" solto
    (M2); alvos medidos só em dois botões (M4); BOM no início do spec e stubs não usados (L1, L4).
    O menu Criar não tem escolha de publicação (o compositor fica no grupo): a folha de publicação
    sai da matriz e o compositor do grupo entra no lugar.
