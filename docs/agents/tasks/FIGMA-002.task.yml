  - supabase/tests/
  - supabase/seed.sql
  - supabase/database.generated.ts
  - apps/web/app/(shell)/imoveis/
  - apps/web/app/components/bivaque/app-shell.tsx
  - apps/web/app/components/bivaque/app-shell.module.css
  - apps/web/app/components/bivaque/listing-*.tsx
  - apps/web/app/components/bivaque/listing-*.module.css
  - apps/web/lib/listings/
  - packages/domain/
  - tests/unit/ui/
  - tests/e2e/imoveis/
  - scripts/visual/capture.mjs
  - docs/agents/tasks/FIGMA-002.task.yml
  - tools/backend-kanban/public/board.json
  - tools/backend-kanban/BOARD.md
  # Ampliacao autorizada pela coordenacao em 06/10/2026 (despacho FIGMA-002):
  # o contexto listing da conversa existente entra no shared inbox/thread pelo
  # rotulo canonico, a origem /imoveis/<id> e o titulo do anuncio no detalhe —
  # SOMENTE estes dois arquivos, sem refactor de nav nem regressao do 001
  # (copy do consumidor e provas figma001 permanecem travadas).
  - apps/web/app/(shell)/messages/conversas-loaders.ts
  - apps/web/app/(shell)/messages/conversation-screen.tsx
  # Novo escopo aprovado; consumidores compartilhados somente no ramo listing.
  - docs/decisions/ADR-20261006-anuncios-salvos-e-moderacao.md
  - apps/web/app/components/bivaque/report-button.tsx
  - apps/web/app/components/bivaque/report-actions.ts
  - apps/web/app/(admin)/reports/targets.ts
  - apps/web/app/(admin)/reports/page.tsx
  - apps/web/app/(admin)/reports/actions.ts
