task_id: FIGMA-002
objective: >
  O lote de imoveis do Bivaque entrega busca, detalhe, publicacao e edicao de
  anuncios kind=property com ate 12 fotos (upload, ordem e capa), e o interesse
  contextual que abre/reencontra a conversa do anuncio — tudo persistido no
  dominio unico listings/property_details do ADR-20260909-anuncios-mercado-e-moradia,
  com policies e testes positivos e negativos.
authority:
  - https://www.figma.com/design/niuOHiHkyc9eGaIQBY9hq4/Bivaque (pranchas property-list, property-detail, property-publish, property-review, property-edit em .visual/opencode-figma-20261005/references)
  - Autorizacao direta do dono em 05/10/2026 para executar o lote de imoveis apos FIGMA-001, com limite de 12 fotos
  - docs/decisions/ADR-20260909-anuncios-mercado-e-moradia.md (D1 a D7)
  - docs/decisions/ADR-20260909-midia-de-membro.md (upload, EXIF, bucket privado)
  - docs/decisions/ADR-20260909-pedidos-e-conversa-contextual.md (interesse = conversa contextual idempotente)
  - docs/agents/tasks/RECON-027.task.yml e as partes de fundacao de RECON-025/RECON-026 que forem dependencia real
  - Despacho novo Codex de 06/10/2026 registra aprovacao humana Juan para Salvar/Reportar apos critic PASS; integrar no mesmo escritor sem avaliadores ativos
  - docs/decisions/ADR-20261006-anuncios-salvos-e-moderacao.md (approved; preservar aprovacao e parecer integralmente)
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Em 05/10/2026 nao existe tabela listings nem property_details em
    supabase/migrations (inventario do ADR-20260909-anuncios-mercado-e-moradia,
    linha 122), nenhuma rota /imoveis em apps/web/app/(shell), e as referencias
    property-* do Figma atual foram abertas neste run (PNGs e MDs em
    .visual/opencode-figma-20261005/references). O shell do FIGMA-001 ja reserva
    a entrada de Imoveis como pendencia registrada, sem link morto.
