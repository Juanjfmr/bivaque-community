  # fila: sem estes dois arquivos o alvo listing não teria por onde ocultar,
  # encerrar nem restaurar, e o ramo novo ficaria só no banco.
  - apps/web/app/(admin)/reports/[id]/page.tsx
  - apps/web/app/(admin)/reports/[id]/listing-restore-form.tsx
  - apps/web/app/api/admin/reports/[id]/route.ts
forbidden:
  - endereco, numero, complemento ou coordenada em qualquer coluna ou tela (ADR D5)
  - preco zero ou soma inventada quando valor ausente: null rende "Consultar anunciante" (ADR D6)
  - publico que mude na edicao (ADR D3) e anuncio visivel fora do publico autorizado
  - interesse que crie conversa duplicada ou mova dinheiro (ADR D4)
  - mais de 12 fotos por anuncio; EXIF preservado no upload (ADR de midia)
  - reset/stop do stack compartilhado; stack isolado para aplicar migrations e provar runtime
  - tocar em landing, admissao, pagamentos, documento, perfil ou conversas fora do interesse de anuncio
  - deploy, push ou publicacao em producao
acceptance:
  - migration unica cria listings, property_details, listing_media e listing_interests com RLS enabled+forced e grants minimos; coluna de escopo e policies na mesma migration
  - busca /imoveis lista apenas anuncios active cujo publico o leitor alcanca, com filtro de tipo e texto; proprio anuncio aparece com interesse desabilitado e motivo
  - detalhe /imoveis/[id] mostra fotos com ordem e capa, especificacoes, custos anulaveis honestos e o estado atual do anuncio
  - publicacao valida no cliente e no servidor, grava draft->active somente por escrita autorizada, e a revisao antes de publicar nao persiste nada
  - edicao muda tudo exceto publico; pausar/reativar/encerrar sao transicoes idempotentes gravadas
  - upload aceita ate 12 fotos, define ordem e capa, rejeita a 13a no servidor; EXIF removido na entrada
  - interesse que abra ou reencontre a conversa contextual listing, idempotente, visivel na central de conversas do FIGMA-001
  - testes pgTAP positivos e negativos por operacao (leitor fora do publico, interesse em anuncio pausado, 13a foto, edicao de publico)
  - e2e prova publicar -> buscar -> detalhe -> interesse -> conversa, e a negacao por chamada direta
  - capturas autenticadas 375/768/1440 das rotas tocadas comparadas as pranchas property-*
  - listing_saves privado enabled+forced RLS e grants minimos; salvar proprio allowed active nao oculto audiencia; inserir/remover idempotentes; estado e retorno salvos persistem por reload
  - apos perda de acesso somente IDs e data dos saves proprios sao legiveis/removiveis sem join; joins nao revelam titulo foto status nem contador de inacessiveis; retorno quando elegivel novamente; terceiros e operador sem bypass
  - listing report valida alvo real active nao oculto audiencia nao proprio; inexistente e nao autorizado mesma negativa; motivo validado e deduplicacao aberta preservados
  - moderacao listing oculta separada do status e restaura somente operador; marca protegida de escrita direta; dono edita com aviso sem remover ocultacao; terceiro nao le busca salvos detalhe interesse nem nova origem de conversa
  - eventos hide/restore append-only duraveis enabled+forced RLS; lock transacional idempotente; hide ligado a report resolve e audita atomicamente; report resolvido nao executa novo hide
  - RPC listing SECURITY DEFINER search_path vazio JWT authenticated deriva auth.uid e papel canonico na transacao sem operadorID cliente; nega membro e report de outro tipo; resolve_report service_role dos outros alvos intacto
  - endpoint autenticado de bytes sob imoveis valida sessao vinculo audiencia status moderacao por fetch; dono qualquer estado terceiro apenas active nao oculto audiencia; operador sem bypass; respostas private no-store sem signedURLs no cliente HTML JSON redirect ou Next optimizer
  - pgTAP e E2E positivos e negativos fecham salvar desfazer retorno reload denunciar fila hide dismiss restore eventos e midia; mesma URL de bytes negada apos hide/perda audiencia; TTL legado maximo 600 sem promessa de revogacao retroativa
proof:
  - node scripts/agents/task-contract.mjs docs/agents/tasks/FIGMA-002.task.yml
  - npx pnpm@11.18.0 gate
  - npx pnpm@11.18.0 exec supabase test db (stack isolado ou shadow)
  - npx pnpm@11.18.0 test:e2e --grep imoveis
  - node scripts/visual/capture.mjs com BIVAQUE_VISUAL_ROUTE=/imoveis e /imoveis/<id> nos tres viewports
risk: anuncio de moradia com midia de membro e conversa contextual
risk_level: R3
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: BLOCKED
