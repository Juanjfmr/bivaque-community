  - "Acompanhamento dos dois lados: GET /api/app/pedidos passa a listar os DOIS lados para quem os participa (solicitante e dono do negocio — or com RLS decidindo o que cada um ve; status legivel); PATCH /api/app/pedidos/[id] com acao=cancelar|encerrar chamando os RPCs existentes (cancel_/close_service_request; posse decide no banco; idempotencia do estado; negativos completos). Pedido.tsx: botoes honestos por lado e estado, cada um com Confirmacao da entrada (troca de sobreposicao, nao empilhamento — licao 16/11), link para a conversa do pedido (conversaId ja vem no payload; rota conversa existe), e a situacao revalida apos acao. Pedidos.tsx ganha o lado recebidos (abste-se de aba nova se a lista atual ja segrega; decidir e registrar)."
  - "Pedido enderecavel: rota no catalogo (path /pedidos/novo, com ?destino= de negocio, search lido, molde das telas de overlay enderecavel existentes) — o form da ficha vira a MESMA folha aberta por URL; menu Criar create-request aponta para a rota real; bairro/regiao: campo opcional de texto no form gravando na coluna region via create_service_request (se o RPC nao tem par de region hoje, NAO mudar RPC: gravar no texto da descricao com prefixo? NAO — leia create_service_request: se region e inalcancavel pelo RPC sem migration, DEIXAR region de fora e registrar como limitacao declarada no RELATORIO (coluna morta da web tambem); sem migration, sem chuto)."
  - "Troca em cadeia: 307 /negocio e /negocio/cataloga → destinos do app (rota de gestao — definir path no catalogo: ex. /app/negocio-meu ou reuso da rota de negocio com modo proprio; decidir e registrar), /pedidos/novo → /app/pedidos/novo, /explorar/servicos → /app/negocios, /pedidos e /pedidos/[id] (pastas residuais atras do 307) REMOVIDAS junto com (shell)/negocio, (shell)/prestadores e (shell)/explorar quando o grep provar zero importador vivo; (provider)/prestador NAO se toca. TROCADAS + ausencia no molde, negativas do prestador civil intactas (proxy.ts:158-167 fica), link-crawl: portas de F07 repontadas (as 4 do mapa + as seeds do RUN-176 ajustadas ao que morreu — rebase em origin/main e reconciliar a lista com a realidade nova), capture.mjs sem as rotas web mortas, provider-member-business.spec.ts migra para o E2E real do app (criar ficha, editar, publicar item de catalogo, foto, abrir ficha publica, fazer pedido, cancelar) preservando cada garantia do spec morto — tabela item-a-item no RELATORIO."
