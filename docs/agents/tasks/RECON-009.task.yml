task_id: RECON-009

objective: >
  A rota /communities/[id] passa a ser a comunidade da prancha 43: apresentacao, grupos e o estado de pedido pendente, com o que o visitante pode ver separado do que o membro ve.

authority:
  - docs/design/visual-guide-2026-09-06/43-web-comunidade-grupos.png
  - docs/superpowers/specs/2026-09-08-reconstrucao-visual-web-design.md secao 8 gate G1
  - docs/agents/DESIGN_SYSTEM.md secao 5, secao 9.1

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    apps/web/app/(shell)/communities/[id]/page.tsx le communities, community_memberships, feed_community e profiles, e renderiza feed e lista. Nao separa a apresentacao autorizada do conteudo de membro nem segue a composicao da prancha 43.

allowed_paths:
  - apps/web/app/(shell)/communities/[id]/
  - docs/agents/tasks/RECON-009.task.yml

forbidden:
  - tocar apps/web/app/components/bivaque/ — diretorio compartilhado, esta onda roda em paralelo
  - mostrar lista de participantes, avatares ou perfis a quem nao e membro aprovado
  - usar numero ilustrativo como criterio de acesso a grupo
  - tocar proxy.ts, (shell)/layout.tsx, bottom-nav.tsx, NAV_ITEMS ou qualquer arquivo .sql
  - criar migration, RPC, policy ou coluna
  - chumbar nome, cidade, data, contagem ou qualquer dado — tudo vem de contexto ou consulta real
  - inventar conteudo; sem dado real, estado vazio honesto
  - linkar rota que nao existe
  - prometer prazo, aprovacao, entrega ou alcance que o servidor nao garante
  - texto de placeholder, href vazio, handler vazio ou toast como unica implementacao
  - valor de cor cru em JSX, style inline ou classe utilitaria de paleta
  - introduzir familia tipografica, biblioteca de componentes ou modo escuro

acceptance:
  - a comunidade de membro mostra grupos, e o acesso a cada grupo respeita as permissoes reais do grupo
  - no pedido pendente aparece o rail Sobre a comunidade da prancha 43, com contagem de membros, data de criacao e local, todos vindos de consulta real e nunca chumbados
  - o motivo opcional, se houver, aparece como resumo somente leitura para o solicitante, nunca como formulario obrigatorio nem publicacao
  - visitante de comunidade privada nao ve roster, avatar nem perfil de participante; a contagem agregada e permitida
  - todos os estados fechados: skeleton no carregamento, vazio honesto, erro recuperavel com nova tentativa
  - nenhum dado inventado sobrevive na tela
  - exatamente um h1 na tela
  - contraste >= 4,5:1, alvos >= 44x44, foco visivel
  - npx pnpm@11.18.0 gate verde
  - auditoria visual de /communities/[id] em 375/768/1440 sem finding de severidade high

proof:
  - node scripts/agents/task-contract.mjs docs/agents/tasks/RECON-009.task.yml
  - npx pnpm@11.18.0 gate
  - node scripts/visual/loop.mjs

risk: escopo de comunidade e visibilidade a visitante
risk_level: R2
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: HUMAN_DECISION
closure:
  requires_runtime_evidence: true

revisao:
  - >
    09/09/2026 — o dono decidiu que a prancha 43 vence: no estado de pedido pendente o rail
    Sobre a comunidade aparece com Membros, Criada em e Local. A regra anterior deste contrato
    proibia a contagem para quem nao fosse membro aprovado; ela foi escrita sem conferir a
    prancha e apertava mais do que a privacidade exige. O que continua fechado e o roster:
    lista de participantes, avatares e perfis. A implementacao entra pelo RECON-033.
