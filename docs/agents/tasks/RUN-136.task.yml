# RUN-136 — acessibilidade das superfícies que faltam na matriz de axe
#
# Fecha o critério 5 (acessível) das jornadas F02, F03 e F07, onde a matriz de
# axe de 10/11 cobre Início/Mercado/Negócios/Guia/Conversas mas não a busca, o
# menu Criar, o formulário de encontro, a ficha do negócio nem o pedido.

task_id: RUN-136

objective: >
  As superfícies de busca, menu Criar, formulário de encontro, ficha do negócio
  e pedido de serviço passam a ser medidas por axe (WCAG A/AA e 2.1 AA, falha em
  sério/crítico) em 375/768/1440 e nos dois temas, com teclado, foco, contraste
  e movimento reduzido provados no navegador — e as falhas essenciais de
  acessibilidade dessas superfícies ficam corrigidas.

authority:
  - docs/LANCAMENTO.md (F02, F03, F07 — critério 5, acessível)
  - docs/agents/regua-nextdoor/HANDOFF.md
  - apps/app/AGENTS.md (prova de tela: teclado, leitor de tela, capturas nos dois temas)
  - tools/backend-kanban/public/board.json (LAN-F02, LAN-F03, LAN-F07)

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    apps/app/tests/e2e/acessibilidade.spec.ts:51-82 (matriz axe de 10/11) cobre
    cinco superfícies — Início, Mercado, Negócios, Guia e Conversas — e não cobre
    a busca, o menu Criar, o formulário de encontro, a ficha do negócio nem o
    pedido; a varredura de acessibilidade de 10/11 registrou a lacuna no cartão
    LAN-F02/F03/F07.

