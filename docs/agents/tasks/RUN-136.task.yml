acceptance:
  - A matriz de axe cobre busca, menu Criar, formulário de encontro, ficha do negócio e pedido em 375/768/1440 e nos dois temas, com as tags wcag2a/wcag2aa/wcag21aa, sem skip novo e falhando em impacto sério/crítico.
  - O teclado alcança a ação primária de cada superfície, ativa com Enter, fecha sobreposições com Esc devolvendo o foco ao botão de origem, e as setas andam no menu Criar (medido no navegador).
  - O contraste medido de texto (4,5; 3,0 em texto grande) e do tom contornado (4,5) passa nos dois temas nas superfícies novas.
  - `prefers-reduced-motion: reduce` desliga as animações de entrada e de sobreposição nas superfícies novas.
  - Nenhuma das cinco superfícies tem overflow horizontal em 375/768/1440 nem erro de console.
  - As capturas das superfícies novas ficam retidas no artefato do app smoke, que sobe `.visual/`.
  - Os casos existentes (21/21 de f05 e a matriz axe de 10/11) continuam verdes.

