task_id: RECON-010

objective: >
  A rota /admissions passa a ser a operacao de admissoes da prancha 57: fila e analise de solicitacao, mostrando ao operador somente o necessario para decidir.

authority:
  - docs/design/visual-guide-2026-09-06/57-web-operacao-admissoes.png
  - docs/superpowers/specs/2026-09-08-reconstrucao-visual-web-design.md secao 8 gate G1
  - docs/agents/DESIGN_SYSTEM.md secao 5, secao 9.1
  - docs/decisions/ADR-20260816-forma-da-admissao.md

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    apps/web/app/(admin)/admissions/page.tsx le list_verification_queue e list_verification_documents e decide por action. Nao segue a composicao da prancha 57.

allowed_paths:
  - apps/web/app/(admin)/admissions/
  - docs/agents/tasks/RECON-010.task.yml

forbidden:
  - tocar apps/web/app/components/bivaque/ — diretorio compartilhado, esta onda roda em paralelo
  - exibir documento cru, payload do Portal, CPF ou qualquer dado alem do necessario a decisao
  - contornar a confirmacao de operador das actions
  - tocar proxy.ts, (shell)/layout.tsx, bottom-nav.tsx, NAV_ITEMS ou qualquer arquivo .sql
  - criar migration, RPC, policy ou coluna
  - chumbar nome, cidade, data, contagem ou qualquer dado — tudo vem de contexto ou consulta real
  - inventar conteudo; sem dado real, estado vazio honesto
  - linkar rota que nao existe
  - prometer prazo, aprovacao, entrega ou alcance que o servidor nao garante
  - texto de placeholder, href vazio, handler vazio ou toast como unica implementacao
  - valor de cor cru em JSX, style inline ou classe utilitaria de paleta
  - introduzir familia tipografica, biblioteca de componentes ou modo escuro

acceptance:
  - a fila e a analise seguem a composicao da prancha 57
  - o operador ve somente o necessario para decidir — nenhum documento cru, nenhum payload do Portal, nenhum CPF
  - cada decisao passa pela action que ja confirma operador antes da chamada privilegiada
  - recusa e reprocessamento tem caminho negado visivel quando o caller nao e operador
  - todos os estados fechados: skeleton no carregamento, vazio honesto, erro recuperavel com nova tentativa
  - nenhum dado inventado sobrevive na tela
  - exatamente um h1 na tela
  - contraste >= 4,5:1, alvos >= 44x44, foco visivel
  - npx pnpm@11.18.0 gate verde
  - auditoria visual de /admissions em 375/768/1440 sem finding de severidade high

proof:
  - node scripts/agents/task-contract.mjs docs/agents/tasks/RECON-010.task.yml
  - npx pnpm@11.18.0 gate
  - node scripts/visual/loop.mjs

risk: console de operador sobre dado de verificacao
risk_level: R3
adr: docs/decisions/ADR-20260816-forma-da-admissao.md
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: HUMAN_DECISION
closure:
  requires_runtime_evidence: true
