task_id: RECON-023

objective: >
  O acompanhamento do pedido passa a ser o da prancha 17 - lista de respostas, conversa no
  contexto do pedido, resumo do que foi pedido, publico do pedido e encerramento, com a situacao
  vindo da coluna do pedido e nao da contagem de mensagens.

authority:
  - docs/design/visual-guide-2026-09-06/17-web-pedido-servico.png
  - docs/agents/PRANCHAS-WEB-RESTANTES.md secao 17-web-pedido-servico
  - docs/superpowers/specs/2026-09-08-reconstrucao-visual-web-design.md secao 4.6 R43 R44 e secao 4.8 C12
  - docs/agents/tasks/RECON-022.task.yml
  - Relatório comparativo Mobbin e autorização do responsável em 23/09/2026 para estados terminais e retenção da conversa

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    A lista e o detalhe existem, mas o acompanhamento ainda oferece apenas
    encerrar; o RPC e os testes de banco já definem cancelamento pelo solicitante.
    A tela não expõe esse estado terminal, não carrega cancelled_at/by e mantém o
    composer ativo depois de closed/cancelled. A correção usa o contrato já
    autorizado, sem criar tabela, RPC ou política nova.

allowed_paths:
  - apps/web/app/(shell)/pedidos/
  - apps/web/app/(shell)/messages/
  - apps/web/lib/service-requests/
  - supabase/migrations/
  - supabase/tests/
  - scripts/visual/capture.mjs
  - tests/unit/
  - tests/e2e/journey-pedir-servico.spec.ts
  - docs/agents/tasks/RECON-023.task.yml

forbidden:
  - listar pedido que nao pertence a sessao
  - permitir alterar o destinatario do pedido
  - tratar encerrado como servico prestado, pago ou avaliado
  - injetar participante ou contexto pelo corpo da requisicao
  - permitir mensagem entre contas sem contexto autorizado
  - perder o texto digitado quando o envio falha
  - editar migration ja aplicada
  - texto de placeholder, href vazio, handler vazio ou toast como unica implementacao

acceptance:
  - a lista mostra somente pedidos proprios, por situacao, com ultima atualizacao e link para o detalhe
  - o detalhe segue a prancha 17 - trilha, titulo, chip de situacao, botao de encerrar, linha de metadados com local, quando e envio, e as tres colunas de respostas, conversa e resumo
  - a coluna de respostas mostra contagem real, item selecionado destacado e marcador de nao lida
  - a conversa persiste, ordena por tempo, deduplica envio repetido e preserva o texto no erro
  - o rail direito traz o resumo do servico solicitado, o botao de editar pedido e o publico do pedido, com o aviso de que valores e pagamento sao combinados entre as pessoas
  - encerrar registra ator e e idempotente, e o estado sobrevive a recarregar em outra sessao
  - o solicitante pode cancelar um pedido aberto/em conversa pelo RPC autorizado; a tela mostra Cancelado, ator e instante, e não deixa compositor ativo
  - closed e cancelled são terminais para nova mensagem, mas preservam a leitura da conversa; terceiro e prestador não ganham cancelamento por UI ou chamada direta
  - a RPC bloqueia mensagem depois de closed/cancelled e close depois de cancelled; a ação revalida a lista e o detalhe
  - a tela do prestador também exibe o instante de cancelamento e nunca transforma cancelled em closed
  - terceiro nao le a conversa nem o pedido, inclusive por chamada direta sem interface
  - as policies que sustentam a leitura entram na mesma migration das colunas que elas leem
  - todos os estados fechados - carregando, vazio que leva a busca, erro recuperavel, sessao expirada e conflito de encerramento concorrente
  - exatamente um h1 por tela, contraste maior ou igual a 4,5:1, alvos maiores ou iguais a 44x44 e foco visivel
  - as rotas novas estao cadastradas em scripts/visual/capture.mjs com fixture concreta

proof:
  - node scripts/agents/task-contract.mjs docs/agents/tasks/RECON-023.task.yml
  - npx pnpm@11.18.0 exec vitest run tests/unit/service-requests/cancel-action.test.ts tests/unit/service-requests/tracking.test.ts
  - npx pnpm@11.18.0 gate
  - reset local sem seed seguido de npx pnpm@11.18.0 test:db com caso positivo e negativo
  - supabase/tests/service-request-terminal.sql: mensagem após closed/cancelled e close após cancelled são negados
  - npx pnpm@11.18.0 build
  - npx pnpm@11.18.0 test:e2e do ciclo entre duas contas, incluindo duas respostas do prestador no mesmo pedido
  - node scripts/visual/capture.mjs para cada rota tocada em 375 768 e 1440

risk: conversa entre contas e situacao do pedido
risk_level: R3
adr: docs/decisions/ADR-20260909-pedidos-e-conversa-contextual.md
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: HUMAN_DECISION
closure:
  requires_runtime_evidence: true
