# Evidencia (23/10/2026, branch codex/lote5-nav, executor DeepSeek V4.1 Flash)
# NAVEGACAO: NAV_ITEMS passa a Inicio/Comunidade/Conversas/Voce em bottom-nav.tsx, com rotulos, ordem,
#   icones e o comentario de que nao haveria inbox corrigido; active-nav.ts passa aos ids inicio/comunidade/
#   conversas/voce e mapeia cada area (Explorar/Guia/Agenda/Mercado/Imoveis/descoberta -> Inicio;
#   Indicoes/Grupos/community/communities -> Comunidade; messages -> Conversas; perfil/Salvos/Meus
#   anuncios/configuracoes/notificacoes/pedidos/denuncias/ajuda/negocio -> Voce). Salvos acende Voce,
#   como no activeTab() de navigation.js.
# ABAS DA COMUNIDADE: community-tabs.tsx com Indicacoes (/community) e Grupos (/groups); a aba Negocios
#   fica no lote 6. A fileira vive na rota /community; a troca e por rota (endereco compartilhavel).
# ROTAS DE VILA: vila nao existe nesta versao. /communities, /communities/[id] e filhas,
#   (owner)/communities/[id]/admin e o aceite de convite /invite/[token] redirecionam para /community por
#   lista fechada em apps/web/app/components/shell/vila-redirects.ts (vilaRedirectFor recusa qualquer
#   caminho fora da lista; nunca le a URL). Nada e apagado no banco: RPC, pgTAP e tabelas continuam.
# Prova: node scripts/visual/flows/reachability.mjs -> 95 rotas, 0 links quebrados, 0 orfaos NOVOS. O unico
#   orfao e /onboarding/perfil, pre-existente; /profile/[userId] segue sem saida propria (card
#   NAV-BECOS-SEM-SAIDA). Todos os destinos que saem da barra (Explorar, Comunidades, /groups, /mercado,
#   /negocio, Guia, Agenda, Salvos) tem porta a partir de Inicio, Comunidade ou Voce.
# Prova: pnpm gate -> VERDE (lint, typecheck, typecheck:e2e, test 1709, secrets); o estagio build e PULADO
#   pelo gate por nao existir apps/web/.env.local, que este contrato proibe criar.
# Prova: pnpm --filter web build com NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY de
#   pnpm exec supabase status -o env (sem criar apps/web/.env.local) -> ok; BUILD_ID escrito e todas as
#   rotas de vila presentes no app-path-routes-manifest.json.
# Prova: node scripts/agents/prova-fila.mjs -- node scripts/agents/prova-sequencia.mjs e2e
