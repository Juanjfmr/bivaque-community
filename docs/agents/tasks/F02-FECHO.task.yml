  - redesenhar Início ou Busca além dos dois itens da revisão às cegas; mexer no tema escuro
  - apagar teste sem lar declarado no RELATORIO (teste de código morto morre junto, nomeado)
  - skip/fixme novo, afrouxar asserção, inline de credencial ou leitura de arquivo .env pelo spec
  - push, merge, force-push, editar o quadro (tools/backend-kanban), tocar outra worktree
