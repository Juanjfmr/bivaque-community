acceptance:
  - "Busca.tsx e Inicio.tsx guardam o tipo da falha no molde de Agenda.tsx (sessao | negado | falhou) usando sessaoVencida()/acessoNegado() já existentes; 401 renderiza EstadoDeSessaoVencida (botão 'Entrar de novo' leva a /app/entrar), 403 renderiza EstadoNegado com texto próprio da tela, e só falha de rede/5xx mantém EstadoDeErro com 'Tentar de novo'. Abortar continua ignorado."
  - "Teste de unidade no app (vitest, apps/app/tests) cobrindo os três ramos nas duas telas, com caso negativo: falha de rede NÃO mostra sessão vencida."
  - "E2E do app (apps/app/tests/e2e, rotas simuladas no molde de busca-resultado-ficha.spec.ts): /app/busca?q=escola com a API respondendo 401 mostra [data-estado='sessao-vencida'] e o botão leva a /app/entrar, nos projetos de 375, 768 e 1440 da config do app; o mesmo para /app/inicio."
  - "tests/e2e/busca-redirects.spec.ts: o 307 e o q preservado ficam intactos; a asserção do estado na aterrissagem sem sessão passa a ser [data-estado='sessao-vencida'] (não afrouxar: continua exigindo o estado visível nas três larguras)."
  - "tests/e2e/f02-inicio-real.spec.ts ganha a prova negativa de navegador A4: com a sessão do membro semeado, uma busca por termo que só exista em conteúdo de entrada pendente/oculta no seed não lista esse conteúdo. O executor escolhe o termo lendo supabase/seed.sql (sem alterá-lo) e registra no RELATORIO qual linha do seed sustenta o caso; se o seed não tiver conteúdo pendente buscável, registrar BLOQUEADO para este item com a linha exata do seed que falta, em vez de inventar."
  - "Pasta apps/web/app/(shell)/inicio REMOVIDA inteira. O que ainda tem importador vivo (loadPrimaryCommunity/createRequestGuard/PrimaryCommunity e buildGoingLine de home-loaders, JoinCommunityCard, eventDateChip, useAvatarSrc e o que eles puxarem) vai para apps/web/lib/inicio/ (lógica) ou apps/web/app/(shell)/community/ (componente usado só lá), com imports repontados. Testes de unidade que exercitam código que sobrevive mudam só o import; testes de código que morre (hub, novidade, hub-view, etc.) morrem nomeados no RELATORIO. grep -rn \"(shell)/inicio\" apps tests scripts retorna só comentários históricos ou nada."
  - "proxy.ts: '/' com sessão e aceite vai para '/app/inicio' direto (sem aceite segue '/onboarding'); teste de unidade do proxy cobre os dois casos e o anônimo continua recebendo a landing. Nenhum ciclo de redirect: /app/inicio não passa pelo portão que manda para '/'."
  - "link-crawl.spec.ts e capture.mjs sem a tela antiga /inicio (o 307 continua válido como destino)."
  - "CEGA F02: (a) em 375 os chips de filtro da Busca não terminam cortados sem sinal — a rolagem horizontal mantém respiro final e o último chip alcança a borda com folga (padding final), sem quebrar 768/1440; (b) o texto de apoio do Início que a revisão julgou longo vira uma frase curta (no máximo ~80 caracteres), sem URL nem jargão (regra 'copy fala com a pessoa')."
  - "RELATORIO no fim da execução (em .visual/f02-fecho/RELATORIO.md): arquivos tocados, testes que morreram e por quê, comandos rodados com o resultado lido, e o que não rodou."

