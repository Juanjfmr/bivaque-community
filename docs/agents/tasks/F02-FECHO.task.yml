# F02-FECHO — fecha o LAN-F02 pelos seis critérios de pronto (docs/LANCAMENTO.md :34-48).
#
# Inventário do coordenador em 18/11 sobre origin/main 5e66cd28 (disco e git, não o texto
# do cartão). O que já está: /app/inicio e /app/busca ligados ao banco (PR #138), presença
# gravada e relida, 401 nas rotas sem sessão, /inicio e /explorar* com 307 para o app,
# tests/e2e/f02-inicio-real.spec.ts rodando nos três projetos (375/768/1440). O que falta é
# este contrato.
#
# Emenda do coordenador (rodada 2, depois da revisão FAIL): allowed_paths ganha o classificador
# tipo-de-falha.ts e os órfãos que a remoção expôs (highlights e os três testes que liam a
# tela antiga). Nenhum critério de aceite mudou.

task_id: F02-001

adr: docs/decisions/ADR-20261024-front-react-spa.md

objective: >
  A Busca e o Início do app distinguem sessão vencida (401) e acesso negado (403) de falha de
  rede, com a saída real para /app/entrar; a prova negativa de navegador "entrada pendente não
  aparece na busca" volta a existir; a tela antiga apps/web/app/(shell)/inicio sai inteira do
  apps/web (o 307 /inicio → /app/inicio já existe) com os módulos ainda usados por outras telas
  realocados; o proxy manda o membro com sessão de "/" direto para /app/inicio; e as duas
  melhorias baratas da revisão às cegas de 17/11 para o F02 entram.

authority:
  - docs/LANCAMENTO.md :34-48 (critérios 1, 3 e 6) e :55 (linha F02)
  - Card LAN-F02 (checklist "Tela antiga do apps/web retirada, com redirecionamento e portão do proxy")
  - Card BUSCA-SESSAO-VENCIDA (quatro itens do checklist)
  - Card CEGA-MELHORIAS-17-11 (itens F02 — chips cortados em 375; texto de apoio longo no Início)
  - ADR-20261024-front-react-spa.md §8 (ordem da troca; redirect e portão do proxy no mesmo PR)

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    apps/app/src/telas/Busca.tsx:131-150 e :256-257 transformam toda falha em EstadoDeErro (o
    401 de /api/app/busca vira "Confira a conexão"); Inicio.tsx:299 idem. O molde certo existe:
    Agenda.tsx:59-61 com sessaoVencida()/acessoNegado() e EstadoDeSessaoVencida/EstadoNegado de
    apps/app/src/eventos/EstadosDeAcesso.tsx. tests/e2e/busca-redirects.spec.ts:27-30 afirma o
    estado de erro errado. A pasta apps/web/app/(shell)/inicio tem 22 arquivos servindo tela
    inalcançável (next.config.ts tem ["/inicio", "/app/inicio"]), mas ainda é importada por
    (shell)/community/page.tsx:15-16 (home-loaders, join-community),
    components/bivaque/feed-right-rail.tsx:9 (formatters), components/bivaque/intent-launcher.tsx:10
    (use-avatar-src) e por tests/unit/ui/inicio-going-line, inicio-hub, inicio-novidade e
    shell-create-action. proxy.ts:92 redireciona "/" com sessão para "/inicio" (salto duplo).

