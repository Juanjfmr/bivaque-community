  administra a comunidade ((owner)/communities/[id]/admin: início, pendentes, moderadores, prestadores
  e mídia), e então apagar as versões do site com código e testes. A porta provisória do #309 passa a
  abrir as telas novas.
authority:
  - docs/LANCAMENTO.md (fase 6, critério: nenhuma rota de membro no apps/web servindo tela)
  - docs/decisions/ADR-20261024-front-react-spa.md (§5 contrato de API, §8 ordem da troca)
  - "card LAN-TROCA-ADMIN; decisão do dono de 20/11 (nenhuma tela antiga sobrevive)"
adr: docs/decisions/ADR-20261024-front-react-spa.md
