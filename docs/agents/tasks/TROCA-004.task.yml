  - remover a tela web antes de a tela do app passar na revisão às cegas e no E2E
  - redirecionamento em ciclo ou que perca ID ou query
  - afrouxar ou apagar asserção de teste de uma rota que continua existindo
  - rota de API nova sem o contrato do ADR SPA §5 (resolvedor único, CSRF por Origin e cabeçalho, CORS explícito) e sem teste positivo e negativo
  - service_role sem autorização explícita no código
  - expor Força/OM de outro membro (BLOCK-AFFILIATION)
  - git stash, delegar, dado pessoal real ou CPF real
  - apps/web/app/(admin)/**, a landing, apps/mobile, apps/prototipo
