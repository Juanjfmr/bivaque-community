  - "só dono e moderadores veem e usam o painel; membro comum e anônimo recebem recusa na API e na tela (testes negativos)"
  - "aprovar ou recusar pendente, nomear moderador, gerir prestadores e mídia gravam com as mesmas regras de hoje (validação compartilhada num só módulo enquanto o caminho velho existir)"
  - "as rotas antigas devolvem 307 ao /app com ID preservado; páginas, componentes e testes antigos saem"
  - "a porta provisória passa a abrir as telas novas; link-crawl no rigor normal"
