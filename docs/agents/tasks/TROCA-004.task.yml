task_id: TROCA-004
objective: >
  Tirar do site, sem substituto no app, o indicar prestador pelo membro
  ((shell)/communities/[id]/indicar-prestador) e o painel de quem administra a vila
  ((owner)/communities/[id]/admin: início, pendentes, moderadores, prestadores e mídia). Pelo redesenho
  da Comunidade, a vila sai (§3.4) e só o operador convida e atesta prestador (§6); a indicação de
  negócio por membro é do F09. As rotas antigas passam a 307 e as páginas saem com código e testes.
authority:
  - docs/LANCAMENTO.md (fase 6, critério: nenhuma rota de membro no apps/web servindo tela)
  - docs/decisions/ADR-20261024-redesenho-da-comunidade.md (§3.4 a vila sai; §6 só o operador convida prestador)
  - docs/decisions/ADR-20261024-front-react-spa.md (§8 rotas antigas redirecionam)
  - "card LAN-TROCA-ADMIN; decisão do dono de 20/11 (nenhuma tela antiga sobrevive)"
adr: docs/decisions/ADR-20261024-redesenho-da-comunidade.md
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Em origin/main seguem servindo tela no site (shell)/communities/[id]/indicar-prestador e as cinco
    páginas de (owner)/communities/[id]/admin, todas sobre a vila (communities, community_memberships,
    provider_invitations.community_id).
allowed_paths:
  - apps/web/app/(shell)/communities/**
  - apps/web/app/(owner)/**
  - apps/web/app/components/**
  - apps/web/lib/**
  - apps/web/components/**
  - apps/web/proxy.ts
  - apps/web/next.config.ts
  - tests/**
  - apps/web/tests/**
  - docs/agents/tasks/TROCA-004.task.yml
forbidden:
  - criar no app tela, rota de API, RPC ou migration de comunidade (a vila sai, redesenho §3.4)
  - convite ou atestação de prestador por membro (redesenho §6)
  - apagar tabela ou função da vila no banco (é o RED-003/R4); migration de qualquer tipo
  - redirecionamento em ciclo ou que perca a query
  - afrouxar ou apagar asserção de teste de uma rota que continua existindo
  - tocar apps/web/app/(admin)/** (a área do operador fica), apps/app, apps/mobile, apps/prototipo
  - git stash, delegar, dado pessoal real ou CPF real
acceptance:
  - "/communities/:id/indicar-prestador devolve 307 para /app/negocios; /communities/:id/admin e as subrotas (pending, moderators, providers, media) devolvem 307 para /app/comunidade; anônimo segue o portão sem ciclo"
  - "as páginas, layouts, actions, componentes e testes do (owner) e do indicar-prestador saem; o layout (owner) sai se não sobrar página"
  - "nenhum link vivo no apps/web nem no apps/app aponta para as rotas removidas (create-visibility e afins ajustados); link-crawl no rigor normal"
  - "a área do operador em (admin) segue igual, com seus testes verdes"
proof:
  - npx pnpm@11.18.0 gate --fast
  - npx pnpm@11.18.0 test
  - npx pnpm@11.18.0 test:scope
  - npx pnpm@11.18.0 test:e2e
risk: authz
risk_level: R2
reviewer_must_differ_from_executor: true
retry_budget: 2
on_budget_exhausted: HUMAN_DECISION
closure:
  requires_runtime_evidence: true
