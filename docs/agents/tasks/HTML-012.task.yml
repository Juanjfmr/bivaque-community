task_id: HTML-012
objective: >
  Rodada 12 troca as 11 categorias soltas do prototipo HTML por 12 grupos de servico mais
  Outros, cada um com especialidade opcional, em pedidos abertos, paginas de negocio e
  indicacoes. Pedido com especialidade chega as empresas do grupo que marcaram aquela
  especialidade ou nenhuma. Os dados de exemplo antigos e o estado ja salvo sao convertidos
  na carga. Separado: marcar um negocio num comentario de grupo so vale ao responder uma
  pergunta.
authority:
  - Pedido explicito do usuario em 2026-10-15 - abranger mais servicos sem lista gigante, item e subitem opcional
  - Aprovacao do usuario em 2026-10-15 da lista de 12 grupos e especialidades
  - Decisao do usuario em 2026-10-15 - pedido com especialidade filtra quem recebe
  - Decisao do usuario em 2026-10-15 - indicar negocio em evento e contar como indicacao nao faz sentido
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    HEAD 78b2c241. Pedido e negocio usavam 11 categorias soltas (Climatizacao e Refrigeracao
    separadas, sem hidraulica, pintura, limpeza, tecnologia, documentos); comentario em
    evento, oferta, enquete ou publicacao comum permitia marcar negocio e dava indicacao.
