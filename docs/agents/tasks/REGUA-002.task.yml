forbidden:
  - tocar em Conversas.tsx, Conversa.tsx, Avisos.tsx, na casca ou nas peças (são do lote REGUA-001)
  - criar rota de API, mudar banco, migrations ou contrato de dados; se "Mandar mensagem" não tiver rota existente, não crie — registre no relatório
  - mostrar Força, OM, posto ou selo de verificação de outro membro (BLOCK-AFFILIATION)
  - mostrar a origem de CEP ou coordenada de outra pessoa
  - afrouxar ou apagar teste existente para ficar verde
acceptance:
  - o avatar e o nome da barra e os da página Você vêm da mesma fonte; na captura os dois mostram a mesma pessoa
  - o hub Você mostra perfil (avatar, nome, cidade) e a lista "Seu Bivaque"; mudar de cidade fica atrás de uma linha da lista ou de "Editar perfil", sem texto de mecanismo ou de privacidade na tela
  - a falha ao carregar mostra um único aviso com "Tentar de novo" e mantém a mesma estrutura da tela de sucesso
  - o perfil de membro tem ⋯ com Bloquear e Denunciar pelas rotas existentes (com confirmação), e "Mandar mensagem" se houver rota existente; respiro de 16 px sob a barra; bio alinhada
  - bloqueados mostram iniciais num dos quatro tons, data completa, texto neutro ("Bloqueio desde 03/11/2026"), "Desbloquear" em pílula; vazio com apoio de uma linha
  - salvos têm um único estado vazio quando nada foi salvo, busca em forma de campo, filtros só junto da seção de anúncios, chip selecionado em tinta
  - nenhum texto destas telas é cortado em 375; o "+" não encosta em controle algum
  - em 1440 as telas respeitam a largura de leitura e não esticam campos a ~1290 px
  - capturas cegas regeradas em claro E escuro (375/768/1440)
