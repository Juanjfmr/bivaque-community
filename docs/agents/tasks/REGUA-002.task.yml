task_id: REGUA-002
objective: >
  Você, perfil de membro, bloqueados e salvos ficam no nível da régua Nextdoor em 375/768/1440: a
  identidade mostrada na barra é a mesma da página Você; o hub Você abre no perfil e na lista "Seu
  Bivaque", não num formulário; o perfil de membro tem saída (mensagem quando existe rota, e ⋯ com
  bloquear e denunciar); nenhum texto perde o sentido por corte; sucesso e falha têm a mesma estrutura.
