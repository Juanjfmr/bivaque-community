baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Revisão às cegas de 18/11 (capturas do #295, head edca972e), cartão LAN-F10. Defeitos deste lote:
    (1) barra de baixo com avatar "RS" e página Você com "Ana Beatriz Ferreira" — descobrir se é o
    ajudante de teste ou o app que lê duas fontes, e fazer as duas lerem a mesma; (2) "+" encosta em
    "Mudar de cidade" em 375; (3) cortes: "Bloqueado em 03/11/2…" e subtítulos de "Seu Bivaque";
    (4) perfil de membro sem mensagem, bloquear ou denunciar, cabeçalho colado na barra, bio
    desalinhada; (5) hub Você abre direto no formulário de mudar de cidade, com parágrafo de mecanismo
    e regra de privacidade na tela; na falha o erro aparece três vezes e a estrutura muda; (6)
    bloqueados sem iniciais, "Bloqueado" sem concordância neutra, "Desbloquear" sem forma de pílula,
    apoio de 4 linhas no vazio; (7) salvos: quatro vazios empilhados, busca sem forma de campo,
    filtros de anúncio acima de tudo, chip selecionado em Brasa; (8) desktop em coluna solta.
