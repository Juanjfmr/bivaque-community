  - Migration na faixa 20261024121000. O pedido ao grupo Fechado aceita motivo de ate 300 caracteres (CHECK no banco); so quem aprova no grupo (dono e moderador) e a propria pessoa leem o motivo, provado por pgTAP positivo e negativo (outro membro, nao membro, anonimo)
  - O motivo e apagado quando o pedido e aprovado ou recusado, e um job pg_cron (a extensao ja esta habilitada no projeto) apaga o motivo de pedido sem decisao com mais de 30 dias; pgTAP das tres vias
  - No maximo 3 pedidos da mesma pessoa ao mesmo grupo em 30 dias, contados numa tabela propria de tentativas (recusar apaga a linha de participacao), com RLS fechada e pgTAP do quarto pedido recusado
  - A tela do pedido avisa para nao incluir endereco, telefone, CPF ou dados de saude, com o texto e o layout de prototypes/bivaque-html/src/features/groups/
  - Convite e um botao que copia ou compartilha o link da tela do grupo; no grupo Fechado o link leva ao pedido, nunca a entrada direta; e2e dos dois casos
  - A nova UI fica em componentes novos dentro de apps/web/app/(shell)/groups/[id]/, e page.tsx so ganha o import e a linha que renderiza, para reduzir conflito entre COM-005, COM-006 e COM-007
  - e2e nos tres viewports de pedir com motivo, aprovar e ver o motivo sumir
