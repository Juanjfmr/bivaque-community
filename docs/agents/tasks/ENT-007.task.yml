forbidden:
  - adaptar um bloco sem o crédito no topo do arquivo (nome do bloco, autor e link do 21st.dev)
  - manter dos blocos next/link, next/image, Base UI, framer-motion ou o FancyButton; trocá-los pelos componentes e pela camada de navegação do app
  - instalar, remover ou atualizar dependências; rodar o CLI do shadcn ou do 21st
  - mudar textos, campos, validações, destinos, rotas ou dados de demonstração
  - mexer nas telas aprovadas (03 a 09c, 11, 12f) além do que a regra comum de tamanho no celular abaixo exigir; 12a e 12b só mudam pela troca dos componentes do formulário do negócio pelos blocos
  - usar pacote fora do radix-ui já instalado para Checkbox e Radio Group dos blocos (sem @radix-ui/react-*, lucide-react ou react-hook-form)
  - usar Base UI, Material Web ou HeroUI; usar Brasa fora do logo; cor fixa fora dos tokens
  - editar migrations, Supabase, apps/web ou apps/mobile
  - delegar a subagentes

acceptance:
  - "Composição de acesso no desktop (≥ 1024 px), a partir do código do sign-in-3 (grade de duas colunas e painel lateral de cantos grandes, com os lados invertidos): grade de duas colunas iguais (1fr 1fr) na altura da janela; à esquerda o painel, com a foto cobrindo-o e a frase e os itens de hoje por cima, no lugar do depoimento do bloco; à direita o conteúdo centralizado na vertical e na horizontal, com largura máxima de 30rem (480 px). Logo com 48 px de altura no topo do conteúdo; título em Noto Serif com 2.75rem (44 px); apoio com 1.0625rem (17 px); botão do Google, campos e botão principal com 48 px de altura."
  - "Enquadramento da foto: em cada tela da composição de acesso a pessoa ou o grupo principal da referência aparece inteiro, sem corte de rosto: no login a mesa com o aperto de mão inteiro; no criar conta as duas mulheres do portão. Ajuste object-position por imagem (variável CSS por tela); nas telas 13b, 13c, 16, 17 e 18 (rodada 3) a foto é nova, gerada para os recortes da tela (paisagem 16:9 ou 16:10 e retrato 2:3), sem farda, insígnia, texto ou logotipo, no estilo das fotos de demonstração: boas-vindas de quem mora (vizinhos) e de quem sai (mudança); convite com a família reunida em casa; conta apagada com uma varanda ao entardecer, sem pessoas. A 13 (aprovada) mantém a foto atual; no desktop, onde a versão larga cortaria a cena no painel alto, vale a versão retrato (login: demo/landing-hero-retrato.webp, a mesma foto; convite e conta apagada: convite-retrato.webp e apagada-retrato.webp, tomadas próprias da mesma cena da versão em paisagem)."
  - "Composição de acesso no celular (< 768 px): a foto é uma faixa na largura da coluna, com as margens de 16 px e os cantos da referência de celular, em proporção 16:10 e o mesmo enquadramento do desktop (sem zoom extra); título com 1.5rem (24 px) em uma linha quando o texto couber em 375 px; apoio com 0.9375rem (15 px); campos e botões com 44 px de altura; rótulos com 0.875rem (14 px)."
  - "Regra comum de tamanho no celular (< 768 px) para todas as telas de /app/entrar/*: título de display 1.5rem (24 px); subtítulo de seção 1.125rem (18 px); texto de apoio 0.9375rem (15 px); rótulos 0.875rem; textos de ajuda 0.8125rem (13 px); campos 44 px de altura. As telas aprovadas só mudam se hoje estiverem acima desses valores."
  - "Boas-vindas (13, 13b, 13c) a partir do código do Onboarding / Welcome Screen: a entrada escalonada do bloco vira transição de CSS (opacidade e deslocamento curtos), desligada com prefers-reduced-motion; desktop com a coluna de até 47.5rem (760 px), foto na largura da coluna com proporção 21:9 e o grupo inteiro (sem corte de rosto), título 3rem (48 px), apoio 1.125rem, cartões de atalho com ícone de 24 px e altura entre 80 e 100 px (a referência F01-13, desenhada em 1536 px, mede 94 a 97 px em 1440); celular com foto 16:10, título 24 px e os mesmos cartões entre 56 e 80 px (a referência de celular mede cerca de 60 px em 375), sem cortar o texto de duas linhas."
  - "Grupos (10) a partir do código do Card Style Checkbox (21st.dev, cnippet-dev/v-checkbox-4): o rótulo inteiro é o cartão, com borda de 1 px, cantos de 8 px, respiro de 12 px, caixa de 16 px (Checkbox do radix-ui), título em 0.875rem e descrição em 0.75rem; marcado troca a cor da borda e o fundo, sem mudar a espessura. A miniatura do grupo fica à direita no celular (< 768 px, 72 × 72 px) e no topo a partir de 768 px (16:9), na grade 2 × 2."
  - "Formulário do negócio (12a a 12e) a partir do código do Onboarding Wizard Form (21st.dev, cnippet-dev/v-form-8): indicador de cinco passos numerados (círculos de 24 px, check quando feito, linha entre eles; abaixo de 768 px só o passo atual mostra o rótulo), com o texto \"Passo X de 5\" para leitor de tela; cartões de rádio do Radio Group (21st.dev, originui) com título e descrição curta; especialidades e dias como caixas do Card Style Checkbox; revisão como a confirmação do bloco, em linhas divididas com rótulo, valor e Editar. Campos com cantos de 8 px e 40 px de altura no desktop; no celular valem os 44 px da regra comum. O subtítulo de cada passo (só usado neste formulário) mede 18 px também no desktop, no lugar dos 22 px, para a hierarquia do bloco."
  - "Negócio passos 4 e 5 (12d, 12e) no celular: miniaturas de foto em grade de 4 colunas (cerca de 72 px), selo Capa menor, \"Voltar\" e \"Continuar\" com 44 px; textos pela regra comum. No passo 5 (revisão) a foto de capa tem proporção 16:9 e as linhas de cada bloco seguem a regra comum."
  - "Foco no título ao abrir; foco visível; sem rolagem horizontal em 320, 360, 375, 430, 768 e 1440 px; tema escuro pelos tokens; os testes de privacidade que já existem em entrada-etapa.spec.ts continuam passando sem alteração."

