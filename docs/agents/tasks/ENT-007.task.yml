  - npx pnpm@11.18.0 --filter @bivaque/app test:e2e -- tests/e2e/entrada-etapa.spec.ts tests/e2e/entrada-acesso.spec.ts tests/e2e/entrada-21st.spec.ts
  - npx pnpm@11.18.0 test:scope
  - npx pnpm@11.18.0 lint
  - "Testes: no desktop as duas colunas da composição de acesso têm a mesma largura (diferença ≤ 2 px) e o conteúdo tem no máximo 480 px; no celular o título de display mede 24 px em todas as telas de /app/entrar/*; a foto da composição de acesso no celular tem proporção 16:10 (± 2%); nos grupos a miniatura mede 40% do cartão (± 2%); no negócio em 375 px as miniaturas ficam em 4 colunas"
  - "Capturas de página inteira das telas 01, 02, 10, 12d, 12e, 13, 13b, 13c, 14, 15, 15b, 16, 17 e 18 em 375, 768 e 1440 px em .visual/ENT-007/"

