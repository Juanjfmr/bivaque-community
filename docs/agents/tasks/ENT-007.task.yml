# ENT-007 — F01, rodada de ajustes do aceite visual do dono (31/10/2026)
#
# Executor: Claude Code (decisão do dono, 31/10/2026). Revisor independente: Codex. Verificação de
# runtime: Claude Code, com as provas abaixo rodadas na revisão entregue.
# Sem backend. O dono revisou as 28 telas em 31/10/2026: 13 aprovadas, 14 com ajuste, 1 pendente.
# Os ajustes são dois: a foto (corte e enquadramento) e o tamanho (grande demais no celular,
# pequeno demais no desktop). Por decisão do dono (31/10/2026), a composição de acesso e as
# boas-vindas passam a partir do código real dos blocos do 21st.dev mapeados na direção da F01,
# obtido pelo plugin do 21st; os blocos não declaram licença e o dono assumiu esse risco.
# Alterações deste contrato depois do primeiro despacho (31/10/2026), pelo coordenador, que também
# é o executor por decisão do dono: a origem passou do login-02 aos blocos do 21st (decisão do
# dono); logo, coluna e título das boas-vindas e a altura dos atalhos foram medidos nas referências
# aprovadas; grupos (40% só no celular) e a faixa do celular (com margens) foram corrigidos porque
# contradiziam a referência. Cada mudança está no commit que a fez e foi revista pelo Codex.
# Ratificação: estas mudanças de critério (origem nos blocos, medidas, grupos só no celular, faixa
# com margens, foto retrato no desktop) só valem com o aceite visual do dono na rodada 2 da página
# Aceite da Entrada; sem esse aceite o ENT-007 não fecha.
# Rodada 2 (01/11/2026): 18 telas aprovadas, 3 com ajuste (10 grupos, 12c e 12d negócio: verifique
# os blocos/componentes do 21st), 9 sem marcação (12e, 13b, 13c, 14, 15, 15b, 16, 17, 18). Por isso
# grupos e formulário do negócio passam ao código real dos blocos mapeados na direção (Card Style
# Checkbox, Onboarding Wizard Form, Radio Group). O formulário é um componente só: a troca alcança
# também 12a e 12b, que voltam ao aceite na rodada 3. Estas mudanças também dependem do aceite do
# dono na rodada 3.
# Rodada 3 (01/11/2026): 23 telas aprovadas, inclusive 10 e 12a a 12e (o que ratifica os critérios
# de grupos e do formulário); 5 com ajuste só de foto (13b, 13c, 16, 17, 18). O dono sugeriu gerar
# outra imagem; por isso as fotos dessas telas passam a ser geradas para os recortes de cada uma.
task_id: ENT-007

objective: >
  No app (apps/app), as telas da entrada com ajuste pedido pelo dono ficam iguais às referências
  aprovadas em proporção, enquadramento da foto e tamanho de texto e controles, no celular e no
  desktop. A composição de acesso (login, criar conta, recuperar senha e envio, retomar, convite,
  convite indisponível e conta apagada) é refeita a partir do código do bloco Split Sign In Form
  (21st.dev, diarmuradi/sign-in-3), com a foto à esquerda; as boas-vindas a partir do bloco
  Onboarding / Welcome Screen (21st.dev, ravikatiyar162). Mesmos textos, campos, validações e
  destinos de hoje.

authority:
  - "Revisão do dono em 31/10/2026 (página Aceite da Entrada), notas por tela: 01 login: foto cortada, melhorar o preenchimento da tela à direita; 02 criar conta: problema na foto à esquerda; 10 grupos: melhorar o enquadramento; 12d e 12e negócio: tamanho das coisas muito grande, texto muito grande; 13, 13b e 13c boas-vindas: ajustar a foto e o tamanho dos textos; 14 retomar, 15 senha, 15b senha enviada, 16 convite, 17 convite indisponível e 18 conta apagada: o mesmo (foto e texto). Aprovadas sem mudança: 03 a 09c, 11, 12a, 12b e 12f. 12c ficou sem revisão."
  - docs/design/fluxos-2026-10-30/individuais/F01/ (referências desktop) e individuais/F01/celular/ (referências celular)
  - .visual/ENT-007/comparacao/ (lado a lado referência × app de 31/10, e as imagens separadas ref-* e app-*)
  - .visual/ENT-007/blocos-21st/ (código dos blocos sign-in-3 e onboarding-welcome-screen do 21st.dev, como o plugin devolveu, com demos e relatório)
  - "Revisão do dono na rodada 2 (01/11/2026): 10 grupos \"Verifique os blocos 21 St dev\"; 12c \"Verifique os componentes\"; 12d \"Mesma coisa\"."
  - "Revisão do dono na rodada 3 (01/11/2026): 13b \"A foto ainda está mal enquadrada. Talvez seja necessário gerar outra imagem\"; 16 \"Foto mal enquadrada\"; 13c, 17 e 18 marcadas para ajuste sem nota."
  - .visual/ENT-007/blocos-21st-r3/ (código dos blocos v-checkbox-4, v-form-8, radio-group de originui e c-stepper-1, como o plugin devolveu, com demos e relatório)
  - docs/decisions/ADR-20261020-identidade-visual-e-tema-escuro.md (título de display com 24 px no celular; cantos de 12 px)
  - docs/decisions/ADR-20261024-front-react-spa.md (shadcn/ui no apps/app)
  - docs/design/fluxos-2026-10-30/F01-DIRECAO.md
  - docs/agents/tasks/ENT-001.task.yml a ENT-006.task.yml

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Capturas de 31/10/2026 na revisão 094ba62d (.visual/ENT-007/comparacao/). Desktop: no login e
    no criar conta a foto ocupa cerca de 46% da largura e vem ampliada, cortando metade da cena (a
    segunda pessoa no criar conta, o aperto de mão no login); o formulário tem cerca de 280 px de
    largura e deixa a metade direita quase vazia; nas boas-vindas a coluna, a foto e o título
    ficam menores que na referência. Celular (375 px): títulos de cerca de 30 px que quebram em
    duas linhas; no negócio, campos, rótulos e miniaturas de foto grandes (miniaturas em duas
    colunas de cerca de 160 px); nos grupos a miniatura é estreita e a foto vem recortada.

