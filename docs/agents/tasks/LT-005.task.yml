# LAN-TROCA — F06: as listas antigas de mercado/imóveis/meus-anúncios saem da web.
#
# Molde: RUN-133 / LT-002 / LT-004. O lado do app JÁ está pronto e provado com banco real:
# /app/mercado e /app/imoveis (Mercado.tsx -> /api/app/mercado?tipo=item|property, filtros
# de URL consumidos em filtros-url.ts) e /app/meus-anuncios (MeusAnuncios.tsx ->
# /api/app/mercado/meus, gestão editar desapego + situação). E2E f06-mercado-real.spec.ts.
# O motivo do hold da fase 1 (filtros da URL não consumidos) CAIU. Este lote é só o lado web.
#
# DECISÕES DE ESCOPO (do mapa F06 do explore):
# (D1) Troca PARCIAL ao estilo fase 1: saem só as 3 listas (mercado/page, imoveis/page,
#      meus-anuncios/page). FICAM na web: criação/edição de imóvel (imoveis/novo, [id]/editar
#      — app só tem rascunho local), alertas (imoveis/alertas — sem equivalente no app),
#      criação/edição web de desapego (mercado/novo, [id]/editar), detalhes [id] (já 307 fase 1),
#      e as peças compartilhadas (mercado-shared, property-form, alert-form, save-listing-button,
#      share-button, loading/error/not-found de imoveis). NÃO remover nada com importador vivo.
# (D2) Filtros parcialmente consumidos pelo app: q é client-side sobre a página carregada;
#      categoria/condicao/regiao/ordem (mercado) e bairro/tipo_negocio/sort (imoveis) NÃO são
#      consumidos; tipo fora de apartamento/casa cai em todos. Limitação a registrar, não bloqueia.
# (D3) Após a troca, as portas de criação/edição/alertas de imóvel dependem do menu Criar web
#      + URL direta. Gap de edição de imóvel é PRÉ-EXISTENTE (sem link desde a fase 1); F06 não
#      remove porta que ainda existia. Registrar no card.
# (D4) Drift do card LAN-F06 (checklist stale vs código landed 06/11) — reconciliar no fechamento.

