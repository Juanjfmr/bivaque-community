  - o diagnóstico explica a intermitência — por que três viewports num head e uma no seguinte, sem mudança de código
  - o teste passa em cinco repetições seguidas nas três viewports, não numa passagem isolada
  - nenhuma asserção do spec foi enfraquecida para o teste passar
  - a suíte E2E completa fecha com zero falhas

