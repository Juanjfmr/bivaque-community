task_id: RECON-022

objective: >
  A ficha do prestador e o pedido de servico passam a ser os da prancha 62 - ler a ficha
  autorizada, abrir o pedido com destinatario fixo e somente leitura, descrever a necessidade
  com contador, quando e fotos opcionais, e enviar um pedido que persiste.

authority:
  - docs/design/visual-guide-2026-09-06/62-web-prestador-pedido.png
  - docs/agents/PRANCHAS-WEB-RESTANTES.md secao 62-web-prestador-pedido
  - docs/superpowers/specs/2026-09-08-reconstrucao-visual-web-design.md secao 4.6 R41 R42
  - docs/decisions/ADR-20260820-conta-de-prestador.md

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    /prestadores/[id] existe e nunca foi comparada com a prancha 62. Nao existe rota de pedido
    nem tabela de pedido de servico no banco - o inventario de tabelas de 09/09 confirma.
    Medido em 09/09/2026 na arvore de codex/ajuste-de-auditoria.

allowed_paths:
  - apps/web/app/(shell)/prestadores/
  - apps/web/app/(shell)/pedidos/
  - apps/web/lib/service-requests/
  - supabase/migrations/
  - supabase/tests/
  - scripts/visual/capture.mjs
  - tests/unit/
  - docs/agents/tasks/RECON-022.task.yml

forbidden:
  - aceitar destinatario, participante ou contexto vindo do corpo da requisicao
  - compartilhar telefone ou outro contato automaticamente ao enviar o pedido
  - transformar prazo desejado em campo de contato pessoal
  - expor contato de ficha retirada ou de conta sem permissao
  - criar estrela, selo, ranking, prova social ou promessa de prazo de resposta
  - derivar a situacao do pedido da existencia de mensagem
  - criar valor, pagamento, custodia ou cobranca
  - editar migration ja aplicada
  - texto de placeholder, href vazio, handler vazio ou toast como unica implementacao

acceptance:
  - a ficha segue a prancha 62 - link de voltar, foto grande a esquerda, nome, ocupacao, localizacao, descricao, secao de servicos com icone e rotulo, e os dois botoes Pedir servico e Entrar em contato
  - a rota de novo pedido existe com destinatario derivado da URL e exibido em campo somente leitura
  - o formulario segue a prancha - descricao com contador de 500, quando opcional, fotos opcionais com o limite real, e o cartao Resumo do pedido espelhando os campos
  - enviar grava o pedido com autor da sessao e destinatario fixo, e reenviar nao duplica
  - o pedido e a conversa de contexto sao criados de forma idempotente e o contexto e imutavel
  - a tabela nova e as policies que a leem entram na mesma migration, com caso positivo e negativo em pgTAP
  - terceiro nao le nem altera o pedido, inclusive por chamada direta sem interface
  - ficha retirada ou sem permissao devolve estado honesto sem revelar existencia privada
  - todos os estados fechados - carregando, vazio, erro recuperavel que preserva o texto, envio em andamento sem duplicar e sessao expirada
  - exatamente um h1 por tela, contraste maior ou igual a 4,5:1, alvos maiores ou iguais a 44x44 e foco visivel
  - as rotas novas estao cadastradas em scripts/visual/capture.mjs com fixture concreta

proof:
  - node scripts/agents/task-contract.mjs docs/agents/tasks/RECON-022.task.yml
  - npx pnpm@11.18.0 gate
  - reset local sem seed seguido de npx pnpm@11.18.0 test:db com caso positivo e negativo
  - npx pnpm@11.18.0 build
  - node scripts/visual/capture.mjs para cada rota tocada em 375 768 e 1440

risk: pedido de servico e conversa entre contas
risk_level: R3
adr: docs/decisions/ADR-20260909-pedidos-e-conversa-contextual.md
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: HUMAN_DECISION
closure:
  requires_runtime_evidence: true
