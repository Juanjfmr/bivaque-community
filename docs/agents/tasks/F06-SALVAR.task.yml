acceptance:
  - "POST/DELETE /api/app/mercado/[id]/salvo no ADR §5: exigirSessao + conferirEscrita (escrita por cookie), visibilidade do anuncio pela leitura sob RLS (invisivel/sumido -> 404 sem confirmar), insert/delete em listing_saves com user_id da SESSAO (nunca corpo), duplicata idempotente (23505 -> 200 mesmo estado), DELETE do proprio sempre permitido, sem service_role, sem eco, OPTIONS no molde. GET /api/app/mercado/salvos: a lista paginada dos proprios salvos (saved_at desc, join can_read_listing, kind/tipo param como o GET mercado hoje) no molde de guia/salvos. A rota lista (GET mercado) passa a incluir o flag salvo por item (uma leitura a mais da propria tabela, sem N+1)."
  - "App: marcarSalvoAnuncio(id, ativo) + listarSalvos(...) no cliente de dados; Anuncio/Mercado/Inicio substituem o Set local pelo estado vindo do servidor (otimista com reversao em falha no botao; cartoes mostram o flag real); a tela Salvos (aba Mercado/Imoveis) lista dos salvos reais com links ao detalhe — a seccao que hoje e demo/ausente sai do demo. Sem localStorage novo; rascunhos de composicao ficam como estao."
  - "F06-RESSALVAS item 'Salvar anuncio do Inicio (vindo do F02) persistir': passa a existir e a ser provado no fluxo do Início; os outros dois itens da ressalva (filtros property_details, price_cents) NAO sao deste lote."
  - "Testes: unit POST/DELETE/GET salvos (positivos; 401; CSRF 403; invisivel 404; duplicata idempotente; flag salvo na lista; delete de outrem nao apaga; 503 sem eco), molde mercado/rotas.test.ts; perguntas/dados do app para os novos clients; E2E real f06-mercado-real: salvar do detalhe -> recarrega -> ainda salvo -> aparece em /app/salvos -> dessalvar de la -> some (3 larguras stateful); stub do app (mercado-gestao ou spec novo em apps/app/tests/e2e) para o caminho Inicio→salvar→estado real. Positivo E negativo em toda permissao."
  - "Passam: gate --fast, tsc -p tests/e2e, pnpm test, test:scope, app test. TOTAL_DE_ROTAS: dois route.ts novos — recalcular CONTRA O DISCO apos rebase no estado atual da main (CIDADE-169/#243 somam antes); api-surface com as duas rotas e teste verde. E2E navegador no CI. Antes de tocar qualquer arquivo fora dos allowed_paths, EMENDAR este contrato primeiro."

