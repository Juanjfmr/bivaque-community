task_id: RUN-005

objective: >
  Todo botão da landing pública que leva a uma página navega no primeiro toque,
  mesmo antes de o JavaScript registrar o componente Material Web.

authority:
  - tools/backend-kanban card LANDING-CTA-ANTES-DO-REGISTRO
  - docs/decisions/ADR-20261024-front-react-spa.md (§4, a landing fica no Next)

