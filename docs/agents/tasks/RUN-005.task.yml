  - ler, criar ou editar arquivos .env

acceptance:
  - "O CTA Criar conta e todos os outros md-filled-button/md-*-button com href da landing (chamada final, barra fixa, folha do menu) são um <a href> real ou estão dentro de um, com foco visível e nome acessível; navegam sem JavaScript."
  - "E2E com JavaScript desligado (javaScriptEnabled false) toca cada CTA e chega ao destino em 375/768/1440."
  - "landing-v8.spec.ts deixa de esperar o registro do elemento antes de clicar e continua verde."
  - "Capturas 375/768/1440 nos dois temas sem mudança visual perceptível nos botões, em .visual/run-005/."
  - "Card atualizado com a prova e o commit; status done só com tudo acima verde."

proof:
