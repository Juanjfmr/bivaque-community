# F04 — denuncia de pergunta e de resposta pelo app.
#
# LANCAMENTO.md:57 exige denuncia e conduta na linha F04; conduta ja existe
# (Conduta.tsx), falta o menu de denuncia na pergunta. O mecanismo de denuncia JA
# existe e cobre recommendation_request/reply no banco: tabela reports
# (20260802001600), enum estendido (20260821000031), auto-denuncia bloqueada
# (20260821000032), is_deleted (20260821000033), RPC de resolucao do operador
# (20260821000034), destino do aviso report_resolved -> /app/pergunta/{id}. Tudo
# com pgTAP (reports-unified-targets.sql). SEM migration — trabalho de camada de
# aplicacao sobre mecanismo provado. Molde exato: denuncia de publicacao de grupo
# (grupos/publicacoes/[id]/denuncia + AcoesDaPublicacao.tsx).
#
# Uma rota com respostaId OPCIONAL cobre pedido E resposta (a web antiga tem os
# dois, indication-detail.tsx:493-498,588-593; a troca exige paridade). Precedente
# do campo opcional: rota resolucao. Escopo SO pergunta+resposta (nao anuncio/
# mensagem/outros alvos). Sem bloquear-apos-denunciar (molde do app de grupos nao
# oferece; o bloqueio ja existe em Voce -> Pessoas bloqueadas).
#
# Tambem perguntar a cidade e gap SEPARADO, grande, R3 (migration de origem +
# compositor + vinculo post-request) — NAO construir aqui; deferido com card proprio.

