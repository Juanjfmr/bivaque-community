#   ARQUIVO DA MIGRATION: o timestamp 20261023110200 foi escolhido, não gerado —
#   o relógio da máquina está em 22/10 e supabase migration new criaria um nome
#   que ordena ANTES de 20261023110000/20261023110100, desta mesma frente. A
#   função só depende de objetos de agosto, então a ordem é segura nos dois casos.
#   PROVA (unit): tests/unit/profile/interests-require-verification.test.ts 12/12 —
#   sem verificação e sem familiar a lista nem é consultada (null, pending,
