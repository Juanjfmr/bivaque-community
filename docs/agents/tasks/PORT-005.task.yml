# ── Segunda correção do coordenador (desenho definido em 23/10/2026) ──────────
# Duas regressões que a correção anterior deixou.
#
# P2 FAMILIAR ADMITIDO PERDIA OS INTERESSES (app/(shell)/profile/interests-actions.ts)
#   A guarda exigia read_verification_status verified da PRÓPRIA pessoa. O
#   dependente admitido por convite familiar tem vínculo e membership, mas não
#   tem verificação própria (D16: o convite é a única porta sem CPF) — e passou a
#   ser recusado. Corrigido.
#   PROCURA PELA REGRA QUE JÁ DECIDE A ADMISSÃO: não existe. As candidatas foram
#   lidas e nenhuma cobre o familiar:
#     private.is_locality_member / private.is_active_locality_member -> só o
#       vínculo, sem verificação;
#     private.is_verified_locality_member -> titular verificado com vínculo, sem
#       família;
#     private.is_verified_holder / public.is_verified_holder -> só a verificação
#       própria;
#     private.has_accepted_family(a, b) -> exige os dois ids, não responde se a
#       pessoa tem titular verificado, e vive no schema private.
#   DESVIO REGISTRADO, E POR QUÊ: o desenho previa, como alternativa, ler
#   family_account_links pelo cliente de serviço. Não é possível em runtime:
#   supabase/config.toml expõe só public e graphql_public ao Data API, então um
#   `.from` em family_account_links pelo service client responde erro de schema — e
#   ler esse erro como não é familiar é exatamente o defeito silencioso que a
#   cidade de destino teve nesta frente. Expor o schema private está fora de
#   questão (invariante de privacidade). A regra foi então para o SQL, como o
#   primeiro parágrafo do desenho prefere: migration 20261023110200 cria
#   public.has_verified_family_holder(p_user_id uuid), security definer,
#   service_role apenas, que reusa private.is_verified_holder para o titular e
#   lê private.family_account_links para o vínculo ATIVO. Nada de regra nova em
#   TypeScript: a action só pergunta ao banco.
#   A guarda passou a ser: verified (condição mais estreita que já existia para
#   o titular) OU has_verified_family_holder; a segunda leitura só acontece para
#   quem não é verificado; erro de leitura em qualquer uma das duas fecha a porta
#   (não conseguir conferir não é não ter vínculo). A cidade continua vindo só do
#   vínculo corrente (`kind = current`).
#   TIPOS: supabase/database.generated.ts ganhou a entrada da função nova à mão,
#   no formato que o gerador emite (uma linha por chave, alfabético). NÃO rodei
#   generate:types porque exige o stack local e o coordenador pediu para não
