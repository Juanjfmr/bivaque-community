  - tests/privacy/product-boundaries-and-pii.test.ts
  - apps/app/src/telas/
  - apps/app/src/casca/
  - apps/app/lib/navegacao/entrada.ts
  - apps/app/tests/e2e/jornadas-reais.spec.ts
  - apps/app/tests/dados-demo.test.ts
