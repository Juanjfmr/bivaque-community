forbidden:
  - instalar ou atualizar dependências; API, banco, autenticação real ou credenciais
  - reverter a V1 ou enfraquecer a bateria antiga para esconder regressão
  - alegar ondas 2 a 8 completas, aceite visual ou segurança do banco por este reparo
  - merge, push, deploy, force-push ou env.local
acceptance:
  - Varredura preserva fontes, exclusões e resultados, reduz custo de filesystem e mantém o timeout original, com revisão independente
  - Leituras aguardadas em lotes de até 32 preservam ordem e propagam erro; paridade cobre hits reais, links, conclusão fora de ordem e EACCES
  - Resposta não vazia entra na lista da pergunta em memória, mantém entradas repetidas distintas e só então limpa o campo
  - Paleta usa o histórico único; Voltar fecha antes de sair, escolha não deixa camada fantasma e diálogo mantém foco contido e devolvido
  - Sete detalhes diferenciam carga pendente de registro não encontrado e oferecem retorno ao Início
  - Casos reais usam Playwright sem o fixture que ativa TelaDeProva e correm em 375, 768 e 1440
  - Comparação de imagens mantém igualdade byte a byte usando Buffer.equals, sem aumentar timeout nem remover casos
  - Captura valida títulos normais contra referência e contrato explícito, identidade de conteúdo, ausência do andaime e carregamento terminado; evidência antiga não vira aceite
  - Instrumentos recebem revisão focal de outro modelo; coluna provas compartilhada não é citada como prova individual de cada componente
  - Gate completo e regressão completos lidos e classificados antes do commit local; restante funcional e visual explicitamente pendente
proof:
  - npx pnpm@11.18.0 --filter @bivaque/app test
  - npx pnpm@11.18.0 --filter @bivaque/app test:e2e
  - node --test tests/scope/app-instrumentos.test.mjs
  - node scripts/app/capturar.mjs
  - npx pnpm@11.18.0 gate
risk: histórico, resposta local, indisponível e instrumento de runtime
risk_level: R2
adr: docs/decisions/ADR-20261024-front-react-spa.md
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: HUMAN_DECISION
closure:
  requires_runtime_evidence: true
