task_id: APP-007
objective: A V1 permite responder sem perder texto, fechar a paleta por Voltar e sair do carregamento de registros inexistentes, com provas no modo normal.
authority:
  - Decisão direta do dono em 26/10/2026, Então corrija, autorizando correção focal da varredura e nova prova global
  - Decisão direta do dono em 26/10/2026, Segue você agora, após a revisão da V1
  - docs/decisions/ADR-20261024-front-react-spa.md
  - docs/agents/prototipo-shadcn/STATUS.md
