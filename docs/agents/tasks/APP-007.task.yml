  status: FAIL-EVIDENCED
  evidence: APP-ONDAS-runtime-Codex.json reproduz os três defeitos; APP-REAL-C1-vermelho-mobile.log tem 2 falhas e APP-REAL-C1-vermelho-desktop.log tem 1 falha no navegador.
