# CIDADE-169 — consulta de cidade no app (C1) + diluicao do /localidade na mesma tela (C2).
#
# O LANCAMENTO nao nomeia ver outra cidade como linha de jornada, mas o ADR
# 20260925-consulta-outra-cidade (R3 ACEITO pelo dono em 25/09; tabela via
# migration 20260925161111; pgTAP consulta-outra-cidade.sql com 19 assercoes)
# aprovou a leitura. Criterio 6 da fase 6 manda trocar /cidade/[id] e
# /localidade; redirect sem destino mataria produto aprovado — o destino ja
# existe no app (detalhes de evento/verbete/anuncio ja suportam visitante). A
# transferencia de cidade NAO e daqui — e do F10-TROCA-PERFIL-PROPRIO (pills e
# declare_locality_transfer vao la). Sem migration nenhuma: so porta + tela.
#
# C1: GET /api/app/cidade/[id] (id do catalogo localities OU o literal atual
# = cidade do vinculo current da sessao) devolvendo o agregado do city-consult
# web: cidade, guia aprovado (8), encontros de alcance cidade (5), desapegos e
# imoveis ativos de alcance cidade (8+8), SEM comunidades/perguntas/vitrine.
# Tela /app/cidade/$id reusa os detalhes existentes (visita ja funciona).
# C2: /localidade cai na mesma tela com a cidade propria (atual); vitrine de
# prestadores nao e linha nenhuma — aposentar so com prova de entrada viva
# restante (ver acceptance).

