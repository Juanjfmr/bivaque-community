acceptance:
  - "GET /api/app/cidade/[id] no contrato ADR do app §5: exigirSessao; id do catalogo OU literal atual (cidade do vinculo current da SESSAO — nunca nome/parametro externo); formato invalido ou cidade fora do catalogo -> 404; bundle lido sob as permissoes existentes (guia aprovado, encontros publicos/town, desapegos e imoveis ativos de alcance cidade conforme a regra de leitura aprovada em 25/09; o web city-consult.tsx:55 le exatamente os mesmos dados por ela); sem service_role; 503 sem eco. A rota cita nos comentarios os arquivos do web portados e a decisao do ADR."
  - "App: rota cidade no catalogo (path /cidade/$id, origem, sem pai de aba) + entrada de painel; tela CidadeConsulta reusando pecas reais de lista (linhas do guia/evento/mercado) com links aos detalhes existentes (que abrem em visita); CTA 'Vou me mudar para cá' aponta /profile?mudar=<id>#cidade ENQUANTO a transferencia nao pousar (F10) — registrar no RELATORIO; painel de cidade: escolher cidade real abre /app/cidade/<id> via catalogo (/api/localities/[uf] ja consumido na entrada — se o picker atual so rotulo nao der id, estender o minimo); a cidade do membro abre via atual. A consulta NAO muda a cidade da sessao em lugar nenhum."
  - "Troca: 307 /cidade/:id -> /app/cidade/:id e /localidade -> /app/cidade/atual (ou /app/cidade se o catalogo preferir path sem id — decidir e manter TROCADAS coerente). Query preservada; prova de ausencia das duas pastas; negativas de prefixo. Remover (shell)/cidade e (shell)/localidade; depois remover em (shell)/inicio SOMENTE o que ficar sem importador vivo (grep antes de cada arquivo; city-consult levava hub-loaders/market-strip/week-events/questions-guide; page.tsx do inicio ja esta atras de 307 — sair se o ultimo importador morrer). city-reference.tsx/search_providers: verificar entradas vivas de /localidade e do proprio componente em todo apps/web; sem entrada viva, aposentar e registrar provider-vitrine.spec.ts (migra para a entrada viva restante; se nao existir NENHUMA, NAO matar a prova — BLOCKED parcial no RELATORIO para decisao do coordenador/card F07)."
  - "Pins: cidade-consulta.test.ts migra para as fontes do app mantendo as tres intencoes; transfer-switch/locality-tabs-keyboard: o que provava pills outbound/teclado do /localidade vira prova da tela nova sem pills (a transferencia morre no F10 — registrar no card la); rail-unico hrefs /localidade -> /app/cidade; link-crawl apaga as portas :101-103 e :218-221; capture.mjs atualizado."
  - "Testes novos: unit da rota (atual; id do catalogo; id fora 404; formato invalido 404; bundle SEM comunidades/perguntas; visitante conforme a regra; CSRF nao se aplica a GET; 503 sem eco), app dados + e2e stub do painel->consulta, E2E real (membro abre a consulta da propria cidade e de outra cidade; blocos linkam detalhes que abrem em visita; 375/768/1440 claro). TOTAL_DE_ROTAS 93->94 (um route.ts novo); api-surface com marcador e teste verde."
  - "Passam: gate --fast, tsc -p tests/e2e, pnpm test, test:scope, app test. E2E navegador no CI. Antes de tocar qualquer arquivo fora dos allowed_paths, EMENDAR este contrato primeiro (licao paga 15/11)."

