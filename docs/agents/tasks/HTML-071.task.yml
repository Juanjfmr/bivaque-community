  - prototypes/bivaque-html/docs/
  - scripts/bivaque-html/
  - docs/agents/tasks/HTML-071.task.yml
forbidden:
  - editar src/vendor, src/styles/fonts.css, src/data/demo/assets.js, a referência HTML congelada ou a base visual
  - mudar o fluxo de cadastro, login ou convite (só a landing que leva a eles)
  - carregar qualquer recurso externo (fonte, imagem ou script)
  - fazer merge, push, deploy ou git stash
acceptance:
  - Quem saiu vê a landing v8 com o título e a linha de apoio do título F, palavra por palavra
  - Um único CTA, "Criar conta", leva à conta; "Entrar" leva ao login; nenhum "Quero fazer parte" ou amostra
  - As seções da v8 aparecem na ordem, com os textos da maquete; o rodapé só tem links com destino real
  - No celular, menu em folha (Esc fecha e devolve o foco) e barra fixa de "Criar conta" depois do topo
  - Nos dois temas, texto com no mínimo 4,5:1 e CTA em Brasa; nenhuma requisição externa
  - As provas antigas que afirmavam a landing da R53 passam a afirmar a v8 e continuam verdes
