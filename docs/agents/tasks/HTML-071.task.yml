task_id: HTML-071
objective: >
  Rodada 71: a landing pública passa a ser a v8 aprovada (.visual/bivaque-html-landing-v3/v8/maquete-v8.html)
  com o título F ("Juntos somos mais fortes."), na pele da marca da R70 e nos temas claro e escuro. Sai a
  landing da R53 (título "Muda a cidade. Fica a sua rede.", dois CTAs e a amostra por cidade). Um único
  CTA, "Criar conta", leva ao cadastro; "Entrar" leva ao login; o convite de familiar continua dentro do
  cadastro. As imagens já estão em ASSETS (commit 4d45ceda).
authority:
  - Decisão do dono em 2026-10-18 (maquete v8 e título F, docs/agents/HANDOFF-COORDENACAO-2026-10-19.md)
  - docs/decisions/ADR-20261020-identidade-visual-e-tema-escuro.md
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Base 4d45ceda: a landing mostra "Muda a cidade. Fica a sua rede.", os CTAs "Quero fazer parte" e
    "Recebi um convite de familiar" e a amostra por cidade; não há seções de exemplo, recursos, mudança,
    passos, perguntas, chamada final nem barra fixa.
allowed_paths:
