# Lote B do F01 (04/11/2026): ligar a tela aprovada da entrada ao servidor real.
# Autoridade: docs/LANCAMENTO.md (F01), ADR de entrada, ADR de progresso, card
# LAN-F01 e o handoff de 04/11 (docs/agents/HANDOFF-20261104.md, seção Lote B).
task_id: RUN-001

objective: >
  A entrada do app deixa de ser demonstrativa. A tela aprovada de
  apps/app/src/previa-f01 roda em /app/entrar sobre a máquina de estados real,
  grava e retoma o rascunho pelo servidor, autentica pelo código do e-mail com as
  rotas /api/app/entry e provisiona cidade, momento, interesses, grupos, avisos e
  o combinado nas tabelas canônicas — com prova de ponta a ponta no navegador, em
  375, 768 e 1440 e nos dois temas, contra o Next servindo /app e o Supabase local
  com seed.

authority:
  - docs/LANCAMENTO.md (F01, critério 1 e 3)
  - docs/decisions/ADR-20261101-entrada-unica-por-codigo.md
  - docs/decisions/ADR-20261102-progresso-da-entrada.md
  - docs/agents/HANDOFF-20261104.md (Lote B)
  - tools/backend-kanban card LAN-F01

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    apps/app/src/previa-f01/PreviaF01.tsx ainda lê e salva o progresso em
    servidor-simulado.ts (localStorage) e só existe no servidor de desenvolvimento
    (main.tsx, import.meta.env.DEV). A rota /app/entrar usa apps/app/src/telas/Entrar.tsx,
    a tela demonstrativa anterior, e as rotas /api/app/entry (progresso, otp,
    verificação, aceite, cpf, provisionamento) não têm nenhum consumidor no app. O
    servidor já está fechado pelo SEC-008 (gate --fast, pnpm test e db:lint verdes em
    04/11); falta a tela. Os achados I-4 e I-5 da revisão de 04/11 são citados no
    handoff, mas o texto deles não está no repositório.

