forbidden:
  - editar migration já aplicada (criar migration nova)
  - aceitar cidade, momento ou data sem validação do servidor e do catálogo
  - gravar CPF, payload do Portal ou dado pessoal em rascunho, log ou URL
  - deixar o caminho de produção lendo localStorage para decidir etapa
  - mexer em apps/prototipo, apps/mobile ou produção/Vercel
  - redesenhar telas aprovadas sem a revisão às cegas do lote
  - fechar o lote sem o texto dos achados I-4 e I-5 anexado ao card
  - empurrar trabalho novo para ds/lancamento (o branch desta linha é o do PR 128)

acceptance:
  - /app/entrar renderiza a máquina de estados aprovada (PreviaF01) e cada etapa grava o rascunho pelo PUT /api/app/entry/progress; retomar em outro aparelho abre na etapa em que a pessoa parou e versão antiga volta ao início.
  - envio e verificação do código usam POST /api/app/entry/otp e /otp/verify reais, com a mensagem única de código inválido, o reenvio de 60 s e o limite de 5xx/429 tratados na tela; nada de simulador no caminho de produção.
  - cidade pelo ibge_code do catálogo, momento arriving/resident/leaving, data de chegada/saída em YYYY-MM-DD e destino obrigatório quando a pessoa está saindo; nenhum texto livre de cidade ou data inventada.
  - interesses e grupos gravados em user_group_interests, avisos em notification_preferences (e preferência de e-mail só quando ligada), e o combinado registrado com a versão do Código de Conduta; se precisar de schema novo, a emenda é feita no ADR-20261102 antes da migration.
  - CPF vai no corpo do POST /api/app/entry/cpf, aceite é exigido antes, a resposta não traz motivo técnico e o valor não aparece em log, URL ou armazenamento local; documento e revisão seguem o caminho existente.
  - servidor-simulado.ts sai do caminho de produção (fica só na prévia DEV ou é removido) e nenhum estado local decide a etapa em produção.
  - harness de E2E no Playwright da raiz, contra o Next servindo /app e o Supabase local com seed: 375, 768 e 1440, claro e escuro, conta nova e conta existente, com capturas em .visual/.
  - os achados I-4 e I-5 da revisão de 04/11 ficam fechados, com o texto do achado anexado ao card e a correção provada.
  - revisão independente por outro modelo e, por tocar modelo de dados, parecer do security-auditor antes de marcar o LAN-F01 como done.

