  - npx pnpm@11.18.0 test
  - node scripts/agents/prova-fila.mjs -- npx pnpm@11.18.0 exec supabase db reset --local --no-seed
  - node scripts/agents/prova-fila.mjs -- npx pnpm@11.18.0 test:db
  - node scripts/agents/prova-fila.mjs -- npx pnpm@11.18.0 exec supabase db reset --local
  - node scripts/agents/prova-fila.mjs -- npx playwright test tests/e2e/f01-entrada-real.spec.ts --project mobile-375 --project tablet-768 --project desktop-1440
  - capturas dos três tamanhos e dois temas em .visual/ (não versionadas)

