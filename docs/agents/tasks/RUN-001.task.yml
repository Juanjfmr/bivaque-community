# entraram no main. O passo `Check generated types drift` da CI é determinístico e
# roda ANTES de banco, pgTAP e E2E — então tudo depois dele é pulado, e todo PR do
# repositório herda o vermelho. Não é falha de nenhum PR em particular: é do main.

task_id: RUN-001

objective: >
