  de fato no schema public, de modo que `pnpm generate:types` seguido de
  `git diff --exit-code` não produza saída — e a CI passe do passo de drift para os
  passos de banco e de E2E, que hoje nem chegam a executar.

authority:
  - AGENTS.md §Supabase — tipos do cliente, somente o schema public
  - .github/workflows/pull-request-ci.yml §Check generated types drift
  - execução da CI 32741062495 (job 97475371836)

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Run 32741062495, job 97475371836, passo 14 "Check generated types drift", 24/08
    14:53Z, head f946b935 (PR do dependabot, base main). O passo saiu com exit code 1
    e imprimiu o diff do gerador. Duas entradas defasadas: complete_event ganhou
