  - a entrada de complete_event traz p_caller_user_id além de p_event_id
  - a entrada de decide_verification_document traz p_operator_user_id além dos três argumentos antigos
  - o arquivo cobre apenas o schema public, como o script de geração já determina
  - o diff da tarefa toca um arquivo só, e é saída literal do gerador

proof:
