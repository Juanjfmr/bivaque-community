acceptance:
  - "Rotas no apps/web com exigirSessao/conferirEscrita/opcoesDoApp de lib/app-api e o cliente Supabase DA SESSÃO: GET /api/app/negocios (categorias e lista da cidade da sessão), GET /api/app/negocios/[id], POST /api/app/negocios/[id]/pedidos, GET /api/app/pedidos e GET /api/app/pedidos/[id] (só os do próprio membro). Validação no mesmo módulo de apps/web/lib que a tela antiga usa (extrair se precisar)."
  - "Cada rota com teste de unidade positivo e negativo: sem sessão 401, origem/cabeçalho errado 403, inexistente ou fora do alcance 404, corpo inválido 400, erro do banco 503 (nunca lista vazia), sem eco da mensagem do Postgres."
  - "Módulo apps/app/lib/dados/negocios.ts usa o cliente único (sem editá-lo), com AbortSignal; as telas trocam dadosDoApp pelo módulo: carregando, vazio honesto, erro com Tentar de novo, escrita mostra o resultado gravado e volta ao estado anterior com mensagem se falhar."
  - "E2E tests/e2e/f07-negocios-real.spec.ts contra o banco local com seed em 375/768/1440: caminho principal, gravação que sobrevive ao recarregar, negação de acesso e falha principal. Se o banco local não subir, registrar o comando exato no relatório e entregar com unidade + app."
  - "Teste de escopo: as telas da jornada não importam mais dadosDoApp; as rotas não usam clienteDeServicoOuNulo."
  - "Relatório curto em .visual/run-010/relatorio.md: o que entrou, commits, números das provas e o que não rodou (o coordenador leva ao card LAN-F07)."

