# Evidencia (23/10/2026, branch codex/lote5-pergunta, executor DeepSeek V4.1 Flash)
# Correcao da revisao independente (Codex, achados 1 a 5). O que a revisao pediu e onde ficou:
#   1. excluir a resposta que e a resolucao ATUAL reabre a pergunta. Gatilho do banco
#      (private.reopen_request_on_resolved_reply_delete, before delete em recommendation_replies, security
#      definer), com os mesmos campos que reopen_recommendation limpa. A ultima resolucao cai junto com a
#      resposta excluida (FK on delete set null): nao ha o que preservar quando a resposta deixa de existir.
#      pgTAP do caso (secao 8 do community-question-cycle).
#   2. a marca de edicao e do banco: o gatilho de edited_at SEMPRE recalcula (pergunta e resposta), e o update
#      da autoria desceu para as colunas de conteudo, entao um PATCH que tente zerar edited_at e recusado por
#      permissao. pgTAP do PATCH que tenta zerar edited_at.
#   3. o update da autoria so alcanca conteudo (title/body na pergunta, body na resposta); a resolucao so muda
#      pelas RPCs SECURITY DEFINER. resolution.ts, indication-detail.tsx e profile-indications.tsx leem o
#      ESTADO DA PERGUNTA, nao so o ponteiro; list_indications devolve resolved_reply_body so com is_resolved.
#      pgTAP negativo do PATCH direto nas colunas de resolucao (42501).
#   4. o e2e usa o viewport do projeto (testInfo.project.use.viewport); exclui a pergunta COM resposta e confere
#      por REST, na sessao de quem escreveu a resposta, que a resposta sumiu (positivo antes, negativo depois).
#      A captura mede o conteiner que rola (main do shell no Next, #main no prototipo) e compara estados iguais,
#      em dois estados: aberta e resolvida.
#   5. o rotulo do salvar virou Seguir respostas / Seguindo respostas (ADR-20261023, secao 2); recon-032 atualizado.
# migration: supabase/migrations/20261024110000_lote5_pergunta.sql
#   CHECK do titulo 8..300 (valida, sem not valid: producao nao tem uso real)
#   edited_at em recommendation_requests e recommendation_replies, com gatilho que sempre recalcula
#   last_resolved_reply_id (FK on delete set null) + gatilho validando os dois ponteiros na mesma pergunta
#   mark_recommendation_reply_resolved grava atual e ultima; mark_recommendation_resolved e a resolvida sem resposta
#   reopen_recommendation esvazia a atual e mantem a ultima
#   excluir a resposta que resolveu reabre a pergunta (gatilho novo)
#   grant update da autoria restrito a title/body (pergunta) e body (resposta)
#   list_indications ganha p_mine e, no Para ajudar, sem resposta primeiro; resolved_reply_body so com is_resolved
#   list_question_replies e a leitura da conversa: a resposta removida volta como aviso, sem texto e sem autor
# pgTAP: supabase/tests/community-question-cycle.sql, 59 asserts (59/59 no test:db)
#   supabase/tests/recommendation-resolved-reply.sql: o PATCH direto na resolucao passou a exigir 42501 (a
