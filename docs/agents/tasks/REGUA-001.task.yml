  - "Mobbin, Nextdoor web, Chats com conversa aberta (duas colunas: lista com abas All/DMs/For Sale, conversa com cabeçalho nome+bairro, menu ⋯, compositor em pílula com envio redondo): https://mobbin.com/screens/fd834924-6a02-4fa0-a5e7-1c3d20f9c549"
  - "Mobbin, Nextdoor web, Chats sem conversa aberta (lista à esquerda, ilustração + 'Send a message' à direita): https://mobbin.com/screens/ecb9d604-1ecb-4f55-b45a-8c9d4efec815"
