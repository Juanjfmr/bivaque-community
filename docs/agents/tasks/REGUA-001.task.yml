forbidden:
  - tocar em Voce.tsx, PerfilDeMembro.tsx, Bloqueados.tsx ou Salvos.tsx (são do lote REGUA-002)
  - mudar rotas de API, banco, migrations ou contratos de dados
  - mudar a navegação (Início · Comunidade · Criar · Mercado · Você, Conversas no topo)
  - inventar dado de demonstração novo fora dos ajudantes de teste existentes
  - afrouxar ou apagar teste existente para ficar verde
acceptance:
  - em 1440 e 768 a rota de Conversas mostra lista e conversa lado a lado; sem conversa aberta, o lado direito tem ilustração e uma ação de saída; em 375 continua lista → conversa
  - nenhuma tela deste lote passa de uma largura de leitura definida (sem linhas ou campos de ~1290 px em 1440)
  - o "+" (FAB) não sobrepõe nenhum controle em 375/768/1440; o conteúdo rola acima dele e da barra de baixo; "Gravar preferências" fica visível numa barra fixa no rodapé
  - títulos dos avisos e respostas rápidas quebram linha (até 2) em vez de cortar o objeto da frase
  - o título da tela aparece uma vez só; o nome do interlocutor aparece uma vez só na conversa
  - a navegação lateral marca a seção dona da rota (Salvos e perfil de membro não marcam Início)
  - a variante brasa só é usada pelo Criar (FAB e Criar da barra); concluir usa ardósia; o teste apps/app/tests/brasa-so-no-criar.test.ts varre src e components e falha em qualquer outro uso; textos de pecas e galeria dizem a regra do ADR
  - envio que falhou aparece como balão da própria mensagem marcado "Não enviada" com ação "Tentar de novo"; o texto não se perde
  - contexto da conversa mostra o título do item (anúncio, pedido ou evento) quando a API o fornece, sem o rótulo "Contexto da conversa"
  - menu ⋯ da conversa em 375/768 abre como folha de baixo com alça; denúncia em 375 abre como folha e cita a mensagem denunciada; rótulos dentro do campo
  - preferências usam interruptores de 44 px por canal, termo "No celular" no lugar de "Push", apoio de no máximo uma linha
  - capturas cegas regeradas em claro E escuro (375/768/1440) pela spec de capturas
