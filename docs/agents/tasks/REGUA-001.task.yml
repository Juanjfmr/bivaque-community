task_id: REGUA-001
objective: >
  Conversas e Avisos ficam no nível da régua Nextdoor em 375/768/1440: no computador a caixa e a
  conversa aparecem lado a lado (lista à esquerda, conversa ou vazio com saída à direita), nada de
  coluna solta esticada; o "+" nunca cobre conteúdo nem botão; nenhum título de aviso ou resposta
  rápida perde o sentido por corte; o título da tela não aparece duplicado na barra e no corpo; a
  navegação lateral marca a seção certa; a Brasa só aparece no Criar.
