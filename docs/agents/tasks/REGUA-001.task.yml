  - "Mobbin, Nextdoor iOS, Settings com abas Account/Notifications/Privacy: https://mobbin.com/screens/f187554e-5407-47cd-b1a9-9f80aa3200aa"
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Revisão às cegas de 18/11 sobre as capturas de apps/app/tests/e2e/cegas/capturas-f09-f10.spec.ts
    (head edca972e, #295), registrada no cartão LAN-F09. Defeitos a corrigir neste lote:
    (1) 768 Avisos preferências: o "+" cobre o seletor "Semanal" e "Gravar preferências" fica sob a
    barra de baixo; (2) 375 Avisos lista: títulos terminam em reticências e perdem o objeto; 375
    Conversa: chip de resposta rápida cortado na borda; (3) 1440 em todas as telas: coluna solta de
    ~1290 px; Conversas sem lista+conversa; (4) 1440: título duplicado na barra e no corpo
    ("Conversas", "Avisos"); nome do interlocutor duplicado na barra e no cabeçalho da conversa;
    (5) navegação lateral marca "Início" em telas fora da Início (Salvos, perfil de membro);
    (6) Brasa em "Enviar", "Enviar denúncia", "Tentar de novo"; (7) envio que falhou é só uma linha
    vermelha sob o campo, sem a mensagem como balão "Não enviada · Tentar de novo"; (8) caixa vazia
    sem saída; (9) contexto da conversa diz só "Anúncio" sem título do item; (10) menu ⋯ da conversa
    com uma opção suspensa no celular em vez de folha; (11) preferências: caixas de 18 px em dois
    níveis, a palavra "Push", apoio de 3 linhas e botão de gravar sem barra fixa.
