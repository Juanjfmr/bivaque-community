task_id: RECON-030

objective: >
  O artigo do Guia passa a ser o da prancha 25 - subtitulo, imagem de capa, corpo em secoes com
  indice lateral, a origem ligando a conversa que gerou a referencia, e a sugestao de correcao
  que chega a curadoria, e decidida e volta ao solicitante.

authority:
  - docs/design/visual-guide-2026-09-06/74-web-guia-curadoria.png
  - docs/agents/PRANCHAS-WEB-RESTANTES.md secao 74-web-guia-curadoria
  - docs/design/visual-guide-2026-09-06/25-web-guia-referencia.png
  - docs/agents/PRANCHAS-WEB-RESTANTES.md secao 25-web-guia-referencia
