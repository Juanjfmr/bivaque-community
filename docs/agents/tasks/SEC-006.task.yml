task_id: SEC-006
objective: >
  Nenhuma imagem de usuario chega ao Storage sem passar pela limpeza do servidor. O envio do Mercado
  (novo anuncio e editar foto) deixa de gravar direto do navegador e passa por action no servidor com a
  mesma limpeza da SEC-004; as policies de Storage que permitem INSERT ou UPDATE pelo papel authenticated
  nos buckets de imagem de usuario sao removidas, e a escrita fica so com as actions (service role com
  autorizacao reconferida).
authority:
  - docs/decisions/ADR-20261019-correcoes-de-seguranca-pre-lancamento.md
  - docs/AUDITORIA_ADERENCIA_2026-10-19.md (secao 5, H4)
  - Decisao do coordenador em 2026-10-19 ao dividir a SEC-004 (inventario do Codex no contrato SEC-004)
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Inventario da SEC-004 - mercado/novo/page.tsx e mercado/[id]/editar/page.tsx enviam direto do navegador
    para listing-photos; Storage permite INSERT authenticated em avatars, event-photos, listing-photos,
    community-images, provider-photos e service-request-photos, e UPDATE em avatars, event-photos,
    community-images e service-request-photos. Escrever primeiro o pgTAP em que authenticated grava direto
    num bucket de imagem e ver passar a escrita (falha do contrato).
allowed_paths:
  - supabase/migrations/
  - supabase/tests/
  - supabase/database.generated.ts
  - apps/web/app/
  - apps/web/lib/
  - apps/web/next.config.ts
  - tests/unit/
  - tests/e2e/
  - tests/fixtures/
  - docs/agents/tasks/SEC-006.task.yml
forbidden:
  - push direto na main, merge, deploy ou db push no banco remoto
  - commitar segredos ou arquivos .env
  - afrouxar policy ou grant existente fora do escopo desta tarefa
  - remover leitura (SELECT) dos buckets ou mudar quem pode ver as imagens
  - editar o prototipo (prototypes/bivaque-html) ou a referencia HTML congelada
acceptance:
  - pgTAP prova que authenticated NAO consegue INSERT nem UPDATE direto nos buckets de imagem de usuario e que a leitura existente continua igual
  - Mercado novo anuncio e editar foto enviam pela action do servidor, com limpeza de metadados e o mesmo limite de tamanho e formato de antes (ajustar bodySizeLimit se necessario, com justificativa)
  - Teste prova que a foto do Mercado gravada nao tem EXIF ou GPS
  - Nenhum outro caminho de upload quebra (testes existentes e E2E de foto)
  - Revisao Flash M3 - moradia (lib/listings/actions.ts), portfolio (prestador/actions.ts) e pedido (pedidos/novo/actions.ts) ainda gravam com o cliente do usuario; passam a gravar com service role depois de reconferir a mesma autorizacao que a policy exigia, antes de remover as policies
proof:
  - npx supabase db reset --local --no-seed
  - npx pnpm@11.18.0 test:db
  - npx pnpm@11.18.0 exec vitest run tests/unit/security
  - npx pnpm@11.18.0 gate
  - npx playwright test tests/e2e/photo-upload.spec.ts (no CI se nao houver seed local)
risk: coordenada do aparelho gravada em foto publica por envio direto ao Storage
risk_level: R3
adr: docs/decisions/ADR-20261019-correcoes-de-seguranca-pre-lancamento.md
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: BLOCKED
closure:
  requires_runtime_evidence: true
# Execucao SEC-006, 2026-10-19, sobre b025f440 + diff local.
# RED: supabase test db com security-image-storage.sql -> 137 arquivos, 1918 testes, FAIL.
# Falhas 1-8, 10, 12 e 43: authenticated ainda fazia INSERT/UPDATE direto em avatars, event-photos,
# listing-photos, community-images, provider-photos e service-request-photos.
# O rascunho do teste tinha plan(42) para 43 casos e misturava set_config com a funcao de teste;
# cada caso virou instrucao propria. O visitante de outra cidade passou a provar a leitura de
# listing-photos ativa que o ADR de consulta a outra cidade garante, em vez de exigir negacao.
# GREEN: npx pnpm@11.18.0 test:db -> 137 arquivos, 1923 testes, PASS; security-image-storage.sql ok.
# Unidade: npx pnpm@11.18.0 exec vitest run tests/unit/security -> 12 arquivos, 201 testes PASS.
# Gate: npx pnpm@11.18.0 gate -> exit 0; lint, typecheck, test e secrets PASS; build PULADO sem .env.local.
# MORADIA, PORTFOLIO e PEDIDO gravam com service_role depois de reconferir a autorizacao:
# listings.owner_user_id, can_manage_provider_profile(provider_id) e service_requests.requester_user_id.
# MERCADO (novo e editar) envia por uploadListingPhotoAction; formatos JPEG/PNG/WebP e limite de 10 MB
# preservados; bodySizeLimit 12mb justificado por uma foto de 10 MB por chamada mais multipart.
# Teste de unidade prova bytes gravados sem EXIF, GPS, XMP ou orientacao nos tres formatos.
# Upload com service_role deixa owner nulo (conferido na API local do Storage); por isso as remocoes
# de foto de anuncio e portfolio tambem passaram ao servidor, reconferindo posse e prefixo de pasta,
# sem alterar as policies de DELETE.
# Policies removidas (INSERT): avatars_insert_own_folder, event_photos_insert_self,
# listing_photos_storage_insert_owner, community_images_insert_owner, provider_photos_insert_owner,
# service_request_photos_storage_insert_owner.
# Policies removidas (UPDATE): avatars_update_own, event_photos_update_own,
# community_images_update_owner, service_request_photos_storage_update_owner.
# SELECT e DELETE preservados; verification-documents nao foi tocado.
# pgTAP existentes ajustados ao contrato novo: community-images, event-photos-storage, listings-moradia,
# provider-member-business, provider-showcase-scope e rls-or-column-regression.
# BLOQUEIO REAL: db reset --local --no-seed recusado pelo guard-rail de permissao nesta execucao
# nao interativa. A migration nova foi aplicada com supabase migration up --local e test:db passou
# nesse estado; o replay limpo a partir de banco vazio fica pendente de uma sessao com aprovacao.
# E2E foto-upload nao rodou: sem seed local e sem apps/web/.env.local.
# Sem .env.local, instalacao, push, PR, merge, deploy ou db push remoto; nenhuma migration antiga editada.
# Revisao independente e runtime de entrega continuam pendentes.

