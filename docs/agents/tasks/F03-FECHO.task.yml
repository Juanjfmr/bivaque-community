  - npx pnpm@11.18.0 gate --fast
  - npx pnpm@11.18.0 test
  - npx pnpm@11.18.0 --filter @bivaque/app test -- --run
  - node scripts/agents/task-contract.mjs docs/agents/tasks/F03-FECHO.task.yml

