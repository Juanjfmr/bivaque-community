  - tests/e2e/f03-evento-grupo-real.spec.ts
  - .visual/f03-fecho

forbidden:
  - tocar supabase/ (migration, seed, pgTAP); a cidade sai de dado já legível pelo membro sob RLS
  - service_role nas rotas de grupo; mudar campos existentes das respostas (só acrescentar `cidade`)
  - passo de revisão na publicação em grupo; guardar foto no sessionStorage do grupo
  - redesenhar telas além do pedido; mexer em telas antigas do apps/web (saem no F04)
  - apagar teste sem nome e motivo no RELATORIO; skip/fixme novo; afrouxar asserção
  - credencial inline ou leitura de arquivo de ambiente pelo spec; dado pessoal real
  - push, merge, force-push, editar o quadro (tools/backend-kanban), tocar outra worktree
  - supabase start/reset ou escrita em banco (o coordenador roda as provas de banco e E2E real)

acceptance:
  - "Evento: o formulário guarda rascunho na sessão da aba (chave por cidade, no molde de apps/app/src/criar/rascunho.ts), automático e com botão 'Salvar rascunho'; reabrir o Criar encontro restaura o texto; publicar com sucesso apaga o rascunho. O botão principal leva a um passo de revisão (título, data e hora por extenso, local) com 'Editar' e 'Criar encontro'; só o segundo grava. Falha mantém os campos e volta à edição, com a frase de mensagemDaFalha (sessão vencida tem frase própria)."
  - "Desapego: o campo de preço vira type='text' com inputMode='decimal' e aceita '650', '650,00' e '650.5'; precoBRL formata '12,50' como 'R$ 12,50'; valor inválido mostra erro no campo. A ajuda continua dizendo o que o campo aceita."
  - "Cidade: GET /api/app/grupos/[id] e GET /api/app/grupos/publicacoes/[id] acrescentam `cidade` (nome da localidade do grupo, lido com o mesmo cliente do usuário que a rota já usa). Grupo.tsx e Publicacao.tsx mostram essa cidade no cabeçalho; casca.cidade só como reserva enquanto carrega. Teste de unidade da rota com caso positivo (cidade presente) e negativo (sem sessão 401, campos antigos intactos)."
  - "Grupo: uma única regra de foco — o foco de chegada (useRolagemEFoco) não disputa com o foco da publicação recém-criada: depois de publicar o foco vai para a publicação nova e a rolagem não salta para o topo; quando a publicação não está na página carregada, o anúncio diz isso e o foco fica no botão que abriu a folha. Teste no app (vitest de lógica ou E2E simulado em grupos-publicar.spec.ts)."
  - "E2E real (@stateful, tests/e2e/f03-evento-grupo-real.spec.ts, nos projetos 375/768/1440): membro semeado cria um encontro pelo Criar passando pela revisão e cai no detalhe com o título gravado; membro publica no grupo com uma foto (fixture de imagem do repositório) e a publicação aparece na lista com a foto depois de recarregar; sem sessão, POST de evento e de publicação respondem 401."
  - "E2E do app simulado: rascunho e revisão do evento (restaura ao reabrir; revisão não grava; Criar grava), e preço com vírgula até a revisão mostrando 'R$ 650,00', nos projetos 375/768/1440 da config do app."
  - "RELATORIO em .visual/f03-fecho/RELATORIO.md: arquivos tocados, testes novos e removidos com motivo, comandos rodados com resultado lido, e o que não rodou."

