# F03-FECHO — fecha o LAN-F03 (Criar) pelos critérios de pronto (docs/LANCAMENTO.md :34-48, :56).
#
# Inventário do coordenador em 18/11 sobre origin/main 5e66cd28 (disco e git). Já está: pergunta
# (POST /api/app/perguntas) e desapego (POST /api/app/mercado) com rascunho de sessão, revisão,
# erro de sessão e destino; publicação em grupo com foto (POST .../fotos e .../publicacoes) com
# rascunho de texto e erro 401/rede; evento (POST /api/app/eventos) com erro de sessão e destino;
# /mercado/novo, /imoveis/novo, /pedidos/novo e /events/novo com 307 para o app.
#
# Decisões do coordenador (mandato 02/11), registradas aqui:
# - A publicação em grupo continua sem passo de revisão: a folha de escrever já é a prévia (régua
#   Nextdoor: publicar no grupo é direto). Rascunho do grupo guarda só o texto; fotos ficam fora
#   do sessionStorage pelo tamanho.
# - As telas antigas ainda servidas pela web nesta área (groups "Criar grupo",
#   communities/[id]/invite, communities/[id]/indicar-prestador, denuncias/nova) pertencem às
#   telas da Comunidade e saem com o F04, não aqui.
# - A porta "indicate" do menu Criar (rascunho de sessão sem publicação) fica fora: é do F07.

task_id: F03-001

adr: docs/decisions/ADR-20261024-front-react-spa.md

objective: >
  O evento ganha rascunho de sessão e passo de revisão no molde de Perguntar/Desapego; o preço do
  desapego aceita vírgula de verdade; o cabeçalho do Grupo e da Publicação mostra a cidade que vem
  do servidor, não a cidade da casca; o Grupo tem uma única regra de foco e rolagem estável depois
  de publicar; e criar evento e publicar no grupo com foto ganham E2E contra o servidor real.

authority:
  - docs/LANCAMENTO.md :34-48 e :56 (linha F03 — rascunho, revisão e erro)
  - Card LAN-F03
  - Card CORRETA-F03-RESSALVAS (itens 1, 2 e 3)
  - Card F03-RESIDUOS-REVISAO (itens 1 e 2)
  - ADR-20261024-front-react-spa.md §5 (contrato da API) e §8

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    apps/app/src/eventos/FormularioDeEncontro.tsx:48-58 guarda o estado só em memória e o botão
    Criar grava direto (sem rascunho nem revisão). apps/app/src/criar/Desapego.tsx:189-190 tem
    ajuda "650 ou 650,00" num campo type="number" (o navegador recusa a vírgula) e
    apps/app/src/criar/formularios.ts:231-234 (precoBRL) usa Number(), que mostra "R$ —" para
    "12,50". apps/app/src/telas/Grupo.tsx:243-246 e Publicacao.tsx:230 usam casca.cidade; as
    rotas apps/web/app/api/app/grupos/[id] e grupos/publicacoes/[id] não devolvem a cidade.
    Grupo.tsx:104 (useRolagemEFoco) e :105-115 (foco próprio) são duas regras de foco na mesma
    tela. Não há E2E real de criar evento nem de publicar no grupo com foto.

