# F10: /salvos sai da web; Salvos fica no app, com busca e remover para todo tipo.
#
# Autoridade: docs/LANCAMENTO.md fase 6 e linha F10. Levantamento de 17/11
# (.work/orq/relatorios/escopo-trocas.md, seção 2, a parte de /salvos: itens 2.3.6 a 2.3.9,
# 2.4, 2.5 e 2.6). Vem depois do RUN-184 (#274), que tirou /configuracoes da mesma casca.
#
# Decisões do coordenador, 17/11, por delegação:
# - Buscar nos salvos (2.3.7): construir no app, filtrando o que a tela já carregou.
# - Remover de todo tipo (2.3.8): construir o gesto de dessalvar guia, pergunta e publicação na
#   tela Salvos do app, pelas rotas de API que já existem; nada de rota nova.
# - Abas por tipo e ?aba= (2.3.6): divergência registrada. O app organiza por seções (desenho
#   aprovado); o redirect antigo /recommendations?aba=saved passa a levar a /app/salvos puro.
# - Item indisponível (2.3.9): divergência registrada. As seções do app só listam o que a API
#   devolve; quem perdeu acesso a um conteúdo simplesmente não o vê mais.
# - O módulo saved-items.ts morre com a tela; o href de indicação que ele gerava não tem mais
#   consumidor. O teste de portas das indicações deixa de citá-lo.

