acceptance:
  - "next.config.ts: /salvos redireciona (307) para /app/salvos, query preservada, sem ciclo; lan-troca-redirect acrescenta a rota em TROCADAS e prova a ausência da pasta (shell)/salvos. O redirect antigo /recommendations?aba=saved (legacy-routes.ts) passa a levar a /app/salvos, com o teste de indicações ajustado."
  - "A pasta apps/web/app/(shell)/salvos e apps/web/lib/saves/saved-items.ts saem com tests/unit/saves/saved-items.test.ts; portas.test.ts deixa de citar o módulo; o relatório traz o git grep provando que nenhum import sobrou."
  - "Links vivos migrados direto para o app: lateral da casca (app-shell.tsx) e ajuda pública levam a /app/salvos; active-nav deixa de citar /salvos. Os E2E da web que usavam /salvos como página-base da casca (shell-navigation, global-search-flow, journey-pedir-servico, recon-032-messages) passam a usar outra rota viva da casca web (ex.: /community), sem perder o que provavam. recon-032-salvos migra para o app ou é removido com a cobertura equivalente apontada no app. Inventário completo (git grep da página /salvos, excluindo as rotas de API /api/app/.../salvos) no relatório, com o destino de cada ocorrência."
  - "Salvos.tsx: campo de busca que filtra por título o que as seções já carregaram (sem nova chamada), com estado vazio de busca; gesto de remover em guia, pergunta e publicação pelas rotas de dessalvar existentes, com atualização otimista que volta e avisa em caso de falha. E2E do app (salvos.spec.ts novo ou mercado-salvos.spec.ts) prova busca e remoção nas três larguras."
  - "link-crawl e capture.mjs sem sobras de /salvos; probe-tab-style e round46-proof deixam de apontar para a tela morta."
  - "ADR-20261117-f10-salvos-no-app.md registra a troca e as duas divergências (abas por tipo com ?aba=, e item indisponível) com o motivo. O relatório traz a linha pronta da RATIFICACAO.md."

