task_id: LOJA-003
objective: >
  Lado do app da sessão nativa do app de loja, como decide o ADR-20261120 (§5, §6, §7, §8, §9), sobre o
  servidor que o LOJA-002 (#317) já entregou: cofre do aparelho para o token de renovação e o fluxo
  pendente, token de acesso só em memória, cliente único com Bearer e base absoluta no nativo,
  renovação única com ciclo de vida (abrir, voltar do segundo plano, 401), sair na ordem fixa com
  limpeza local, Google e Apple pelo navegador do sistema com PKCE S256 e retorno por ouvinte
  próprio, CSP do build nativo, e o ramo Apple no entry/oauth do servidor. A web (cookie) não muda.
authority:
  - docs/decisions/ADR-20261120-sessao-nativa-do-app-de-loja.md (a fonte deste lote; §5 a §9, Provas exigidas, item App, CSP e Emulador)
  - docs/decisions/ADR-20261024-front-react-spa.md (§5 contrato de API)
  - docs/decisions/ADR-20261105-porta-de-dados-do-app.md (§1 cliente único, sem repetir escrita)
  - docs/decisions/ADR-20261118-push (ordem de sair, §2) e ADR-20261119 (CSP do /app, §2)
  - docs/agents/LOJA-SESSAO-INVENTARIO.md
  - "card LAN-LOJA em tools/backend-kanban/public/board.json (nota do LOJA-002: herdado pelo LOJA-003)"
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Em origin/main 9fc92ef6b, apps/app/lib/api/cliente.ts usa só cookie (credentials include) e não
    conhece Bearer nem renovação; não há plugin de cofre nem @capacitor/browser em apps/app/package.json;
    apps/app/scripts/preparar-nativo.mjs injeta script inline sem CSP; apps/web/app/api/app/entry/oauth/route.ts
    aceita só PROVEDOR = "google"; não existe ouvinte de bivaque://auth-callback.
