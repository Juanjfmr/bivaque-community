# ── Correcao da revisao do Codex (REPROVADO), 2026-10-22 ───────────────────────
# 4 achados corrigidos com TDD: o pgTAP que falha veio antes da migration.
# RED medido em support-tickets.sql com 50 asserts: 7 falhas.
#   not ok 24/25  authenticated ainda tinha SELECT da tabela inteira e de answered_by
#   not ok 28/29  o titular lia answered_by no proprio chamado (direto e no select *)
#   not ok 45/46  a purga deixava a resposta support_answered no outbox apos troca de e-mail
#   not ok 50     a purga do operador preservava answered_by (soft delete, sem cascade)
# O achado BAIXA 4 era do proprio teste: agora enche cinco abertos, prova a recusa do
# sexto, responde um e prova que a nova abertura passa (asserts 31-35).
#
# Correcoes:
#  20261022130516: revoke do SELECT de tabela e grant POR COLUNA sem answered_by.
#    Colunas liberadas: id, user_id, email, topic, body, status, reply, created_at,
#    answered_at. `select *` e `select answered_by` passam a falhar com 42501.
