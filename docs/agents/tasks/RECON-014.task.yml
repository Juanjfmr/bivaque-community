task_id: RECON-014

objective: >
  A superficie de publicacao passa a ser a da prancha 45: criar publicacao, escolher audiencia real, e recuperar o rascunho de quem foi interrompido.

authority:
  - docs/design/visual-guide-2026-09-06/45-web-publicacao.png
  - docs/superpowers/specs/2026-09-08-reconstrucao-visual-web-design.md secao 8 gate G1
  - docs/agents/DESIGN_SYSTEM.md secao 5, secao 9.1
  - Relatório comparativo Mobbin e autorização do responsável em 23/09/2026 para rascunho, público efotos

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    A implementação atual separa o compositor, mas o rascunho usa uma chave global
    bivaque.post-draft.v1 e é carregado antes de resolver a audiência e a cidade.
    Uma pessoa que sai e entra como outra conta no mesmo navegador pode receber o
    texto anterior; reabrir o modal também perde o destino escolhido. A correção
    torna a chave por membro, carrega o rascunho só no contexto atual e preserva
    a audiência sem alterar a autorização do insert.

allowed_paths:
  - apps/web/app/components/bivaque/feed-post.tsx
  - apps/web/app/components/bivaque/feed-composer.tsx
  - apps/web/app/components/bivaque/feed-post-create.tsx
  - apps/web/app/components/bivaque/feed-post-draft.ts
  - apps/web/app/components/bivaque/feed-post-audience.tsx
  - apps/web/app/components/bivaque/feed-post-photo.tsx
  - apps/web/app/components/bivaque/feed-post-shared.tsx
  - tests/unit/composer/
  - tests/e2e/publish-golden-slice.spec.ts
  - docs/agents/tasks/RECON-014.task.yml

forbidden:
  - executar em paralelo com RECON-014, 015, 016 ou 017 — os quatro dividem components/bivaque/ e a onda 4 e SERIAL, ordem 1 de 4
  - tocar arquivo de components/bivaque/ fora dos allowed_paths deste contrato
  - quebrar a API publica dos componentes sem atualizar toda consumidora no mesmo diff
  - mandar rascunho para o servidor ou para qualquer armazenamento compartilhado
  - publicar automaticamente qualquer coisa que o membro nao confirmou
  - tocar proxy.ts, (shell)/layout.tsx, bottom-nav.tsx, NAV_ITEMS ou qualquer arquivo .sql
  - criar migration, RPC, policy ou coluna
  - chumbar nome, cidade, data, contagem ou qualquer dado — tudo vem de contexto ou consulta real
  - inventar conteudo; sem dado real, estado vazio honesto
  - linkar rota que nao existe
  - prometer prazo, aprovacao, entrega ou alcance que o servidor nao garante
  - texto de placeholder, href vazio, handler vazio ou toast como unica implementacao
  - valor de cor cru em JSX, style inline ou classe utilitaria de paleta
  - introduzir familia tipografica, biblioteca de componentes ou modo escuro

acceptance:
  - criar publicacao e editar seguem a composicao da prancha 45
  - a audiencia oferecida e a real do membro — comunidade e grupo vem de consulta, nunca de lista fixa
  - o rascunho sobrevive a interrupcao pelo armazenamento do proprio navegador do membro; ele NAO vira publicacao, nao sai do dispositivo e nao e enviado ao servidor
  - o rascunho e a preferencia de audiencia sao namespaced por membro e locality; trocar de conta nao expoe o texto anterior
  - o rascunho so e recuperado quando a audiencia persistida continua autorizada; uma revogacao volta a cidade com aviso, sem publicar automaticamente
  - reabrir o compositor recupera a ultima audiencia escolhida sem transformar o rascunho em publicacao
  - fechar e reabrir o compositor preserva o rascunho; campos vazios nunca o apagam e o descarte exige confirmação
  - descartar rascunho e explicito e reversivel ate confirmar — nao apaga em silencio
  - feed-post.tsx termina abaixo de 500 linhas; a separacao e por responsabilidade (cartao / criacao / edicao), nao corte arbitrario
  - nenhuma consumidora do modulo quebra: a mudanca de superficie mantem as props que /inicio, /communities e /explorar ja passam
  - exatamente um h1 por tela consumidora — o componente NAO introduz h1 proprio
  - todos os estados fechados: skeleton no carregamento, vazio honesto, erro recuperavel com nova tentativa
  - nenhum dado inventado sobrevive na tela
  - contraste >= 4,5:1, alvos >= 44x44, foco visivel
  - npx pnpm@11.18.0 gate verde
  - auditoria visual das rotas que consomem publicacao e rascunho em 375/768/1440 sem finding de severidade high

proof:
  - node scripts/agents/task-contract.mjs docs/agents/tasks/RECON-014.task.yml
  - npx pnpm@11.18.0 exec vitest run tests/unit/composer/draft-scope.test.ts tests/unit/composer/audience-reset.test.ts
  - npx pnpm@11.18.0 exec playwright test tests/e2e/publish-golden-slice.spec.ts --workers=1
  - npx pnpm@11.18.0 gate
  - node scripts/visual/loop.mjs

