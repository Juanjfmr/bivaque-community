    feed-post.tsx tem 1022 linhas e concentra cartao, modal de criacao, edicao e acoes; feed-composer.tsx tem 69 e so abre o modal. O arquivo passa do limite de 500 linhas do projeto e a composicao nao segue a prancha 45. Nao ha recuperacao de rascunho.

allowed_paths:
