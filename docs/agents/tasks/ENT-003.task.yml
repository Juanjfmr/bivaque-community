  status: FAIL-EVIDENCED
  evidence: >
    Capturas de 30/10/2026 em docs/design/fluxos-2026-10-30/individuais/F01/previa-atual/
    06-consulta-indisponivel-desktop.png, 07-documento-desktop.png e 08-analise-desktop.png: cartão
    único com aviso de demonstração, input de arquivo nativo que exibe o nome do arquivo e lista
    numerada simples na análise. Revisão do ENT-002 (.visual/ENT-002/resultado-desktop-1440.png):
