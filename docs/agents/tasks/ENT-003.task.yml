forbidden:
  - enviar, ler o conteúdo, converter ou guardar o arquivo escolhido (fica só como File em memória; sem FileReader, sem URL.createObjectURL, sem localStorage, sem log)
  - exibir o nome do arquivo em qualquer lugar da tela
  - mudar o tratamento do CPF ou as telas de acesso (ENT-001)
  - instalar, remover ou atualizar dependências
  - copiar código de blocos do 21st.dev (File Dropzone e Process Timeline são referência de anatomia)
  - usar Base UI, Material Web ou HeroUI; usar Brasa fora do logo
  - criar texto, campo ou destino que não esteja nesta lista de aceite
  - editar migrations, Supabase, apps/web ou apps/mobile
  - delegar a subagentes

acceptance:
  - "Consulta indisponível (/app/entrar/consulta-indisponivel): EntradaEtapa no passo 2. Ícone de traço de nuvem com alerta (Material Symbols cloud_off ou equivalente já hospedado) acima do título \"Não foi possível concluir a consulta.\"; apoio \"A fonte oficial está fora do ar agora. Não é nada com seus dados.\" e segunda linha \"Tente novamente em alguns minutos ou envie sua identidade para análise.\"; botão principal \"Tentar novamente\" (volta ao vínculo) e secundário \"Enviar identidade\" (vai ao documento)."
  - "Documento (/app/entrar/documento): passo 2. Título \"Envie sua identidade.\"; apoio \"Se a consulta por CPF não for concluída, você pode enviar sua identidade militar digital.\"; área de envio com borda tracejada, ícone de documento e botão \"Selecionar arquivo\" (o input type=file fica dentro, acessível pelo rótulo e por teclado, aceitando application/pdf, image/jpeg e image/png); nota \"Envie um único arquivo completo. PDF, JPG ou PNG, até 10 MB.\"; depois de escolher, a área mostra um cartão com ícone, o tipo e o tamanho (ex.: \"PDF · 420 KB\") e o botão \"Trocar arquivo\", e nunca o nome; arquivo de tipo ou tamanho inválido mostra o erro \"Escolha um PDF, JPG ou PNG de até 10 MB.\" (role=alert) e mantém o envio desabilitado; botão principal \"Enviar arquivo\" desabilitado até haver arquivo válido, então vai à análise como hoje; link \"Voltar\" para o vínculo."
  - "Análise (/app/entrar/analise): passo 2. Título \"Vínculo em análise.\"; apoio \"Acompanhe as etapas da análise por aqui.\"; linha do tempo vertical com três marcos: \"Documento enviado\" (concluído, check em círculo Grafite), \"Em análise\" (atual, círculo Grafite com o número 2) com a linha \"Até 2 dias úteis, normalmente no mesmo dia\", e \"Resultado\" (futuro, círculo vazado em var(--muted-foreground)) com a linha \"Você recebe um aviso assim que liberar\"; lista ordenada com aria-current=\"step\" no marco atual; caixa desenhada em Grafite \"Avise-me quando houver uma atualização.\" (estado local, como hoje); botão secundário \"Substituir documento\" (vai ao documento)."
  - "Sem o parágrafo \"Jornada demonstrativa\" e sem \"Na demonstração\" nessas três telas."
  - "Correção do ENT-002: no indicador de ≥768 px, o passo 5 não tem nenhum traço ou linha solta entre o círculo e o rótulo \"Negócio\"; o conector só existe entre círculos."
  - "Correção do ENT-002: no vínculo confirmado, o check dentro do círculo Grafite de 72 px tem pelo menos 36 px."
  - "Sem rolagem horizontal em 320, 360, 375, 430, 768 e 1440 px; foco no título ao abrir; foco visível; tema escuro pelos tokens."
  - "Os specs entrada-etapa, entrada-acesso e entrada-21st continuam verdes, com entrada-21st ajustado só onde dependia do nome do arquivo, do aviso de demonstração ou dos textos substituídos."

