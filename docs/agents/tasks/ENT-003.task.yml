# ENT-003 — F01, lote 3: consulta indisponível, envio de identidade e análise (+ correções do ENT-002)
#
# Executor: OpenCode com deepseek-v4.1-flash. Revisor, auditoria de segurança e verificação de
# runtime: Claude Code. Sem backend: o arquivo nunca sai do navegador.
task_id: ENT-003

objective: >
  No app (apps/app), as rotas /app/entrar/consulta-indisponivel, /app/entrar/documento e
  /app/entrar/analise passam para a composição de etapa (EntradaEtapa, passo 2 Vínculo), como nas
  referências aprovadas em 30/10/2026: resultado com ícone e duas ações, área de envio tracejada de
  arquivo único e linha do tempo da análise com prazos. O arquivo escolhido continua só na memória
  da página, e a tela passa a mostrar apenas o tipo e o tamanho dele, nunca o nome (que pode conter o
  CPF). Corrige também dois detalhes do ENT-002 no indicador e no vínculo confirmado.

authority:
