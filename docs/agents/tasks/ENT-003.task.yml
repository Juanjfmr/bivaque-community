allowed_paths:
  - apps/app/src/telas/Entrar.tsx
  - apps/app/src/styles.css
  - apps/app/components/bivaque/entrada-etapa.tsx
  - apps/app/tests/e2e/entrada-etapa.spec.ts
  - apps/app/tests/e2e/entrada-21st.spec.ts
