  - docs/design/fluxos-2026-10-30/individuais/F01/F01-06-consulta-indisponivel.png, F01-07-documento.png, F01-08-analise.png e as mesmas em celular/
  - docs/decisions/ADR-20261022-entrada-do-prototipo.md (análise pendente com linha do tempo, reenvio de documento e aviso)
  - prototypes/bivaque-html/src/features/entry/account.js (do documento ficam só tipo e tamanho; tipos PDF, JPG e PNG até 10 MB)
  - docs/agents/tasks/ENT-002.task.yml (componente EntradaEtapa e padrão de testes)

