task_id: RECON-008

objective: >
  A rota /guide passa a ser o Guia da cidade da prancha 12-web-guia: descoberta
  editorial por categoria com busca, sobre o diretorio curado que ja existe.

authority:
  - docs/design/visual-guide-2026-09-06/12-web-guia.png
  - docs/design/visual-guide-2026-09-06/PROCESSO-DE-CONSTRUCAO.md §7 — Guia e entrada de Explorar
  - docs/superpowers/specs/2026-09-08-reconstrucao-visual-web-design.md §8 gate G1
  - docs/agents/DESIGN_SYSTEM.md §5, §9.1

baseline:
