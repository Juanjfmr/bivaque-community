  - apps/app/lib/**
  - apps/app/tests/**
  - apps/web/app/(shell)/**
  - apps/web/app/components/**
  - apps/web/app/(provider)/**
  - apps/web/app/(preauth)/**
  - apps/web/app/api/app/**
