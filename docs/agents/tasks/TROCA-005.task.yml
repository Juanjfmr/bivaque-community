  - docs/agents/tasks/TROCA-005.task.yml
forbidden:
  - editar migration já aplicada (só arquivo novo); reiniciar ou reconstruir o banco local
  - remover a tela web antes de a tela do app passar na revisão às cegas e no E2E
  - redirecionamento em ciclo ou que perca ID, token ou query
  - afrouxar ou apagar asserção de teste de uma rota que continua existindo
  - rota de API nova sem o contrato do ADR SPA §5 (resolvedor único, CSRF por Origin e cabeçalho, CORS explícito) e sem teste positivo e negativo
  - service_role sem autorização explícita no código
  - mexer em /consent, /auth/*, /privacidade, /codigo-de-conduta, /ajuda ou /conta-apagada (ficam como aceite do Google, troca de código e páginas públicas)
  - a denúncia identificar o denunciante a quem foi denunciado
  - git stash, delegar, dado pessoal real ou CPF real
  - apps/web/app/(admin)/**, a landing, apps/mobile, apps/prototipo
acceptance:
  - "Meu negócio (/app/meu-negocio) tem as abas Ficha, Catálogo, Pedidos/Atendimento e Conta, com a aba na URL e a volta à posição do NAV-001; o prestador abre um pedido (Folha ou tela filha), responde e vê o estado gravado; a falha principal de cada aba mostra erro honesto, não vazio; em 375/768/1440, claro e escuro"
  - "o convite de prestador (/prestador-convite/[token]) é aceito no app como estado da entrada ou Folha, com token válido, inválido e já usado; nenhuma tela nova foi criada para isso"
  - "Ajuda mostra uma lista única com Meus chamados e Minhas denúncias (filtro ou abas); Nova denúncia abre na Folha única do NAV-001; o membro denuncia, acompanha e vê o desfecho no detalhe (Folha ou tela filha), com falha principal, em 375/768/1440"
  - "o prestador só vê os próprios pedidos e o membro só as próprias denúncias (testes negativos na API e na tela); a denúncia nunca identifica o denunciante a quem foi denunciado (ADR-20261116)"
  - "as rotas antigas (/denuncias, /denuncias/nova, /denuncias/[id], /prestador/*, /prestador-convite/[token]) devolvem 307 ao destino fundido no /app com ID e token preservados, sem ciclo; páginas, componentes e testes antigos saem, inclusive os arquivos mortos da entrada"
  - "inventário final: apps/web/app só tem landing, API, auth, páginas públicas e (admin); o card LAN-TROCA registra a lista"
