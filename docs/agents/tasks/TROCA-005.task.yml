task_id: TROCA-005
objective: >
  Trazer para o app, no desenho fundido do plano "Reduzir o excesso de telas" (dono, 21/11/2026),
  as denúncias do membro e a área do prestador, e então apagar as versões do site. (1) A área do
  prestador ((provider)/prestador: início, atendimento, catálogo, conta, ficha e pedidos/[id]) vira
  abas dentro do "Meu negócio" do app (/app/meu-negocio): Ficha, Catálogo, Pedidos/Atendimento e
  Conta; o detalhe de um pedido abre como Folha (NAV-001) ou tela filha. O aceite em
  /prestador-convite/[token] vira um estado da entrada do app ou uma Folha, sem tela nova. (2) As
  denúncias do membro entram em Ajuda, numa lista única com "Meus chamados" (filtro ou abas);
  "Nova denúncia" abre na Folha do NAV-001 e o detalhe abre como Folha ou tela filha. Nada de tela
  nova quando uma aba ou uma Folha resolve. (3) Apagar os arquivos mortos da entrada antiga em
  (preauth) que next.config.ts já redireciona para /app/entrar (login, signup, recuperar-senha,
  nova-senha, onboarding/*), com os testes deles. As denúncias do operador em (admin) ficam.
authority:
  - docs/LANCAMENTO.md (fase 6, critério: nenhuma rota de membro no apps/web servindo tela)
  - docs/decisions/ADR-20261024-front-react-spa.md (§5 contrato de API, §8 ordem da troca)
  - docs/decisions/ADR-20261116-bloqueio-e-denuncia-pela-porta-do-app.md
  - "card LAN-TROCA-DENUNCIA-PRESTADOR; decisão do dono de 20/11 (nenhuma tela antiga sobrevive)"
  - "plano Reduzir o excesso de telas (dono, 21/11/2026): aba ou Folha antes de tela nova"
adr: docs/decisions/ADR-20261116-bloqueio-e-denuncia-pela-porta-do-app.md
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Depois do TROCA-002 (#309) seguem servindo tela no site (shell)/denuncias (3 páginas),
    (provider)/prestador (6 páginas) e (preauth)/prestador-convite/[token]; as páginas de login, signup,
    recuperar-senha, nova-senha e onboarding seguem no disco embora next.config.ts as redirecione.
allowed_paths:
