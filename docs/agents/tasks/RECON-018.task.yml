  - docs/design/visual-guide-2026-09-06/37-web-auth-confirmacao.png
  - docs/design/visual-guide-2026-09-06/71-web-auth-recuperacao.png
  - docs/agents/PRANCHAS-WEB-RESTANTES.md secao 36-web-auth-entrada e secao 37-web-auth-confirmacao
  - docs/agents/PRANCHAS-WEB-RESTANTES.md secao 71-web-auth-recuperacao
  - docs/superpowers/specs/2026-09-08-reconstrucao-visual-web-design.md secao 4.1 R02 R03 R04 R06 R07 R08
  - docs/decisions/ADR-20260907-login-com-senha.md
  - docs/decisions/ADR-20260907-consentimento-no-cadastro.md
  - Relatório comparativo Mobbin e autorização do responsável em 23/09/2026 para continuidade Auth

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    A árvore atual contém as telas, mas a auditoria de 23/09/2026 mediu confirmação ausente na
    allowlist explícita do proxy, callback-error apenas coberto por prefixo (o que também expunha
    lookalikes), destino fragmentado entre redirect/return/next, Google sem respeitar o aceite no
    cadastro, erro de senha curta capaz de travar o próximo submit e recuperação expirada sem
    caminho para pedir outro link. Revisão de entrada: 4f78aa97, worktree
    C:/Users/juana/bivaque-journey-ux.

