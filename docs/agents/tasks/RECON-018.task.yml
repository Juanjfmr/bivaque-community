task_id: RECON-018

objective: >
  A entrada web passa a ser das pranchas 36 e 37 e a manter uma jornada contínua e recuperável:
  entrar e criar conta na composição de duas colunas, confirmar o e-mail com reenvio limitado
  pelo servidor, preservar o destino autorizado e oferecer recuperação clara, usando o mecanismo
  de senha e o aceite definidos pelos ADRs aprovados.

