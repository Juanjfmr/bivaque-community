task_id: RECON-018

objective: >
  A entrada web passa a ser a das pranchas 36 e 37: entrar e criar conta na composicao de duas
  colunas com imagem sangrada, e confirmar o e-mail com reenvio limitado pelo servidor, usando
  o mecanismo de senha que o ADR aprovado determina.

authority:
  - docs/design/visual-guide-2026-09-06/36-web-auth-entrada.png
  - docs/design/visual-guide-2026-09-06/37-web-auth-confirmacao.png
  - docs/design/visual-guide-2026-09-06/71-web-auth-recuperacao.png
  - docs/agents/PRANCHAS-WEB-RESTANTES.md secao 36-web-auth-entrada e secao 37-web-auth-confirmacao
  - docs/agents/PRANCHAS-WEB-RESTANTES.md secao 71-web-auth-recuperacao
  - docs/superpowers/specs/2026-09-08-reconstrucao-visual-web-design.md secao 4.1 R02 R03 R04 R06 R07 R08
  - docs/decisions/ADR-20260907-login-com-senha.md
  - docs/decisions/ADR-20260907-consentimento-no-cadastro.md

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    As rotas existem em apps/web/app/(preauth) e nunca foram comparadas com as pranchas 36 e 37.
    Nao existe rota de confirmacao de e-mail; a prancha 37 desenha a tela e o catalogo pede R04.
    Medido em 09/09/2026 na arvore de codex/ajuste-de-auditoria.

allowed_paths:
  - apps/web/app/(preauth)/login/
  - apps/web/app/(preauth)/signup/
  - apps/web/app/(preauth)/recuperar-senha/
  - apps/web/app/(preauth)/nova-senha/
  - apps/web/app/auth/
  - apps/web/app/components/auth/
  - scripts/visual/capture.mjs
  - tests/unit/ui/
  - tests/e2e/
  - docs/agents/tasks/RECON-018.task.yml

forbidden:
  - implementar as seis caixas de digito da prancha 37, que o ADR de senha supera
  - trocar o campo de senha por magic link ou codigo de uso unico
  - exigir nome civil completo no cadastro
  - expor endereco de e-mail em query string, log ou titulo de pagina
  - distinguir e-mail inexistente de senha errada em qualquer mensagem
  - prometer envio ou reenvio sem confirmacao do servidor
  - criar migration, policy ou coluna
  - tocar apps/web/proxy.ts ou o shell de membro
  - texto de placeholder, href vazio, handler vazio ou toast como unica implementacao
  - valor de cor cru em JSX, style inline ou classe utilitaria de paleta

acceptance:
  - entrar usa e-mail e senha com mostrar e ocultar, botao Entrar, Esqueci minha senha, Google e Criar conta
  - criar conta pede nome de apresentacao, e-mail, senha e o aceite explicito com os links legais
  - a composicao das duas telas segue a prancha 36 - imagem sangrada a esquerda com o wordmark sobreposto, formulario a direita, separador ou, botao do Google secundario e links de rodape
  - a rota de confirmacao de e-mail existe, mostra o endereco, oferece alterar e-mail e reenviar com contador regressivo limitado pelo servidor
  - o estado expirado mostra o alerta e oferece novo envio sem reenviar material vencido
  - credencial errada devolve uma mensagem unica, e limite de tentativa e falha de rede sao distinguiveis dela
  - sessao persiste apos recarregar e o destino pos-entrada aceita somente rota interna permitida
  - recuperar senha devolve resposta neutra e o link abre a redefinicao por callback valido
  - todos os estados fechados - carregando, erro recuperavel, sessao expirada e envio em andamento sem duplicar
  - exatamente um h1 por tela, contraste maior ou igual a 4,5:1, alvos maiores ou iguais a 44x44 e foco visivel
  - as rotas tocadas estao cadastradas em scripts/visual/capture.mjs e a captura registra Authenticated capture quando aplicavel

proof:
  - node scripts/agents/task-contract.mjs docs/agents/tasks/RECON-018.task.yml
  - npx pnpm@11.18.0 gate
  - npx pnpm@11.18.0 build
  - npx pnpm@11.18.0 test:e2e
  - node scripts/visual/capture.mjs para cada rota tocada em 375 768 e 1440

risk: entrada e cadastro
risk_level: R2
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: HUMAN_DECISION
closure:
  requires_runtime_evidence: true
