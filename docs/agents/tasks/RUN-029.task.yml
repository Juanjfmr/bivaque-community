forbidden:
  - nome, foto, trecho de conteúdo ou qualquer dado de outro membro no título ou no corpo do push
  - pedir permissão de notificação ao abrir o app (só ao ligar o push nas preferências)
  - confiar em user_id do corpo; UPDATE de cliente na tabela de inscrições; leitura de inscrição de outro membro
  - envio fora do outbox, furando a preferência por canal, o bloqueio entre membros ou o limite de lote
  - chave privada do Web Push no repositório, em log ou no bundle do cliente (só a chave pública vai ao cliente)
  - o nome da plataforma do Google proibido em tests/privacy/product-boundaries-and-pii.test.ts
  - inscrição nativa de loja (android/ios) nesta rodada; dependência nova além de uma biblioteca de Web Push pequena e fixada no apps/web
  - editar migration existente; mudar o desenho aprovado das preferências além do interruptor de push
  - push, merge ou force-push no git; pedir revisão a outro modelo ou ao Claude
  - ler, criar ou editar arquivos .env

acceptance:
  - "Migration nova com public.push_subscriptions conforme o ADR (RLS forçada, dono lê/cria/apaga só as suas, sem UPDATE de cliente, papel de serviço lê para enviar, destino único por kind, cascade na conta); pgTAP positivo e negativo."
  - "POST /api/app/push grava a inscrição deste aparelho e DELETE a apaga, com exigirSessao/conferirEscrita e o cliente da sessão; a saída do app chama o DELETE."
  - "Service worker de push no app: mostra título e corpo recebidos e, no toque, abre o destino do aviso pelo destinoEmRota (desconhecido cai na tela segura)."
  - "Adaptador push no outbox: frase fixa por tipo (sem dado de terceiro), respeita preferência por canal e bloqueio; resposta gone/not found apaga a inscrição; sem chave configurada, desligado e sem erro."
  - "Preferências de aviso: o interruptor de push pede permissão ao ligar e inscreve; negado mostra mensagem e mantém desligado; sem suporte do navegador, o interruptor não aparece."
  - "Testes de unidade das rotas, do adaptador e da frase por tipo (teste de privacidade: nenhum campo de terceiro no payload); teste do app do interruptor; E2E tests/e2e/push-web-real.spec.ts gravando e apagando a inscrição pela rota (sem envio real)."
  - "Tipos públicos regenerados; nomes das chaves novas documentados em docs/PRODUCAO-PASSO-A-PASSO.md, sem valores."

