# LAN-PUSH, parte web (07/11/2026): inscrição, envio pelo outbox e abertura no destino certo.
# Processo enxuto (ADR-20261105-entrada-enxuta-e-r3-sem-parada): uma rodada, uma revisão, no máximo uma correção.
task_id: RUN-029

objective: >
  Na web instalada, o membro liga o push nas preferências de aviso, o navegador pede permissão naquele
  momento, a inscrição do aparelho é gravada pela rota do app e, a partir daí, os avisos do canal push saem
  pelo outbox existente como notificação com título "Bivaque" e frase fixa por tipo, sem dado de terceiro; o
  toque abre o destino do aviso no app. Sair do app, apagar a conta ou o provedor recusar o destino remove a
  inscrição. Sem a chave do Web Push configurada, o envio fica desligado e o app não oferece o push.

authority:
  - docs/decisions/ADR-20261107-push-no-aparelho.md
  - docs/decisions/ADR-20261105-porta-de-dados-do-app.md
  - docs/decisions/ADR-20261105-entrada-enxuta-e-r3-sem-parada.md
  - tools/backend-kanban card LAN-PUSH

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    O canal push existe só na matriz de preferências (supabase/migrations/20261106214256_notification_push_channel.sql);
    não há tabela de inscrições, rota de inscrição, service worker de push nem adaptador de envio no outbox
    (apps/web/lib/outbox/adapters.ts envia só e-mail).

