forbidden:
  - retornar em resultado qualquer item que o leitor nao teria direito de abrir, inclusive trecho e contagem
  - apresentar como resultado um modulo que ainda nao esta integrado
  - criar ranking, selo, estrela ou promessa comercial que o dado nao sustenta
  - depender de modelo de linguagem para a busca minima funcionar
  - criar migration, policy ou coluna
  - inventar dois significados para o mesmo parametro de URL
  - manter filtro selecionado sobre resultado incompativel
  - texto de placeholder, href vazio, handler vazio ou toast como unica implementacao

acceptance:
  - o campo de busca do cabecalho existe em todas as telas de membro com o rotulo da prancha e leva a rota de resultados
  - a rota de resultados agrupa por tipo ja implementado, usa q como parametro canonico e aceita o alias antigo na borda
  - a busca de servicos segue o segundo painel da prancha 61 - seta de voltar, titulo com o termo entre aspas, filtros de bairro e tipo, botao de limpar filtros, contagem e cartoes horizontais com foto, nome, ocupacao, localizacao, descricao e botao Ver ficha
  - a contagem exibida usa os mesmos filtros e a mesma autorizacao da lista
  - filtro, termo e paginacao sobrevivem a recarregar, voltar, avancar e abrir em nova aba
  - resultado vazio e diferente de erro e oferece limpar filtros ou trocar de cidade
  - conta sem direito nao ve item restrito nem por chamada direta sem interface
  - todos os estados fechados - carregando com dimensao estavel, vazio, erro recuperavel e sessao expirada
  - exatamente um h1 por tela, contraste maior ou igual a 4,5:1, alvos maiores ou iguais a 44x44 e foco visivel
  - a rota nova esta cadastrada em scripts/visual/capture.mjs com fixture concreta

