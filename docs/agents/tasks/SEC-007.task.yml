# Lote A do F01: endurecer o servidor da entrada antes de ligar as telas.
# Origem: revisão independente (reviewer) e auditoria (security-auditor) de 04/11/2026
# sobre o trabalho do executor DeepSeek (origin/ds/lancamento, HEAD f1d14a2d).
task_id: SEC-007

objective: >
  A porta de entrada do app (rotas /api/app/entry/*) passa a resistir a abuso do código por
  e-mail, mantém a sessão viva além da primeira hora, não rebaixa quem já foi verificado, decide o
  destino pelo estado canônico e apaga o rascunho com dado pessoal em todo caminho de conclusão.

authority:
  - docs/LANCAMENTO.md (F01, critérios 1, 3 e 4)
  - docs/decisions/ADR-20261101-entrada-unica-por-codigo.md (§1 destino pelo servidor; §2 seis tentativas, limite por e-mail e IP, reenvio de 60 s)
  - docs/decisions/ADR-20261102-progresso-da-entrada.md (versão diferente volta ao inicial; rascunho apagado ao terminar)
  - docs/decisions/ADR-20261024-front-react-spa.md (§5.1 cliente do usuário sob RLS; §5.2 CSRF)
  - tools/backend-kanban card LAN-F01

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Relatórios de 04/11 do reviewer (FAIL: B-1 sessão sem renovação, B-2 OTP sem limite; I-2, I-3,
    I-6, I-7, I-8, M-2, M-3, M-7, M-8) e do security-auditor (BLOQUEIA: HIGH OTP sem limite e IP do
    servidor; MEDIUM cookie sem Secure; LOW rota de verificação com service_role, rascunho não
    apagado em todo caminho, sem frame-ancestors). Revisão 30628fb5..dd75d8d0 do branch
    ccr-2c6b6b22-i5rd59: gate --fast verde, pnpm test verde, test:db PASS 159/2461.

