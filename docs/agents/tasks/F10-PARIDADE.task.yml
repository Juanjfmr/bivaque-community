# RUN-170 — F10 Lote A (paridade): transferencia de cidade e afiliacao privada no app.
#
# A troca de /profile + /profile/editar (Lote B) nao pode matar os dois recursos
# que so a web tem: a TRANSFERENCIA DE CIDADE (decisao do dono 25/09 no
# ADR-20260925 — cidade muda pelo perfil, RPC declare_locality_transfer com grant
# authenticated, regras 30d padrao / 180d teto no modulo compartilhado
# lib/locality/move-city.ts, constraints no banco) e a AUTODECLARACAO Forca/OM
# (ADR-20260908 D2, tabela profile_affiliations, uma linha por campo). A
# decisao do lote esta no ADR-20261116-perfil-transferencia-e-afiliacao-no-app
# (delegacao): afiliação entra PRIVADA por construcao (is_visible sempre false no
# caminho do app; o toggle Exibir morre com a tela web — BLOCK-AFFILIATION nunca
# teve consumidor vivo), upload de foto morre com a tela (card pos-lancamento
# sera aberto pelo coordenador no fechamento), e NAO se porta o desfazer
# (reverse_locality_transfer e hatch service_role, nao produto). SEM migration.
#
# DESJUNTAO: as lanes RUN-168 (salvar) e RUN-169 (alertas) tocam mercado/
# Inicio/Anuncio/Salvos e rotas mercado/imoveis — este lote nao toca nada delas.
# NAO troca /profile nem remove telas web (Lote B, depois deste + #246).

