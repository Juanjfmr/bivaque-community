acceptance:
  - "GET /api/app/voce (extensao aditiva): cidade passa a ter id; entra outbound | null = { id, nome, uf, endsAt, readOnly } lido da linha leaving sob RLS no padrao do (shell)/layout.tsx:91-110. Licao paga: campo aditivo em TODOS os caminhos que devolvem o objeto (POST/PUT locais, stubs do app, testes existentes) e no parser do cliente — teste de mutacao prova o furo."
  - "POST /api/app/voce/cidade (e OPTIONS) no ADR §5: corpo { destino: uuid, prazo: ISO date }; exigirSessao + conferirEscrita; validacao REUSA lib/locality/move-city.ts (destino != atual, prazo hoje..+180, default 30d) sem duplicar regra; RPC declare_locality_transfer com o cliente da sessao (SECURITY DEFINER resolve auth.uid(); nunca service_role na rota; destino NUNCA vem de nome); 23505 vira a mensagem vigente de mudanca em andamento, 23514/28000/42501 no molde das rotas voce existentes, 503 sem eco; sucesso devolve o estado novo (current/leaving/leaving_at)."
  - "Modulo compartilhado de afiliacao: logica de apps/web/app/(shell)/profile/affiliation.ts (enum Marinha/Exercito/Aeronautica, OM <=80 com varredura CPF/CEP, normalizar limpar=apagar) MUDA para apps/web/lib/profile/affiliation.ts e o arquivo antigo vira re-export de uma linha (testes web da pasta continuam verdes sem edicao). GET/PUT /api/app/voce/afiliacao: PUT { armedForce?: string|null, om?: string|null } grava/apaga linhas de dono com is_visible=false SEMPRE (sem campo de visibilidade no corpo — corpo que trouxer visibilidade e recusado 400); GET devolve as proprias; posse decide no banco (RLS dono); negativos: enum aberto 400, OM com digitos tipo CPF 400, sem sessao 401, CSRF no PUT, 503 sem eco."
  - "App: dados/voce.ts ganha declararMudancaDeCidade(destino, prazo), lerAfilicao(), salvarAfilicao({armedForce, om}); Voce.tsx (secao Sua cidade): mostra cidade com id, estado 'saindo de <cidade> ate <data> — uma nova mudanca fica disponivel depois do prazo' com a cidade de destino, e o form de declaracao (destino pelo catalogo publico UF-municipio /api/localities + /api/localities/[uf], prazo com default 30d e aviso do teto 180) que so aparece sem leaving; ocupado/erro/vazio honestos, sucesso revalida o GET da tela. EdicaoDePerfil (ou a linha de edicao do Voce, o que a tela ja usa): campo Forca Armada (select dos 3 + vazio) e OM (texto), com a frase 'opcional e privado — outras pessoas nao veem'; limpar campo e apagar (espelhando normalizar do modulo). /app/voce le o param mudar=<id> da URL e pre-seleciona o destino no form (a query sobrevive ao 307 do Lote B; hoje so a consulta de cidade usa isso)."
  - "Sem Lote B aqui: /profile e /profile/editar seguem servindo (a prova lan-troca-redirect.test.ts:219-224 de que continuam na web NAO muda); confirmacao de UI com a peca Confirmacao no molde das irmas (troca de sobreposicao, nao empilhamento — licao 16/11)."
  - "Testes: unit do POST cidade (positivo com payload do RPC igual ao da action web; sem sessao 401; CSRF 403; destino=current 400; prazo fora 400; segunda mudanca 23505→mensagem; 503 sem eco) em tests/unit/app-api/voce; unit da afiliacao (GET/PUT, is_visible false sempre, corpo com visibilidade 400, limpar=apaga, enum/OM invalidos) e a existente profile-affiliation.test.ts continua verde via re-export; unit do GET voce com outbound; vitest do app para os novos clients e a tela (fetch mockado); e2E stub do app para o fluxo cidade (declarar→estado saindo aparece) roda local em vitest/Playwright do PROPRIO app se a porta estiver livre — senao fica pro CI e voce declara. E2E real @stateful: estender tests/e2e/f10-voce-real.spec.ts com o fluxo cidade pela persona em transferencia do seed (membro-transferencia@) — declarar de novo 23505 e o texto de bloqueio aparece; e afiliacao gravar→recarregar→persiste→apagar. Positivo E negativo em toda permissao."
  - "api-surface: duas rotas novas marcadas (voce/cidade, voce/afiliacao); TOTAL_DE_ROTAS recalculado CONTRA O DISCO apos git rebase origin/main no fim do lote (RUN-168/169 somam na mesma janela — o teste do manifesto compara disco×manifesto). Passam: gate --fast, tsc -p tests/e2e, pnpm test, test:scope, app test. Antes de tocar fora dos allowed_paths, EMENDAR este contrato primeiro (cada '- ' em uma linha so — o parser nao aceita item quebrado)."

