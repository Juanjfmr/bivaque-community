# LAN-F09 (06/11/2026): avisos no app e preferências por canal, no molde das jornadas na main.
# Processo enxuto (ADR-20261105-entrada-enxuta-e-r3-sem-parada): uma rodada, uma revisão, no máximo uma correção.
task_id: RUN-022

objective: >
  O membro passa a ver seus avisos no app (lista com não lidos, marcar como lido, tocar leva ao destino
  certo: conversa, pergunta, evento, pedido, grupo) e a ajustar as preferências de aviso por canal (no app,
  e-mail, push), pela sessão, reaproveitando a lógica que a web antiga usa em notifications e
  configuracoes/notificacoes. Push no celular real fica fora (depende das chaves do dono).

authority:
  - docs/LANCAMENTO.md (F09: avisos no app, por e-mail e por push, com destino certo; preferências por canal)
  - docs/decisions/ADR-20261105-porta-de-dados-do-app.md
  - docs/decisions/ADR-20261105-entrada-enxuta-e-r3-sem-parada.md
  - tools/backend-kanban card LAN-F09

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    O app não tem lista de avisos nem rota (o ícone de avisos da casca usa a demonstração). A web antiga tem
    a lista em apps/web/app/(shell)/notifications e as preferências em configuracoes/notificacoes, com a
    lógica em apps/web/lib/notifications e a tabela notification_preferences (as quatro colunas que a
    entrada do F01 já grava).

