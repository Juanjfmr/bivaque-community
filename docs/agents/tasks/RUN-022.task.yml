  - aviso de outro membro; user_id vindo do corpo ou da query
  - service_role onde a RLS da sessão basta
  - editar migration existente
  - mudar o desenho aprovado da casca; quebrar as outras telas
  - pedir revisão a outro modelo (o coordenador cuida)
  - ler, criar ou editar arquivos .env

acceptance:
  - "GET /api/app/avisos (avisos do próprio membro, paginado, com contagem de não lidos), POST /api/app/avisos/lidos (marcar um ou todos), GET e PATCH /api/app/avisos/preferencias (canais app, e-mail, push por tipo, no formato que a web já usa)."
  - "Cada aviso traz o destino no app (rota /app/... da jornada correspondente); destino sem jornada no app cai na tela segura mais próxima, nunca em 404."
  - "Testes de unidade positivo e negativo por rota (401, 403 de origem, corpo inválido 400, erro do banco 503 sem eco, aviso de outro membro invisível)."
  - "A casca mostra a contagem real de não lidos; a tela de avisos e a seção de preferências na área Você leem e gravam pela rota, com carregando, vazio honesto, erro com Tentar de novo."
  - "Testes do apps/app que esperavam a demonstração simulam as rotas com page.route (RegExp)."
  - "E2E tests/e2e/f09-avisos-real.spec.ts contra o banco: ver aviso semeado, marcar lido, recarregar e continuar lido, mudar preferência e persistir; devolve o estado ao terminar."

