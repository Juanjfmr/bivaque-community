#
# Autoridade: docs/LANCAMENTO.md fase 6 (nenhuma rota de membro no apps/web servindo tela) e
# linha F08 (só exclui curadoria por IA). A exclusão de sugerir lugar novo existia só em
# comentários de código (next.config.ts:106-108, Guia.tsx:54-55), e o LANCAMENTO vence comentário.
# Levantamento de 17/11 (.work/orq/relatorios/escopo-trocas.md, seção 1, opção B).
#
# Decisão do coordenador, 17/11, por delegação: construir a porta no app reusando a função de
# banco existente suggest_guide_entry (mesma fila de curadoria /guide-queue, mesmo limite de
# sugestões pendentes), sem migration, grant ou policy nova; e retirar a tela antiga com 307.

task_id: RUN-182

