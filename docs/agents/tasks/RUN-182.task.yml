  Membro sugere um lugar novo para o Guia de dentro do app, com o mesmo formulário, as mesmas
  regras e a mesma fila de curadoria de hoje, e a rota /guide/sugerir da web deixa de servir
  tela, redirecionando para o app, sem link apontando para tela morta.

