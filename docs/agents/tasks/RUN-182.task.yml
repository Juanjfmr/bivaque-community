acceptance:
  - "Rota nova POST /api/app/guia/sugestao segue a seção 5 do ADR da SPA: resolve a sessão, confere CSRF e origem como as rotas irmãs do guia, valida o corpo com os mesmos campos e limites da tela antiga (nome, categoria entre as permitidas, descrição, site e telefone opcionais), chama suggest_guide_entry com o cliente da sessão e mapeia os erros do banco para frases fixas, sem error.message. Testes unitários positivos e negativos: sem sessão 401, CSRF 403, corpo inválido 400, limite de pendentes do banco com frase fixa, sucesso 201."
  - "O app ganha a folha de sugerir lugar novo, aberta por um botão no Guia, com nome antes da categoria (a ordem que o question-first-order provava), validação, envio pela rota nova, mensagem de sucesso e foco previsível; teste do módulo de dados e o guia-estrutura passam a provar a presença do botão em vez da ausência."
  - "/guide/sugerir vira 307 para a folha nova no app (ou para /app/guia se a folha não tiver rota própria), a pasta (shell)/guide/sugerir sai, e guia-redirects, lan-troca-redirect, link-crawl e question-first-order são ajustados para a troca, sem porta declarada sobrando."
  - "Inventário completo de links para /guide/sugerir (git grep de href, href:, action=, router.push, templates) migrado direto para o app, registrado no relatório."
  - "O relatório final traz a linha pronta da RATIFICACAO.md para esta decisão (exclusão revogada, porta construída), em uma linha de tabela."

