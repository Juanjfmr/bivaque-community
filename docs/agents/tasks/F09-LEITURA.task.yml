# F09-LEITURA — primeiro lote do LAN-F09 (Conversas e avisos): conversa lida e contador real.
#
# Inventário do coordenador em 18/11 sobre origin/main 054d511b (disco e git). Já está: caixa
# (Conversas.tsx), conversa com resposta, falha guardada, bloquear e denunciar (Conversa.tsx),
# avisos com destino do servidor e preferências por canal; rotas /api/app/conversas, mensagens,
# avisos, avisos/lidos e avisos/preferencias com testes; E2E real f09-conversas-real,
# f09-avisos-real e f09-rpc-real; /messages e /notifications com 307 para o app.
#
# Lacuna deste lote: o contador de conversas no topo vem da demonstração
# (apps/app/src/contexto/casca.tsx:73-78 usa dadosDoApp.resumoDaCasca(), e
# apps/app/lib/dados/index.ts:42-47 conta `unread === true` sobre números, então dá sempre 0);
# a RPC public.mark_conversation_read (supabase/migrations/20260911105119_service_request_tracking.sql:193)
# não é chamada em lugar nenhum; GET /api/app/conversas não diz o que está por ler.
#
# Decisões do coordenador (mandato 02/11):
# - "Por ler" = existe mensagem da outra pessoa com created_at maior que o last_read_at da própria
#   linha em dm_read_states (ou sem linha). Mensagem própria nunca conta.
# - A contagem exata vem de uma função nova de leitura, security invoker, sob a RLS que já existe
#   (dm_conversations, dm_messages, dm_read_states); nenhuma política nova nem mudança de grant em
#   tabela. Sem decisão nova; o nível é R3 só porque toca supabase/migrations.
# - Abrir a conversa marca lida (depois que as mensagens carregam e a cada mensagem nova recebida
#   pela releitura); falha ao marcar é silenciosa para a pessoa e não bloqueia a leitura.
# - Bloqueio no caminho dos avisos/e-mail, push e limpeza do web são lotes seguintes, não este.

task_id: F09-001

adr: docs/decisions/ADR-20261105-porta-de-dados-do-app.md

objective: >
  Abrir uma conversa a marca como lida no banco; a caixa mostra quais conversas têm mensagem por
  ler; o contador de conversas no topo do app é o do servidor, não o da demonstração; e tudo isso
  tem prova de banco, de rota e de navegador.

