forbidden:
  - editar migration já aplicada (só migration nova, criada com supabase migration new)
  - política RLS nova, grant em tabela, security definer na função de contagem, service_role nas rotas
  - mudar ou remover campos existentes das respostas (só acrescentar)
  - presença, "visto por" ou confirmação de leitura para a outra pessoa (fora do lançamento)
  - redesenhar telas além do marcador de "por ler" e do contador
  - apagar teste sem nome e motivo no RELATORIO; skip/fixme novo; afrouxar asserção
  - credencial inline, leitura de arquivo de ambiente pelo spec, dado pessoal real
  - push, merge, force-push, editar o quadro (tools/backend-kanban), tocar outra worktree
  - supabase start/reset ou escrita em banco (o coordenador roda as provas de banco e E2E real)

acceptance:
  - "Banco: migration nova cria public.unread_conversation_count() returns integer, language sql, stable, security invoker, search_path vazio, execute só para authenticated (revoke de public e anon), contando as conversas da pessoa com mensagem da outra pessoa mais nova que o próprio last_read_at (ou sem linha em dm_read_states)."
  - "pgTAP novo em supabase/tests (identidades example.invalid, UUIDs fixos, dentro de transação com rollback): mensagem da outra pessoa conta 1; mensagem própria não conta; depois de mark_conversation_read conta 0; mensagem nova depois da leitura volta a 1; conversa de terceiros nunca entra na contagem nem pode ser marcada (42501); anon não executa nenhuma das duas funções."
  - "POST /api/app/conversas/[id]/lida chama mark_conversation_read com o cliente do usuário e responde 204; id que não é UUID 400; não participante 404 (42501 vira 404, sem eco do banco); sem sessão 401; escrita por cookie sem o cabeçalho do app ou de origem fora da lista recusada como as outras escritas; erro do banco 503. Registrada em apps/web/lib/security/api-surface.ts."
  - "GET /api/app/conversas acrescenta em cada conversa `porLer: boolean` (mesma regra da função) e no corpo `porLer: number` vindo de unread_conversation_count(); campos antigos intactos. Testes de rota com casos positivos e negativos."
  - "App: a casca lê o contador de conversas do servidor do mesmo jeito que já lê o de avisos (casca.tsx:92-104), e nunca da demonstração fora do modo de prova; abrir a conversa chama a rota de lida e baixa o contador; a caixa marca as conversas por ler com peso de texto e um ponto com nome acessível ('Por ler'), sem depender só de cor."
  - "E2E do app simulado (apps/app/tests/e2e, projetos 375/768/1440): o contador do topo mostra o número do servidor; abrir uma conversa por ler envia um POST de lida e o contador cai; a caixa mostra 'Por ler' só nas conversas certas."
  - "E2E real (@stateful, tests/e2e/f09-conversas-real.spec.ts): a outra pessoa semeada manda mensagem ao membro semeado numa conversa existente; o membro vê a conversa marcada como por ler e o contador maior que zero; ao abrir, o marcador some e continua sumido depois de recarregar; POST de lida em conversa alheia responde 404 e sem sessão 401."
  - "RELATORIO em .visual/f09-leitura/RELATORIO.md: arquivos tocados, testes novos e removidos com motivo, comandos rodados com resultado lido, e o que não rodou."

