  evidence: >
    rg "mark_conversation_read" apps tests não acha chamada; apps/web/app/api/app/conversas/route.ts
    devolve id, nome, outroId, tipo, contextoId e ultima, sem estado de leitura;
    apps/app/src/contexto/casca.tsx:78 lê conversas de dadosDoApp.resumoDaCasca() (demonstração).

