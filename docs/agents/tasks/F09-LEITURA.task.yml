  - docs/LANCAMENTO.md :34-48 e :62 (linha F09)
  - Card LAN-F09
  - ADR-20261024-front-react-spa.md §5 (contrato da API) e §8
  - ADR-20261105-porta-de-dados-do-app.md (rota por jornada com o cliente da sessão sob RLS); sem decisão nova, R3 pelo toque em supabase/migrations, com security-auditor antes do merge

