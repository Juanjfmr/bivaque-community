# BUG-CIDADE-GRUPOS — Defeitos que o dono achou no app local em 22/11/2026 (03h38 UTC),
# com um perfil que trocou de Manaus para o Rio de Janeiro na entrada.
# Diagnóstico do coordenador no banco local e no código (main 3c360fc1b):
#  - O vínculo está certo: Rio de Janeiro com kind 'current' e Manaus com 'leaving'.
#  - Chip do topo: apps/app/src/contexto/casca.tsx inicia `cidade`/`cidadeDeCasa` com
#    dadosDoApp.resumoDaCasca() ou CIDADE_PADRAO = "Manaus" e nunca lê a cidade da sessão.
#    A Início lê a cidade da sessão (cidadeDaSessao em api/app/eventos/_comum.ts, kind 'current').
#  - Grupos de outra cidade na entrada: api/app/entry/groups/route.ts (e interests) lê
#    locality_memberships com .limit(1) SEM filtrar kind = 'current'; pegou Manaus ('leaving').
#  - Grupos escolhidos somem: o "Entrar" da entrada só grava interesse
#    (user_group_interests, via record_user_group_interests); a Comunidade lista
#    group_memberships. A pessoa nunca vira membro.
#  - Grupos de prova no banco local: tests/e2e/group-base.spec.ts e
#    group-join-reason.spec.ts (apps/web) criam "Grupo COM-003 <ts>" e "Grupo COM-005 ..."
#    e não apagam. Quase-duplicatas: supabase/dev/demo-manaus.sql cria grupos parecidos
#    com os do seed ("Caminhada do Mindu" x "Caminhada no Mindu", "Corrida ao amanhecer" x
#    "Corrida às Terças", "Trocas de livro e gibis" x "Trocas de Livros", "Reformas e
#    reparos em casa" x "Reformas e Consertos", "Pais e mães do Parque 10" x "Pais e Filhos").
#  - A persona demo-ana caiu na entrada de novo: o script de demonstração não grava o
#    progresso da entrada como concluído.

task_id: BUGCID-001

objective: >
  O app mostra uma cidade só: o chip do topo, a Início e a lista de grupos da entrada
  usam a cidade atual da sessão (vínculo kind 'current'), ou a cidade consultada quando
  a pessoa troca pelo chip. Os grupos em que a pessoa toca "Entrar" na entrada viram
  participação de verdade e aparecem na Comunidade. O banco local não guarda grupos de
  prova nem quase-duplicatas da demonstração, e a persona de demonstração entra direto
  no app.

authority:
  - Relato do dono em 22/11/2026 03h38 UTC na thread do projeto (capturas do cadastro RJ)
  - Nota do coordenador de 22/11/2026 03h39 UTC (lote BUG-CIDADE-GRUPOS, itens 1 a 6)
  - docs/decisions/ADR-20261102-progresso-da-entrada.md (etapa de interesses e provisionamento)
  - docs/decisions/ADR-20261024-front-react-spa.md §5 (contrato de segurança das rotas)

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Banco local em 22/11: usuário dd000000-0000-4000-8000-000000000001 com vínculos
    Rio de Janeiro (current) e Manaus (leaving); entry/groups devolveu grupos de Manaus;
    6 linhas em user_group_interests e nenhuma group_membership nova; chip do topo
    "Manaus" com a Início em "Rio de Janeiro"; 11 grupos "Grupo COM-00x <timestamp>"
    na cidade de Manaus.

