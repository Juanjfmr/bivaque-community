  - editar supabase/seed.sql
  - mudar o tamanho, a ordem ou os passos da entrada (o redesenho é outro lote, ENTRADA-ENXUTA)
  - mudar o fluxo de CPF, Portal ou verificação
  - usar service_role para entrar em grupo; a participação usa o cliente da sessão (RPC join_group, sob RLS)
  - entrar automaticamente em grupo privado ou de outra cidade
  - skip/fixme novo ou afrouxar asserção existente
  - ler, criar ou editar arquivos de ambiente; imprimir credenciais
  - rodar reset de banco; o banco local é compartilhado com o app que o dono está usando

acceptance:
  - "Cidade da sessão em um lugar só: as rotas de entry (groups, interests e qualquer outra que use a cidade para escopar dado) leem a cidade pelo mesmo helper de cidadeDaSessao (kind 'current'). Teste da rota com uma pessoa que tem vínculo current numa cidade e leaving em outra: a lista só traz grupos públicos da current."
  - "Chip do topo: com sessão, cidade e cidadeDeCasa da casca vêm da cidade da sessão (rota existente do app que já devolve a cidade, sem rota nova se der). CIDADE_PADRAO não aparece para quem tem cidade. Trocar pelo chip continua mudando a cidade consultada, e a Início mostra a mesma cidade do chip. Vitest cobre: sessão com cidade X mostra X no chip; troca pelo chip muda os dois."
  - "Entrar na entrada vira participação: cada grupo público da cidade current marcado com Entrar vira group_membership pela RPC join_group no cliente da sessão, no momento em que o vínculo com a cidade existe (no provisionamento ou logo depois). Interesse continua gravado como hoje. Grupo privado ou de outra cidade é ignorado sem erro para a pessoa. Testes positivos e negativos na rota (grupo público da cidade vira membro; privado e de outra cidade não)."
  - "E2E do app em 375, 768 e 1440 nos dois temas: concluir a entrada marcando um grupo, abrir Comunidade e ver o grupo em Seus grupos (ou equivalente)."
  - "Botões Entrar da lista de grupos da entrada com a mesma largura em todas as linhas, qualquer que seja o tamanho do texto. Asserção de largura igual no E2E."
  - "Estado vazio da Início numa cidade sem conteúdo só afirma o que a consulta confirmou: nenhuma contagem, nome ou promessa de conteúdo que não existe. Teste cobre a cidade vazia."
  - "Banco local limpo: as duas specs da web que criam Grupo COM-003/COM-005 apagam o que criaram (afterAll ou afterEach, com o cliente que já usam). O demo-manaus.sql não cria quase-duplicatas do seed: reaproveita os grupos do seed ou troca por temas distintos, e apaga, só no banco local e de forma idempotente, grupos cujo nome começa com 'Grupo COM-00' e as quase-duplicatas que ele mesmo criou antes (ids dd2...)."
  - "A persona de demonstração entra direto no app: o script grava o progresso da entrada como concluído para as contas dd... (mesmas tabelas que o provisionamento usa), e conserta demo-ana se ela já tiver passado pela entrada (deixa uma cidade current só)."
  - "Passam: --filter @bivaque/app test, --filter @bivaque/app typecheck, --filter web test, --filter @bivaque/app test:e2e (PLAYWRIGHT_PORT=3294, PLAYWRIGHT_BUILD_PORT=3295) e gate completo no fechamento."

