  # estes dois specs travavam a navegacao antiga (4 containers e fallback Perfil
  # para /messages) e ficariam vermelhos com a retirada de Comunidades autorizada
  # pelo dono; reconcilia-los mantendo cobertura faz parte do contrato.
  - tests/e2e/manaus-pilot-full-journey.spec.ts
  - tests/e2e/nav-container-invariant.spec.ts
  # Revisao independente GLM (05/10/2026): este spec travava contagem de abas e
  # o alvo 44px do link Indicoes, ambos obsoletos com a navegacao desta versao;
  # reconciliar mantendo cobertura de acesso/foco/tamanho.
  - tests/e2e/shell-accessibility-denials.spec.ts
  # Paleta aprovada pelo dono em 05/10/2026 entra na arquitetura canonica de
