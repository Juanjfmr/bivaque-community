  - apps/web/app/(shell)/salvos/
  - apps/web/lib/saves/
  - tests/unit/
  - docs/agents/tasks/RECON-038.task.yml
  - tools/backend-kanban/public/board.json
  - tools/backend-kanban/BOARD.md

forbidden:
  - inventar dado para preencher bloco da prancha; sem fonte real, o elemento vira pendência nomeada no card
  - apagar, afrouxar ou pular teste para deixar o gate passar
  - tocar public.profiles, is_suspended ou is_account_suspended
  - mudar schema, migration aplicada, policy ou estado do banco compartilhado
  - remover o segundo Publicar sem conferir que o do compositor continua publicando
  - trocar um fluxo por outro parecido com o mesmo rótulo

acceptance:
  - a marca aparece como a prancha desenha, em todas as larguras
  - o seletor de cidade e a busca ocupam as posições da prancha
  - existe um único Publicar, e ele publica
  - a lateral destaca a rota atual em /inicio, /explorar e /salvos
  - o item de lateral ativo é derivado da rota, com teste que falha se voltar a divergir
  - as abas de Salvos correspondem à prancha, ou a diferença fica registrada com o motivo
  - cada elemento ausente do Início é entregue com fonte de dado real, ou nomeado como pendência no card com a razão
  - gate completo verde, com o código de saída lido diretamente
  - capturas de /inicio, /explorar e /salvos em 375/768/1440 confrontadas com as pranchas, e as diferenças restantes listadas

proof:
  - node scripts/agents/task-contract.mjs docs/agents/tasks/RECON-038.task.yml
  - npx pnpm@11.18.0 gate
  - node scripts/visual/capture.mjs com BIVAQUE_VISUAL_ROUTE=/inicio, /explorar e /salvos

traps:
  - As três capturas atuais deram ZERO achados na auditoria mecânica e mesmo assim têm treze divergências; auditoria verde não é fidelidade
  - Nao canalize o gate por tail ou head — o codigo de saida vira o do pipe e vermelho vira verde
  - Antes de confiar em captura, compare apps/web/.next/BUILD_ID com o mtime dos arquivos editados
  - O build precisa das variaveis NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY no ambiente; o stack local responde em 127.0.0.1:55321
  - app-shell.tsx ja foi alterado por RECON-021 e RECON-032 fora do escopo deles; confira o que existe antes de reescrever

risk: >
