acceptance:
  - A rota / mostra a landing v8 com os textos do protótipo palavra por palavra (título F, seções, perguntas, rodapé)
  - Todo "Criar conta" leva a /signup e "Entrar" a /login; os links de Privacidade e Código de conduta vão às páginas do Next; o que não tiver destino público no Next sai e é listado em docs/agents/PORT_001.md
  - Material Web registrado só no cliente, importando só os componentes usados; tags tipadas; sem erro de hidratação no console
  - Noto Sans, Noto Serif e Material Symbols Outlined via next/font/local; nenhuma requisição externa
  - Tokens --md-sys-color-* e --bv-* da R70 com par claro e escuro, aplicados por prefers-color-scheme na landing, sem quebrar o tema HeroUI das outras telas
  - Mesmo comportamento da R72 - menu em folha com foco contido e fundo inerte, barra fixa fora do teclado quando escondida, alvos de 44 px, movimento reduzido
  - Comparação de captura com o protótipo em 375 e 1440, claro e escuro, salva em .visual/port-001/ lado a lado, e o spec e2e afirma textos, rotas, contraste e ausência de requisição externa
  - O contrato de escopo aceita exatamente HeroUI e @material/web durante a migração
proof:
  - npx pnpm@11.18.0 gate
  - npx pnpm@11.18.0 --filter web build
  - npx playwright test tests/e2e/landing-v8.spec.ts tests/e2e/smoke.spec.ts
