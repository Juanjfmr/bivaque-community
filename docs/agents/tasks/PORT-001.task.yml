task_id: PORT-001
objective: >
  Rodada 73, piloto do porte visual: a landing pública do Next (rota /) passa a ser a landing v8 do
  protótipo (R71 e R72), com o título F, na pele da marca, nos temas claro e escuro conforme o sistema,
  feita com Material Web 2.5.0 por adaptadores cliente, Noto self-hosted e ícones Outlined. Fica igual
  ao protótipo na comparação de captura em 375 e 1440, sem requisição externa.
authority:
