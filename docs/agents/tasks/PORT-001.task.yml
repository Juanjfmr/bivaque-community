  - carregar fonte, imagem ou script de CDN
  - mudar outras telas além da landing, ou o tema HeroUI das telas ainda não portadas
  - apagar arquivos existentes de apps/web/public/landing (há spec que usa hero-bivaque-arrival.webp)
