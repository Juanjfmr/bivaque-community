# Atômico exigiria reimplementar o provisionamento (membership + perfil) dentro
# da migration ou refatorar apps/web/lib/onboarding/verifyAndProvision.ts, que
# está fora dos allowed_paths — nos dois casos um segundo caminho de admissão,
# que é o que provision.ts existe para evitar. Então: o aceite devolve ok e o
# MESMO vínculo quando o próprio aceitante repete o código, e o servidor conclui
# o provisionamento. Para a retomada ser alcançável, acceptInviteAction deixa de
# rodar o preview quando já existe sessão com o e-mail do formulário (o preview
# responderia unavailable e barraria antes do aceite). A retomada não chama
# provisionMember quando já há localidade corrente: provision_member_locality
# fecha a corrente antes de inserir a nova, então repetir moveria a pessoa (e,
# na mesma localidade, a deixaria sem corrente); o perfil é garantido à parte.
# Provas: pgTAP (mesmo vínculo, segundo vínculo inexistente, outra pessoa recebe
# a resposta genérica) e tests/unit/convite/invite-provision.test.ts (falha no
# meio e nova tentativa conclui; quem já tem localidade não é movido).
