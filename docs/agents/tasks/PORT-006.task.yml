# P2-4 (falha invisível no formulário). stageError (apps/web/lib/convite/
# form-error.ts) decide: erro de campo da etapa atual fica no campo; erro sem
# campo, ou de campo de outra etapa (field code na etapa da conta), vai para
# o EntryError da etapa, que tem role=alert. As listas de campos por etapa
# vivem no mesmo módulo, para o teste usar a lista que o componente usa.
#
# P2-5 (testes que não provam). invite-screen.test.ts perdeu a prova por
# posição de texto e a busca por NO_LINK. No lugar: invite-actions.test.ts roda
# acceptInviteAction com o cliente Supabase simulado e confere a ordem
# (preview → signUp → consentimento → aceite; sem preview com sessão do mesmo
# e-mail) e cada falha (preview recusado, limite, e-mail diferente, cadastro
# barrado, confirmação pendente, aceite recusado, exceção no aceite);
# invite-provision.test.ts confere a ordem das chamadas do provisionamento.
