acceptance:
  - Salvos lista o que foi guardado por tipo, permite abrir e remover, e sincroniza com o botao de salvar das origens
  - item retirado aparece como indisponivel em Salvos, sem revelar o conteudo antigo
  - o dialogo de denuncia segue a prancha 56 - pergunta, lista fechada de motivos, explicacao opcional com contador e os dois botoes
  - o servidor valida alvo, tipo e acesso, e recusa motivo fora da lista inclusive por chamada direta sem interface
  - o recibo aparece somente depois de persistir, e o acompanhamento mostra situacao, motivo e a propria explicacao ao expandir
  - a conversa tem URL estavel, e abrir direto reconstroi o estado correto
  - a ajuda leva a documentos legais reais e ao canal de suporte configurado, sem inventar chamado
  - o estado de leitura persiste e o contador de nao lidas acompanha, sem entrega duplicada por recarregar
  - todos os estados fechados - carregando, vazio verdadeiro com acao util, erro recuperavel e sessao expirada
  - exatamente um h1 por tela, contraste maior ou igual a 4,5:1, alvos maiores ou iguais a 44x44 e foco visivel
  - as rotas novas estao cadastradas em scripts/visual/capture.mjs com fixture concreta

