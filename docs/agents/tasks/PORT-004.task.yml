# Segunda correcao da revisao (Codex, 22/10/2026). Branch codex/entrada-elegibilidade, base 47f84b71.
#
# Bloqueio 1 (P1) - a aprovacao concorrente podia voltar o resultado para pending.
# - supabase/migrations/20261023100100_verification_document_replacement.sql: a funcao agora trava
#   antes de decidir qualquer coisa. A conferencia de `verified` saiu de antes da trava e passou a
#   ler a linha do resultado depois de travar: se ela ja diz `verified`, a troca e recusada, e nada
#   de `pending` e gravado por cima da decisao.
# - A ordem das travas e documento pendente -> resultado, a mesma de decide_verification_document, e
#   e deliberada: com o resultado primeiro (o caminho natural), o operador que ja segura a linha do
#   documento enquanto espera a do resultado fecharia deadlock (40P01) exatamente na corrida que a
#   trava existe para resolver. Nenhum estado e lido antes da trava do resultado, e ela e o ponto de
#   serializacao.
# - O insert `on conflict (user_id) do nothing` garante uma linha para travar quando a pessoa nunca
#   teve resultado, com o mesmo `pending` que a funcao gravaria no fim.
# - Conferido: decide_verification_document (20260821000040, revisada em 20260922153901) grava nessa
#   mesma linha na mesma transacao, pelo upsert de private.upsert_verification_outcome. A trava
#   serializa as duas operacoes; o pg_advisory_xact_lock do roteiro nao foi necessario.
# - Teste: supabase/tests/verification-document-replacement.sql, 9 asserts novos (plan 12 -> 21).
#   Aprovar e depois trocar: recusa, resultado segue verified, nenhum documento novo na fila.
#   Trocar e depois decidir pelo id antigo: a decisao falha, o resultado segue pending e a analise
#   pendente e a do documento novo. O comentario explica que a serializacao vem da trava e nao da
#   ordem do teste, porque o pgTAP roda numa unica conexao.
# - Observacao, nao corrigida aqui por estar fora do roteiro: submit_verification_document tem o
#   mesmo padrao conferir-depois-inserir e continua exposto a essa corrida. Candidato a cartao.
#
# Bloqueio 2 (P2) - o arquivo antigo podia ficar para sempre no bucket.
# - Nao existe varredura agendada de objetos, e isso foi conferido antes de escolher o ramo:
#   o cron diario bivaque-verification-document-ttl-purge so marca a linha como purged
#   (private.verification_documents_purge_expired nao toca o Storage); sweepOrphanedUploads roda
#   apenas no proximo envio da mesma pessoa e so alcanca objetos com mais de uma hora;
#   /api/internal/account-deletion limpa a pasta de contas excluidas. O caminho substituido ficava
#   mesmo para sempre, entao vale o ramo do roteiro em que a limpeza nao existe.
# - apps/web/app/(preauth)/onboarding/document-actions.ts: a remocao e tentada duas vezes. Se as
#   duas falham, o caminho vai para private.verification_document_removals pela RPC idempotente
#   enqueue_verification_document_removal. O envio continua valendo nos dois casos.
# - A migration cria a fila: tabela privada, RLS habilitada e forcada, sem privilegio para
#   anon/authenticated, so service_role; a RPC tem o mesmo grant. Nada de conteudo do documento, so
#   o caminho do objeto. supabase/database.generated.ts ganhou a assinatura da RPC nova.
# - A fila precisa de um processador; nao criei job, por regra da tarefa. Cartao a abrir pelo
#   coordenador: processar private.verification_document_removals removendo objeto e linha.
# - Teste: tests/unit/onboarding/document-replacement-removal.test.ts, 5 casos - remocao na primeira
#   tentativa sem fila, remocao na segunda tentativa sem fila, fila depois de duas falhas, envio
#   preservado quando a fila tambem falha, e nenhuma tentativa quando nao houve arquivo substituido.
#
# Bloqueio 3 (P2) - testes quebrados pela falta de mock.
# - tests/unit/security/photo-upload-action.test.ts: o mock de web/lib/onboarding/document-status
#   passou a fornecer readDocumentStatus, que a action usa desde a troca do documento. Eram as 5
#   falhas reproduzidas pelo Codex (identidade jpeg/png x 2 orientacoes + o PDF byte a byte).
# - tests/unit/security/identity-pdf-content.test.ts tinha a mesma falta e mais 1 falha, que a
#   contagem por arquivo nao pegou. Corrigido igual. A pasta tests/unit inteira esta verde.
#
# Falhas anteriores encontradas ao rodar a pasta inteira. Reproduzem no HEAD, em arquivos que esta
# correcao nao toca:
# - tests/unit/ui/copy-fala-com-a-pessoa.test.ts reprovava a copy vinda do prototipo (a expressao
#   fonte oficial nas telas de elegibilidade). A regra o banco explicado pegava esse texto, que o
