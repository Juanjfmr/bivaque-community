# Falha anterior encontrada pelo test:scope (nao era desta correcao):
# - tests/e2e/onboarding-elegibilidade.spec.ts preenchia um CPF invalido com os onze digitos
#   repetidos, e o scanner de segredos tratava o valor como CPF numeric: os digitos verificadores do
