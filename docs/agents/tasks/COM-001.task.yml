# e2e (ambiente, primeira rodada): uma rodada com servidor proprio iniciado sem SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY fez /admissions e a resolucao de denuncia devolverem 500 e o onboarding nao listar as cidades; nao era o diff — com o servidor do Playwright, que herda o env de supabase status, os mesmos specs passaram (127/127)
