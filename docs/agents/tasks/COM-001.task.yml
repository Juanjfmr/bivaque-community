# e2e (limite): o negativo do BANCO para publicacao sem grupo e o pgTAP (supabase/tests/publicacao-so-em-grupo.sql); o e2e prova que a tela nao oferece o que o banco recusaria
# visual: NAO rodei o loop visual nesta revisao — a prova de tela vem dos e2e acima; a comparacao de captura com o prototipo nao foi refeita
# pendente: manaus-pilot-full-journey.spec.ts nao foi tocado, como o contrato pede (a falha da linha 130 e do lote 4). Ele afirma o botao Publicar em /community, que esta revisao tirou: essa linha precisa sair junto com a correcao do convite legado, no mesmo arquivo do coordenador
