task_id: COM-001
objective: >
  Lote 5, tarefa N2 (revisao de 23/10/2026): sem publicacao para a cidade inteira, como no prototipo. O feed da
  cidade sai — o Inicio nao mostra feed e a leitura feed_locality nem chega ao banco —, o compositor publica so
  dentro de um grupo, o banco recusa publicacao sem grupo na policy de insert (nao num CHECK, para o seed antigo
  continuar carregando) e a linha de publicar sai de /community. A vista Conversa continua fora da Comunidade.
authority:
  - docs/decisions/ADR-20261023-comunidade-do-prototipo.md (aceito pelo dono em 2026-10-23; item Sem publicacao para a cidade inteira)
  - docs/agents/mapas/lote5-comunidade.md
  - prototypes/bivaque-html/src/features/ (a especificacao)
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Mapa prototipo x Next de 23/10/2026 (docs/agents/mapas/lote5-comunidade.md): as telas e o banco divergem
    do prototipo nos pontos do objetivo. Base codex/lote5-base (main com os PRs 106 a 111).
allowed_paths:
  - supabase/migrations/
  - supabase/tests/
  - supabase/database.generated.ts
  - apps/web/app/(shell)/inicio/
  - apps/web/app/(shell)/community/
  - apps/web/app/components/bivaque/feed-post-shared.tsx
  - apps/web/app/components/bivaque/feed-post-create.tsx
  - apps/web/app/components/bivaque/feed-post-audience.tsx
  - apps/web/app/components/bivaque/feed-post-card.tsx
  - apps/web/app/components/shell/create-menu.tsx
  - tests/unit/
  - tests/e2e/
  - scripts/port/
  - docs/agents/tasks/COM-001.task.yml
forbidden:
  - push, merge, deploy, db push ou --linked
  - db reset fora da fila (o unico permitido e node scripts/agents/prova-fila.mjs -- npx supabase db reset --local)
  - criar ou commitar apps/web/.env.local ou supabase/config.toml
  - instalar pacotes
  - editar arquivos de outra tarefa do lote 5
  - editar prototypes/bivaque-html
acceptance:
  - Migration na faixa 20261024100000 recusa publicacao sem grupo na policy de insert (group_id is not null); o pgTAP prova o positivo (grupo de que se participa) e os negativos (cidade sem grupo, vila sem grupo, grupo Fechado sem participacao)
  - O Inicio nao mostra feed da cidade; a Comunidade fica com o painel de Indicacoes, sem feed, sem vista Conversa e sem linha de publicar
  - O compositor so oferece os grupos da pessoa; sem grupo nenhum, o estado honesto leva a /groups e o primario fica desabilitado
  - e2e do Inicio sem feed e do compositor so em grupo, alem dos specs realinhados ao feed do grupo
proof:
  - node scripts/agents/prova-fila.mjs -- npx supabase db reset --local --no-seed
  - node scripts/agents/prova-fila.mjs -- npx pnpm@11.18.0 test:db
  - npx pnpm@11.18.0 gate
  - npx pnpm@11.18.0 --filter web build
  - node scripts/agents/prova-fila.mjs -- npx supabase db reset --local
  - e2e da tarefa pela fila
risk: policy de insert de posts muda; publicacao sem grupo passa a ser recusada, e o chip de alcance do grupo passa a renderizar
adr: docs/decisions/ADR-20261023-comunidade-do-prototipo.md
risk_level: R3
reviewer_must_differ_from_executor: true
retry_budget: 3
on_budget_exhausted: HUMAN_DECISION
closure:
  requires_runtime_evidence: true

