# (todas as provas abaixo foram rodadas e lidas nesta sessao)
# test:db: PASS — 155 arquivos, 2266 testes. supabase/tests/publicacao-so-em-grupo.sql ok (4 asserts: positivo de publicar no grupo de que se participa e negativos de cidade sem grupo, vila sem grupo e grupo Fechado sem participacao)
# test:db (realinhamento): os pgTAP que publicavam na cidade passaram a publicar no grupo das fixtures — community-feed-happy-path (8 inserts), community-feed-denials (19), event-photos-storage (1), full-regression (2, no grupo de regression.inc) e transfer-degradation (2, um grupo novo no destino); transfer-degradation e full-regression nao mudam nenhuma contagem
# generate:types: feed_locality saiu do database.generated.ts (26 linhas) e nada mais mudou — a leitura nova nao existe no banco
# gate: VERDE em lint, typecheck, typecheck:e2e, test e secrets; o estagio build foi PULADO porque apps/web/.env.local nao existe (proibido criar neste lote)
# build: ok — pnpm --filter web build com NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY exportadas de supabase status -o env (sem criar arquivo de env); rodado duas vezes, antes e depois do fix do chip
# e2e 1: inicio-sem-feed (4 testes), publish-golden-slice (2), question-first-order (3), audience-selector (2), empty-locality (3) — 42 passou, 0 falhou (3 projetos, pela fila, --workers=1)
# e2e 2: two-localities (8), reports-member-flow (1), synthetic-people-interaction (2), journey-quando-algo-falha (1), denied-publish (1), feed-attachment-publish (5), publish-primary-hittable (5), photo-upload (1), close-label-ptbr (4), ds-029-conformance-probes (6), indicacoes-memoria (1), shell-navigation (6) — 127 passou, 8 skipped, 0 falhou
