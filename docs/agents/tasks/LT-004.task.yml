# Molde: RUN-133 (retirada de /events, PR #176) e LT-002 (retirada de /explorar/busca,
# PR #215). O lado do app JÁ está pronto e provado: /app/avisos (Avisos.tsx, ligado a
# /api/app/avisos, E2E f09-avisos-real.spec.ts) e preferências embutidas em Você
# (PreferenciasDeAvisos em Voce.tsx:190). Este lote é só o lado web: 307 + remoção +
# migração de specs. NÃO tocar apps/app nem a API.
#
# DECISÕES DE ESCOPO (registradas, do mapa F09 do explore):
# (D1) /configuracoes/notificacoes -> /app/voce (é onde a matriz de preferências vive;
#      precedente /configuracoes/familia -> /app/voce). /app/avisos é a caixa, não as prefs.
# (D2) Índice /configuracoes (page.tsx faz redirect de página) passa a apontar para
#      /configuracoes/conta (única seção que fica), evitando cadeia de 2 saltos. Continua
#      página web (redirect de página é invisível ao resolver do TROCADAS).
# (D3) A caixa antiga enriquecia a linha com o nome do prestador; o app mostra a frase
#      neutra Seu pedido recebeu uma resposta (rotuloDoAviso não tem o caso do nome).
#      journey-pedir-servico.spec.ts migra para a frase NEUTRA (não tocar app/API no lote
#      de troca). O enriquecimento com o nome vira follow-up próprio (card a abrir).
# (D4) nav-container-invariant.spec.ts (DS-011) testa a nav ANTIGA da web em /notifications;
#      depois da troca não há nav web na rota (avisos é sem-aba no app). Converter em prova
#      de 307 (ou aposentar com justificativa + cobertura substituta), nunca apagar sem substituir.
# (D5) deep-links.ts é MOVIDO para apps/web/lib/notifications/deep-links.ts (não apagado):
#      consumidor de produção vivo = lib/notifications/destino-do-app.ts (usado pela API avisos).

