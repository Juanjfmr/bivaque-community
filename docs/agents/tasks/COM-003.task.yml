  - node scripts/agents/prova-fila.mjs -- npx pnpm@11.18.0 test:db
  - npx pnpm@11.18.0 gate
  - npx pnpm@11.18.0 --filter web build
  - node scripts/agents/prova-fila.mjs -- npx supabase db reset --local
  - e2e da tarefa pela fila
risk: colunas novas em groups e group_memberships com RLS
adr: docs/decisions/ADR-20261023-comunidade-do-prototipo.md
risk_level: R3
reviewer_must_differ_from_executor: true
