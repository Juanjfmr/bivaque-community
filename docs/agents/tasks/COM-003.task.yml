  - db reset fora da fila (o unico permitido e node scripts/agents/prova-fila.mjs -- npx supabase db reset --local)
  - criar ou commitar apps/web/.env.local ou supabase/config.toml
  - instalar pacotes
  - editar arquivos de outra tarefa do lote 5
  - editar prototypes/bivaque-html
acceptance:
  - Migration na faixa 20261024120000: coluna rules em groups, nivel de aviso por membership, flag de publicacao fixada (uma por grupo, so o admin fixa), com RLS e pgTAP positivo e negativo
  - Telas e textos de prototypes/bivaque-html/src/features/groups/ (views.js, editors.js, presets.js) para lista, detalhe, criar e gerenciar, com os rotulos Aberto e Fechado
