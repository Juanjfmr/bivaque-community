# RUN-163 — troca do /profile/interests (web) pelo app.
#
# A folha Interesses do app (RUN-160) cobre a tela web por completo (mesmos
# RPCs canonicos; pgTAP + E2E real). A tela web /profile/interests e suas pecas
# saem com redirect 307 → /app/voce no mesmo lote (criterio 6 / SPA ADR §8).
# Perda declarada e aceita: o app landing nao abre a folha direto (folha e
# estado da entrada, nao URL; nao construir ?folha=). A linha Interesses esta na
# primeira dobra do Voce.
#
# ANTES de remover: CONFIRMAR que POST /api/app/voce/interesses exige a mesma
# admissao que a web exigia em interests-actions.ts:90-143 (verificada OU
# familiar admitida; cidade do vinculo). Se a rota do app NAO conferir admissao,
# o portao de verificacao nao pode morrer com a web — portar a checagem para a
# rota do app (modulo compartilhado) com teste positivo E negativo, e manter a
# prova equivalente (interests-require-verification).
#
# /profile (proprio) e /profile/editar NAO sao deste lote (exigem decisao de
# paridade: transferencia de cidade, afiliacao, avatar). Tocar editar So para
# o link de interesses apontar direto ao app (link web para tela que sai).

task_id: RUN-163

objective: >
