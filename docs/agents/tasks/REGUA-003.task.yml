forbidden:
  - criar rota de API, mudar apps/web além do campo ultimaEm em GET /api/app/conversas, supabase, banco ou migrations
  - adicionar dependência
  - usar Brasa fora do Criar (ADR-20261118)
  - mostrar Força, OM, posto ou selo de verificação de outro membro (BLOCK-AFFILIATION)
  - afrouxar, pular ou apagar teste existente para ficar verde; mudar o comportamento de bloqueio, denúncia ou envio além do descrito
  - tocar em telas de outras jornadas além do efeito da casca e das peças compartilhadas
  - git stash, reset de banco, delegação, push, board
acceptance:
  - "barra de baixo: em nenhuma rota e largura abaixo de 1024 px há vão; nas raízes das cinco abas o Criar aparece; fora delas os itens se redistribuem sem buraco (ou o Criar aparece) — teste unitário da regra e prova no E2E de casca"
  - "iniciais: uma única função para toda a app, mesma pessoa → mesmas iniciais e mesmo tom no cartão, na barra e na lateral; os simuladores das capturas usam a mesma pessoa na sessão e no perfil"
  - "Conversas: cada linha da caixa é uma linha só (avatar, nome, prévia, horário relativo, e o contexto como texto curto ou miniatura na própria linha), sem cartão solto; o cabeçalho da conversa mostra o item (título e, quando houver, foto e preço) e não só o tipo; horário nos balões; o ponto de não lida some ao abrir; denúncia por mensagem fica no menu da mensagem ou num toque, não como bandeira fixa; o menu ⋯ tem Denunciar e Bloquear; campo de mensagem em pílula sem alça de redimensionar; respostas rápidas em faixa horizontal com rolagem; envio que falhou fica só no balão com Tentar de novo e o campo volta limpo; rádios da denúncia na cor de tinta"
  - "Avisos: preferências na mesma largura de leitura das demais seções em 768 e 1440; Gravar preferências em barra fixa no rodapé no celular e bem formada no computador; botões em pílula; Marcar todas como lidas; vazio com saída para as preferências; cabeçalho alinhado"
  - "Você: falha fala com a pessoa ('Não foi possível carregar seu perfil') com Tentar de novo em pílula e mantém a estrutura do sucesso, incluindo Mudar de cidade; perfil de membro com nome inteiro em 375 (quebra linha em vez de cortar) e ação de mensagem quando a rota de conversa existente permitir, com ⋯ Bloquear e Denunciar; Salvos com o mesmo ícone de salvo nas linhas e nos cartões, respiro entre seções, grade que ocupa a coluna em 1440; vazios com cartão na largura da coluna"
  - "no computador o título da barra do topo se alinha à coluna de conteúdo nas telas destas jornadas"
  - "capturas cegas regeradas (capturas-f09-f10.spec.ts, portas PLAYWRIGHT_PORT=3310 PLAYWRIGHT_BUILD_PORT=3311) e relatório em .visual/regua-003/RELATORIO.md: achado → arquivo → como foi resolvido, ou por que ficou"
