task_id: REGUA-003
objective: >
  Conversas, Avisos e Você (F09 e F10) ficam no nível da régua Nextdoor em 375/768/1440 no tema
  claro, corrigindo os achados graves e médios da revisão às cegas de 23/11: a barra de baixo nunca
  tem vão, a mesma pessoa tem as mesmas iniciais em toda parte, a conversa mostra o item de que trata,
  nenhuma tela vira coluna de celular solta no computador e nenhum dado principal é cortado.
authority:
  - docs/LANCAMENTO.md (F09 e F10, critério 2)
  - tools/backend-kanban/public/board.json (LAN-F09 e LAN-F10, nota de 23/11 da revisão às cegas)
  - docs/decisions/ADR-20261118-brasa-so-no-criar.md
  - docs/decisions/ADR-20261116-bloqueio-e-denuncia-pela-porta-do-app.md
  - docs/agents/regua-nextdoor/PADRAO-DE-TELA.md
  - docs/agents/regua-nextdoor/IDENTIDADE-DAS-PECAS.md
  - "Mobbin, Nextdoor web, perfil de vizinho (botão Message escuro, ⋯ no canto): https://mobbin.com/screens/041fb7de-0cfe-46de-9d78-37448e7f0493"
  - "Mobbin, Nextdoor iOS, menu ⋯ como folha de baixo: https://mobbin.com/screens/f23df80d-4b7d-4a7a-8abc-fdeadbc0bedd"
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Revisão às cegas de 23/11 sobre a main 9c075d211 (capturas de
    apps/app/tests/e2e/cegas/capturas-f09-f10.spec.ts, tema claro, revisor Claude independente com
    só imagens e régua): F09 Avisos, F09 Conversas e F10 Você REPROVADAS. Vereditos em
    .visual/cega-003/vereditos/. Graves: (1) a barra de baixo mostra um vão entre Comunidade e
    Mercado em /voce, /avisos e nas preferências em 375 e 768 (criaVisivel em apps/app/lib/casca.ts
    tira o botão mas o espaço fica); (2) há duas funções iniciais(): apps/app/src/pecas/pecas.tsx
    (primeira e última: "AF") e apps/app/lib/texto.ts (duas primeiras: "AB"), então a mesma "Ana
    Beatriz Ferreira" aparece como AF no cartão e AB na navegação; nas capturas de 1440 a lateral ainda
    mostra "RS" por sessão simulada diferente do perfil; (3) preferências de avisos em coluna de ~320 px
    solta em 1440 e duas larguras de coluna em 768; (4) a caixa de Conversas põe um cartão branco solto
    ("Anúncio", "Serviço", "Grupo em comum") sob cada linha, sem dizer qual item; o cabeçalho da conversa
    diz só "Anúncio", sem título, foto ou preço; (5) nome do membro cortado ("Paulo Robe…") em 375 no
    perfil de membro, que também não tem ação de mensagem. Médios: envio que falhou repõe o texto no
    campo além do balão com "Tentar de novo"; bandeira de denúncia fixa ao lado de cada mensagem
    recebida; menu da conversa só com Bloquear; campo de mensagem retangular com alça de
    redimensionar; respostas rápidas empilhadas (~170 px); sem horário na caixa e nos balões; ponto de
    não lida continua com a conversa aberta; rádios azuis nativos na denúncia; "Tentar de novo" e
    "Gravar preferências" sem forma de pílula; "Gravar preferências" fora de barra fixa no celular e
    barra fixa malformada em 1440; texto de falha do Você descreve o sistema ("Leitura do perfil
    indisponível agora"); "Mudar de cidade" some na falha; vazios com ícone genérico em mancha e cartão
    vazio mais estreito que a coluna do título; ícone de salvo em contorno nas linhas e cheio nos
    cartões; títulos de seção colados no bloco anterior em Salvos; título da barra do topo no
    computador fora do alinhamento da coluna de conteúdo.
decisions:
  - "Coluna de contexto lateral não é exigida neste lote: a página de notificações e o perfil do Nextdoor web também usam uma coluna central. O que se exige é a largura de leitura da régua (sem coluna de ~320 px solta) e o título da barra do topo alinhado à coluna."
  - "Sem rota nova: o item da conversa vem dos dados que o app já lê (contextoId e as leituras existentes de anúncio, negócio e grupo); se o tipo não tiver leitura existente, o cabeçalho mostra o tipo e o nome do item quando houver, e o relatório registra o que faltou."
  - "Rodada 3 (23/11, coordenador): a caixa de Conversas ganha o horário da última mensagem pelo campo ultimaEm na resposta existente de GET /api/app/conversas (sem rota nova, sem migração: o servidor já lê created_at); o leitor do app e os testes da rota acompanham. Denunciar membro sem rota própria abre a folha de denúncia da conversa existente, nunca navega em silêncio."
  - "Ilustrações novas dos vazios ficam fora: os vazios usam as ilustrações da família que já existem em apps/app (procure as usadas em Conversas vazia e Comunidade); se nenhuma servir, o vazio fica sem figura em vez de ícone em mancha."
