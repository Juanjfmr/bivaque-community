forbidden:
  - editar a referencia HTML congelada, styles globais existentes, data/demo ou vendor
  - mudar a Inicio ou o menu Criar do celular e do tablet
  - alterar backend, Supabase, migrations, politicas ou interfaces Next e Figma
  - fazer merge ou push sem confirmacao
acceptance:
  - A partir de 1024 px a Inicio tem duas colunas; abaixo disso fica identica a anterior, inclusive ao redimensionar
  - Sem estrelas; patrocinado rotulado e visivel tambem no notebook
  - Aviso pessoal na ordem pergunta respondida, pedido com propostas, avisos nao lidos
  - Cartao de chegada pelo momento e Vou confirmando o proximo encontro
  - Painel Criar com 7 opcoes, foco na primeira, Esc devolve o foco ao botao, X fecha
  - Atalho C abre o Criar no desktop e nunca dentro de campo de texto nem no celular
  - Todos os icones existem na fonte embutida
  - Nova base visual congelada e regressao de todas as rodadas, visual e gate
proof:
  - BIVAQUE_HTML_CONTEXTS=375-light,375-dark,768-light,768-dark,1024-light,1024-dark,1440-light,1440-dark node scripts/bivaque-html/round13-proof.mjs
  - node scripts/bivaque-html/round01-proof.mjs
  - node scripts/bivaque-html/round01-visual.mjs --deterministic-renderer
  - node scripts/bivaque-html/visual-stability.mjs
  - npx pnpm@11.18.0 gate
risk: layout da Inicio do desktop e menu Criar, so no prototipo
