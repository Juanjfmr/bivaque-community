task_id: HTML-013
objective: >
  Rodada 13 cria a Inicio do desktop (a partir de 1024 px) aprovada pelo usuario: titulo
  "O que voce precisa", busca e atalhos em linha, aviso pessoal por prioridade, Precisa
  contratar, servicos com indicacoes e patrocinado rotulado, oportunidades e coluna lateral
  com grupos, proximo encontro com Vou e chegada pelo momento. O botao Criar do desktop vira
  "+ Criar" e se desdobra num painel de criacao, com atalho de teclado C. Celular e tablet
  mantem a Inicio e o menu Criar originais. A Inicio aprovada vira a nova base visual congelada.
authority:
  - Pedido explicito do usuario em 2026-10-15 para implementar a Inicio web da versao 2 com os ajustes
  - Decisao do usuario em 2026-10-15 - so desktop; nova base visual aprovada
  - Pedidos do usuario em 2026-10-15 - otimizar espaco, corrigir texto do encontro, Bivaque maior, botao Criar alinhado e menos generico
  - Aprovacao do usuario em 2026-10-15 do painel Criar inspirado no 21st.dev e no Mobbin
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    HEAD e44026d5. No desktop a Inicio era a do celular esticada (uma coluna, conteudo limitado
    a 1120 px, servicos abaixo de grupos e desapegos); o "+" do botao Criar ficava 8 px fora do
    centro e o menu era uma pilha de botoes sem descricao.
allowed_paths:
