# F10 — gestao de interesses pos-onboarding (pares usuario-grupo).
#
# Interesses sao pares usuario↔grupo (NAO taxonomia de temas): a migration
# 20260821000003_user_group_interests diz Interests map directly to groups — no
# parallel taxonomy, finalidade unica sugerir grupos (LGPD). O dado JA e gravado
# no onboarding pelo RPC canonico record_user_group_interests (POST
# /api/app/entry/interests). Falta so a gestao pos-onboarding (ler/alterar/limpar)
# e a porta na tela Voce. SEM migration — tabela + RPCs prontos (list_available_
# groups_for_interests / list_user_group_interests / record_user_group_interests).
# Molde exato: entry/interests/route.ts:65-124 (CSRF, teto 20, UUIDs, dedupe,
# 409 sem-cidade, 503 sem eco) + interests-actions.ts:145-212.
#
# NAO construir Sugeridos nem personalizacao de feed (deferidos por
# ADR-20261023-comunidade-do-prototipo.md:127,184; fora do lancamento). NAO trocar
# a tela web /profile/interests neste lote — o F10 nao fecha so com interesses
# (perfil alheio pendente); a troca vem quando /profile sair por inteiro.
#
# Portao de admissao: seguir o molde entry/interests (pos-provisionamento, a
# pessoa ja esta no app); cidade so do vinculo da sessao, recusa de grupo de outra
# cidade vem do proprio RPC (42501). Registrar a decisao.

