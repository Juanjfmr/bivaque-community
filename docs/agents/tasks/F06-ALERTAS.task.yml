acceptance:
  - "GET+POST /api/app/imoveis/alertas e PATCH+DELETE /api/app/imoveis/alertas/[id] (2 route.ts) no ADR §5: exigirSessao; escrita com conferirEscrita + OPTIONS no molde das rotas mercado existentes; dono SEMPRE da sessao (nunca corpo); posse da linha decidida no banco pelas policies de dono — PATCH/DELETE de linha alheia = 404 sem confirmar existencia; POST espelha EXATAMENTE o que createListingAlertAction gravava (actions.ts:501 e :528-538: kind property, criterios exatamente como a tabela os define — ler as colunas na migration 20260911043053:174-196 e o dispatch :138-148 para nao inventar campo); validacao compartilhada num modulo so (estender lib/listings/alerts.ts, casa de alertSearchHref); limites/duplicata da action preservados; 503 sem eco."
  - "App: tela AlertasDeImovel no catalogo (path /imoveis/alertas, sem aba) — lista real, criar/editar (mesmos criterios do form web morto), ativar/pausar, apagar com Confirmacao da entrada (peca existente, sobreposicao por id; licao do menu: troca de sobreposicao, nao empilhamento). Estados honestos por linha (carregando/vazio real/erro/negado). O aviso listing_alert ja cai em /app/anuncio/:id (destino existente); a porta de entrada da tela segue o molde das irmas (linha no Voce ou aba que o app ja usa para salvos) — NAO abrir folha em Mercado.tsx nem toque em Anuncio.tsx."
  - "Harmonizacao declarada: alertSearchHref (lib/listings/alerts.ts:58-69) gera bairro/tipo_negocio/sort que o app NAO le (filtros-url le so q/tipo/quartos/valor_max/preco_*). Gerar a URL no formato que o app consome quando o criterio tiver essas chaves, e registrar no RELATORIO a perda do resto (bairro/tipo_negocio/sort) — nao prometer filtro silenciosamente ignorado."
  - "Troca: 307 /imoveis/alertas → /app/imoveis/alertas (query preservada; regra antes da generica /imoveis/:id que hoje exclui alertas pelo lookahead — conferir e manter as negativas de novo|alertas); remover (shell)/imoveis/alertas/ + alert-manager.tsx + alert-form.tsx; as 4 server actions de alerta morrem com as telas se sem importador vivo (grep). NAO limpar actions alem das de alerta (as de property ja morreram no RUN-164; o que sobrou em actions.ts nao e daqui)."
  - "Provas: unit das rotas em tests/unit/app-api/imoveis (POST grava criterio igual a action morta — comparar payload nos testes; 401/CSRF 403/validacao/nao-dono 404/duplicata/503 sem eco); TROCADAS + ausencia da pasta + negativas (/imoveis/:id detalhe e /imoveis lista intactos); link-crawl: tirar as portas declaradas de alertas em :196-210 sem deixar entrada stale; capture.mjs: rota web fora; E2E real novo tests/e2e/imoveis-alertas-real.spec.ts (@stateful): persona cria alerta pelo app, aparece na lista, desliga, apaga, persiste apos recarga (3 larguras via CI — sem seed de alertas, criar pela UI); tests/unit/listings/alerts.test.ts continua valendo para o modulo compartilhado."
  - "api-surface: duas rotas novas marcadas; TOTAL_DE_ROTAS recalculado CONTRA O DISCO apos git rebase origin/main no fim do lote (RUN-168 soma +2 na mesma janela — nao gravar numero no escuro; o teste do manifesto compara com a contagem real). Passam: gate --fast, tsc -p tests/e2e, pnpm test, test:scope, app test. Antes de tocar fora dos allowed_paths, EMENDAR este contrato primeiro."
  - "Emenda 16/11: tests/e2e/mercado-redirects.spec.ts e tests/e2e/portas-de-entrada.spec.ts afirmavam que /imoveis/alertas ficava na web. As duas provas se invertem para o 307 em /app/imoveis/alertas, sem perder as negativas de subcaminho (denunciar, novo/editar)."

