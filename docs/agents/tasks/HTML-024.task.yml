  - prototypes/bivaque-html/src/styles/empty-states.css
  - prototypes/bivaque-html/src/manifest.json
  - prototypes/bivaque-html/docs/
  - scripts/bivaque-html/
  - docs/agents/tasks/HTML-024.task.yml
forbidden:
