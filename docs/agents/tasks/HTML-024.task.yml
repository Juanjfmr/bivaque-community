task_id: HTML-024
objective: >
  Rodada 24 mostra um esqueleto so onde ha espera real (fotos carregando ou falhando) e troca os
  estados vazios por uma ilustracao leve, inspirada nos Skeleton e Empty State do 21st.dev.
authority:
  - Pedido do usuario em 2026-10-15 para executar a ordem sugerida de componentes do 21st.dev
  - Pedido do usuario em 2026-10-16 "Vai pro 24"
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    HEAD bdf77a5a. Fotos apareciam de uma vez depois de decodificar, com a moldura vazia; estados
    vazios eram so um icone numa caixa tracejada.
allowed_paths:
