  - Fotos a vista no primeiro desenho nao ficam presas carregando
  - Todo estado vazio tem a ilustracao, oculta do leitor de tela, com titulo e acao iguais
  - Movimento reduzido desliga as animacoes
proof:
  - BIVAQUE_HTML_CONTEXTS=375-light,1440-light node scripts/bivaque-html/round24-proof.mjs
  - BIVAQUE_HTML_CONTEXTS=375-light,1440-light node scripts/bivaque-html/round23-proof.mjs
