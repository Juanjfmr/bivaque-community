acceptance:
  - O menu de tres pontos da pergunta aparece so para o autor e oferece Editar pergunta, Marcar como resolvida (ou Reabrir pergunta), Compartilhar e Excluir pergunta
  - Editar pergunta reabre o texto preenchido e salva no mesmo registro, com a marca editada; texto curto demais nao salva
  - Excluir pergunta pede confirmacao com o numero de respostas e Isso nao pode ser desfeito; depois some das listas, da busca, da pagina do negocio que a citava, de Retomar, e o aviso que apontava para ela deixa de abrir
  - Resposta minha tem Editar e Excluir (com confirmacao); excluir a resposta marcada como solucao devolve a pergunta a sem solucao
  - Publicacao e comentario meus em grupo tem Editar e Excluir (confirmacao na exclusao) e os contadores de comentarios ficam coerentes; excluir o comentario que resolveu reabre a publicacao e retira a indicacao do negocio
  - Enquete com votos so muda o texto (opcoes e votos ficam); sem votos as opcoes tambem mudam, com o minimo de duas
  - Encontro meu em grupo e na Agenda tem Editar e Cancelar com confirmacao; mudar data, horario ou local, ou cancelar, avisa quantas pessoas que confirmaram foram avisadas
  - O menu nao aparece em conteudo de outra pessoa; armazenamento cheio nao perde nada e avisa que nao salvou; o Ocultar pessoal e a moderacao seguem como estavam
