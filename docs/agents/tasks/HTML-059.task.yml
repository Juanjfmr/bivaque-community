task_id: HTML-059
objective: >
  Rodada 59 do Lote Funcional: quem publicou edita e exclui o que publicou. Pergunta (menu de tres
  pontos so para o autor: Editar pergunta, Marcar como resolvida, Compartilhar, Excluir pergunta, com
  confirmacao que diz quantas respostas saem), resposta minha numa pergunta (Editar e Excluir; excluir a
  solucao devolve a pergunta a sem solucao), publicacao e comentario meus em grupo (Editar e Excluir com
  contadores coerentes; enquete com votos so muda o texto) e encontro meu em grupo ou na Agenda (editar
  e cancelar avisam quem confirmou presenca, aviso local). Conteudo de outra pessoa nao muda.
