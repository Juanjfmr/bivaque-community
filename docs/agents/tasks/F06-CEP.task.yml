acceptance:
  - "Migration nova: listings + cep text(9)-norm, latitude/longitude double precision null, localizacao_publica text in (exata, aproximada) null; CHECKs: imovel criado APOS a troca exige cep (avo sem cep continua valido — a exigicao vive na validacao da rota, nao num CHECK que quebraria linhas antigas; registrar isso no comentario da migration); item libera o bairro-obrigatorio (relaxar listings_item_required_fields no CHECK novo, mantendo titulo/descricao); grants por coluna no molde profiles (authenticated perde leitura de cep/lat/lng, dono ve via leitura propria explicita); purga de conta conhece as colunas; cep_geocodes intacto."
  - "Modulo unico de localizacao do anuncio (novo em apps/web/lib/geo ou lib/listings): recebe cep cru, normaliza, consulta cache (lerCepDoCache), miss chama geocodificador sob LIMITADOR por usuario (429 com mensagem propria; cache hit nao consome) e GRAVA cache; deriva cidade e bairro casando o address da BrasilAPI com neighborhoods por name_key (se derivar bairro, corrigir para vizinho como faz o perfil — espelhar o comportamento, nao reinventar); arredonda coordenada para baixo com piso ~300 m quando aproximada; CEP sem coordenada = sucesso parcial (cidade/bairro derivados, lat/lng null, localizacao forcada a aproximada — fecha LOC-CEP-SEM-COORDENADA com teste; nada de 422 travando anuncio interiorano)."
  - "POST /api/app/mercado kind=property exige cep + localizacao_publica (default aproximada se omitida — registrar); kind=item aceita cep opcional (com cep, coordenada aproximada FORCADA sem oferta de exata; com cep, bairro pode vir da derivacao ou do usuario; sem cep e sem bairro => 400 honesto agora que bairro e opcional so com cep? NAO: com o relaxo, item sem cep e sem bairro e valido mas a cidade da sessao permanece — espelhar ADR secao 2). PATCH aceita os mesmos ramos; editar imovel avo (cep null) sem fornecer cep => 400 com mensagem de primeira-edicao do ADR. Respostas das rotas NUNCA incluem cep/lat/lng crus; endereco publicado segue opcional e so aparece quando exata com endereco preenchido."
  - "SPA: formulario-imovel (criar) ganha campo CEP (inputmode numerico, mascara) + escolha exata/aproximada (aproximada default e unica opcao quando sem endereco digitado); Desapego ganha CEP opcional e bairro passa a opcional; lib/dados/mercado e filtros-url dao o formato ao POST; Anuncio.tsx mostra a escolha REAL do anunciante (aproximada: bairro-cidade + nota 'Local aproximado'; exata: endereco publicado quando houver) e some com a frase 'pode ser combinado na conversa' mentirosa onde o endereco agora existe."
  - "Provas: pgTAP novo (select-star de authenticated nao devolve cep/lat/lng; dono le a propria localizacao; to_jsonb 42501; purga de conta limpa; neighborhoods-match); unit da rota (property sem cep 400; avo PATCH sem cep 400-com-frase-do-avo; item sem bairro agora valido; cep-erro-formato; limitador 429 apos N misses com cache mockado; cache-hit nao conta); unit do modulo geo (arredondamento nunca abaixo do piso; sem-coordenada vira aproximada com cidade e bairro); E2E do app stub (criar imovel CEP-exato mostra endereco; criar sem-cep e impossivel no form); @stateful real: seed nao tem cep de anuncio — criar pelo UI com CEP sintetico pre-gravado no cache em fixTURE propria do spec (padrao seed.sql:235-240 de cache) e verificar o detalhe; recarga persiste; capture/rotas se algo mudou."
  - "LOC-LIMITE-GEOCODIFICACAO e LOC-CEP-SEM-COORDENADA: este lote fecha ambos com provas nomeadas no RELATORIO. TOTAL_DE_ROTAS inalterado (nenhuma rota nova — conferir disco apos rebase). Passam: gate completo incl. test:db e db:lint (lote mexe banco!), app test, pnpm test, test:scope, tsc -p tests/e2e. Antes de tocar fora dos allowed_paths, EMENDAR o contrato primeiro (itens em uma linha; sem aspas em comentarios)."

