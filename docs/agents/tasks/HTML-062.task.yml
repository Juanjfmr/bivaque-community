task_id: HTML-062
objective: >
  Rodada 62 do Lote Funcional: Apagar a conta e Ajuda com suporte. Ajuda (rota ajuda, aberta para quem
  saiu e para quem entrou) com quatro temas de 3 a 5 perguntas sobre o que o app faz hoje, cartao Nao
  achou com Fale com a gente e Meus chamados; Fale com a gente (assunto, texto de no minimo 10
  caracteres, e-mail da conta ou campo de e-mail sem conta) grava o chamado neste aparelho; Controles
  do prototipo ganham Simular resposta do suporte, que responde o chamado mais antigo e cria um aviso
  que abre Meus chamados; Apagar a conta em Configuracoes, confirmada digitando APAGAR, remove o que e da
  pessoa, anonimiza respostas e indicacoes, apaga as conversas, limpa perfil, entrada e chamados, sai da
  conta e mostra a tela Sua conta foi apagada com Voltar ao inicio.
authority:
  - Pedido do usuario em 2026-10-18: implementar a Rodada 62 do docs/LOTE_FUNCIONAL.md, a partir da AUDITORIA_FUNCIONAL_2026-10-18 e da maquete funcional aprovada (quadros 13 a 16); decisao do usuario: a confirmacao de apagar e digitar APAGAR
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    HEAD 0612251a (Rodada 59), build sem alteracoes. Prova round62 em 375-light: ver ROUND_62.md
    (rotas ajuda, contato, chamados e apagar-conta inexistentes; sem linha Ajuda, sem Apagar a conta, sem
    Simular resposta do suporte).
allowed_paths:
