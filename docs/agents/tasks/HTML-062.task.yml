forbidden:
  - guardar senha
  - guardar CPF ou documento de identificacao
  - editar a referencia HTML congelada, vendor ou a base visual congelada (.visual/**/baseline)
  - fazer merge, push, deploy ou git stash sem confirmacao
  - fora do escopo: bloquear e denunciar (rodada 60), encerrar grupo e pausar pagina (rodada 61), promessas da tela (rodada 63)
acceptance:
  - A Ajuda abre com e sem conta (visual da entrada para quem saiu, tambem pelo endereco direto e pelo rodape da landing) e por Voce e Configuracoes; cada um dos quatro temas abre de 3 a 5 perguntas com resposta
  - Fale com a gente exige texto de no minimo 10 caracteres (erro no campo), mostra A resposta vai para o e-mail da conta ou pede um e-mail valido sem conta, e ao enviar grava o chamado em state.tickets, avisa Recebemos e abre Meus chamados com o estado
  - Simular resposta do suporte nos Controles marca o chamado mais antigo como respondido e cria um aviso que abre Meus chamados; sem chamado aberto avisa e nao cria aviso
  - Apagar a conta so age com a palavra APAGAR (qualquer caixa, espacos nas pontas); sem ela mostra erro no campo e nada muda
  - Ao apagar saem anuncios, rascunhos, perguntas, pagina do negocio, encontros e pedidos da pessoa; respostas, indicacoes, publicacoes e comentarios ficam como Membro que saiu; conversas, avisos, chamados, convites e alertas sao apagados; perfil e entrada sao limpos e a pessoa sai da conta
  - A tela Sua conta foi apagada leva a landing por Voltar ao inicio; a conta apagada nao volta pelo login; a Ajuda continua aberta
  - Falha de gravacao nao deixa nada pela metade (apagar e enviar chamado)
