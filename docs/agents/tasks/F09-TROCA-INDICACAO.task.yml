  - push, merge, force-push, editar o quadro (tools/backend-kanban), tocar outra worktree
  - supabase start/reset ou escrita em banco (o coordenador roda as provas de banco e E2E real)

acceptance:
  - "Banco: migration nova revoga insert on public.dm_messages from authenticated (select continua). pgTAP novo em supabase/tests (identidades example.invalid, UUIDs fixos, transação com rollback): como authenticated participante, INSERT direto em dm_messages falha com 42501; send_conversation_message grava a mensagem; chamada repetida com o mesmo p_client_key devolve a mesma linha (um só registro); a corrida on conflict → reselect só é alcançável com duas transações simultâneas, então a prova é estrutural: o índice único parcial (conversation_id, sender_id, client_key) existe e um segundo INSERT com a mesma chave (como postgres) falha com 23505, garantindo que o on conflict da RPC nunca duplica; authenticated mantém select; anon sem insert nem select."
  - "Pergunta ao organizador: POST /api/app/eventos/[id]/perguntas grava pela RPC send_conversation_message na conversa aberta por open_event_question (sem .from(\"dm_messages\").insert em apps/web); respostas e códigos atuais preservados (201 com o mesmo corpo; recusa da RPC por bloqueio ou indisponibilidade vira o 403 'recusado' com a mensagem amigável; 22023 vira 400 'corpo-invalido'; erro inesperado 503). Testes de rota atualizados com casos positivo e negativos, incluindo a recusa da RPC."
  - "Troca: next.config.ts ganha [\"/indicacoes/:id\", \"/app/pergunta/:id\"] (307, query preservada) sem capturar a lista; a pasta apps/web/app/(shell)/indicacoes/[id]/ sai inteira, com indication-detail.tsx, conversation-menu.tsx e lib/recommendations/trigger-label.ts (conferir com git grep que não há outro importador antes de remover); tests/unit/infra/lan-troca-redirect.test.ts cobre a regra nova, a ausência da pasta e a ausência de ciclo."
  - "Links: indicationHref, deep-links.ts (recommendation_reply, recommendation_request e resolveReportTargetHref), reports.ts TARGET_HREF.recommendation_request, legacy-routes ?focus, active-nav, scripts/port/compare-pergunta.mjs e scripts/visual/capture.mjs passam a /app/pergunta/:id (ou a captura sai, se já coberta pelo app). git grep \"/indicacoes/\" em apps/web, scripts e tests só pode sobrar em asserção de redirect ou de ausência."
  - "Web morta: o ramo blockUserId/handleBlock do ReportButton sai (o componente e reports.insert ficam); chat-thread.tsx sai (órfão) e message-delivery.ts sai se ficar sem importador; tests/scope/design-system-contract.test.mjs deixa de ler os arquivos removidos sem afrouxar o que verifica nos que ficam."
  - "Testes que liam os arquivos removidos são migrados ou removidos com nome e motivo no RELATORIO (portas.test.ts, indications.test.ts, aviso-de-pedido.test.ts, erro-cru-na-rota, erro-servidor-em-portugues, no-engagement-in-indications, gatilho-overflow-nome-acessivel, nome-acessivel-de-fechar, shell-active-nav, link-crawl, recommendation-reply-notify, indicacoes-ciclo-pergunta, indicacoes-memoria e o que mais git grep achar). E2E web que navegava a tela antiga passa a esperar /app/pergunta/:id."
  - "RELATORIO em .visual/f09-troca/RELATORIO.md: arquivos tocados e removidos, testes novos, migrados e removidos com motivo, comandos rodados com resultado lido, e o que não rodou."

