  - Cards LAN-F09, F09-B3-INSERT-DIRETO-DM e F09-B2-BLOQUEIO-E-CORRIDA
  - ADR-20261116-bloqueio-e-denuncia-pela-porta-do-app.md (emenda de 17/11: revogação no lote 3)
