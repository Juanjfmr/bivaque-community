# F09-TROCA-INDICACAO — terceiro lote do LAN-F09: a tela antiga de indicação sai e o INSERT
# direto em dm_messages fecha (cartão F09-B3-INSERT-DIRETO-DM).
#
# Inventário do coordenador em 18/11 sobre origin/main 44bc2284 (disco e git), partindo de
# .work/orq/relatorios/escopo-trocas.md §3 (17/11) e conferindo de novo:
# - Paridade da tela Pergunta do app já na main: bloquear depois de denunciar (SEC-015, #270) e
#   editar/excluir/resolver sem resposta/compartilhar/Guia/editada (RUN-185, #275).
# - apps/web/app/(shell)/indicacoes/[id]/ ainda serve a tela antiga (IndicationDetail); o único
#   chamador do ramo de bloqueio do ReportButton (blockUserId → dm_blocks.insert,
#   report-button.tsx:167) é indication-detail.tsx:832.
# - Produtores de INSERT direto em public.dm_messages: (a) a rota viva
#   apps/web/app/api/app/eventos/[id]/perguntas/route.ts:60-67 (pergunta ao organizador do
#   encontro; o relatório de 17/11 não a viu) e (b) apps/web/app/components/bivaque/chat-thread.tsx:116,
#   órfão (nenhum importador; só tests/scope/design-system-contract.test.mjs:117 o lê). Todas as
#   funções SQL que gravam em dm_messages são security definer e não dependem do grant.
#
# Decisões do coordenador (mandato 02/11; executa o que o ADR-20261116 e sua emenda já previam
# para o lote 3, sem decisão nova de produto; R3 pelo grant):
# - Revoga só o INSERT de public.dm_messages para authenticated (select fica). O INSERT de
#   public.dm_blocks FICA: POST /api/app/voce/bloqueados grava com o cliente da sessão sob a
#   policy dm_blocks_insert_self — revogá-lo quebraria o bloqueio do app (o relatório de 17/11
#   recomendava revogar; está errado nesse ponto).
# - A pergunta ao organizador passa a gravar pela RPC public.send_conversation_message(uuid, text,
#   text) na conversa devolvida por open_event_question, com p_client_key nulo; as recusas da RPC
#   (42501 blocked / not a participant / unavailable, 22023) viram as mesmas respostas que a rota
#   já dá hoje.
# - /indicacoes/:id passa a 307 para /app/pergunta/:id em next.config.ts; a lista /indicacoes
#   (redirect interno para a Comunidade) fica até o F04.
# - O ramo de bloqueio do ReportButton sai (fica sem chamador); o componente fica para grupos e
#   publicações da web até o F04.
# - Entra também a prova que falta do cartão F09-B2: pgTAP do caminho on conflict → reselect da
#   RPC de envio.

task_id: F09-003

adr: docs/decisions/ADR-20261116-bloqueio-e-denuncia-pela-porta-do-app.md

objective: >
  A tela antiga /indicacoes/[id] sai da web com redirecionamento 307 para /app/pergunta/[id] e com
  todos os links migrados; nenhum caminho do produto grava direto em dm_messages, e o banco recusa
  o INSERT direto (42501), enquanto a RPC de envio e a pergunta ao organizador seguem funcionando;
  tudo com prova de banco, de rota e de navegação.

