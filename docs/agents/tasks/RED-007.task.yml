acceptance:
  - Ler somente trechos pertinentes das duas suítes, definições e autoridades, nunca migration ou matriz inteiras
  - Corrigir fixtures obsoletas de alcance e grupo segundo cidade e estados open closed archived atuais, sem alterar produção
  - Preservar pergunta ao organizador coexistindo com pedido de serviço, idempotência e recusa de outro contexto; não fabricar ator ou evento incompatível com a autoridade para obter positivo artificial
  - Preservar negativos de anônimo, terceiro, bloqueio, contexto inválido e perda de acesso; revalidar que as duas pessoas ainda podem ler o objeto contextual no momento da ação conforme E5 F5 e R1-229
  - Troca de fixture de grupo aberto para fechado exige critério de acesso citado e mapa explícito; não converter todos os negativos por conveniência nem usar grupo ou vínculo inexistente como prova de acesso negado
  - Negativos de leitura devem ter alvo existente com positivo autorizado, e ações devem usar authenticated ou anon e identidade coerente; postgres só prepara fixtures e observa estado
  - Registrar mapa antigo para atual e cada extinção exclusiva da vila com ID R1 e decisão; negativos novos são independentes, não equivalentes apenas por polaridade ou contagem
  - Duas suítes concluem sem abortos ou planos interrompidos e com asserções verdes; planos-base 10 e 25, total 35, podem crescer por cobertura, nunca diminuir para esconder falha
  - Se houver defeito real de permissão fora do escopo, manter teste vermelho e registrar dependência concreta; sem repetir tentativa idêntica nem afrouxar expectativa
  - Rodar prova exata de banco e db lint pela fila e gate completo com públicas locais somente no processo; agregado vermelho e limites devem permanecer explícitos
  - Executar no máximo três rodadas próprias; esgotamento gera HUMAN_DECISION real, sem criar outro lote para repetir o mesmo defeito
  - Terminar escrevendo STATUS e R3-RED-007 com resultados por arquivo, planos, mapa, rodadas, logs, hash inalterado e limites sem autoaprovação de RLS ou banco
