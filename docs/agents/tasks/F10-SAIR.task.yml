# F10 — sair da conta (sign-out) pelo app.
#
# O app tem Apagar a conta mas NAO tem Sair da conta. A web sai pelo cliente
# Supabase de navegador (profile/page.tsx:159, configuracoes/conta/page.tsx:100).
# O app NAO tem cliente Supabase (ADR-20261105 proibe supabase-js no navegador;
# entrada/servidor.ts: O app nunca fala com o Supabase). Por isso o sign-out do
# app e uma ROTA DE SERVIDOR que revoga a sessao e limpa o cookie, nao signOut no
# cliente. Molde exato: apps/web/app/api/app/voce/apagar-conta/route.ts.
#
# Este lote e SO o sign-out. NAO troca /profile web (a jornada F10 inteira e
# esforco separado, card LAN-F10). SEM migration. R2 (escrita que revoga sessao,
# CSRF, cookie). A contagem TOTAL_DE_ROTAS sobe 1 (registrar a rota no manifesto).

task_id: RUN-157

objective: >
  Adicionar Sair da conta ao app: rota POST /api/app/voce/sair (exigirSessao ->
  conferirEscrita -> auth.sessao.cliente.auth.signOut() -> responder 200 com os
  cookies de remocao), funcao sairDaConta() em lib/dados/voce.ts, e LinhaDeAjuste
  Sair da conta na tela Voce com Confirmacao (perigo). Ao confirmar: limpar
  sessionStorage/localStorage e window.location.replace(/app/entrar). 401 = ja
  saiu (segue para a entrada); outra falha = mensagem na tela, a pessoa fica.

