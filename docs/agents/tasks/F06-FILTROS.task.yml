# RUN-171 — F06 Lote C: filtros do Mercado sobre o universo (server-side), espelhando a web.
#
# O GET /api/app/mercado ja aceita quartos/valor_max/tipo_imovel/ordem, mas com
# dois furos provados (mapa F06 16/11; F06-RESSALVAS itens 1 e 2 abertos): o
# embed de property_details e LEFT JOIN (SELECT_ANUNCIO em _comum.ts com
# comentario explicito de que !inner nao e usado), entao gte/eq nas colunas do
# satellite NAO restringem o pai; e preco de imovel mora no satellite
# (rent_cents/sale_price_cents por deal) enquanto o filtro usa price_cents (NULL
# em imovel → imoveis somem em silencio com filtro de valor). A tela agrava:
# Mercado.tsx so envia tipo+pagina ao servidor e q/preco/quartos/ordem sao
# client-side sobre A PAGINA CARREGADA — filtro truncado, o pior tipo de meio
# feito. A web resolve isso do lado certo: lib/listings/queries.ts
# searchProperties :121-157 (property_details!inner + deal→coluna de preco :143
# + ilike title/neighborhood + gte bedrooms). Sem migration — o mecanismo ja
# funciona em PostgREST na web.

task_id: RUN-171

