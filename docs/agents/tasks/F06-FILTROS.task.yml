  (q, quartos, tipo do imovel, deal/tipo_negocio, bairro, valor maximo por deal,
  ordem), com embed !inner restringindo o pai, a tela consumindo o servidor em
  vez da pagina carregada, e os links de alerta (alertSearchHref) passando a
  levar bairro/tipo_negocio de verdade — fechando a perda declarada do RUN-169 e
  os itens 1 e 2 do F06-RESSALVAS.

