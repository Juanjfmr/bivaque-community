  - prototypes/bivaque-html/src/app/handlers.js
  - prototypes/bivaque-html/src/shell/
  - prototypes/bivaque-html/src/styles/catalog.css
  - prototypes/bivaque-html/src/styles/segmented.css
  - prototypes/bivaque-html/src/manifest.json
  - prototypes/bivaque-html/docs/
  - scripts/bivaque-html/
  - docs/agents/tasks/HTML-023.task.yml
forbidden:
  - mudar o que cada filtro filtra alem da disponibilidade nova
  - editar a referencia HTML congelada, styles globais existentes, data/demo ou vendor
  - fazer merge ou push sem confirmacao
acceptance:
  - Pilulas mostram o valor escolhido; Filtros mostra quantos estao ativos
  - Painel conta os resultados antes de aplicar; fechar, Esc ou Voltar descartam e fecham so o painel
  - Folha e tela cheia no celular, painel suspenso e lateral no desktop; atalhos nao abrem por baixo
  - Cada tela guarda os proprios filtros, inclusive o preco
  - Imovel filtra por disponibilidade (agora, 30, 60 dias ou data); editor, cartao e detalhe mostram
proof:
