task_id: HTML-023
objective: >
  Rodada 23 troca a apresentacao dos filtros de Desapegos e Imoveis por pilulas com folha (celular)
  e painel suspenso ou lateral (desktop), contagem ao vivo antes de aplicar e ordenacao junto da
  contagem, como na maquete aprovada, e acrescenta a disponibilidade para morar nos imoveis.
authority:
  - Maquete aprovada pelo usuario em 2026-10-16 (ordem das pilulas e atalhos Aceita pets e Mobiliado)
  - Pedido do usuario em 2026-10-16 para tirar "de quem esta de mudanca" do subtitulo de Desapegos
baseline:
  status: FAIL-EVIDENCED
  evidence: >
    HEAD fdb6dba0. Selects, slider e grupos de chips empurravam os resultados para baixo; ruido de
    "Qualquer" marcado; preco so por slider; sem data de disponibilidade do imovel.
allowed_paths:
