# ENT-001 — F01, lote 1: telas de acesso (login, criar conta, recuperar senha)
#
# Executor: OpenCode com deepseek-v4.1-flash. Revisor e verificação de runtime: Claude Code,
# independentes do executor. Sem backend: a jornada é demonstrativa, como hoje.
task_id: ENT-001

objective: >
  No app (apps/app), as rotas /app/entrar/login, /app/entrar/conta e /app/entrar/senha passam a
  seguir a composição A aprovada pelo dono em 30/10/2026: foto editorial com a frase da marca num
  painel arredondado ao lado do formulário (acima dele no celular), "Continuar com Google" antes do
  formulário de e-mail, "Esqueci minha senha" na linha do rótulo da senha, a proposta de valor no
  painel de criar conta e o estado de instruções enviadas na recuperação. Mesmos campos, ações e
  destinos de hoje; nenhuma informação sai do navegador.

authority:
  - docs/design/fluxos-2026-10-30/F01-DIRECAO.md (direção comum, regras de consistência, blocos 21st e seção Celular)
  - docs/design/fluxos-2026-10-30/individuais/F01/F01-01-login.png, F01-02-conta.png, F01-15-senha.png, F01-15b-senha-enviada.png (desktop aprovado pelo dono em 30/10/2026)
  - docs/design/fluxos-2026-10-30/individuais/F01/celular/ com os mesmos nomes (celular)
  - docs/decisions/ADR-20261022-entrada-do-prototipo.md
  - docs/decisions/ADR-20261024-front-react-spa.md

