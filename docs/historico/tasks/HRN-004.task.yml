task_id: HRN-004

objective: >
  As jornadas do guia visual passam a ser andadas no app de verdade. Um spec abre
  uma jornada de scripts/visual/flows/journeys.json pelo id e registra cada passo
  que observa, com captura; o registro recusa passo que a jornada nao cita,
  recusa concluir com passo faltando, e separa o que foi observado por clique,
  o que so foi alcancado pela URL (atalho) e o que o ambiente nao entrega
  (lacuna). Um relatorio poe prancha e tela real lado a lado, na ordem da
  jornada. Piloto com cinco jornadas web: pedir e responder um servico, entrar
  e ser admitido, operar admissoes e quando algo falha.

authority:
  - Pedido do dono em 22/09/2026 para montar o piloto do teste simulado de usuario
  - tools/backend-kanban/public/board.json, card TEST-MASSA-JORNADAS (cobertura E2E de Pedidos; executar cada jornada com entrada, acao, feedback e follow-up)
  - scripts/visual/flows/journeys.json, que se declara documental e nao gravado em runtime
  - docs/design/visual-guide-2026-09-06/VALIDACAO-2026-09-08.json, runtime "Nao executado"

baseline:
  status: FAIL-EVIDENCED
  evidence: >
    Medido em 22/09/2026 na revisao 65fc81f. Nenhum spec em tests/e2e cobre a
    vertical de Pedidos (grep de "pedidos" em tests/e2e vazio). journeys.json
    tem 61 jornadas, 38 web, e nenhuma e executada: o mapa prova cobertura de
    tela, nao que o app percorre a jornada. VALIDACAO-2026-09-08.json registra
    runtime "Nao executado".

