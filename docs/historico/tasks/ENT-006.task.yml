task_id: ENT-006

objective: >
  No app (apps/app), as últimas telas da entrada seguem as referências aprovadas em 30/10/2026:
  boas-vindas que mudam pelo momento escolhido na cidade (chegando, moro aqui, saindo), com foto,
  atalhos e "Entrar na comunidade"; e retomar, convite de família, convite indisponível e conta
  apagada na composição de acesso (EntradaAcesso), com a foto no painel e o formulário ao lado.
  Mesmos campos, validações e destinos de hoje, exceto os destinos novos dos atalhos das
  boas-vindas, que usam rotas que já existem. Corrige a barra de progresso interna do negócio no
  celular. Ao final, o cartão antigo da entrada deixa de ser usado.

