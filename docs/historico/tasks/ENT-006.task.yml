acceptance:
  - "Boas-vindas (/app/entrar/boas-vindas): sem indicador de passos; barra superior da composição de etapa sem o botão Sair; coluna central com foto larga no topo (demo/landing-hero.webp, cantos de 16 px, alt vazio), ícone de check em círculo Grafite pequeno sobre a borda inferior da foto, título \"Você chegou ao Bivaque.\" em Noto Serif centralizado e, conforme o momento escolhido na tela da cidade: chegando — apoio \"Seu plano de chegada a {cidade} já está pronto.\" e dois cartões de atalho de linha inteira com ícone e seta: \"Ver o plano de chegada\" / \"Moradia, escola, saúde e mudança, na ordem.\" (vai ao início) e \"Conhecer quem chega com você\" / \"Chegadas 2027 em {cidade}\" (vai ao grupo turma-manaus-2027 quando a cidade é Manaus; sem esse cartão em outras cidades); moro aqui (padrão) — apoio \"O que a comunidade de {cidade} indica já está à sua espera.\" e um cartão \"Conhecer {cidade}\" / \"O que a comunidade indica, por assunto.\" (vai ao guia); saindo — apoio \"Seu plano de saída para {destino} já está pronto.\" (sem destino, \"Seu plano de saída já está pronto.\") e o cartão \"Ver o plano de saída\" / \"Moradia, escola, saúde e mudança, na ordem.\" (vai ao início). Botão principal \"Entrar na comunidade\" (vai à comunidade)."
  - "Retomar (/app/entrar/retomar): composição de acesso com demo/chegada.webp. Título \"Continue de onde parou.\"; apoio \"Você começou seu cadastro e pode continuar.\"; cartão com avatar de iniciais, nome e e-mail da conta em andamento (do estado da entrada; quando vazio, o nome da pessoa da demonstração lido de lib/dados, sem e-mail); \"Continuar cadastro\" (principal) e \"Usar outra conta\" (contorno), destinos de hoje."
  - "Convite (/app/entrar/convite): composição de acesso com demo/landing-hero-retrato.webp. Título \"Convite de família.\"; apoio \"Use o código recebido para aceitar seu convite.\"; campo \"Código do convite\" único, em maiúsculas, com fonte monoespaçada e espaçamento entre letras (sem biblioteca); \"Nome completo\"; \"E-mail do convite\" somente leitura com fundo levemente acinzentado e ícone de cadeado; senha com Mostrar; aceite desenhado; \"Aceitar convite\" desabilitado até o aceite e então vai à cidade como hoje; \"Simular convite indisponível\" como link de texto discreto no fim."
  - "Convite indisponível (/app/entrar/convite-indisponivel): composição de acesso com demo/landing-hero-retrato.webp, conteúdo alinhado à esquerda: ícone de atenção de traço, título \"Convite indisponível.\", apoio \"O código não é válido ou não está mais disponível.\", \"Tentar outro código\" (principal) e \"Voltar para entrar\" (contorno)."
  - "Conta apagada (/app/entrar/apagada): composição de acesso com demo/landing-hero.webp, alinhado à esquerda: ícone de check de traço, título \"Conta apagada.\", apoio \"Sua conta e seus dados foram apagados.\", \"Voltar ao início\" (principal)."
  - "Correção do ENT-005: abaixo de 768 px a barra interna \"Passo X de 5\" do negócio tem no máximo 60% da largura da coluna e fica centralizada, distinta da barra geral da etapa."
  - "Nenhuma tela de /app/entrar/* usa mais o cartão antigo nem mostra o parágrafo \"Jornada demonstrativa\"; o código e o CSS do cartão antigo que ficarem sem uso são removidos."
  - "Foco no título ao abrir; foco visível; sem rolagem horizontal em 320, 360, 375, 430, 768 e 1440 px; tema escuro pelos tokens."

