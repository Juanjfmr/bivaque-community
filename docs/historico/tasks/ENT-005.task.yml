acceptance:
  - "Escolha (/app/entrar/negocio): EntradaEtapa no passo 5 (quatro anteriores concluídos). Título \"Você tem um negócio ou oferece algum serviço?\" (Noto Serif, centralizado); apoio \"No Mercado, você pode apresentar seu negócio ou serviço à comunidade.\"; nota \"Esta etapa é opcional. Você pode voltar a ela depois.\"; três ações empilhadas na largura da coluna: \"Divulgar agora\" (principal Grafite), \"Tenho interesse em criar\" (contorno) e \"Decidir depois\" (texto); destinos de hoje."
  - "Formulário (/app/entrar/negocio-formulario): passo 5. Título \"Apresente seu negócio.\" centralizado; logo abaixo, centralizado, \"Passo X de 5\" em var(--muted-foreground) e uma barra de cinco segmentos (concluídos e atual em Grafite, futuros em var(--border)); o texto \"Nenhuma informação será publicada nesta demonstração\" sai. Subtítulo de cada etapa (\"O que você oferece?\", \"Onde você atende?\", \"Como funciona seu atendimento?\", \"Como podem conhecer seu trabalho?\", \"Confira sua página\") em Noto Serif semibold, alinhado à esquerda da coluna de 560 px. Rádios de área e de atendimento como cartões de linha inteira (borda Grafite de 2 px no selecionado), com os campos condicionais logo abaixo do cartão selecionado; especialidades e dias como chips de seleção (selecionado em Grafite com texto claro e check); campos de horário lado a lado; fotos em miniaturas quadradas com a primeira marcada \"Capa\" e um quadro tracejado \"+\" para adicionar; a revisão em cartão com a foto de capa no topo e uma linha por bloco com ícone, valor e link \"Editar\" que volta à etapa correspondente. Ações: \"Voltar\" (contorno) e \"Continuar\" (principal Grafite) lado a lado, metade da coluna cada; na etapa 5 o principal é \"Salvar rascunho\". A nota \"Rascunho local de {cidade}, apenas nesta sessão. Nenhum dado será enviado.\" sai; o status depois de salvar continua (\"Rascunho salvo nesta sessão. Seu negócio não foi publicado.\") com o botão \"Continuar\"."
  - "Interesse (/app/entrar/negocio-interesse): passo 5. Título \"Ideias para seu negócio.\"; apoio \"Quando quiser, explore os negócios locais no Mercado e conheça o que a comunidade procura.\"; \"Continuar\" (principal) e \"Voltar\" (contorno) empilhados; destinos de hoje."
  - "Dados de demonstração: o grupo turma-manaus-2027 usa img \"chegada\" (as duas ocorrências em cenarios.ts)."
  - "Foco no título ao abrir e ao trocar de etapa; foco visível; sem rolagem horizontal em 320, 360, 375, 430, 768 e 1440 px; tema escuro pelos tokens."
  - "Os specs entrada-etapa, entrada-acesso e entrada-21st continuam verdes; entrada-acesso deixa de usar /app/entrar/negocio como exemplo de tela em cartão (use /app/entrar/boas-vindas); entrada-21st ajustado só onde dependia dos textos substituídos."

