task_id: ENT-005

objective: >
  No app (apps/app), /app/entrar/negocio, /app/entrar/negocio-formulario e
  /app/entrar/negocio-interesse passam para a composição de etapa (passo 5, Negócio opcional) como
  nas referências aprovadas em 30/10/2026: escolha com três ações empilhadas, formulário em cinco
  etapas com progresso interno "Passo X de 5" e barra de cinco segmentos, subtítulos em Noto Serif,
  cartões de rádio, chips de especialidade e de dias, campos de horário, fotos com capa e revisão com
  "Editar"; "Voltar" e "Continuar" lado a lado. Mesmos campos, validações, limites e destinos de hoje.
  A capa do grupo de chegada nos dados de demonstração troca para a foto de chegada.

