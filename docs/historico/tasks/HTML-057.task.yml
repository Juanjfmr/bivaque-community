    7 de 8 checkpoints FAIL (aviso de proposta nao abre o pedido; aviso de pedidos nao abre a lista;
    o proprio encontro mostra "Vou"; interesse no proprio anuncio aceito e menu com "Tenho interesse";
    grupo fechado sem acao de cancelar; Voce mostra 3 salvos e Salvos lista 2).
