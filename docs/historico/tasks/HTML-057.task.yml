task_id: HTML-057
objective: >
  Rodada 57 do Lote Funcional: caminhos quebrados simples da auditoria de 18/10/2026. O aviso de
  proposta abre o pedido e o aviso de pedidos abre a lista (um aviso de pedido que sumiu fica na
  caixa, com explicacao). "Confirmado" no proprio encontro vira "Voce organiza", que leva ao
  encontro. Interesse no proprio anuncio nao cria conversa e o menu de toque longo oferece "Ver
  anuncio" sem denuncia. O pedido de entrada em grupo fechado pode ser cancelado. O contador de
  Salvos em Voce usa o mesmo criterio da lista Salvos.
