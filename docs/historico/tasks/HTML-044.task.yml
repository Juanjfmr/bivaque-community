task_id: HTML-044
objective: >
  Rodada 44 deixa a busca em tela cheia mais util: no celular sai o titulo repetido; a busca vazia
  mostra buscas recentes (com Limpar), Explorar com atalhos que abrem a tela filtrada e sugestoes,
  em linhas com a seta que completa o texto sem buscar; ao digitar, sugestoes de complemento e
  atalhos por tipo vem antes dos resultados.
authority:
  - Aprovacao do usuario em 2026-10-17 (maquete; "Sim, como na maquete")
baseline:
