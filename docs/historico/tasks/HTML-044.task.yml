  - A seta completa sem gravar busca; a linha busca e grava; Limpar apaga as recentes
  - Explorar abre Negocios filtrados, Imoveis ou Desapegos
  - Ao digitar, sugestao com a parte digitada em destaque e atalho por tipo que filtra
proof:
