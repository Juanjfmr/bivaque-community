  - Filtros de imovel por tipo, total do mes, quartos, vagas, area e comodidades
  - Filtros de desapego por categoria, estado de uso, preco e retirada
  - Mais filtros recolhidos no celular e no tablet, sempre a vista no desktop
  - Editor exige tipo (imovel) ou categoria e estado (desapego); detalhe e cartao mostram os campos
  - Exemplos novos entram uma vez; dados salvos antigos ganham os atributos
