# ENT-002 — F01, lote 2: composição de etapa (aceite, CPF e vínculo confirmado)
#
# Executor: OpenCode com deepseek-v4.1-flash. Revisor, auditoria de segurança e verificação de
# runtime: Claude Code, independentes do executor. Sem backend: jornada demonstrativa, como hoje.
task_id: ENT-002

objective: >
  No app (apps/app), as rotas /app/entrar/aceite, /app/entrar/cpf e /app/entrar/resultado passam a
  seguir a composição B aprovada pelo dono em 30/10/2026: barra superior com o logo e "Sair", indicador
  de cinco passos nomeados (Conta, Vínculo, Cidade, Grupos, Negócio opcional), título e apoio
  centralizados numa coluna de 560 px e ações na largura da coluna. A tela do CPF ganha o aviso de que
  o CPF é usado só na consulta e não fica guardado e o "Por que pedimos seu CPF?" já aberto. Mesmos
  campos, ações e destinos de hoje; o tratamento do CPF (estado local, sem persistência, sem envio)
  não muda.

authority:
  - docs/design/fluxos-2026-10-30/F01-DIRECAO.md (Duas composições, Regras de consistência, Valor e atrito, Celular)
  - docs/design/fluxos-2026-10-30/individuais/F01/F01-03-aceite.png, F01-04-cpf.png, F01-05-vinculo-confirmado.png (desktop aprovado pelo dono em 30/10/2026)
  - docs/design/fluxos-2026-10-30/individuais/F01/celular/ com os mesmos nomes (celular)
  - docs/decisions/ADR-20261022-entrada-do-prototipo.md (CPF sem pergunta prévia de vínculo, "Por que o CPF")
  - docs/decisions/ADR-20261024-front-react-spa.md
  - docs/agents/tasks/ENT-001.task.yml (composição A já entregue; mesmo padrão de componente e testes)

