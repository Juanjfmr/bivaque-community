forbidden:
  - mudar como o CPF é tratado: continua só no estado do componente, sem localStorage, sem log, sem envio e sem aparecer na URL
  - instalar, remover ou atualizar dependências
  - copiar código-fonte de blocos do 21st.dev (o Basic Stepper é referência de anatomia, reproduzida com os componentes do app)
  - usar Base UI, Material Web ou HeroUI
  - mudar as telas de acesso (ENT-001) ou as demais telas da entrada (consulta indisponível, documento, análise, cidade, grupos, negócio, boas-vindas, retomar, convite, conta apagada)
  - usar a cor Brasa fora do logo
  - criar texto, campo, etapa ou destino que não esteja nesta lista de aceite
  - editar migrations, Supabase, apps/web ou apps/mobile
  - delegar a subagentes

acceptance:
  - "Componente apps/app/components/bivaque/entrada-etapa.tsx com a casca da composição B: barra superior fina (logo horizontal oficial de 28 px à esquerda, com a troca para a versão branca no tema escuro como em entrada-acesso.tsx, e o botão de texto \"Sair\" à direita, que leva a /app/entrar/login), o indicador de passos e um slot para o conteúdo. Recebe o passo atual (1 a 5)."
  - "Indicador em ≥768 px: cinco círculos ligados por linha, com o nome embaixo: Conta, Vínculo, Cidade, Grupos e Negócio (com \"opcional\" pequeno embaixo). Concluído: círculo Grafite com check branco; atual: círculo Grafite com o número; futuro: círculo vazado com contorno e número em var(--muted-foreground), nunca preenchido de cinza. A linha entre passos concluídos é Grafite; as demais em var(--border). Abaixo de 768 px: a legenda \"Etapa N de 5 · Nome\" (no 5, \"Etapa 5 de 5 · Negócio (opcional)\") e uma barra de cinco segmentos (concluídos e atual em Grafite, futuros em var(--border)). O indicador tem texto acessível equivalente (ex.: aria-label \"Etapa 2 de 5: Vínculo\") e os círculos são decorativos."
  - "Coluna central de 560 px no desktop (largura total menos 20 px de cada lado no celular). Título em Noto Serif (var(--font-brand)) centralizado, cerca de 40 px no desktop e 30 px no celular; apoio centralizado; campos e textos longos alinhados à esquerda; ações na largura da coluna, a principal em cima (Grafite, 48 px) e a secundária embaixo (contorno). Sem o parágrafo \"Jornada demonstrativa\" nessas três telas."
  - "Aceite (/app/entrar/aceite): passo 1 (Conta). Título \"Só falta aceitar o combinado.\"; apoio \"Leia e aceite para continuar com sua conta Google.\"; caixa \"Li e concordo com a Política de privacidade e o Código de conduta.\" (links para as rotas de hoje), desenhada em Grafite; botão \"Aceitar e continuar\" desabilitado até o aceite, e então vai à etapa do vínculo como hoje."
  - "Vínculo (/app/entrar/cpf): passo 2 (Vínculo). Título \"Confirme seu vínculo.\"; apoio \"Vamos conferir seu CPF para confirmar seu vínculo.\"; campo \"CPF\" como hoje (numérico, sem autocomplete); logo abaixo, faixa neutra clara com ícone de cadeado e o texto \"Seu CPF é usado só nesta consulta e não fica guardado.\"; bloco recolhível já aberto por padrão (details open) \"Por que pedimos seu CPF?\" com o texto \"Conferimos na fonte oficial se você é militar federal da ativa, veterano ou pensionista. Leva poucos segundos. Familiares entram pelo convite, sem CPF.\"; botão principal \"Continuar\" (vai ao resultado como hoje); rodapé centralizado \"É familiar? Usar convite\". O controle de demonstração \"Simular consulta indisponível\" continua existindo e funcionando, mas como link de texto discreto e pequeno no fim da coluna, abaixo do rodapé."
  - "Vínculo confirmado (/app/entrar/resultado): passo 2 com Conta concluída. Ícone grande de confirmação (círculo Grafite de 72 px com check branco) acima do título \"Vínculo confirmado.\"; apoio \"Tudo certo. Agora escolha sua cidade.\"; botão principal \"Continuar\" (vai à cidade como hoje)."
  - "Foco: ao abrir cada tela, o foco vai para o título como hoje (useRolagemEFoco). Ordem do Tab natural: Sair, conteúdo, ações. Foco visível com anel var(--ring)."
  - "Sem rolagem horizontal em 320, 360, 375, 430, 768 e 1440 px. Tema escuro funcionando pelos tokens."
  - "Os testes existentes (entrada-21st.spec.ts e entrada-acesso.spec.ts) continuam verdes, ajustados só onde dependiam do parágrafo de demonstração ou do botão de simulação (que agora é link)."

