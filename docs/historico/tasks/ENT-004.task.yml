#
# Executor: OpenCode com deepseek-v4.1-flash. Revisor e verificação de runtime: Claude Code.
# Sem backend: seleção de grupos e momento continuam estado local da demonstração.
task_id: ENT-004

objective: >
  No app (apps/app), /app/entrar/cidade (passo 3, Cidade) e /app/entrar/sugestoes-grupos (passo 4,
  Grupos) passam para a composição de etapa, como nas referências aprovadas em 30/10/2026: cidade com
  ícone de lugar, momento em três cartões de rádio na mesma linha, campos condicionais de data e
  destino; grupos sugeridos em cartões selecionáveis com foto de capa e caixa de seleção, em grade
  2 × 2 no desktop e uma coluna no celular. Mesmos campos, regras condicionais, filtros (só grupos
  abertos da cidade) e destinos de hoje. Corrige a checagem de tipo do documento do ENT-003.

