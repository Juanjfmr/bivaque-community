  - mostrar grupos fechados ou de outra cidade nas sugestões, ou criar participação ao selecionar
  - instalar, remover ou atualizar dependências
  - copiar código de blocos do 21st.dev (Radio Group e Card Style Checkbox são referência de anatomia)
  - usar Base UI, Material Web ou HeroUI; usar Brasa fora do logo
  - criar texto, campo ou destino que não esteja nesta lista de aceite
  - mudar as telas dos lotes anteriores além da correção indicada
  - editar migrations, Supabase, apps/web ou apps/mobile
  - delegar a subagentes

acceptance:
  - "Cidade (/app/entrar/cidade): EntradaEtapa no passo 3 (Conta e Vínculo concluídos). Título \"Sua cidade e seu momento.\"; campo \"Cidade\" com ícone de lugar à esquerda e o valor atual (Manaus na demonstração); grupo \"Seu momento\" com três cartões de rádio na mesma linha, de largura igual, cada um com rádio desenhado em Grafite e o rótulo (Chegando, Moro aqui, Saindo), o selecionado com borda Grafite de 2 px; campo \"Como quer ser chamado\"; Chegando mostra \"Data de chegada\" e Saindo mostra \"Data de saída\" e \"Cidade de destino\", como hoje, com ícone de calendário no campo de data; botão principal \"Continuar\" (vai aos grupos como hoje). No celular os três cartões continuam na mesma linha se couberem em 320 px; se não couberem, empilham sem rolagem horizontal."
  - "Grupos (/app/entrar/sugestoes-grupos): passo 4. Título \"Encontre seus grupos.\"; apoio \"Conheça alguns grupos de {cidade}. Escolher é opcional.\"; os grupos abertos da cidade (os mesmos de hoje, até 4) em cartões selecionáveis: foto de capa no topo vinda de apresentacao.img do grupo (via import.meta.env.BASE_URL + demo/...), sem foto quando o grupo não tiver; nome em negrito, descrição curta em cinza e caixa de seleção desenhada em Grafite; o cartão inteiro é o rótulo da caixa; selecionado com borda Grafite de 2 px; grade 2 × 2 em ≥768 px e uma coluna no celular com a foto à esquerda; estados de carregando (\"Buscando sugestões…\") e vazio (\"Ainda não há grupos sugeridos para esta cidade. Você pode continuar.\") mantidos e estilizados; ações \"Continuar\" (principal) e \"Escolher depois\" (secundária), os dois indo ao negócio como hoje. Sem o aviso \"Demonstração: selecionar grupos não cria participação.\""
  - "Sem o parágrafo \"Jornada demonstrativa\" nas duas telas. Foco no título ao abrir; foco visível; sem rolagem horizontal em 320, 360, 375, 430, 768 e 1440 px; tema escuro pelos tokens."
  - "Correção do ENT-003: a validação do tipo do documento usa Object.hasOwn(TIPOS_DE_DOCUMENTO, tipo) em vez do operador in."
  - "entrada-21st.spec.ts continua verde, ajustado só nos textos substituídos (aviso de demonstração dos grupos e mensagem de vazio)."

