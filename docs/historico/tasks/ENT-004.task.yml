  - docs/decisions/ADR-20261022-entrada-do-prototipo.md (cidade e momento numa tela: cidade, momento, data, destino, como quer ser chamado)
  - docs/agents/tasks/ENT-002.task.yml e ENT-003.task.yml (EntradaEtapa e padrão de testes)

