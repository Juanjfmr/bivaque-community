version: 1
source_revision: 53295458b9ad526f7b15914a6657828ffbfc38bb
scope:
  method: static_route_and_navigation_audit
  ui_pages: 40
  excludes:
  - app/api/**/route.ts
  - loading.tsx
  - error.tsx
  - not-found.tsx
  - modal-only states
  runtime_note: Evidência estática identifica rotas e defeitos de navegação; candidatos permanecem candidatos até prova
    em browser.
automation:
  static_gate: tests/scope/product-page-map.test.mjs
  runtime_gate: tests/e2e/product-page-map-navigation.spec.ts
  policy: O gate estático bloqueia drift estrutural; o runtime prova apenas arestas seguras declaradas por persona.
section_prefixes:
  PUB: public
  AUTH: auth
  ONB: onboarding
  INV: invites
  LOC: locality
  EVT: events
  PRV: providers
  COM: community
  REC: recommendations
  GRP: groups
  ME: profile
  MSG: messages
  NOT: notifications
  PRO: provider_portal
  ADM: admin
  OWN: community_admin
navigation_profiles:
  member_shell:
    inherited_exits:
    - LOC-01
    - COM-01
    - GRP-01
    - ME-01
    - REC-01
    - NOT-01
    note: Quatro containers primários + Indicações e Notificações no header.
  provider_shell:
    inherited_exits:
    - PRO-01
    - PRO-02
    - PRO-03
  operator_shell:
    inherited_exits:
    - ADM-01
    - ADM-02
    - ADM-03
    - ADM-04
  community_admin_shell:
    inherited_exits:
    - OWN-02
    - COM-03
    note: O layout atual expõe Pedidos de entrada e Voltar à comunidade.
