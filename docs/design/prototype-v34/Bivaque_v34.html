<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bivaque — Protótipo v34</title>
<meta name="theme-color" content="#0b3e32">
<meta name="description" content="Protótipo v34: candidato de referência visual. Dados fictícios. Ver docs/design/prototype-v34/README.md">
<style>
:root{
  --bg:#f7f7f2;
  --surface:#ffffff;
  --surface-2:#f1f4ee;
  --ink:#102821;
  --muted:#68756f;
  --line:#dfe5dd;
  --pine:#0c513f;
  --pine-2:#146a52;
  --mint:#e8f3ec;
  --sage:#dfeadf;
  --gold:#d89b2b;
  --rose:#c95363;
  --blue:#4c7ecf;
  --violet:#7456b8;
  --shadow:0 16px 40px rgba(16,40,33,.10);
  --shadow-sm:0 8px 24px rgba(16,40,33,.07);
  --r-xl:28px;
  --r-lg:20px;
  --r-md:14px;
  --sidebar:236px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
img{display:block;width:100%;height:100%;object-fit:cover}
body{overflow-x:hidden}
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;padding:18px 14px 18px;border-right:1px solid var(--line);
  background:rgba(255,255,255,.93);backdrop-filter:blur(18px);z-index:30;
  display:flex;flex-direction:column;gap:14px
}
.logo{display:flex;align-items:center;gap:10px;padding:7px 10px 14px}
.logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#0c513f,#d8a44a);position:relative;overflow:hidden}
.logo-mark:before,.logo-mark:after{content:"";position:absolute;bottom:5px;width:14px;height:21px;background:white;clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.95}
.logo-mark:before{left:4px;transform:rotate(-12deg)}
.logo-mark:after{right:4px;transform:rotate(12deg)}
.logo b{font:700 24px/1 "Public Sans",system-ui,sans-serif}
.tagline{font-size:10px;color:var(--muted);line-height:1.25}
.contribute{
  border:0;background:var(--pine);color:white;border-radius:16px;height:50px;font-weight:700;
  box-shadow:0 10px 22px rgba(12,81,63,.18);display:flex;align-items:center;justify-content:center;gap:8px
}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  border:0;background:transparent;color:#42524b;border-radius:13px;padding:11px 12px;display:flex;align-items:center;gap:11px;text-align:left;font-weight:600
}
.nav button svg{width:19px;height:19px}
.nav button:hover{background:#f3f6f1}
.nav button.active{background:#e8f2eb;color:var(--pine)}
.sidebar .sep{height:1px;background:var(--line);margin:4px 4px}
.context{
  margin-top:auto;border:1px solid var(--line);background:#fbfcfa;border-radius:16px;padding:12px;
}
.context .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.context b{display:block;margin-top:5px}
.context span{font-size:12px;color:var(--muted)}
.context .bar{height:5px;background:#e8ece7;border-radius:99px;margin-top:10px;overflow:hidden}
.context .bar i{display:block;width:75%;height:100%;background:var(--pine);border-radius:99px}

.shell{min-width:0}
.topbar{
  position:sticky;top:0;z-index:20;height:60px;border-bottom:1px solid var(--line);
  background:rgba(247,247,242,.88);backdrop-filter:blur(16px);
  display:flex;align-items:center;padding:0 26px;gap:16px
}
.global-search{flex:1;max-width:520px;display:flex;align-items:center;gap:9px;background:white;border:1px solid var(--line);border-radius:12px;padding:0 13px;height:40px;color:var(--muted)}
.global-search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.top-spacer{flex:1}
.city-chip,.icon-btn,.avatar{border:0;background:white;border:1px solid var(--line);height:38px;border-radius:12px}
.city-chip{display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:600;color:#2f4139}
.icon-btn{width:38px;display:grid;place-items:center}
.avatar{width:38px;border-radius:50%;background:linear-gradient(135deg,#e6efe7,#cfded0);font-weight:800;color:var(--pine)}

.content{padding:20px 26px 42px;max-width:1520px;margin:auto}
.page{display:none}
.page.active{display:block}
.hero{
  min-height:330px;border-radius:26px;overflow:hidden;position:relative;padding:34px 38px 30px;color:white;
  background:
   linear-gradient(90deg,rgba(5,33,26,.86) 0%,rgba(5,33,26,.62) 42%,rgba(5,33,26,.16) 72%,rgba(5,33,26,.10) 100%),
   url("https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&w=1800&q=90") center 46%/cover;
  box-shadow:var(--shadow)
}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 58%,rgba(7,42,33,.36));pointer-events:none}
.hero-inner{position:relative;z-index:2;max-width:920px}
.context-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);color:var(--pine);padding:8px 12px;border-radius:99px;font-weight:700;font-size:13px}
.hero h1{font:700 clamp(40px,5vw,72px)/.96 "Public Sans",system-ui,sans-serif;letter-spacing:-.03em;margin:18px 0 12px;max-width:740px}
.hero p{max-width:650px;color:rgba(255,255,255,.86);font-size:15px;margin:0 0 22px}
.resolver{
  display:flex;align-items:center;gap:10px;background:white;border-radius:18px;padding:7px 7px 7px 16px;max-width:1040px;box-shadow:0 18px 38px rgba(0,0,0,.20)
}
.resolver input{flex:1;min-width:0;border:0;outline:0;height:46px;font-size:15px;color:var(--ink)}
.resolver button{border:0;background:var(--pine);color:white;padding:0 22px;height:46px;border-radius:14px;font-weight:700}
.hero-metrics{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hero-metrics span{background:rgba(10,66,52,.72);border:1px solid rgba(255,255,255,.15);padding:8px 11px;border-radius:99px;font-size:12px}

.intent-strip{
  margin-top:-32px;position:relative;z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:0 20px
}
.intent{
  background:white;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow-sm);
  min-height:114px;text-align:left;transition:.2s transform,.2s box-shadow
}
.intent:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.intent .bubble{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;margin-bottom:10px}
.intent b{display:block;font-size:14px;line-height:1.2}
.intent span{display:block;font-size:12px;color:var(--muted);line-height:1.25;margin-top:5px}
.i1 .bubble{background:#e5f1e8;color:var(--pine)} .i2 .bubble{background:#fff0dc;color:#a86112}
.i3 .bubble{background:#ffe9ed;color:#b63c56} .i4 .bubble{background:#eeeafd;color:#6249aa}
.i5 .bubble{background:#e7f4f1;color:#15705c}

.section{margin-top:26px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}
.section-head h2{font:700 28px/1.1 "Public Sans",system-ui,sans-serif;margin:0}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.link-btn{border:0;background:transparent;color:var(--pine);font-weight:700}
.continue-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.continue-card{
  display:grid;grid-template-columns:94px 1fr auto;gap:12px;background:white;border:1px solid var(--line);border-radius:18px;padding:11px;align-items:center;
}
.continue-card .pic{height:76px;border-radius:13px;overflow:hidden}
.continue-card small{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.continue-card b{display:block;margin-top:3px}
.continue-card span{font-size:12px;color:var(--muted)}
.arrow{font-size:22px;color:#8b9992}

.activity-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:16px}
.feed{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.feed-card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.feed-card .photo{height:102px;position:relative}
.feed-card .body{padding:11px}
.feed-card .eyebrow{font-size:10px;font-weight:800;color:var(--pine);text-transform:uppercase}
.feed-card b{display:block;font-size:13px;margin-top:5px;line-height:1.25}
.feed-card p{font-size:11px;color:var(--muted);line-height:1.3;margin:5px 0 0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800;background:#eef3ef;color:var(--pine)}
.badge.gold{background:#fff1d9;color:#a66a06}.badge.pink{background:#ffe9ed;color:#b53c55}.badge.blue{background:#eaf0ff;color:#3f63aa}.badge.violet{background:#eeebff;color:#644bad}

.benefit-panel{background:#0f4538;border-radius:22px;padding:18px;color:white;box-shadow:var(--shadow-sm)}
.benefit-panel .section-head h2{color:white;font-size:24px}
.benefit-panel .section-head p{color:#bed1ca}
.benefit-list{display:grid;gap:10px}
.benefit{display:grid;grid-template-columns:78px 1fr auto;gap:11px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);border-radius:15px;padding:9px}
.benefit .pic{height:64px;border-radius:10px;overflow:hidden}
.benefit b{font-size:13px}.benefit p{font-size:11px;color:#c8d8d2;margin:3px 0}
.offer{color:#fff0a8;font-weight:800;font-size:12px}

.quick-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.quick{border:1px solid var(--line);background:white;border-radius:17px;overflow:hidden}
.quick .photo{height:120px}
.quick .body{padding:11px}
.quick b{display:block;font-size:13px}
.quick span{display:block;margin-top:3px;color:var(--muted);font-size:11px}

/* Surfaces */
.surface-hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:4px 0 18px}
.surface-hero h1{font:700 42px/1 "Public Sans",system-ui,sans-serif;margin:0}
.surface-hero p{margin:8px 0 0;color:var(--muted)}
.surface-search{min-width:320px;display:flex;align-items:center;gap:8px;background:white;border:1px solid var(--line);border-radius:13px;padding:0 12px;height:44px}
.surface-search input{border:0;outline:0;flex:1;min-width:0}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter{border:1px solid var(--line);background:white;border-radius:99px;padding:8px 12px;color:#45544d;font-weight:600;font-size:12px}
.filter.active{background:var(--pine);color:white;border-color:var(--pine)}
.cards-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.listing{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-sm);position:relative}
.listing .photo{height:210px;position:relative}
.listing .heart{position:absolute;right:11px;top:11px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.listing .body{padding:14px}
.listing h3{margin:5px 0 2px;font-size:17px}
.listing .price{font-weight:800;color:var(--pine);font-size:17px}
.listing .meta{font-size:12px;color:var(--muted);margin-top:5px}
.listing .why{margin-top:10px;background:#f2f6f2;border-radius:12px;padding:9px;font-size:11px;color:#56635d}
.sponsor{position:absolute;left:11px;top:11px;z-index:2}

.service-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.service-card{background:white;border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;grid-template-columns:110px 1fr auto;gap:13px;align-items:center}
.service-card .pic{height:94px;border-radius:13px;overflow:hidden}
.service-card h3{font-size:15px;margin:3px 0}.rating{font-size:12px;color:#8b6619}.trust{font-size:11px;color:var(--muted);margin-top:5px}
.cta{border:0;background:var(--pine);color:white;height:40px;border-radius:11px;padding:0 13px;font-weight:700;font-size:12px}

.community-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.7fr);gap:16px}
.community-card{background:white;border:1px solid var(--line);border-radius:18px;padding:14px}
.question{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.question:last-child{border-bottom:0}
.question .ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:#e9f2eb;color:var(--pine)}
.question b{display:block}.question span{font-size:12px;color:var(--muted)}
.event-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.event{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.event .photo{height:125px}.event .body{padding:10px}.event b{font-size:13px;display:block}.event span{font-size:11px;color:var(--muted)}

.resolver-results{display:none;margin-top:18px;background:rgba(255,255,255,.97);color:var(--ink);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.resolver-results.show{display:block}
.result-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.result-card{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fbfcfa}
.result-card b{display:block;font-size:13px;margin-top:6px}.result-card p{font-size:11px;color:var(--muted);margin:6px 0}
.result-card .why{font-size:10px;color:#557067;background:#eef4ef;padding:7px;border-radius:9px}

.mobile-nav{display:none}
@media(max-width:1080px){
  .app{grid-template-columns:1fr}.sidebar{display:none}
  .topbar{padding:0 14px}.global-search{display:none}
  .content{padding:12px 12px 92px}
  .hero{min-height:310px;padding:26px 20px}.hero h1{font-size:48px}
  .intent-strip{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:-22px;padding:0 8px}.intent:last-child{grid-column:1/-1}
  .continue-grid,.cards-3{grid-template-columns:1fr}
  .activity-grid,.community-layout{grid-template-columns:1fr}
  .feed{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .service-list{grid-template-columns:1fr}
  .surface-hero{align-items:flex-start;flex-direction:column}.surface-search{width:100%;min-width:0}
  .result-row{grid-template-columns:1fr 1fr}
  .mobile-nav{display:flex;position:fixed;z-index:40;left:0;right:0;bottom:0;height:72px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
  .mobile-nav button{flex:1;border:0;background:none;color:#66736d;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:10px;font-weight:700}
  .mobile-nav button.active{color:var(--pine)}
}
@media(max-width:680px){
  .topbar{height:54px}.city-chip{font-size:11px}.content{padding-inline:10px}
  .hero{border-radius:20px;min-height:305px}.hero h1{font-size:41px}.hero p{font-size:13px}
  .resolver{padding-left:12px}.resolver button{padding:0 14px}
  .intent-strip{grid-template-columns:1fr 1fr;gap:8px}.intent{min-height:108px;padding:12px}
  .section-head h2{font-size:24px}.continue-grid{gap:8px}
  .continue-card{grid-template-columns:74px 1fr auto}.continue-card .pic{height:68px}
  .feed{grid-template-columns:1fr 1fr}.benefit{grid-template-columns:62px 1fr}.benefit .offer{display:none}
  .quick-grid{grid-template-columns:1fr 1fr}.quick .photo{height:100px}
  .service-card{grid-template-columns:86px 1fr}.service-card .cta{grid-column:1/-1}.service-card .pic{height:82px}
  .cards-3{gap:10px}.listing .photo{height:180px}
  .event-strip{grid-template-columns:1fr}
  .result-row{grid-template-columns:1fr}
}

/* ===== Lock candidate: interaction / routing polish ===== */
[onclick], .clickable{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex="0"]:focus-visible{outline:3px solid rgba(20,106,82,.35);outline-offset:2px}
.feed-card,.quick,.continue-card,.listing,.service-card,.question,.event,.benefit{transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.feed-card:hover,.quick:hover,.continue-card:hover,.listing:hover,.service-card:hover,.question:hover,.event:hover,.benefit:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:#c7d5ca}
.back-inline{border:0;background:#edf3ee;color:var(--pine);border-radius:12px;padding:9px 12px;font-weight:800;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(9,25,20,.5);backdrop-filter:blur(6px);display:grid;place-items:end center;padding:24px}
.overlay[hidden]{display:none!important}
.drawer{width:min(720px,100%);max-height:min(84vh,760px);overflow:auto;background:var(--surface);border-radius:26px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.28);padding:20px}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.drawer-head h2{font:700 30px/1.06 "Public Sans",system-ui,sans-serif;margin:0}.drawer-head p{color:var(--muted);margin:5px 0 0;font-size:13px}
.close-btn{width:38px;height:38px;border:1px solid var(--line);background:white;border-radius:12px;font-size:20px}
.detail-hero{height:220px;border-radius:18px;overflow:hidden;background:#e9eee9;margin:8px 0 15px}.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-grid{display:grid;grid-template-columns:1fr 220px;gap:14px}.detail-box{background:#f4f7f3;border:1px solid var(--line);border-radius:16px;padding:14px}.detail-box h3{margin:0 0 7px}.detail-box p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.secondary{border:1px solid var(--pine);color:var(--pine);background:white;height:42px;border-radius:12px;padding:0 14px;font-weight:800}.primary{border:0;background:var(--pine);color:white;height:42px;border-radius:12px;padding:0 15px;font-weight:800}
.toast-lock{position:fixed;z-index:140;left:50%;bottom:28px;transform:translateX(-50%);background:#102821;color:white;padding:12px 16px;border-radius:13px;box-shadow:var(--shadow);font-weight:700;font-size:13px;max-width:calc(100% - 28px)}
.toast-lock[hidden]{display:none!important}
.inbox-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px}.inbox-list,.conversation-panel,.profile-card,.notice-card{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden}.inbox-item{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}.inbox-item:last-child{border-bottom:0}.inbox-item:hover{background:#f5f8f4}.mini-avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e2eee5;color:var(--pine);font-weight:800;flex:none}.inbox-item b{display:block;font-size:13px}.inbox-item span{font-size:11px;color:var(--muted)}
.conversation-panel{padding:18px}.anchor-card{background:#edf4ef;border-radius:15px;padding:12px;margin-bottom:14px}.anchor-card small{color:var(--muted);text-transform:uppercase;font-weight:800;font-size:9px}.anchor-card b{display:block;margin-top:3px}.messages{display:flex;flex-direction:column;gap:8px}.bubble-chat{max-width:78%;padding:10px 12px;border-radius:14px;background:#f0f3ef;border:1px solid var(--line);font-size:13px}.bubble-chat.me{align-self:flex-end;background:var(--pine);color:white;border-color:var(--pine)}.composer-line{display:flex;gap:8px;margin-top:14px}.composer-line input{flex:1;border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:42px}
.notice-stack{display:grid;gap:10px}.notice-card{padding:15px;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center}.notice-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#e9f2eb;color:var(--pine)}.notice-card b{display:block}.notice-card span{font-size:12px;color:var(--muted)}

const MSHORT = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"]
function isoAdd(iso, n) { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10) }

/* ---- roteador com histórico ---- */
/* Gaveta não empurra histórico. Voltar do navegador fecha a gaveta e re-empurra a página atual
   (síncrono, sem history.back() programático). Uma entrada sentinela impede que Voltar, na primeira
   tela, saia do app com a gaveta aberta. */
let route = { page: "home", params: {} }
let overlayOpen = false
let lastFocus = null, lastSig = null
let toastN = 0
const VIEWS = {}
function go(page, params = {}, opts = {}) {
  if (!VIEWS[page]) return
  if (overlayOpen) hideOverlay()
  route = { page, params }
  const st = { page, params }
  if (opts.replace) history.replaceState(st, "", "#" + page)
  else history.pushState(st, "", "#" + page)
  render()
  if (!opts.keepScroll) window.scrollTo(0, 0)
}
function render() {
  $("#view").innerHTML = VIEWS[route.page](route.params)
  shellUpdate()
}
function commit() { save(); render() }
window.addEventListener("popstate", (e) => {
  if (overlayOpen) {
    hideOverlay()
    history.pushState({ page: route.page, params: route.params }, "", "#" + route.page)
    restoreFocus()
    return
  }
  const st = e.state
  if (st && st.sentinel) { history.back(); return }
  if (st && st.page && VIEWS[st.page]) route = { page: st.page, params: st.params || {} }
  else { const p = (location.hash || "#home").slice(1); route = { page: VIEWS[p] ? p : "home", params: {} } }
  render()
})

/* ---- gaveta (diálogo) ---- */
function openDrawer(html) {
  const dr = $("#drawer")
  dr.innerHTML = html
  if (!overlayOpen) {
    lastFocus = document.activeElement
    const a = lastFocus && lastFocus.dataset ? lastFocus.dataset : {}
    lastSig = a.act ? { act: a.act, id: a.id, dtype: a.dtype } : null
  }
  overlayOpen = true
  $("#overlay").hidden = false
  $("#app").inert = true
  const title = $("#dlgTitle", dr)
  setTimeout(() => (title || $("button,input", dr))?.focus(), 10)
}
function hideOverlay() {
  $("#overlay").hidden = true
  $("#app").inert = false
  overlayOpen = false
}
function restoreFocus() {
  let el = null
  if (lastSig) {
    const sel = `[data-act="${lastSig.act}"]` + (lastSig.id ? `[data-id="${CSS.escape(lastSig.id)}"]` : "") + (lastSig.dtype ? `[data-dtype="${CSS.escape(lastSig.dtype)}"]` : "")
    el = $$(sel).find((x) => x.offsetParent !== null)
  }
  if (!el && lastFocus && document.contains(lastFocus)) el = lastFocus
  if (el) el.focus()
}
function closeDrawer() {
  if (!overlayOpen) return
  hideOverlay(); render(); restoreFocus()
}
function drawerHead(title, sub, extra = "") {
  return `<div class="drawer-head"><div>${extra}<h2 id="dlgTitle" tabindex="-1">${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ""}</div><button class="close-btn" data-act="closeDrawer" aria-label="Fechar">×</button></div>`
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && overlayOpen) { closeDrawer(); return }
  if (e.key === "Tab" && overlayOpen) {
    const f = $$("button:not([disabled]),input:not([disabled]),select,textarea,a[href],[tabindex]:not([tabindex='-1'])", $("#drawer")).filter((x) => x.offsetParent !== null)
    if (!f.length) return
    const first = f[0], last = f[f.length - 1]
    if (!$("#drawer").contains(document.activeElement)) { e.preventDefault(); first.focus() }
    else if (e.shiftKey && (document.activeElement === first || document.activeElement.id === "dlgTitle")) { e.preventDefault(); last.focus() }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus() }
  }
})

function providerEvidence(pid) {

function evSummary(pid) {
  const list = providerEvidence(pid)
  // Resultado (deu certo / parcial / não) só conta quem contratou. Quem só mencionou aparece à parte.
  const c = { yes: 0, partial: 0, no: 0, hired: 0, mentioned: 0, total: list.length, last: "" }
  list.forEach((e) => { if (e.kind === "hired") { c[e.result]++; c.hired++ } else c.mentioned++; if (e.month > c.last) c.last = e.month })
  return c
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`
function evLine(pid) {
  const c = evSummary(pid)
  if (!c.total) return "Sem evidência ainda"
  const parts = []
  if (c.yes) parts.push(plural(c.yes, "deu certo", "deram certo"))
  if (c.partial) parts.push(`${c.partial} parcial`)
  if (c.no) parts.push(plural(c.no, "não deu certo", "não deram certo"))
  if (!parts.length) parts.push("ninguém contratou ainda")
  return parts.join(" · ") + " · mais recente " + monthShort(c.last)
}
function hiredLine(pid) {

const LEX = [

  ["sell", /vend(er|o)|desapeg|passar adiante|sofa|geladeira|berco|anunciar meu/],

  ["health", /pediatra|clinica|consulta|medico|saude|vacina|dentista/],

function cityMentions(n) { return Object.keys(CITIES).filter((k) => n.includes(norm(CITIES[k].name))) }
function classify(q, forced) {
  const n = norm(q).trim()
  if (!n) return { type: "clarify", question: "Conte um pouco mais sobre o que você precisa.", options: [] }
  if (forced) return { type: "results", intent: forced.intent, param: forced.param, mention: null, n }
  const t = T()
  const words = n.split(/\s+/)
  if (words.length === 1) {
    const opts = {
      escola: ["Para qual faixa etária você procura escola?", [["Criança de 3 a 5 anos", "school", "infantil"], ["Criança de 6 a 10 anos", "school", "fundamental"], ["Adolescente", "school", "medio"]]],
      mudanca: ["O que você quer fazer com a mudança?", [["Contratar uma mudança", "moving"], ["Vender coisas antes de sair", "sell"], ["Entender como funciona", "moving", "ref"]]],
      moradia: ["Que tipo de ajuda com moradia?", [["Encontrar imóvel para alugar", "housing"], ["Entender os bairros", "housing", "ref"]]],
      casa: ["Que tipo de ajuda com moradia?", [["Encontrar imóvel para alugar", "housing"], ["Entender os bairros", "housing", "ref"]]],
      ajuda: ["Qual parte você quer resolver agora?", [["Encontrar um serviço", "service"], ["Achar moradia", "housing"], ["Falar com quem já viveu isso", "people"]]],
      servico: ["Que serviço?", [["Instalação ou conserto em casa", "service"], ["Mudança", "moving"], ["Saúde", "health"]]],
      medico: ["Para quem?", [["Criança (pediatria)", "health"], ["Adulto", "health"]]],
      evento: ["Quando?", [["Neste fim de semana", "event"], ["Quero organizar um", "event"]]],
    }[n]
    if (opts) return { type: "clarify", question: opts[0], options: opts[1].map(([label, intent, param]) => ({ label, intent, param })) }
  }
  let intent = null
  for (const [k, re] of LEX) if (re.test(n)) { intent = k; break }
  if (!intent) return { type: "empty", n }
  let m = cityMentions(n)
  if (m.includes(t.from) && m.includes(t.to)) m = []
  const age = n.match(/(\d{1,2})\s*anos/)
  const param = intent === "school" && age ? (+age[1] <= 5 ? "infantil" : +age[1] <= 10 ? "fundamental" : "medio") : undefined
  return { type: "results", intent, param, mention: m[0] || null, n }

  const threadItems = (tg) => allThreads().filter((th) => th.community && comm(th.community).city === cityKey && fits(th.tags, tg) && isMember(th.community)).slice(0, 1).map((th) => O({ type: "Comunidade", tone: "", dtype: "thread", id: th.id, title: th.title, meta: `${repliesOf(th).length} respostas · ${comm(th.community).name}`, why: "pergunta parecida na sua comunidade" }))
  switch (cl.intent) {

      list.filter((h) => h.campaign).slice(0, 1).forEach((h) => out.sponsored.push(O({ type: "Anúncio", tone: "gold", dtype: "housing", id: h.id, title: `${h.title} · ${h.bairro}`, meta: `${money(h.rent)}/mês · ${h.m2} m²`, ad: true, badge: h.campaign.label })))
      refsFor(cityKey, "moradia").slice(0, 1).forEach((r) => out.organic.push(ref(r, `relatos de bairros em ${c.name}`)))
      out.organic.push(...people(["moradia", "criancas"]).slice(0, 1))
      break

    case "moving": {

      const nMove = S.needs.find((n) => n.intent === "moving" && n.proposals.length && !["resolved", "abandoned"].includes(n.status))
      if (nMove) out.organic.push(O({ type: "Ação", tone: "gold", act: "openNeed", id: nMove.id, title: `Você já tem ${nMove.proposals.length} propostas`, meta: nMove.title, why: "necessidade que você já acompanha" }))
      organic.forEach((p) => out.organic.push(providerItem(p, {}, whyProvider(p, { route }))))
      refsFor(cityKey === t.to ? t.from : cityKey, "mudanca").slice(0, 1).forEach((r) => out.organic.push(ref(r, `trecho ${route}`)))
      out.organic.push(...people(["mudanca"]).slice(0, 1))
      sponsored.forEach((p) => out.sponsored.push(providerItem(p, {}, "")))
      break
    }
    case "service": {
      const wanted = tags.filter((x) => ["climatizacao", "eletrica", "hidraulica"].includes(x))
      const { organic, sponsored } = providersFor(cityKey, wanted.length ? wanted : ["manutencao", "climatizacao"], {})
      organic.forEach((p) => out.organic.push(providerItem(p, {}, whyProvider(p, {}))))
      if (wanted.includes("climatizacao")) refsFor(cityKey, "climatizacao").slice(0, 1).forEach((r) => out.organic.push(ref(r, `climatização em ${c.name}`)))
      sponsored.forEach((p) => out.sponsored.push(providerItem(p, {}, "")))
      const top = organic[0]
      if (top && evSummary(top.id).total) out.organic.push(O({ type: "Evidência", tone: "violet", act: "openEvidence", dtype: "provider", id: top.id, title: `Resultados de quem contratou ${top.name}`, meta: evLine(top.id), why: "resultado de quem contratou, com mês e vínculo" }))
      break
    }
    case "health": {

      organic.forEach((p) => out.organic.push(providerItem(p, {}, whyProvider(p, {}))))
      out.organic.push(...threadItems(["saude", "pediatria"]), ...people(["saude", "pediatria"]))
      refsFor(cityKey, "saude").slice(0, 1).forEach((r) => out.organic.push(ref(r, `saúde em ${c.name}`)))
      sponsored.forEach((p) => out.sponsored.push(providerItem(p, {}, "")))
      break
    }
    case "event": {
      const evs = DB.events.filter((e) => e.city === cityKey && daysUntil(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date))
      evs.filter((e) => !e.campaign).slice(0, 3).forEach((e) => out.organic.push(O({ type: "Evento", tone: "violet", dtype: "event", id: e.id, title: e.title, meta: `${weekday(e.date)}, ${fmtShort(e.date)} · ${e.time} · ${e.place}`, why: `${e.going} pessoas confirmaram · ${comm(e.community).name}` })))
      evs.filter((e) => e.campaign).slice(0, 1).forEach((e) => out.sponsored.push(O({ type: "Anúncio", tone: "gold", dtype: "event", id: e.id, title: e.title, meta: `${weekday(e.date)}, ${fmtShort(e.date)} · ${e.time}`, ad: true, badge: e.campaign.label })))
      break
    }
    case "sell": {
      out.organic.push(O({ type: "Ação", tone: "pink", act: "openOffer", dtype: "market", title: "Anunciar desapego com janela de retirada", meta: "A data exata só aparece na conversa", why: `você sai de ${city(t.from).name} em ${windowLabel(t.date)}`, extra: { prefill: cl.n } }))
      DB.demands.filter((d) => d.city === cityKey).forEach((d) => out.organic.push(O({ type: "Demanda", tone: "blue", dtype: "demand", id: d.id, title: `${d.count} ${d.label.toLowerCase()}`, meta: "Janela aproximada: " + monthName(d.window), why: "famílias que aceitaram ser avisadas, sem expor datas ou nomes" })))
      DB.events.filter((e) => e.city === cityKey && /troca/i.test(e.title) && daysUntil(e.date) >= 0).slice(0, 1).forEach((e) => out.organic.push(O({ type: "Evento", tone: "violet", dtype: "event", id: e.id, title: e.title, meta: `${weekday(e.date)}, ${fmtShort(e.date)} · ${e.time}`, why: "onde as trocas acontecem antes das transferências" })))
      refsFor(cityKey, "desapego").slice(0, 1).forEach((r) => out.organic.push(ref(r, "como definir a janela de retirada sem expor sua data")))
      break
    }
    case "buy": {
      visibleMarket().filter((m) => m.city === cityKey).sort((a, b) => a.window.localeCompare(b.window)).forEach((m) => out.organic.push(marketItem(m)))
      break
    }
    case "docs": {
      const list = [...refsFor(t.from, "documentos"), ...refsFor(t.to, "documentos")].filter((r) => (cl.mention ? r.city === cityKey : true))
      list.forEach((r) => out.organic.push(ref(r, r.city === t.to ? "chegada a " + city(t.to).name : "saída de " + city(t.from).name)))
      out.organic.push(...threadItems(["documentos"]))
      break
    }
    case "people": {
      Object.values(DB.communities).filter((x) => x.city === cityKey).forEach((x) => out.organic.push(O({ type: "Comunidade", tone: "", dtype: "community", id: x.id, title: x.name, meta: x.sub, why: `comunidade de ${c.name}` })))
      break
    }
    default:
  }
  if (cl.param === "ref") out.organic = out.organic.filter((x) => x.type === "Referência" || x.type === "Pessoa")
  return out
}
function marketItem(m) {
  const t = T(); const near = m.city === t.to && Math.abs(daysUntil(m.window) - daysUntil(t.date)) <= 10
  return O({ type: "Desapego", tone: "pink", dtype: "market", id: m.id, title: m.title, meta: `${money(m.price)} · retirada em ${windowLabel(m.window)} · ${city(m.city).name}`,
    why: m.city === t.to ? (near ? `quem sai de ${city(m.city).name} deixa isto para quem chega; sua chegada é em ${windowLabel(t.date)}` : `deixado por quem sai de ${city(m.city).name}, retirada em ${windowLabel(m.window)}`) : `oferta da comunidade de ${city(m.city).name}` })
}

/* ---------- notificações derivadas do estado ---------- */
function deriveNotifs() {
  const list = []
  const add = (id, day, title, sub, act, dataset, action) => list.push({ id, day, title, sub, act, dataset, action: !!action })
  S.needs.forEach((n) => {
    const pend = n.proposals.filter((p) => p.status === "sent")
    if (pend.length && n.status !== "resolved") add("prop-" + n.id + "-" + pend.length, n.last, `${pend.length} proposta${pend.length > 1 ? "s" : ""} para comparar`, `${INTENTS[n.intent].label} · decida quando quiser`, "openProposals", { id: n.id }, true)
    if (n.status === "contracted" && S.day - n.last >= 3) add("fu-" + n.id, n.last + 3, "Deu certo? Registre o resultado", `${INTENTS[n.intent].label} · contratado há ${S.day - n.last} dias`, "openResolution", { id: n.id }, true)
    const sd = staleDays(n)
    if (sd) add("stale-" + n.id, n.last, `Sem novidade há ${sd} dias`, `${INTENTS[n.intent].label} · tentar outro caminho`, "openNeed", { id: n.id }, true)
  })
  S.convs.filter((c) => c.unread).forEach((c) => add("conv-" + c.id, c.msgs.at(-1).day, `${c.with} respondeu`, c.msgs.at(-1).text.slice(0, 70), "openConv", { id: c.id }, true))
  Object.entries(S.rsvps).forEach(([eid, st]) => {
    const e = byId([...DB.events, ...S.own.events], eid)
    if (st === "going" && e && daysUntil(e.date) === 1) add("ev-" + eid, S.day, `Amanhã: ${e.title}`, `${e.time} · ${e.place}`, "openObj", { dtype: "event", id: eid }, true)
  })
  S.threads.filter((t) => t.own).forEach((t) => { const r = S.extraReplies[t.id]; if (r && r.length && !S.resolvedThreads[t.id]) add("thr-" + t.id + r.length, t.day + 3, "Nova resposta na sua pergunta", t.title, "openObj", { dtype: "thread", id: t.id }, true) })
  S.helpReqs.filter((h) => h.status === "accepted").forEach((h) => add("help-" + h.id, h.accepted, `${byId(DB.people, h.personId).name} aceitou conversar`, "Resposta simulada da demonstração", "openConv", { id: h.convId }, true))
  Object.entries(S.membership).forEach(([id, st]) => { if (st === "member" && S.memberSince[id] !== undefined && S.memberSince[id] > 0) add("mem-" + id, S.memberSince[id], `Você entrou em ${comm(id).name}`, "Pedido aprovado", "openObj", { dtype: "community", id }, false) })
  visibleMarket().filter((m) => m.appears > 0).forEach((m) => { const t = T(); if (m.city === t.to) add("mk-" + m.id, m.appears, `Novo desapego na sua janela: ${m.title}`, `${city(m.city).name} · retirada em ${windowLabel(m.window)}`, "openObj", { dtype: "market", id: m.id }, false) })
  DB.refs.forEach((r) => { const i = refInfo(r); if (i.status === "revisao" && S.saved.some((s) => s.type === "ref" && s.id === r.id)) add("ref-" + r.id, S.day, `Referência que você salvou entrou em revisão`, r.title, "openObj", { dtype: "ref", id: r.id }, false) })
  return list.sort((a, b) => b.day - a.day).map((n) => ({ ...n, read: !!S.readN[n.id] }))
}
const unreadCount = () => deriveNotifs().filter((n) => !n.read).length

/* ---------- relógio de demonstração: eventos simulados e rotulados ---------- */
function advanceDays(n) {
  S.day += n
  tick()
  save(); render()
}
function tick() {
  S.quotes.forEach((q) => {
    if (!q.replied && S.day - q.day >= 2) {
      q.replied = true
      const p = provider(q.providerId); const n = needById(q.needId)
      const price = Math.round(((p?.base || 800) * (0.92 + ((q.id.charCodeAt(2) || 5) % 5) / 25)) / 10) * 10
      if (n) { n.proposals.push({ id: uid("pr"), providerId: q.providerId, price, days: 7, insurance: "A combinar", note: "Proposta simulada da demonstração.", status: "sent" }); touch(n, "responded") }
      const cv = byId(S.convs, q.convId); if (cv) { cv.msgs.push({ me: false, text: "Recebi seu pedido. Enviei uma proposta (resposta simulada).", day: S.day }); cv.unread = true }
    }
  })
  S.helpReqs.forEach((h) => {
    if (h.status === "pending" && S.day - h.day >= 3) {
      h.status = "accepted"; h.accepted = S.day
      const cv = byId(S.convs, h.convId); const p = byId(DB.people, h.personId)
      if (cv) { cv.status = "active"; cv.unread = true; cv.msgs.push({ me: false, text: `Oi! Posso conversar sobre ${h.topicLabel}. (resposta simulada)`, day: S.day }) }
      const n = needById(h.needId); if (n) touch(n, n.status === "open" ? "responded" : n.status)
    }
  })
  Object.keys(S.membership).forEach((id) => { if (S.membership[id] === "pending" && S.day - (S.memberSince[id + ":req"] ?? 0) >= 3) { S.membership[id] = "member"; S.memberSince[id] = S.day } })
  S.threads.forEach((t) => {
    if (t.own && S.day - t.day >= 3 && !(S.extraReplies[t.id] || []).length && !S.resolvedThreads[t.id]) {
      S.extraReplies[t.id] = [["Renata P.", "Na minha experiência, vale comparar o trajeto antes de decidir. (resposta simulada)"]]
      const n = S.needs.find((x) => x.threadId === t.id); if (n) touch(n, "responded")
    }
  })
}

  const n = unreadCount()
  const nav = (arr) => arr.map(([p, l, i]) => `<button data-act="go" data-page="${p}"${cur === p ? ' aria-current="page"' : ""}><span aria-hidden="true">${i}</span> ${l}</button>`).join("")

  $("#mobileNav").innerHTML = PRIMARY.map(([p, l, i]) => `<button data-act="go" data-page="${p}"${cur === p ? ' aria-current="page"' : ""}><span aria-hidden="true">${i}</span><span>${l}</span></button>`).join("")
  const t = T()
  $("#ctxTitle").textContent = `${city(t.from).name} → ${city(t.to).name}`
  $("#ctxMeta").textContent = `${PHASE_LABEL[phaseOf(t)]} · ${phaseLine(t)}`

  const list = DB.benefits.filter((b) => b.city === k && passes("benefits", b.partner + b.offer)).sort((a, b) => (benefitState(a) === "expired") - (benefitState(b) === "expired") || a.until.localeCompare(b.until))
  const cold = !city(k).content ? coldStartBlock(k, "") : ""
  return catShell("benefits", "Benefícios", `Condições de parceiros em ${city(k).name}, com validade e como usar.`, side, cold || list.map(benefitCard).join("") || emptyList("benefits"))
}
VIEWS.refs = (p) => {
  const side = catSide("refs", p); const k = cityKey(side)
  const list = DB.refs.filter((r) => r.city === k && passes("refs", r.title + r.summary, r.tags))
  const cold = !city(k).content ? coldStartBlock(k, "") : ""
  return catShell("refs", "Referências", `O que a comunidade já sabe sobre ${city(k).name}, com origem, revisão e curador.`, side, cold || list.map(refCard).join("") || emptyList("refs"), { cls: "stack" })
}

/* ---------- Comunidade ---------- */
function activeComm() { return S.activeComm && comm(S.activeComm) ? S.activeComm : Object.keys(S.membership).find((k) => isMember(k)) || "ajuricaba" }
function joinBlock(c) {
  const el = eligibility(c)
  const label = el === "eligible" ? "Entrar" : el === "pending" ? "Pedido enviado, aguardando aprovação" : "Pedir entrada"
  return `<div class="lock-block"><h2>${esc(c.name)} tem regra de entrada</h2><p>${esc(c.rule.text)}</p>
    ${el === "pending" ? `<span class="badge gold">${label}</span>` : `<button class="primary" data-act="openJoin" data-id="${c.id}">${label}</button>`}
    <p class="privacy-note">Perguntas e respostas só aparecem para membros. A memória pública fica visível abaixo.</p></div>`
}
VIEWS.community = (p) => {
  const id = p.id || activeComm(); const c = comm(id); S.activeComm = id
  const member = isMember(id)
  const qs = allThreads().filter((t) => t.community === id)
  const evs = [...S.own.events, ...DB.events].filter((e) => e.community === id && daysUntil(e.date) >= 0).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 3)
  const refs = DB.refs.filter((r) => r.community === id)
  const evGroups = communityEvidence(id)
  const circles = DB.circles.filter((x) => x.community === id)
  const memory = `<aside class="benefit-panel" aria-label="Memória da comunidade"><div class="section-head"><div><h2>O que esta comunidade já sabe</h2><p>Referências com curador e resultados de quem já resolveu.</p></div></div><div class="benefit-list">
    ${refs.map((r) => { const i = refInfo(r); return `<article class="benefit card"><div class="pic ico-pic">✦</div><div><h3>${cardLink(r.title, { dtype: "ref", id: r.id })}</h3><p>${r.needs + r.reports} relatos · revisada em ${fmtShort(r.reviewed)}${i.status !== "ok" ? " · " + REF_STATUS[i.status] : ""}</p></div></article>` }).join("")}
    ${evGroups.map((g) => { const pv = g.providerId ? provider(g.providerId) : null; const parts = [g.yes && `${g.yes} sim`, g.partial && `${g.partial} parcial`, g.no && `${g.no} não`].filter(Boolean).join(" · "); return `<article class="benefit card"><div class="pic ico-pic">✓</div><div><h3>${pv ? cardLink(pv.name, { id: g.providerId }, "openEvidence") : cardLink(g.category || "Resultado", { comm: id, cat: g.category }, "openEvidenceGroup")}</h3><p>${parts} · mais recente ${monthShort(g.last)}</p></div></article>` }).join("")}</div></aside>`
  const head = H1(c.name, c.sub, `<button class="city-chip" data-act="openCommunitySwitcher">Trocar comunidade ▾</button>`)
  if (!member) return `${head}${joinBlock(c)}<div class="community-layout"><div class="community-card"><h2>${qs.length} perguntas abertas</h2><p class="muted">O conteúdo é visível para membros.</p></div>${memory}</div>`
  return `${head}<div class="community-layout"><div>
    <div class="community-card"><div class="section-head"><div><h2>Precisa da sua experiência</h2><p>Perguntas abertas para quem já viveu isso.</p></div><button class="primary" data-act="openAsk" data-comm="${id}" data-q="">Fazer uma pergunta</button></div>
      ${qs.filter((t) => !S.resolvedThreads[t.id]).slice(0, 4).map((t) => `<button class="question" data-act="openObj" data-dtype="thread" data-id="${t.id}"><span class="ico" aria-hidden="true">?</span><div><b>${esc(t.title)}</b><span>${repliesOf(t).length} respostas · ${esc(t.ago || "agora")}${t.own ? " · sua pergunta" : ""}</span></div><span class="arrow" aria-hidden="true">›</span></button>`).join("") || `<p class="muted">Nenhuma pergunta aberta. Seja a primeira pessoa a perguntar.</p>`}
      <button class="link-btn" data-act="openThreadList" data-id="${id}">Ver todas (${qs.length})</button></div>
    <div class="section"><div class="section-head"><div><h2>Círculos</h2><p>Assuntos dentro da comunidade. A memória continua sendo da comunidade.</p></div></div><div class="choice-row">${circles.map((x) => `<button class="filter" data-act="openCircle" data-id="${x.id}" aria-pressed="${!!S.follows[x.id]}">${S.follows[x.id] ? "✓ " : ""}${esc(x.name)}</button>`).join("")}</div></div>
    <div class="section"><div class="section-head"><div><h2>Acontecendo na comunidade</h2><p>Eventos de ${esc(city(c.city).name)}.</p></div></div>
      <div class="event-strip">${evs.map((e) => `<article class="event card"><div class="photo">${img(e.img, 600)}</div><div class="body"><span class="badge violet">${fmtShort(e.date)} · ${esc(e.time)}</span>${S.rsvps[e.id] === "going" ? '<span class="badge good">✓ Você vai</span>' : ""}<h3>${cardLink(e.title, { dtype: "event", id: e.id })}</h3><span>${esc(e.place)}</span></div></article>`).join("") || `<p class="muted">Nenhum evento marcado. Quem sabe você organiza o primeiro?</p>`}</div></div></div>${memory}</div>`
}

    const n = cur.needId ? needById(cur.needId) : null
    panel = `<div class="conversation-panel"><button class="back-inline mobile-only" data-act="go" data-page="messages">← Conversas</button><h2 class="conv-h">${esc(cur.with)}</h2>
      <div class="anchor-card"><small>Necessidade</small>${n ? `<button class="anchor-link" data-act="openNeed" data-id="${n.id}">${esc(n.title)} · ${STATUS[n.status]}</button>` : `<b>Sem necessidade vinculada</b> <button class="link-btn" data-act="linkNeed" data-id="${cur.id}">Ligar a uma necessidade</button>`}
        <small class="mt">Objeto</small>${cur.obj ? `<button class="anchor-link" data-act="openObj" data-dtype="${cur.obj.type}" data-id="${cur.obj.id}">${esc(objLabel(cur.obj))}</button>` : "<b>Conversa direta</b>"}</div>
      <div class="messages" role="log" aria-live="polite">${cur.msgs.map((m) => `<div class="bubble-chat${m.me ? " me" : ""}">${esc(m.text)}</div>`).join("")}</div>
      ${cur.status === "pending" ? `<p class="privacy-note">Aguardando aceite. Nada além do tema e do lado da mudança foi compartilhado.</p>` : `<form class="composer-line" data-form="sendMsg" data-id="${cur.id}"><label class="sr-only" for="msg">Mensagem</label><input id="msg" name="text" autocomplete="off" placeholder="Escreva uma mensagem"><button class="primary" type="submit">Enviar</button></form>`}</div>`
  }
  return `${H1("Conversas", "Cada conversa fica ligada ao que você está resolvendo.")}<div class="inbox-grid${cur ? " has-open" : ""}"><div class="inbox-list">${list.map(item).join("") || `<p class="muted pad">Nenhuma conversa ainda.</p>`}</div>${panel}</div>`

function objLabel(o) {
  const src = { provider: () => provider(o.id)?.name, housing: () => { const h = byId([...DB.housing, ...S.own.housing], o.id); return h && `${h.title} · ${h.bairro}` }, market: () => byId([...DB.market, ...S.own.market], o.id)?.title, event: () => byId([...DB.events, ...S.own.events], o.id)?.title, person: () => byId(DB.people, o.id)?.name }[o.type]
  return (src && src()) || "Objeto"
}
function convAnchorLabel(c) { const n = c.needId ? needById(c.needId) : null; return n ? INTENTS[n.intent].label + " · " + STATUS[n.status] : c.obj ? objLabel(c.obj) : "Conversa direta" }

  return `${H1("Notificações", "Só o que mudou de verdade no que você acompanha.")}${grp("Pede sua ação", list.filter((n) => n.action))}${grp("Novidades", list.filter((n) => !n.action))}${list.length ? "" : `<div class="empty-state">Nada novo. Quando algo mudar, aparece aqui, e só aqui.</div>`}`
}

    <section class="profile-card"><h2>Meu negócio</h2><p class="muted">Veja como um prestador recebe pedidos e responde com proposta.</p><button class="secondary" data-act="go" data-page="provider">Abrir painel do prestador (demonstração)</button></section>

      <div class="choice-row"><button class="secondary" data-act="advance" data-n="3">Avançar 3 dias</button><button class="secondary" data-act="advanceToMove">Ir à data da mudança</button><button class="secondary" data-act="resetDemo">Reiniciar</button></div></section>
  </div>`

function savedLabel(s) {

}

/* ===== Gavetas, formulários e ações ===== */
const DR = {}
const field = (id, label, input, hint = "") => `<div class="field"><label for="${id}">${label}</label>${input}${hint ? `<small>${hint}</small>` : ""}</div>`
const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(l)}</option>`
const val = (id) => (document.getElementById(id) || {}).value || ""
const saveBtn = (type, id) => { const on = savedHas(type, id); return `<button class="secondary" data-act="toggleSave"${attrs({ type, id })} aria-pressed="${on}">${on ? "♥ Salvo" : "♡ Salvar"}</button>` }
const kindTxt = (k) => (k === "hired" ? "contratou" : "só mencionou")
const commName = (id) => (id && comm(id) ? comm(id).name : "rede")
function windowOptions() {
  const out = []
  for (let m = 0; m < 3; m++) {
    const base = new Date(today() + "T12:00:00"); base.setMonth(base.getMonth() + m, 1)
    ;[3, 13, 25].forEach((d) => { const iso = new Date(base.getFullYear(), base.getMonth(), d, 12).toISOString().slice(0, 10); if (iso >= today()) out.push({ iso, label: windowLabel(iso) }) })
  }
  return out
}
const relatedIntentOf = (dtype, id) => (dtype === "housing" ? "housing" : dtype === "market" ? "buy" : dtype === "provider" ? (provider(id)?.tags.includes("mudanca") ? "moving" : provider(id)?.tags.includes("saude") ? "health" : "service") : dtype === "person" ? "other" : "other")

A.closeDrawer = () => closeDrawer()
A.go = (d) => go(d.page, { side: d.side, id: d.id })
A.runQuery = (d) => go("resolver", { q: d.q })
A.runForced = (d) => go("resolver", { q: d.q, forced: { intent: d.intent, param: d.param || undefined } }, { replace: true, keepScroll: true })
A.heroSearch = (d, f) => { const q = f.q.value.trim(); if (q) go("resolver", { q }); else f.q.focus() }
A.resolverSearch = (d, f) => { const q = f.q.value.trim(); go("resolver", q ? { q } : {}, { replace: true, keepScroll: true }) }
A.globalSearch = (d, f) => { const q = f.q.value.trim(); if (q) { f.q.value = ""; go("resolver", { q }) } }
A.openSearch = () => { if (route.page === "resolver") { $("#rq")?.focus(); return } go("resolver", {}); $("#rq")?.focus() }
A.setFocus = (d) => { S.focus = d.focus; save(); if (overlayOpen) closeDrawer(); render(); toast("Priorizando: " + focusLabel()) }
A.setCatSide = (d) => go(d.page, { side: d.side }, { replace: true, keepScroll: true })
A.setCatFilter = (d) => { catState(d.kind).f = d.v; render() }
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-input='catQuery']")
  if (!el) return
  catState(el.dataset.kind).q = el.value
  const pos = el.selectionStart
  render(); const n = $("[data-input='catQuery']"); if (n) { n.focus(); n.setSelectionRange(pos, pos) }
})
A.toggleSave = (d, el) => {
  const i = S.saved.findIndex((s) => s.type === d.type && s.id === d.id)
  if (i >= 0) S.saved.splice(i, 1); else S.saved.push({ type: d.type, id: d.id })
  save(); const on = i < 0
  if (el.classList.contains("heart")) { el.textContent = on ? "♥" : "♡" } else if (el.classList.contains("secondary")) { el.textContent = on ? "♥ Salvo" : "♡ Salvar" }
  el.setAttribute("aria-pressed", on)
  if (route.page === "profile") render()
  toast(on ? "Salvo em Você → Salvos." : "Removido dos salvos.")
}

  askForm()
}
function askForm() {
  const members = Object.values(DB.communities).filter((c) => isMember(c.id))
  const sel = ASK.comm && isMember(ASK.comm) ? ASK.comm : (ASK.city ? "" : members[0]?.id || "")
  const cityWaiting = ASK.city && !commOfCity(ASK.city)
  const notMember = Object.values(DB.communities).filter((c) => !isMember(c.id))
  openDrawer(`${drawerHead("Perguntar à comunidade", "Você revisa antes de publicar.")}

      ${field("o-area", "Onde atende", `<input id="o-area" name="area" required value="${esc(data.area || "")}">`)}

A.offerPreview = (d, f) => {

    sell: () => `<b>${esc(v.title)}</b><br>${money(v.price)} · retirada em ${esc(windowLabel(v.win))} · ${esc(city(v.city).name)}`,

    ${d.type === "sell" ? `<p class="privacy-note">A data exata (${fmtShort(v.win)}) só você vê. Quem pediu aviso para este tipo de item é avisado sem ver seu nome.</p>` : ""}
    <div class="detail-actions"><button class="secondary" data-act="offerBack">Editar</button><button class="primary" data-act="offerPublish">${d.type === "service" ? "Enviar para verificação" : "Publicar"}</button></div>`)
}
A.offerBack = () => { const v = DRAFT.v; offerForm(DRAFT.type, "", { ...v, win: v.win }) }
A.offerPublish = () => {
  const { type, v } = DRAFT
  if (type === "sell") {
    const it = { id: uid("m"), mine: true, city: v.city, title: v.title.trim(), price: +v.price, cat: v.cat, window: v.win, seller: "Você", img: PH[{ moveis: "sofa", infantil: "crib", eletronicos: "nb" }[v.cat]], appears: 0 }
    S.own.market.unshift(it)
    createNeed({ title: it.title, dir: "offer", intent: "sell", cityKey: v.city, extra: { ownRef: { type: "market", id: it.id } } })
    const hit = DB.demands.filter((x) => S.alerts.includes(x.id) && x.city === v.city && x.cats.includes(v.cat)).reduce((s, x) => s + x.count, 0)
    save(); go("market", { side: sideOfCity(v.city) }); toast(hit ? `Desapego publicado. ${hit} famílias que pediram aviso foram avisadas.` : "Desapego publicado. Ele já aparece em Desapegos.")
  } else if (type === "housing") {
    const h = { id: uid("h"), mine: true, city: v.city, title: v.htype, bairro: v.bairro.trim(), beds: +v.beds, m2: 0, rent: +v.rent, from: v.from, furnished: false, tags: [v.htype.toLowerCase()], img: PH.apt2, owner: "Você" }
    S.own.housing.unshift(h)
    createNeed({ title: `${v.htype} em ${v.bairro}`, dir: "offer", intent: "housing", cityKey: v.city, extra: { ownRef: { type: "housing", id: h.id } } })
    save(); go("housing", { side: sideOfCity(v.city) }); toast("Imóvel publicado. Ele já aparece em Moradia.")
  } else if (type === "service") {
    S.own.provider = { name: v.name.trim(), tags: [v.cat], area: v.area, city: v.city, status: "verification", day: S.day }
    createNeed({ title: `Oferecer serviço: ${v.name}`, dir: "offer", intent: "service", cityKey: v.city, extra: { waitingVerification: true } })
    save(); go("provider"); toast("Enviado para verificação. Ele só aparece em Serviços depois de aprovado.")
  } else {
    const e = { id: uid("e"), mine: true, city: comm(v.comm).city, community: v.comm, title: v.title.trim(), date: v.date, time: v.time, place: v.place.trim(), img: PH.crowd, going: 0, organizer: "Você" }
    S.own.events.unshift(e)
    createNeed({ title: e.title, dir: "offer", intent: "event", cityKey: e.city, extra: { ownRef: { type: "event", id: e.id } } })
    save(); go("events", { side: sideOfCity(e.city) }); toast("Evento publicado na comunidade e em Eventos.")
  }
}

/* ---------- Contribuir: intenção primeiro, direção e tipo confirmados por você ---------- */
function inferDir(q) {
  const n = norm(q)
  if (/vend(er|o)|oferec|alug(ar|o) meu|anunci|organiz|presto|sou (eletric|encanad|pintor|diarista|medic|professor)|desapeg/.test(n)) return "offer"
  if (/alguem|quem conhece|quem sabe|qual (o|a) |como (e|funciona)|duvida/.test(n)) return "ask"
  return "need"
}
function inferOffer(q) {
  const n = norm(q)
  if (/organiz|evento|corrida|passeio|encontro/.test(n)) return "event"
  if (/alug|imovel|apart|casa/.test(n)) return "housing"
  if (/vend|sofa|desapeg|berco|geladeira|movel/.test(n)) return "sell"
  return "service"
}
let CMP = { q: "", dir: "need", type: "sell" }
A.openComposer = () => openDrawer(`${drawerHead("O que você quer resolver ou oferecer?", "Explique com suas palavras. O Bivaque sugere, você confirma.")}<form data-form="composeNext">${field("cmp-q", "Descreva", `<input id="cmp-q" name="q" required autocomplete="off" placeholder="Ex.: quero vender meu sofá antes da mudança">`)}<div class="detail-actions"><button class="primary" type="submit">Continuar</button></div></form>`)
A.composeNext = (d, f) => { CMP = { q: f.q.value.trim(), dir: inferDir(f.q.value), type: inferOffer(f.q.value) }; composeConfirm() }
function composeConfirm() {
  const chip = (k, v, l, cur) => `<button type="button" class="filter" data-act="${k}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`
  openDrawer(`${drawerHead("Entendi assim", CMP.q)}
    <div class="detail-box"><h3>Direção</h3><div class="choice-row">${chip("cmpDir", "need", "Preciso", CMP.dir)}${chip("cmpDir", "offer", "Ofereço", CMP.dir)}${chip("cmpDir", "ask", "Pergunto", CMP.dir)}</div></div>
    ${CMP.dir === "offer" ? `<div class="detail-box mt"><h3>O que você oferece</h3><div class="choice-row">${OFFER_TYPES.map(([k, l]) => chip("cmpType", k, l, CMP.type)).join("")}</div></div>` : ""}
    <div class="detail-actions"><button class="primary" data-act="composeGo">${{ need: "Buscar caminhos", ask: "Escrever a pergunta", offer: "Preencher e ver a prévia" }[CMP.dir]}</button></div>`)
}
A.cmpDir = (d) => { CMP.dir = d.v; composeConfirm() }
A.cmpType = (d) => { CMP.type = d.v; composeConfirm() }
A.composeGo = () => {
  if (CMP.dir === "need") go("resolver", { q: CMP.q })
  else if (CMP.dir === "ask") A.openAsk({ q: CMP.q, comm: "" })
  else A.openOffer({ type: CMP.type, prefill: CMP.q })
}

/* ---------- contexto, transferências, foco ---------- */
A.openContext = () => {
  const t = T()
  openDrawer(`${drawerHead("Onde você quer resolver agora?", "A data exata da sua transferência é privada. Terceiros só veem janelas aproximadas.")}
    <div class="switch-list">${[["auto", "Automático", `Pela fase (${PHASE_LABEL[phaseOf(t)].toLowerCase()}): o Bivaque decide o lado de cada assunto.`], ["origin", city(t.from).name + " · saída", "Serviços, desapegos e pendências de quem está saindo."], ["destination", city(t.to).name + " · chegada", "Moradia, escolas, referências e comunidade de quem está chegando."]].map(([f, l, s]) => `<button class="switch-item${S.focus === f ? " active" : ""}" data-act="setFocus" data-focus="${f}"><div class="grow"><b>${esc(l)}</b><span>${esc(s)}</span></div>${S.focus === f ? "✓" : "→"}</button>`).join("")}</div>
    <h3 class="sub-h">Transferências</h3><div class="switch-list">${S.transitions.map((x) => `<button class="switch-item${x.id === S.activeT ? " active" : ""}" data-act="switchT" data-id="${x.id}"><div class="grow"><b>${esc(city(x.from).name)} → ${esc(city(x.to).name)}</b><span>${fmtShort(x.date)} · ${x.id === S.activeT ? "ativa" : "tornar ativa"}</span></div></button>`).join("")}</div>
    <div class="detail-actions"><button class="secondary" data-act="editT" data-id="${t.id}">Editar esta transferência</button><button class="secondary" data-act="addT">Adicionar outra transferência</button></div>`)
}
A.switchT = (d) => { S.activeT = d.id; save(); if (overlayOpen) closeDrawer(); render(); toast("Transferência ativa: " + city(T().from).name + " → " + city(T().to).name) }
const cityOptions = (sel) => Object.entries(CITIES).map(([k, c]) => opt(k, `${c.name} · ${c.uf}`, k === sel)).join("")
function tForm(x, title, act) {
  openDrawer(`${drawerHead(title, "Só você vê a data exata.")}<form data-form="${act}" data-id="${x.id || ""}">
    ${field("t-from", "Saindo de", `<select id="t-from" name="from">${cityOptions(x.from)}</select>`)}${field("t-to", "Indo para", `<select id="t-to" name="to">${cityOptions(x.to)}</select>`)}
    ${field("t-date", "Data da mudança", `<input id="t-date" name="date" type="date" required value="${x.date}">`)}
    ${field("t-ad", "Adultos", `<input id="t-ad" name="adults" inputmode="numeric" value="${x.adults}">`)}${field("t-kids", "Crianças", `<input id="t-kids" name="kids" inputmode="numeric" value="${x.kids}">`)}
    <div class="detail-actions"><button class="primary" type="submit">Salvar</button></div></form>`)
}
A.editT = (d) => tForm(byId(S.transitions, d.id), "Editar transferência", "saveT")
A.addT = () => tForm({ from: T().to, to: "natal", date: isoAdd(today(), 90), adults: T().adults, kids: T().kids }, "Adicionar transferência", "saveT")
A.saveT = (d, f) => {
  if (f.from.value === f.to.value) { toast("Origem e destino precisam ser diferentes."); return }
  const vals = { from: f.from.value, to: f.to.value, date: f.date.value, adults: Math.max(1, +f.adults.value || 1), kids: Math.max(0, +f.kids.value || 0) }
  if (d.id) Object.assign(byId(S.transitions, d.id), vals)
  else { const x = { id: uid("t"), ...vals }; S.transitions.push(x); S.activeT = x.id }
  S.focus = "auto"; save(); go("home"); toast("Transferência salva. A Home segue a nova fase.")
}
A.openTrust = () => openDrawer(`${drawerHead("O que significa verificado", "A rede é fechada a quem tem vínculo.")}
  <div class="detail-box"><h3>Membros</h3><p>Todos passam por verificação de vínculo militar (ativa, reserva, reforma, pensionista ou família). O Bivaque não mostra posto, unidade, endereço ou CPF. Força Armada e OM só aparecem se a própria pessoa optar.</p></div>
  <div class="detail-box mt"><h3>Prestadores</h3><p>Identidade e CNPJ verificados, com a mesma regra para todos. Anunciar não muda a verificação nem a evidência. A ordem da lista vem do resultado de quem contratou.</p></div>`)

/* ---------- notificações e relógio ---------- */
A.openNotif = (d) => {
  const n = deriveNotifs().find((x) => x.id === d.nid); if (!n) return
  S.readN[n.id] = true; save()
  const fn = A[n.act]; if (fn) fn({ ...n.dataset }, null)
  render()
}
A.advance = (d) => { advanceDays(+d.n); toast(`Passaram ${d.n} dias na demonstração. Hoje: ${fmtShort(today())}.`) }
A.advanceToMove = () => { const n = daysUntil(T().date); advanceDays(Math.max(1, n + 1)); toast("Você chegou. A Home agora prioriza " + city(T().to).name + ".") }
A.resetDemo = () => { resetDemo(); toast("Demonstração reiniciada.") }
A.skip = () => $("#view").focus()

/* Regressão local dos invariantes. NÃO é evidência: a verificação está em verify.mjs, fora deste arquivo. */
function selfTest() {
  const out = []; const ok = (name, cond, detail = "") => out.push({ name, ok: !!cond, detail })
  try {
    const qs = ["onde morar chegando em novembro", "preciso instalar um split", "quero algo para fazer no fim de semana", "mudança para Brasília", "pediatra em Brasília", "vender o sofá antes da mudança"]
    const saveFocus = S.focus; const nBefore = S.needs.length
    let leak = 0
    ;["auto", "origin", "destination"].forEach((f) => { S.focus = f; qs.forEach((q) => { const r = buildResults(classify(q)); r.organic.forEach((x) => { const o = x.dtype === "provider" ? provider(x.id) : x.dtype === "housing" ? byId(DB.housing, x.id) : x.dtype === "event" ? byId(DB.events, x.id) : null; if (o && o.campaign) leak++ }) }) })
    S.focus = saveFocus
    ok("nenhum anúncio no orgânico", leak === 0, "vazamentos: " + leak)
    ok("buscar não cria necessidade", S.needs.length === nBefore)
    const bad = []
    Object.keys(VIEWS).forEach((p) => { const div = document.createElement("div"); div.innerHTML = VIEWS[p]({}); $$("[data-act]", div).forEach((e) => { if (!A[e.dataset.act]) bad.push(p + ":" + e.dataset.act) }) })
    ok("todo data-act tem ação", !bad.length, bad.join(","))
  } catch (e) { ok("exceção", false, String(e)) }
  const pre = document.createElement("pre"); pre.id = "selfTestResults"; pre.textContent = JSON.stringify(out); document.body.append(pre)
  document.title = out.every((x) => x.ok) ? "SELFTEST_PASS" : "SELFTEST_FAIL"
}

/* ===== Boot ===== */
tick()
{
  const h = (location.hash || "#home").slice(1)
  route = { page: VIEWS[h] ? h : "home", params: {} }
  history.replaceState({ sentinel: true }, "", "#" + route.page)
  history.pushState({ page: route.page, params: {} }, "", "#" + route.page)
  render()
}
if (new URLSearchParams(location.search).get("selftest") === "1") setTimeout(selfTest, 50)
window.__bv = { get S() { return S }, A, DB, VIEWS, route: () => route, toastN: () => toastN, buildResults, classify, sideCity, T, phaseOf, needById, deriveNotifs, go, render, overlayOpen: () => overlayOpen }
