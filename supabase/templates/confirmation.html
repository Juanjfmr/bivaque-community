<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#f3f5f6;color:#1c262b;font-family:'Noto Sans',Arial,Helvetica,sans-serif">
    <h1 style="font-size:20px;margin:0 0 12px">Seu código do Bivaque</h1>
    <p style="font-size:16px;line-height:1.5;margin:0 0 16px">
      Use este código para entrar. Ele vale por 10 minutos e só serve uma vez.
    </p>
    <p style="font-size:34px;letter-spacing:10px;font-weight:700;margin:0 0 16px">
      {{ .Token }}
    </p>
    <p style="font-size:14px;line-height:1.5;color:#525e64;margin:0">
      Se não foi você que pediu, ignore esta mensagem: sem o código ninguém entra na sua conta.
    </p>
  </body>
</html>
