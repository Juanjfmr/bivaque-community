project_id = "bivaque-community"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 55322
shadow_port = 55320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
# Lista de destinos que o GoTrue aceita depois de verificar o link. É fronteira
# de segurança: o que entra aqui pode receber um `code` de sessão. Por isso o
# app nativo entra com caminho fixo, e não com `bivaque://**` — curinga
# aceitaria qualquer rota do scheme como destino de auth.
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000",
  "bivaque://auth-callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
# SEC-007: reenvio de 60 s também no GoTrue (ADR-20261101 §2). O servidor aplica o
# mesmo piso por e-mail antes de chamar o GoTrue; aqui ele vale mesmo para quem
# falar direto com o endpoint público.
max_frequency = "60s"
otp_length = 6
# ADR-20261101-entrada-unica-por-codigo: o código vale 10 minutos (era 1 hora).
# O reenvio de 60 s é da tela e do GoTrue; a validade curta é a do código.
otp_expiry = 600

# ADR-20261101, §2: o e-mail do código tem o código no assunto e no corpo, em
# texto grande, sem link clicável. O template é o mesmo do magic link do GoTrue,
# servido daqui — a produção usa o SMTP próprio do dono (BLOCK-RESEND).
[auth.email.template.magic_link]
subject = "Seu código do Bivaque: {{ .Token }}"
content_path = "./supabase/templates/magic_link.html"

# Conta nova: `signInWithOtp` com criação de conta manda o e-mail de CONFIRMAÇÃO
# DE CADASTRO, não o de magic link. Sem este bloco a pessoa nova receberia o
# link do template padrão, e não o código. Mesmo corpo do magic link.
[auth.email.template.confirmation]
subject = "Seu código do Bivaque: {{ .Token }}"
content_path = "./supabase/templates/confirmation.html"

# SEC-007: limites do GoTrue por IP, explícitos para não dependerem do padrão da
# versão. `token_verifications` é o teto de verificações de código por IP (5
# minutos); `email_sent` é por hora e vale para o projeto inteiro no SMTP padrão.
# O limite por e-mail, por IP e o teto global de envio moram no banco
# (private.entry_otp_limits). SEC-008: `email_sent` fica ACIMA do teto por IP (30/h) e
# do teto global do servidor (50/h, `entry_otp_send_gate`), para que o servidor corte o
# envio antes de o GoTrue ficar sem e-mail para todo mundo.
[auth.rate_limit]
email_sent = 60
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
